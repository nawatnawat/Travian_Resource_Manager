const dtShow=v=>{const t=parseDT(v);if(t==null)return '';const d=new Date(t);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());};
function dtParse(str){str=String(str||'').trim();if(!str)return '';let m=/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/.exec(str);let y,mo,d,h,mi,se;

/* ============ map.sql (ใช้ที่เก็บร่วมกับแอปหลัก: localStorage "travian-mapsql:<เซิร์ฟเวอร์>") ============ */
const MP={host:'',rows:null,at:0,xy:null,loading:false};
function hostOf(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).host.toLowerCase();}catch(e){return '';}}
function decHtml(s){if(!/&[#a-z0-9]+;/i.test(s))return s;const e=document.createElement('textarea');e.innerHTML=s;return e.value;}
function parseMapSql(t){const out=[],n=t.length;let i=0;
  while(true){const k=t.indexOf('VALUES',i);if(k<0)break;i=k+6;
    while(i<n){while(i<n&&(t[i]===','||t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;if(t[i]!=='(')break;i++;const v=[];
      while(i<n){while(t[i]===' ')i++;let x;
        if(t[i]==="'"||t[i]==='"'){const q=t[i++];let s='';while(i<n){if(t[i]==='\\'){s+=t[i+1];i+=2;}else if(t[i]===q&&t[i+1]===q){s+=q;i+=2;}else if(t[i]===q){i++;break;}else s+=t[i++];}x=s;}
        else{let s='';while(i<n&&t[i]!==','&&t[i]!==')')s+=t[i++];x=s.trim();if(x==='NULL')x=null;}
        v.push(x);while(t[i]===' ')i++;if(t[i]===','){i++;continue;}if(t[i]===')'){i++;break;}break;}

      if(c[2]){if(xs===a&&ys.startsWith(b))sc=ys===b?0:1;}else if(xs===a||ys===a)sc=0;else if(xs.startsWith(a)||ys.startsWith(a))sc=1;if(sc>=0)T.push([sc,r]);}
    T.sort((p,s)=>p[0]-s[0]||p[1].x-s[1].x||p[1].y-s[1].y);T.forEach(([,r])=>{out.push(r);seen.add(r);});}
  const tk=q.split(/\s+/),N=[];
  for(const r of MP.rows){if(seen.has(r))continue;const n=r.name.toLowerCase(),p=r.player.toLowerCase(),al=(r.ally||'').toLowerCase();let sc=0,ok=true;
    for(const w of tk){const s=(p===w||al===w||n===w)?0:(p.startsWith(w)||al.startsWith(w)||n.startsWith(w))?1:(p.includes(w)||al.includes(w)||n.includes(w))?2:-1;if(s<0){ok=false;break;}sc+=s;}if(ok)N.push([sc,r]);}
  N.sort((x,y)=>x[0]-y[0]||y[1].pop-x[1].pop);N.forEach(([,r])=>out.push(r));return out;}
/* ============ คำนวณเวลาเดิน (สูตรเดียวกับแอปหลัก / kirilloid) ============ */
function dist(a,b){const s=op().s;let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);if(s.round){const n=2*s.size+1;dx=Math.min(dx,n-dx);dy=Math.min(dy,n-dy);}return Math.hypot(dx,dy);}   // โลกกลม: คิดข้ามขอบแยกแกน X/Y
function troopH(d,v,ts,boots){const b=(ts>0?20*ts:0)+(+boots||0);if(!(b>0)||d<=20)return d/v;return 20/v+(d-20)/(v*(1+b/100));}   // 20 ช่องแรกปกติ · ที่เกินเร็วขึ้นตาม TS(+20%/เลเวล) + รองเท้า
const spdMul=()=>(+op().s.speed||1)>=2?2:1;
function speedOf(a){const u=(UNITS[a.tribe]||[]).find(u=>u[0]===+a.unit);return u?u[2]*spdMul():0;}   // ความเร็วจากหน่วยที่เลือก × ความเร็วเซิร์ฟ
function travelSec(a,b){const v=speedOf(a)*(ART[a.art]||1);if(!(v>0)||a.x===''||b.x==='')return null;return Math.round(troopH(dist(a,b),v,+a.ts||0,0)*3600);}   // ไม่คิดรองเท้าฮีโร่ (ปกติไม่ใส่ตอนปล่อยทัพ)
function launchMs(a,b){const eta=parseDT(b.eta),t=travelSec(a,b);return eta==null||t==null?null:eta-t*1000;}

const THRUN=/[฀-๿](?:[฀-๿ ]*[฀-๿])?/g;
const LANG=()=>(L&&L.lang)||'th';
const TL=(th,en)=>LANG()==='en'?en:th;
function trText(s){if(!/[฀-๿]/.test(s))return s;return s.replace(THRUN,m=>I18N[m]!==undefined?I18N[m]:m.split(' ').map(p=>I18N[p]!==undefined?I18N[p]:p).join(' '));}
const I18N_ATTR=['placeholder','title','aria-label'];
let _i18nBusy=false,_i18nObs=null;
function i18nNode(root){
  if(LANG()!=='en'||!root)return;
  const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){if(e.hasAttribute&&e.hasAttribute('data-noi18n'))return true;const tg=e.tagName;if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA'||tg==='TITLE')return true;}return false;};
  const doText=n=>{const v=n.nodeValue;if(!v||!/[฀-๿]/.test(v)||skip(n))return;if(n._th===undefined)n._th=v;n.nodeValue=trText(v);};
  const doEl=el=>{if(el.closest&&el.closest('[data-noi18n]'))return;I18N_ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&/[฀-๿]/.test(v)){if(!el.hasAttribute('data-th-'+a))el.setAttribute('data-th-'+a,v);el.setAttribute(a,trText(v));}});};
  if(root.nodeType===3){doText(root);return;}
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1)doEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
}
function i18nRun(nodes){if(_i18nBusy)return;_i18nBusy=true;try{nodes.forEach(i18nNode);}finally{if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}}
function i18nRestore(){_i18nBusy=true;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){if(n._th!==undefined){n.nodeValue=n._th;delete n._th;}}else I18N_ATTR.forEach(a=>{const k='data-th-'+a;if(n.hasAttribute(k)){n.setAttribute(a,n.getAttribute(k));n.removeAttribute(k);}});}
  if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}
function themeCur(){return L&&L.theme?L.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function themeUI(){const t=themeCur();if(L&&L.theme)document.documentElement.setAttribute('data-theme',L.theme);else document.documentElement.removeAttribute('data-theme');
  ['light','dark'].forEach(x=>{const b=$('th-'+x);if(b)b.classList.toggle('on',x===t);});}
function setTheme(t){L.theme=t==='dark'?'dark':'light';save();themeUI();}
function langUI(){const l=LANG();document.documentElement.lang=l;document.title='Travian Scout v'+APP_V;['th','en'].forEach(x=>{const b=$('lang-'+x);if(b)b.classList.toggle('on',x===l);});}
function setLang(l){L.lang=l==='en'?'en':'th';save();if(L.lang==='th'){i18nRestore();render();}else{render();i18nRun([document.body]);}langUI();}
function i18nInit(){
  _i18nObs=new MutationObserver(recs=>{if(_i18nBusy||LANG()!=='en')return;const ns=[];recs.forEach(r=>{if(r.type==='characterData'||r.type==='attributes')ns.push(r.target);else r.addedNodes.forEach(x=>ns.push(x));});i18nRun(ns);});
  _i18nObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:I18N_ATTR});
  langUI();themeUI();if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUI);if(LANG()==='en')i18nRun([document.body]);}

ing devices or sending to a friend", ".1–.2", "ย้ายตัวนับสี 🟡 🟦 🟢 🔴 ของหมู่บ้านเราไปไว้บนสุดของหัวคอลัมน์ · ช่องที่เลยเวลาปล่อยแล้วและยังไม่มีข้อมูล ไม่นับรวมในสีเหลือง · ปุ่ม ✏️ ✕ ของหมู่บ้านเราอยู่ข้างชื่อ", "Our village status counts 🟡 🟦 🟢 🔴 moved to the top of the column header · cells past their launch time with no data are no longer counted as yellow · our village ✏️ ✕ buttons sit next to the name"], ["0.11.1", "🏠 เมืองสอดแต่ละเมืองตั้ง TS และอาร์ติแฟกต์ของตัวเองได้ · ตารางเมืองสอดแสดงทุกศัตรูที่ยังไม่ถึงเวลาปล่อย ช่องที่เมืองนั้นส่งไปไม่ทันขึ้น ไม่ทัน (เลือกไม่ได้) · แถวที่ไม่มีเมืองไหนวิ่งทันจะจางและอยู่ท้าย · เอาจำนวนตัวสอดออก ลิงก์เปิดหน้าส่งทหารพร้อมพิกัด ให้กรอกจำนวนในเกมเอง", "🏠 Each scout village has its own TS and artifact · the scout village table lists every enemy whose launch time is ahead; cells a village can no longer make show too late (not selectable) · rows no village can make are faded and go last · scout count removed: the link opens the send page with the coordinates and you enter the number in the game", ".1", "หัวคอลัมน์หมู่บ้านเรานับจำนวนสถานะ 🟡 🟦 🟢 🔴 แบบเดียวกับหัวแถวศัตรู", "Our village column headers count 🟡 🟦 🟢 🔴 statuses like the enemy row headers"], ["0.10.1", "🏠 เมืองสอด: เตรียมรายชื่อหมู่บ้านที่ใช้ส่งตัวสอดไว้ก่อน (ค้นหาจาก map.sql หรือ ＋ ทุกหมู่บ้านของฉัน · ตั้งจำนวนตัวสอดแต่ละเมือง · ◀▶ เรียง) · คิวปล่อยตัวสอดเป็นตาราง: แถว = ศัตรู · คอลัมน์ = เมืองสอด · ทุกช่องบอกเวลากดและนับถอยหลังของเมืองนั้น · คลิกช่องเพื่อเลือกเมือง แถวเรียงตามเวลากดของเมืองที่เลือก", "🏠 Scout villages: set up the villages you send scouts from (search map.sql or ＋ All my villages · scout count per village · ◀▶ to order) · the scout queue becomes a table: rows = enemies · columns = scout villages · every cell shows that village's press time and countdown · click a cell to pick the village; rows sort by the picked village's press time", ".1", "🗺️ ปุ่มดูหมู่บ้านในเกม (หน้าแผนที่ karte.php: ข้อมูลหมู่บ้าน ผู้เล่น พันธมิตร) ข้างพิกัดของหมู่บ้านศัตรูและหมู่บ้านเรา ทั้งในตารางและคิวปล่อยตัวสอด", "🗺️ View-in-game button (map page karte.php: village, player, alliance) next to the coordinates of enemy and our villages, in the table and in the scout queue"], ["0.9.0", "⏳ สถานะใหม่ รอผลสอด (สีฟ้า): กดปุ่ม ⏳ ในช่อง หรือกด 🕵️ ส่งตัวสอด ในแท็บปล่อยตัวสอดแล้วติ๊กให้เอง (เฉพาะช่องที่ยังไม่มีข้อมูล) · ได้รายงานแล้วกด 🛡 / ⚠ ทับ · หัวแถวนับจำนวน 🟦 ด้วย · ซ่อนศัตรูที่สอดครบแล้ว ไม่ซ่อนแถวที่ยังรอผล", "⏳ New status Awaiting report (blue): press ⏳ in a cell, or press 🕵️ Send scouts in the Send scouts tab and it is marked for you (only cells with no data) · when the report arrives press 🛡 / ⚠ over it · row headers count 🟦 too · Hide fully scouted enemies keeps rows still awaiting", "", "", ""], ["0.8.0", "👢 เอารองเท้าฮีโร่ออก (ปกติไม่ใส่ตอนปล่อยทัพ) · หัวแถวศัตรูแสดง speed หน่วยช้าสุด · TS · ×อาร์ติแฟกต์ (ถ้ามี) แทนเผ่าและชื่อหน่วย · หัวคอลัมน์หมู่บ้านเราเป็นแบบเดียวกันทุกอัน: ชื่อ / พิกัด / ผู้เล่น พันธมิตร / วันที่ / เวลา ", "👢 Hero boots removed (usually not worn when sending) · enemy row headers show the slowest unit's speed · TS · ×artifact (if any) instead of tribe and unit name · our village column headers share one layout: name / coordinates / player alliance / date / time", "", "", ""], ["0.7.5", "↔️ ลากจัดลำดับในตาราง: คลิกค้างที่หัวคอลัมน์ (หมู่บ้านเรา) แล้วลากไปซ้าย/ขวา · คลิกค้างที่หัวแถว (ศัตรู) แล้วลากขึ้น/ลง · มีเส้นบอกตำแหน่งที่จะวาง · ลากชิดขอบแล้วตารางเลื่อนให้เอง · เอาปุ่ม ▲▼ ◀▶ ออก", "↔️ Drag to reorder in the table: click and hold a column header (our village) and drag left/right · click and hold a row header (enemy) and drag up/down · a line shows where it will drop · dragging near the edge scrolls the table · ▲▼ ◀▶ buttons removed", ".1–.5", "🕒 ปุ่ม 🗑️ ล้าง เพิ่มแบบ ล้างเฉพาะเวลาเข้า · คัดลอกเวลาเข้าง่ายๆ: 📋 ที่หัวคอลัมน์ แล้ว 📥 ที่หมู่บ้านอื่นเพื่อวาง · ในหน้าต่างแก้ไขหมู่บ้านเรามี ใช้เวลาเข้านี้กับหมู่บ้านอื่น (ติ๊กเลือก / เลือกทั้งหมด / เฉพาะที่ยังไม่มีเวลา) · คลิกค้างที่ช่องในตารางหรือมุมซ้ายบนแล้วลาก = เลื่อนตาราง ไม่ต้องใช้ scroll bar · ปุ่มสถานะเป็นไอคอน 🛡 ปลอดภัย / ⚠ อันตราย · ช่องที่เลยเวลาปล่อยแล้วและยังไม่มีข้อมูล ไม่มีพื้นสีเหลือง · ช่องเวลาเป็นแบบ 24 ชม. (วว/ดด/ปปปป ชช:นน:วว) ไม่มี AM/PM · กดลูกศร ↑↓ ปรับเวลาได้ต่อเนื่อง ช่องไม่หลุด · ชื่อผู้เล่นตัวหนา และพันธมิตรเป็นป้ายสี ให้เด่นกว่าข้อมูลอื่นในตาราง", "🕒 🗑️ Clear gets a clear-arrival-times-only option · easy arrival time copying: 📋 in a column header, then 📥 on other villages to paste · our village editor has Use this arrival time for other villages (tick / select all / only those without a time) · click and hold a table cell or the top-left corner and drag to scroll, no scroll bar needed · status buttons are now icons: 🛡 safe / ⚠ danger · cells past their launch time with no data lose the yellow background · time boxes are 24-hour (dd/mm/yyyy hh:mm:ss) with no AM/PM · ↑↓ arrows adjust the time continuously without losing focus · player names in bold and alliances as colored tags so they stand out in the table"], ["0.6.2", "✏️ แก้ทุกอย่างที่ตารางได้เลย: เอารายการซ้าย/ขวาออก · เพิ่มศัตรู (แถว) และหมู่บ้านเรา (คอลัมน์) จากช่องค้นหา map.sql เหนือตาราง หรือ ＋ ใส่เอง · กดชื่อหรือ ✏️ ที่หัวแถว/หัวคอลัมน์เพื่อเปิดหน้าต่างแก้ไข (ค้นหา map.sql เพื่อเปลี่ยนหมู่บ้าน, ลาน, เผ่า, หน่วยช้าสุด, รองเท้า, อาร์ติแฟกต์, เวลาทัพเข้า) · กดเวลาเข้าที่หัวคอลัมน์เพื่อแก้ · ▲▼ ◀▶ ย้าย · ✕ ลบ (ถามยืนยัน)\nหัวแถวศัตรูแสดงหน่วยช้าสุดและเผ่า", "✏️ Edit everything in the table: left/right lists removed · add enemies (rows) and our villages (columns) with the map.sql search boxes above the table, or ＋ Add manually · click a name or ✏️ in a row/column header to open the editor (search map.sql to change village, TS, tribe, slowest unit, boots, artifact, arrival time) · click the arrival time in a column header to edit it · ▲▼ ◀▶ move · ✕ delete (with confirmation)\nEnemy row headers show the slowest unit and tribe", ".1–.2", "สีแดงเรียกว่า ✗ กองทัพหาย (เอาคำว่า มีโอกาสโดน ออก) · ปุ่ม 🗑️ ล้าง เลือกได้ 3 แบบ: ล้างฝั่งศัตรู / ล้างฝั่งหมู่บ้านเรา / ล้างทั้งหมด", "Red is now just ✗ Army gone (\"may be hit\" removed) · 🗑️ Clear button with 3 choices: clear enemy side / clear our side / clear all"], ["0.5.1", "📊 ตารางเวลาปล่อยรองรับข้อมูลเยอะ (20–30 หมู่บ้านต่อฝั่ง): หัวตารางและคอลัมน์ศัตรูค้างไว้ตอนเลื่อน · ช่องเล็กลง ปุ่ม ✓ ✗ · ไฮไลต์คอลัมน์ตามเมาส์ · ⛶ เต็มจอ (Esc ปิด) · กรองศัตรู / กรองหมู่บ้านเรา · เรียงศัตรูตามเวลาสอดหลัง / ยังไม่มีข้อมูล / กองทัพหาย · ซ่อนศัตรูที่สอดครบแล้ว · เลื่อนตารางค้างไว้ได้ไม่เด้งกลับทุกวินาที\n🛡️ หัวคอลัมน์หมู่บ้านเราแสดง ผู้เล่น · พันธมิตร\n🗂️ รายการซ้าย/ขวาแบบกะทัดรัด: 1 หมู่บ้าน = 2 บรรทัด (ศัตรูเลือกหน่วยช้าสุดได้เลย · หมู่บ้านเราแก้เวลาทัพเข้าได้เลย) กด ✏️ เพื่อแก้ค่าอื่น · รายการยาวเลื่อนในกล่อง", "📊 Launch table handles lots of data (20–30 villages per side): header row and enemy column stay put while scrolling · smaller cells with ✓ ✗ buttons · column highlight under the mouse · ⛶ full screen (Esc to close) · filter enemies / our villages · sort enemies by scout-after time / no data / army gone · hide fully scouted enemies · the table keeps its scroll position instead of jumping back every second\n🛡️ Our village column headers show player · alliance\n🗂️ Compact left/right lists: one village = 2 lines (pick the enemy's slowest unit or edit our arrival time directly), press ✏️ for the other fields · long lists scroll inside their box", ".1", "ชื่อหลักของแอปเป็น Travian Scout · กด ✏️ แก้ไขหมู่บ้านแล้วค้นหาจาก map.sql เพื่อเปลี่ยนเป็นหมู่บ้านอื่นได้ (หน่วย ลาน รองเท้า เวลาทัพเข้า และสถานะที่กดไว้คงเดิม)", "App name is now just Travian Scout · press ✏️ on a village and search map.sql to switch it to another village (unit, TS, boots, arrival time and marked statuses are kept)"], ["0.4.2", "🗂️ โปรไฟล์ = เซิร์ฟเวอร์ที่เล่น อยู่บนสุดของหัวเว็บ พร้อมตั้งค่าเซิร์ฟ (เซิร์ฟเวอร์ ความเร็ว แผนที่ โลกกลม/แบน เวลาเกม) ย้ายขึ้นไปไว้ที่หัวเว็บ · ในแต่ละโปรไฟล์มีตารางสอดได้หลายกลุ่ม กด ＋ เพิ่ม · ข้อมูลเดิมแยกเป็นโปรไฟล์ตามเซิร์ฟเวอร์ให้เอง\n📖 หน้าคู่มือการใช้งาน (แท็บ 📖 คู่มือ) และ Change Log · กดเลขเวอร์ชันที่หัวเว็บเพื่อเปิด Change Log\n☀️/🌙 ธีมสว่าง/มืด และ TH/EN สลับภาษาได้ที่หัวเว็บ แบบเดียวกับแอปหลัก", "🗂️ Profile = the server you play, at the top of the header, with the server settings (server, speed, map, round/flat world, game time) moved into the header · each profile can hold several scout tables, press ＋ Add · existing data is split into profiles by server automatically\n📖 User manual page (📖 Manual tab) and Change Log · click the version number in the header to open the Change Log\n☀️/🌙 light/dark theme and TH/EN language switch in the header, same as the main app", ".1–.2", "เอาช่องเวลาเกม GMT ออก · ใช้นาฬิกาของเครื่องเป็นเวลาเกมแทน (ตั้งเขตเวลาในเกมให้ตรงกับเครื่อง) · เอาช่อง \"หรือความเร็ว\" ของหมู่บ้านศัตรูออก ใช้ความเร็วจากหน่วยที่เลือก", "Removed the game time GMT box · the device clock is used as game time (set the in-game time zone to match your device) · removed the enemy \"or speed\" box, speed comes from the selected unit"], ["0.3.1", "🕵️ แท็บใหม่ ปล่อยตัวสอด: คิวหมู่บ้านศัตรูที่ยังไม่ถึงเวลาปล่อย เรียงตามเวลาที่ต้องกด · เลือกหมู่บ้านเราที่จะส่ง (จาก map.sql ตามชื่อผู้เล่น เรียงจากใกล้สุด) · บอกเวลากดปล่อย นับถอยหลัง เปลี่ยนสีเมื่อใกล้ถึง · ปุ่มส่งตัวสอดเปิดหน้าส่งทหารในเกมพร้อมใส่ตัวสอดให้", "🕵️ New Send scouts tab: queue of enemy villages whose launch time is still ahead, sorted by press time · pick our village to send from (from map.sql by player name, nearest first) · shows press time with a countdown that changes color as it gets close · the Send scouts button opens the in-game send page with scouts filled in", ".1", "ตัวสอดถึงตรงกับเวลาที่ศัตรูต้องปล่อยพอดี (เอาช่องเผื่อเวลาออก ผู้เล่นปรับก่อน/หลังเอง) · พิมพ์พิกัด/ชื่อเพื่อกรองหมู่บ้านต้นทางได้ · พิกัดที่ไม่มีใน map.sql ยังคำนวณเวลาได้แต่ไม่มีปุ่มส่ง · เลือกเผ่าเองได้เมื่อไม่มีชื่อผู้เล่น · แก้: นับถอยหลังทุกวินาทีทำให้ช่องเลือกที่เปิดอยู่ปิดเอง", "Scouts land exactly at the enemy's launch time (margin box removed, players adjust earlier/later themselves) · type coordinates/name to filter source villages · coordinates not in map.sql still get times but no send button · choose your tribe when no player name is set · fix: the per-second countdown closed open dropdowns"], ["0.2.0", "สถานะต่อช่องเวลา: 🟡 ยังไม่มีข้อมูล · 🟢 ปลอดภัย · 🔴 กองทัพหาย · กดเวลาใต้ปุ่มเพื่อแก้เป็นเวลาในรายงานสอด\n🌐 ขึ้นออนไลน์และเชิญทีมด้วย Gmail (✏️ สอด/แก้ได้ · 👁 ดูอย่างเดียว) ซิงค์ทันที · ออกจากทีม / ลบออนไลน์", "Per-cell status: 🟡 no data · 🟢 safe · 🔴 army gone · click the time under the buttons to set the scout report time\n🌐 Go online and invite the team by Gmail (✏️ scout/edit · 👁 view only) with live sync · leave team / delete online", "", "", ""], ["0.1.0", "เวอร์ชันแรก: แยกจากแอปหลักเป็นโปรแกรมสอดแนมสำหรับวางแผนป้องกัน · หลายปฏิบัติการ · ซ้ายหมู่บ้านศัตรู ขวาหมู่บ้านเราที่โดนตี (ค้นหาจาก map.sql ร่วมกับแอปหลัก หรือใส่เอง) · ตารางเวลาที่ศัตรูต้องปล่อยทัพ = เวลาเข้า − เวลาเดิน · คิดลาน รองเท้า อาร์ติแฟกต์ ความเร็วเซิร์ฟ โลกกลม/แบน · คัดลอกไปแชต", "First version: split from the main app as a scout program for defense planning · multiple operations · enemy villages on the left, our targeted villages on the right (search the map.sql shared with the main app, or enter manually) · table of enemy launch times = arrival − travel time · counts TS, boots, artifacts, server speed, round/flat world · copy to chat", "", "", ""]];

function helpGo(id){const e=$(id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});}}
function helpData(){const T=TL;return [["h-quick",T("🚀 เริ่มต้นใช้งาน","🚀 Quick start"),T("<ol><li>ที่หัวเว็บ ใส่ <b>เซิร์ฟเวอร์</b> ของโปรไฟล์ เช่น <code>ts21.x2.asia.travian.com</code> แอปจะโหลด map.sql ให้เอง แล้วตั้ง <b>ความเร็ว</b>, <b>ขนาดแผนที่</b>, <b>โลกกลม/แบน</b> ให้ตรงกับเซิร์ฟ</li>\n<li>แท็บ <b>📊 ตารางเวลาปล่อย</b>: เพิ่มหมู่บ้านศัตรู (แถว) และหมู่บ้านเราที่โดนตี (คอลัมน์) จากช่องค้นหาเหนือตาราง แล้วกดชื่อหมู่บ้านเราเพื่อใส่ <b>เวลาทัพเข้า</b></li>\n<li>ตารางตรงกลางบอก <b>เวลาที่ศัตรูต้องปล่อยทัพ</b> ไปสอดหลังเวลานั้น ถ้าทัพยังอยู่บ้าน = ไม่ใช่ตัวตีหมู่บ้านนั้น</li>\n<li>กด ✓ / ✗ ในแต่ละช่องเพื่อบอกผลการสอด</li>\n<li>แท็บ <b>🕵️ ปล่อยตัวสอด</b>: แอปบอกว่าต้องกดส่งตัวสอดจากหมู่บ้านไหนกี่โมง พร้อมนับถอยหลังและปุ่มส่งในเกม</li>\n<li>กด ＋ เพิ่ม ข้าง 🗂️ ตารางสอด เพื่อแยกตารางเป็นหลายกลุ่ม · กด 👥 เพื่อขึ้นออนไลน์และเชิญทีม</li></ol>","<ol><li>In the header, enter the profile's <b>server</b>, e.g. <code>ts21.x2.asia.travian.com</code>; the app loads map.sql by itself. Set <b>speed</b>, <b>map size</b>, <b>round/flat world</b> to match the server</li>\n<li><b>📊 Launch table</b> tab: add suspected enemy villages (rows) and our targeted villages (columns) with the search boxes above the table, then click our village's name to set its <b>arrival time</b></li>\n<li>The table shows <b>when the enemy must launch</b>. Scout after that time; if the army is still home, that village is not the attacker</li>\n<li>Press ✓ / ✗ in each cell to record the scout result</li>\n<li><b>🕵️ Send scouts</b> tab: shows which village to send scouts from and when, with a countdown and an in-game send button</li>\n<li>Press ＋ Add next to 🗂️ Scout tables to split into several groups · press 👥 to go online and invite your team</li></ol>")],["h-ops",T("🗂️ โปรไฟล์และตารางสอด","🗂️ Profiles and scout tables"),T("<ul><li><b>โปรไฟล์</b> (กล่องบนสุดของหัวเว็บ) = เซิร์ฟเวอร์ที่เล่น · <b>＋</b> เพิ่มโปรไฟล์ · <b>✏️</b> เปลี่ยนชื่อ · <b>🗑️</b> ลบ</li>\n<li>ค่าของเซิร์ฟอยู่ที่หัวเว็บใต้โปรไฟล์: <b>เซิร์ฟเวอร์</b>, <b>ความเร็ว</b>, <b>แผนที่ ±</b>, <b>โลกกลม/แบน</b> และสถานะ map.sql · ใช้กับทุกตารางในโปรไฟล์นั้น</li>\n<li><b>🗂️ ตารางสอด</b>: ในโปรไฟล์มีได้หลายกลุ่ม (เช่น แยกตามพันธมิตรที่มาตี หรือตามวัน) กด <b>＋ เพิ่ม</b> · กดชื่อเพื่อสลับ · ✏️ เปลี่ยนชื่อ · 👥 ออนไลน์/แชร์ · 🗑️ ลบ</li>\n<li>แต่ละตารางแชร์ออนไลน์แยกกันได้ ตารางที่ทีมแชร์มาจะเข้าโปรไฟล์ของเซิร์ฟเวอร์นั้นเอง (ถ้ายังไม่มีจะสร้างให้)</li>\n<li>ตารางที่ยังไม่ออนไลน์เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</li>\n<li><b>💾 Save</b> (ข้างโปรไฟล์) = บันทึกโปรไฟล์นี้เป็นไฟล์ .json (ค่าเซิร์ฟ + ตารางสอดทุกตาราง + เมืองสอด) · <b>📂 Load</b> = เปิดไฟล์ ถ้ามีโปรไฟล์เซิร์ฟเดียวกันอยู่ เลือกเพิ่มตารางเข้าโปรไฟล์เดิม หรือสร้างโปรไฟล์ใหม่ · ใช้สำรองข้อมูล ย้ายเครื่อง หรือส่งให้เพื่อน (การแชร์ออนไลน์ไม่ไปกับไฟล์)</li></ul>","<ul><li><b>Profile</b> (top box in the header) = the server you play · <b>＋</b> add profile · <b>✏️</b> rename · <b>🗑️</b> delete</li>\n<li>Server settings are in the header under the profile: <b>server</b>, <b>speed</b>, <b>map ±</b>, <b>round/flat world</b> and map.sql status · they apply to every table in that profile</li>\n<li><b>🗂️ Scout tables</b>: a profile can hold several groups (e.g. one per attacking alliance or per day). Press <b>＋ Add</b> · click a name to switch · ✏️ rename · 👥 online/share · 🗑️ delete</li>\n<li>Each table is shared online separately; tables shared by your team go into the profile of their server automatically (created if missing)</li>\n<li>Tables that are not online are stored only in this browser</li>\n<li><b>💾 Save</b> (next to the profile) saves this profile as a .json file (server settings + every scout table + scout villages) · <b>📂 Load</b> opens a file; if a profile for the same server exists, add the tables to it or create a new profile · for backups, moving devices or sending to a friend (online sharing is not included)</li></ul>")],["h-table",T("📊 ตารางเวลาปล่อย","📊 Launch table"),T("<p>ทุกอย่างทำที่ตารางเดียว: <b>แถว</b> = ⚔️ หมู่บ้านศัตรูที่สงสัยว่ามาตี · <b>คอลัมน์</b> = 🛡️ หมู่บ้านเราที่โดนตี · <b>ช่อง</b> = เวลาที่ศัตรูหมู่บ้านนั้นต้องปล่อยทัพ เพื่อให้ถึงหมู่บ้านเราตามเวลาเข้า</p>\n<h4>➕ เพิ่ม</h4><ul><li>แถบเหนือตาราง: <b>⚔️ เพิ่มศัตรู</b> และ <b>🛡️ เพิ่มหมู่บ้านเรา</b> พิมพ์ค้นหาจาก map.sql ได้ทั้ง พันธมิตร · ผู้เล่น · ชื่อหมู่บ้าน · พิกัด (พิมพ์บางส่วนได้ เช่น <code>-114</code>) แล้วกด Enter หรือคลิกรายการ</li>\n<li><b>＋ ใส่เอง</b> สำหรับหมู่บ้านที่ไม่มีใน map.sql จะเปิดหน้าต่างแก้ไขให้ทันที</li>\n<li>เผ่าของศัตรูใส่ให้เองจาก map.sql · หมู่บ้านเราใหม่ใช้เวลาทัพเข้าเดียวกับอันล่าสุด</li></ul>\n<h4>✏️ แก้ไข / ย้าย / ลบ</h4><ul><li>กด <b>ชื่อ</b> หรือ <b>✏️</b> ที่หัวแถว/หัวคอลัมน์ เพื่อเปิดหน้าต่างแก้ไข</li>\n<li>ช่องเวลาเป็นแบบ 24 ชม. <code>วว/ดด/ปปปป ชช:นน:วว</code> พิมพ์เองได้ หรือวางเคอร์เซอร์ที่ชั่วโมง/นาที/วินาทีแล้วกด <b>↑↓</b> (Shift+↑↓ = ทีละ 10) · Enter หรือออกจากช่อง = บันทึก</li>\n<li>ศัตรู: <b>ลาน (TS)</b>, <b>เผ่า</b>, <b>หน่วยช้าสุด</b> ที่สงสัย (เช่น แคต), <b>อาร์ติแฟกต์</b> · หัวแถวแสดง speed · TS · ×อาร์ติแฟกต์ · หมู่บ้านเรา: <b>เวลาทัพเข้า</b> ตามที่เห็นในเกม (กดเวลา \"เข้า\" ที่หัวคอลัมน์ก็เปิดได้)</li>\n<li>ช่อง <b>🔍 เปลี่ยนหมู่บ้าน</b> ในหน้าต่างแก้ไข: ค้นหาจาก map.sql เพื่อเปลี่ยนเป็นหมู่บ้านอื่น ค่าอื่นและสถานะที่กดไว้ยังอยู่</li>\n<li>↔️ <b>จัดลำดับ</b>: คลิกค้างที่หัวคอลัมน์แล้วลากไปซ้าย/ขวา · คลิกค้างที่หัวแถวแล้วลากขึ้น/ลง (มีเส้นสีบอกตำแหน่งที่จะวาง ลากชิดขอบแล้วตารางเลื่อนให้เอง) · ลากแถวได้เมื่อ เรียงศัตรู = ตามลำดับที่ใส่</li>\n<li>✕ ลบ (ถามยืนยัน สถานะของแถว/คอลัมน์นั้นจะถูกลบด้วย)</li>\n<li><b>🗑️ ล้าง</b> (ขวาสุดของแถบเพิ่ม): <b>ล้างเฉพาะเวลาเข้า</b> (หมู่บ้านและสถานะยังอยู่) · <b>ล้างฝั่งศัตรู</b> · <b>ล้างฝั่งหมู่บ้านเรา</b> · <b>ล้างทั้งหมด</b> (3 แบบหลังล้างสถานะ ✓ ✗ ทุกช่องด้วย)</li>\n<li>🕒 <b>คัดลอกเวลาเข้า</b>: กด 📋 ใต้เวลาเข้าที่หัวคอลัมน์ แล้วกด 📥 ที่หมู่บ้านอื่น (วางได้หลายหมู่บ้าน) · หรือเปิดหน้าต่างแก้ไขหมู่บ้านเรา แล้วใช้ <b>ใช้เวลาเข้านี้กับหมู่บ้านอื่น</b> ติ๊กเลือกหลายหมู่บ้านทีเดียว</li></ul>\n<h4>🕒 สถานะ</h4><ul><li>ไปสอดหลังเวลาในช่อง แล้วกด <b>🛡</b> ปลอดภัย (ทัพยังอยู่บ้าน) หรือ <b>⚠</b> กองทัพหาย · กดปุ่มเดิมอีกครั้งเพื่อล้าง</li>\n<li><b>⏳ รอผลสอด</b> (สีฟ้า): ส่งตัวสอดแล้ว ยังไม่ได้รายงาน · กด ⏳ ในช่อง หรือกด 🕵️ ส่งตัวสอด ในแท็บปล่อยตัวสอด แอปติ๊กให้เอง · ได้รายงานแล้วกด 🛡 / ⚠ ทับ</li>\n<li>สีช่อง: 🟡 ยังไม่มีข้อมูล (ยังไม่ถึงเวลาปล่อย) · 🟦 รอผลสอด · ไม่มีสี = เลยเวลาปล่อยแล้วแต่ยังไม่มีข้อมูล · 🟢 ปลอดภัย · 🔴 กองทัพหาย · กดเวลาใต้ปุ่มเพื่อแก้เป็นเวลาในรายงานการสอด</li>\n<li>หัวแถวบอก <b>⏱ นับถอยหลัง</b> ถึงเวลาปล่อยที่ใกล้ที่สุดของศัตรูหมู่บ้านนั้น และจำนวน 🟡🟦🟢🔴 (ช่องที่เลยเวลาแล้วไม่นับในสีเหลือง) · หัวคอลัมน์หมู่บ้านเราก็นับจำนวนเหมือนกัน (อยู่บนสุด)</li>\n<li><b>🗺️</b> ข้างพิกัด = เปิดหน้าหมู่บ้านนั้นในเกม (ดูข้อมูลหมู่บ้าน โปรไฟล์ผู้เล่น พันธมิตร) · มีทั้งในตารางและคิวปล่อยตัวสอด</li>\n<li><b>🔴 สรุปหมู่บ้านเราที่โดนมาร์ค กองทัพหาย</b> (ใต้ตาราง): หมู่บ้านเรา ผู้เล่น · กิล เวลาทัพเข้า จำนวน 🔴 และชื่อศัตรูที่กองทัพหาย เรียงจากมากไปน้อย</li>\n<li><b>📋 คัดลอกไปแชต</b> คัดลอกตารางเป็นข้อความไปวางในแชตทีม</li></ul>\n<h4>📚 ข้อมูลเยอะ (20–30 หมู่บ้านต่อฝั่ง)</h4><ul><li>ตารางเลื่อนได้ในกล่อง: <b>คลิกค้างที่ช่องในตาราง (หรือมุมซ้ายบน) แล้วลาก</b> ไม่ต้องใช้ scroll bar หรือใช้ล้อเมาส์ (Shift+ล้อ = ซ้าย/ขวา) · หัวตารางและคอลัมน์ศัตรูค้างไว้ · คอลัมน์ที่เมาส์ชี้จะไฮไลต์ · <b>⛶ เต็มจอ</b> (Esc ปิด)</li>\n<li><b>▲/▼</b> ที่มุมซ้ายบนของตาราง = ย่อมุมมอง: หัวแถวเหลือ 3 บรรทัด (หมู่บ้าน พิกัด / ผู้เล่น กิล / speed ⏱) ช่องเหลือเวลา + ปุ่ม · กดอีกครั้ง = ขยาย</li>\n<li><b>🔍 กรองศัตรู / กรองหมู่บ้านเรา</b>: พิมพ์ชื่อหมู่บ้าน ผู้เล่น พันธมิตร หรือพิกัด</li>\n<li><b>เรียงศัตรู</b>: ตามลำดับที่ใส่ · ควรสอดหลัง (เร็วสุดก่อน) · ยังไม่มีข้อมูลมากสุดก่อน · กองทัพหายมากสุดก่อน · ติ๊ก <b>ซ่อนศัตรูที่สอดครบแล้ว</b> เพื่อเหลือเฉพาะที่ต้องสอด</li></ul>","<p>Everything happens in one table: <b>rows</b> = ⚔️ suspected enemy attacker villages · <b>columns</b> = 🛡️ our targeted villages · <b>cells</b> = when that enemy village must launch to arrive at our village on time</p>\n<h4>➕ Add</h4><ul><li>Bar above the table: <b>⚔️ Add enemy</b> and <b>🛡️ Add our village</b> search map.sql by alliance · player · village name · coordinates (partial works, e.g. <code>-114</code>), then press Enter or click an item</li>\n<li><b>＋ Add manually</b> for villages not in map.sql; the editor opens right away</li>\n<li>The enemy tribe comes from map.sql · a new village of ours copies the latest arrival time</li></ul>\n<h4>✏️ Edit / move / delete</h4><ul><li>Click the <b>name</b> or <b>✏️</b> in a row/column header to open the editor</li>\n<li>Time boxes are 24-hour <code>dd/mm/yyyy hh:mm:ss</code>: type it, or put the cursor on hour/minute/second and press <b>↑↓</b> (Shift+↑↓ = by 10) · Enter or leaving the box saves</li>\n<li>Enemy: <b>TS</b>, <b>tribe</b>, suspected <b>slowest unit</b> (e.g. catapults), <b>artifact</b> · the row header shows speed · TS · ×artifact · our village: <b>arrival time</b> as seen in the game (clicking the \"arrives\" time in the column header also opens it)</li>\n<li><b>🔍 Change village</b> box in the editor: search map.sql to switch to another village; other values and marked statuses are kept</li>\n<li>↔️ <b>Reorder</b>: click and hold a column header and drag left/right · click and hold a row header and drag up/down (a colored line shows where it drops; dragging near the edge scrolls the table) · rows can be dragged when Sort enemies = As entered</li>\n<li>✕ delete (with confirmation; that row/column's statuses are deleted too)</li>\n<li><b>🗑️ Clear</b> (right end of the add bar): <b>clear arrival times only</b> (villages and statuses stay) · <b>clear enemy side</b> · <b>clear our side</b> · <b>clear all</b> (the last 3 also clear ✓ ✗ in every cell)</li>\n<li>🕒 <b>Copy arrival time</b>: press 📋 under the arrival time in a column header, then 📥 on other villages (paste as many as you like) · or open our village's editor and use <b>Use this arrival time for other villages</b> to tick several at once</li></ul>\n<h4>🕒 Status</h4><ul><li>Scout after the time in the cell, then press <b>🛡</b> safe (army still home) or <b>⚠</b> army gone · press the same button again to clear</li>\n<li><b>⏳ Awaiting report</b> (blue): scouts sent, no report yet · press ⏳ in the cell, or press 🕵️ Send scouts in the Send scouts tab and the app marks it · when the report arrives press 🛡 / ⚠ over it</li>\n<li>Cell colors: 🟡 no data (launch time not reached) · 🟦 awaiting report · no color = launch time passed but no data yet · 🟢 safe · 🔴 army gone · click the time under the buttons to set the scout report time</li>\n<li>Row headers show a <b>⏱ countdown</b> to that enemy village's nearest launch time, and the 🟡🟦🟢🔴 counts (cells past their time are not counted as yellow) · our village column headers show the counts too (at the top)</li>\n<li><b>🗺️</b> next to coordinates opens that village in the game (village info, player profile, alliance) · in the table and in the scout queue</li>\n<li><b>🔴 Our villages marked army gone</b> (under the table): village, player · alliance, arrival time, 🔴 count and the enemies whose army is gone, most first</li>\n<li><b>📋 Copy to chat</b> copies the table as text for your team chat</li></ul>\n<h4>📚 Lots of data (20–30 villages per side)</h4><ul><li>The table scrolls inside its box: <b>click and hold a cell (or the top-left corner) and drag</b>, no scroll bar needed, or use the mouse wheel (Shift+wheel = left/right) · header and enemy column stay put · the column under the mouse is highlighted · <b>⛶ Full screen</b> (Esc to close)</li>\n<li><b>▲/▼</b> in the table's top-left corner = compact view: row headers keep 3 lines (village coordinates / player alliance / speed ⏱), cells keep the time + buttons · press again to expand</li>\n<li><b>🔍 Filter enemies / our villages</b>: type a village name, player, alliance or coordinates</li>\n<li><b>Sort enemies</b>: as entered · scout after (earliest first) · most with no data first · most army gone first · tick <b>Hide fully scouted enemies</b> to keep only the ones still to scout</li></ul>")],["h-send",T("🕵️ ปล่อยตัวสอด","🕵️ Send scouts"),T("<h4>🏠 เมืองสอด</h4><ul><li><b>เมืองสอดของทีม</b> = หมู่บ้านที่ทุก ID ในทีมใช้ส่งตัวสอด · เพิ่มจากช่องค้นหา map.sql (กิล · ผู้เล่น · หมู่บ้าน · X/Y) · <b>＋ ใส่เอง</b> ใช้ตอนหมู่บ้านไม่มีใน map.sql · แสดงชื่อหมู่บ้าน ผู้เล่น และกิล · <b>TS</b> เริ่มต้น 0 · <b>อาร์ติ</b> เริ่มต้นไม่มี · ◀▶ เรียงคอลัมน์ · ✕ เอาออก · เก็บในตารางสอดนี้และแชร์ออนไลน์ให้ทีม</li>\n<li><b>จ่ายงาน</b>: คลิกช่องเพื่อเลือกเมืองสอดของแต่ละคู่ ทีมเห็นเหมือนกัน แต่ละคนกด 🕵️ ส่ง เฉพาะแถวที่เป็นหมู่บ้านของตัวเอง (ลิงก์ใช้ได้กับบัญชีเจ้าของหมู่บ้าน)</li>\n<li>มีเมืองสอดแล้ว คิวจะเป็น <b>ตาราง</b>: แถว = ศัตรู · คอลัมน์ = เมืองสอด · แต่ละช่องบอก <b>เวลากด</b> เวลาเดิน และนับถอยหลังของเมืองนั้น · <b>คลิกช่อง</b> = เลือกเมืองนั้น (กรอบเขียว) แล้วปุ่ม 🕵️ ส่ง ทางขวาใช้เมืองนี้ · แถวเรียงตามเวลากดของเมืองที่เลือก ไล่กดได้ทีละแถว · <b>⏰ ใกล้สุด</b> (กรอบส้ม) = เมืองที่ต้องกดเร็วที่สุดของแถวนั้น</li>\n<li>กด <b>ส่งแล้ว รอผล</b> แล้ว แถวนั้นย้ายไปท้ายคิว แสดง <b>ส่งแล้ว</b> เฉพาะเมืองที่ส่ง เมืองอื่นซ่อนและไม่มีปุ่มส่งซ้ำ (กด รอผล อีกครั้ง = ยกเลิก กลับมาเลือกใหม่ได้)</li>\n<li>ช่องที่เมืองนั้นส่งไปไม่ทันแล้วขึ้น <b>ไม่ทัน</b> (เลือกไม่ได้) · แถวที่ไม่มีเมืองไหนวิ่งทันจะจางและอยู่ท้าย </li>\n<li><b>🔢 จำนวนตัวสอด</b>: เมืองสอดแต่ละเมืองใส่ <b>มีสอด</b> (จำนวนตัวสอดที่เมืองนั้นมี) · ในคิว แต่ละแถวมีช่อง <b>ส่งครั้งละ</b> ซึ่งผูกกับ<b>เมืองศัตรู</b>: ใส่ครั้งเดียว ใช้ทุกแถวของศัตรูนั้น · แอปแสดง <b>ใช้ / เหลือ</b> ของแต่ละเมืองสอด: เหลือ = มีสอด − ยอดที่ใช้ของทุกคู่ในคิว (รวมคู่ที่ส่งแล้วรอผล · คู่ที่ได้ผลสอดแล้วหรือเลยเวลาไม่นับ) ติดลบเป็นสีแดง · ลิงก์ 🕵️ ส่ง ใส่พิกัดและจำนวนตัวสอดให้</li>\n<li><b>📝 โน้ต</b>: แต่ละแถวของคิว (ศัตรู → หมู่บ้านเรา) มีช่องโน้ตของตัวเอง ใช้เขียนก่อนและระหว่างสอด · ทีมเห็นร่วมกัน</li>\n<li>ต้องมีเมืองสอดอย่างน้อย 1 หมู่บ้าน คิวถึงจะแสดงเวลา</li></ul>\n<h4>คิวปล่อยตัวสอด</h4><ul><li>แสดงเฉพาะหมู่บ้านศัตรูที่ยังไม่ถึงเวลาปล่อย เรียงตามเวลาที่ต้องกด</li>\n<li><b>1 แถว = ศัตรู 1 หมู่บ้าน → หมู่บ้านเรา 1 หมู่บ้าน</b> (สอดทีละเมืองตามเวลา) เรียงตามเวลาที่ต้องกด · คู่ที่เลยเวลาปล่อย หรือได้ผลสอดแล้ว (ปลอดภัย/กองทัพหาย) ไม่แสดง</li>\n<li><b>ตัวสอดถึงตรงกับเวลาที่ศัตรูต้องปล่อยพอดี</b> อยากให้ถึงก่อนหรือหลังกี่วินาที ปรับตอนกดเอง</li>\n<li><b>กดปล่อย</b> = เวลาถึง − เวลาเดินของตัวสอด · นับถอยหลังเป็นสีเหลืองเมื่อเหลือไม่ถึง 30 นาที และกรอบแดงเมื่อไม่ถึง 5 นาที · ถ้าเลยแล้วบอกว่าเลยมากี่นาทีและถ้าปล่อยตอนนี้จะถึงกี่โมง</li>\n<li><b>🕵️ ส่งตัวสอด ↗</b> เปิดหน้าส่งทหารในเกม ใส่พิกัดและจำนวนตัวสอดให้แล้ว (จำนวนมาจากช่อง ส่งครั้งละ ของเมืองศัตรูนั้น · ถ้าไม่ได้ใส่ ให้กรอกในเกมเอง) (ส่งแบบปล้น = สอดแนม) ต้องกดยืนยันในเกมเอง และเลือกสอดทรัพยากร/การป้องกันในหน้ายืนยัน · ใช้ได้กับหมู่บ้านในบัญชีที่ล็อกอินอยู่เท่านั้น</li>\n<li>ส่งตัวสอดจริงแล้ว กด <b>ส่งแล้ว รอผล</b> เพื่อติ๊ก <b>⏳ รอผลสอด</b> (สีฟ้า) ให้คู่นั้น (แอปไม่ติ๊กให้เองตอนกดลิงก์) · กดอีกครั้ง = ยกเลิก</li>\n<li><b>🎯 เลือกศัตรูที่จะสอด</b> (ปุ่มเหนือคิว เปิดหน้าต่าง มี ใส่หมด / เอาออกหมด): ติ๊กออก = ไม่แสดงในคิว (เช่น เมืองที่มีตัวสอดป้องกันเยอะ) · <b>🚫 ไม่สอด</b> ซ่อนทีละคู่ · <b>แสดงคู่ที่ไม่สอด</b> เพื่อดู/เอากลับ (↩ กลับมาสอด) · แถวมีเลขลำดับ (เก็บเฉพาะเครื่องนี้)</li></ul>","<h4>🏠 Scout villages</h4><ul><li><b>Team scout villages</b> = the villages every team member sends scouts from · add from the map.sql search (alliance · player · village · X/Y) · <b>＋ Add manually</b> is for villages not in map.sql · shows village name, player and alliance · <b>TS</b> starts at 0 · <b>artifact</b> starts at none · ◀▶ order columns · ✕ remove · stored in this scout table and shared online with the team</li>\n<li><b>Assigning</b>: click a cell to pick the scout village for each pair; the team sees the same; each member presses 🕵️ Send only on rows with their own village (links work only for the village owner's account)</li>\n<li>With scout villages the queue becomes a <b>table</b>: rows = enemies · columns = scout villages · each cell shows that village's <b>press time</b>, travel time and countdown · <b>click a cell</b> to pick that village (green frame) and the 🕵️ Send button on the right uses it · rows sort by the picked village's press time so you can work down the list · <b>⏰ Soonest</b> (orange frame) = the village you must press first in that row</li>\n<li>After <b>Sent, awaiting</b> the row moves to the end and shows <b>Sent</b> only for the sending village; other villages are hidden and there is no second send button (press Awaiting again to undo and pick again)</li>\n<li>Cells a village can no longer make show <b>too late</b> (not selectable) · rows no village can make are faded and go last</li>\n<li><b>🔢 Scout counts</b>: each scout village has <b>Scouts</b> (how many scouts it has) · in the queue every row has a <b>Per target</b> box that belongs to the <b>enemy village</b>: enter it once and every row of that enemy uses it · the app shows <b>Used / Left</b> for each scout village: left = scouts − amount used by all pairs in the queue (pairs sent and awaiting a report included · pairs with a result or past their time are not counted), negative in red · the 🕵️ Send link fills in the coordinates and the scout count</li>\n<li><b>📝 Note</b>: every queue row (enemy → our village) has its own note box, for use before and during scouting · shared with the team</li>\n<li>The queue needs at least one scout village to show times</li></ul>\n<h4>Scout send queue</h4><ul><li>Only enemy villages whose launch time is still ahead, sorted by press time</li>\n<li><b>One row = one enemy village → one of our villages</b> (scout one village at a time) sorted by press time · pairs past their launch time or already scouted (safe/army gone) are not shown</li>\n<li><b>Scouts land exactly at the enemy's launch time.</b> If you want them earlier or later, adjust when you press</li>\n<li><b>Press at</b> = arrival − scout travel time · the countdown turns yellow under 30 minutes and the card gets a red frame under 5 minutes · when late it shows by how much and when scouts would land if sent now</li>\n<li><b>🕵️ Send scouts ↗</b> opens the in-game send page with the coordinates and scout count filled in (the count comes from that enemy village's Per target box · if none is set, enter it in the game) (sent as raid = scouting). Confirm in the game and choose resources/defences on the confirm page · works only for villages of the account you are signed in to</li>\n<li>After really sending, press <b>Sent, awaiting</b> to mark <b>⏳ Awaiting report</b> (blue) for that pair (the link no longer marks it) · press again to undo</li>\n<li><b>🎯 Enemies to scout</b> (button above the queue, opens a window with Select all / Clear all): untick = not shown in the queue (e.g. villages with many defending scouts) · <b>🚫 Skip</b> hides one pair · <b>Show skipped pairs</b> to see them / bring back (↩ Scout again) · rows are numbered (kept on this device)</li></ul>")],["h-online",T("🌐 ออนไลน์และทีม","🌐 Online and team"),T("<ul><li>กด <b>🔑 เข้าสู่ระบบ Google</b> แล้วกด <b>👥</b> (แถวตารางสอด) เพื่อขึ้นตารางนี้ออนไลน์ คุณจะเป็น <b>หัวหน้า</b></li>\n<li>ใส่ Gmail ของทีม (หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค) เลือกสิทธิ์ <b>✏️ สอด/แก้ได้</b> หรือ <b>👁 ดูอย่างเดียว</b></li>\n<li>ทีมเปิดแอปแล้วล็อกอินด้วย Gmail นั้น จะเห็นตารางเอง ทุกคนเห็นหมู่บ้าน เวลา และสถานะเดียวกันทันที</li>\n<li>หัวหน้าลบตารางออนไลน์ได้ · สมาชิกออกจากทีมได้ (ข้อมูลยังอยู่ในเครื่อง)</li>\n<li>เมืองสอดของทีมและการจ่ายงานแชร์ไปกับตาราง · การเลือกศัตรูที่จะสอด / 🚫 ไม่สอด เป็นของแต่ละเครื่อง</li></ul>","<ul><li>Press <b>🔑 Sign in with Google</b>, then <b>👥</b> (scout table row) to put this table online; you become the <b>leader</b></li>\n<li>Enter the team's Gmail addresses (several allowed, separated by spaces or commas) and choose <b>✏️ scout/edit</b> or <b>👁 view only</b></li>\n<li>Team members open the app and sign in with that Gmail to see the table; everyone sees the same villages, times and status instantly</li>\n<li>The leader can delete the online table · members can leave the team (data stays on their device)</li>\n<li>Team scout villages and assignments are shared with the table · enemy selection / 🚫 Skip are per device</li></ul>")],["h-map",T("🗺️ map.sql","🗺️ map.sql"),T("<ul><li>map.sql คือไฟล์ข้อมูลหมู่บ้านทั้งเซิร์ฟเวอร์ที่ Travian อัปเดตวันละครั้ง</li>\n<li>แอปโหลดจากสำเนาบน GitHub ของแอปหลัก (Travian Resource Manager) และใช้ข้อมูลที่โหลดไว้ร่วมกับแอปหลักในเบราว์เซอร์เดียวกัน</li>\n<li>กด ⟳ ข้าง map.sql เพื่อโหลดใหม่ · ต้องเปิดแอปจากลิงก์เว็บ (ไม่ใช่ไฟล์ในเครื่อง) ถึงจะโหลดได้</li></ul>","<ul><li>map.sql is the village data file of the whole server that Travian updates once a day</li>\n<li>The app loads it from the main app's GitHub copy (Travian Resource Manager) and shares the loaded data with the main app in the same browser</li>\n<li>Press ⟳ next to map.sql to reload · the app must be opened from the web link (not a local file) to load it</li></ul>")],["h-calc",T("🧮 การคำนวณ","🧮 How it's calculated"),T("<ul><li>ระยะทาง = √(dx² + dy²) · โลกกลม: แต่ละแกนเดินข้ามขอบได้ (ใช้ระยะที่สั้นกว่า)</li>\n<li>20 ช่องแรกเดินความเร็วปกติ ส่วนที่เกิน 20 ช่องคูณ (1 + 20×ลาน/100) · ไม่คิดรองเท้าฮีโร่</li>\n<li>อาร์ติแฟกต์ความเร็วคูณทั้งเส้นทาง · ความเร็วเซิร์ฟ x2 และ x3 ทหารเดินเร็ว ×2</li>\n<li>เวลาที่ศัตรูต้องปล่อย = เวลาทัพเข้า − เวลาเดิน · เวลากดส่งตัวสอด = เวลานั้น − เวลาเดินของตัวสอด</li>\n<li>เวลาทั้งหมดเป็นเวลาเกม แอปใช้นาฬิกาของเครื่องเป็นเวลาเกม เพื่อบอกว่าเลยเวลาแล้วหรือยังและนับถอยหลัง</li></ul>","<ul><li>Distance = √(dx² + dy²) · round world: each axis can wrap around the edge (shorter distance is used)</li>\n<li>The first 20 fields at normal speed; distance beyond 20 fields is multiplied by (1 + 20×TS/100) · hero boots are not counted</li>\n<li>Speed artifacts multiply the whole trip · on x2 and x3 servers troops move ×2</li>\n<li>Enemy launch time = arrival − travel time · scout press time = that time − scout travel time</li>\n<li>All times are game time; the app uses the device clock as game time to tell whether a time has passed and for countdowns</li></ul>")],["h-faq",T("❓ ปัญหาที่พบบ่อย","❓ FAQ"),T("<ul><li><b>ไม่พบผู้เล่นใน map.sql</b>: พิมพ์ชื่อให้ตรงทุกตัวอักษร หรือ map.sql ยังไม่อัปเดต (ผู้เล่นใหม่/เปลี่ยนชื่อ) · พิมพ์พิกัดต้นทางเองแทนได้</li>\n<li><b>ลิงก์ส่งเปิดแล้วไม่ใช่หมู่บ้านเรา</b>: ลิงก์ใช้ได้เฉพาะหมู่บ้านในบัญชีที่ล็อกอินในเบราว์เซอร์นั้น</li>\n<li><b>เวลาเพี้ยนเป็นชั่วโมง</b>: ตั้งเขตเวลาในเกม (โปรไฟล์ → การตั้งค่า) ให้ตรงกับเวลาเครื่อง เช่น ไทย UTC+7</li>\n<li><b>ไม่เห็นตารางของทีม</b>: ล็อกอินด้วย Gmail ที่หัวหน้าเชิญ แล้วกดโหลดรายการทีมใหม่</li></ul>","<ul><li><b>Player not found in map.sql</b>: type the name exactly, or map.sql isn't updated yet (new player/renamed) · you can type source coordinates instead</li>\n<li><b>The send link opens a village that isn't ours</b>: links work only for villages of the account signed in in that browser</li>\n<li><b>Times off by hours</b>: set the in-game time zone (profile → settings) to match your device, e.g. UTC+7 for Thailand</li>\n<li><b>Team table not visible</b>: sign in with the Gmail the leader invited, then reload the team list</li></ul>")],["h-log","📝 Change Log",logHTML()]];}
function helpHTML(){const H=helpData(),en=LANG()==='en';
  return `<div data-noi18n><section class="box"><h3>📖 ${en?'User manual':'คู่มือการใช้งาน'} Travian Scout <span class="tag">v${APP_V}</span>

/* ============ 🕵️ ปล่อยตัวสอด ============ */
// สำหรับศัตรูแต่ละหมู่บ้าน: เลือกเวลาปล่อยที่ยังไม่ถึง (ของหมู่บ้านเราหมู่บ้านไหน หรือ "ล่าสุด") → ตัวสอดถึง = เวลาที่ศัตรูต้องปล่อยพอดี (ผู้เล่นปรับก่อน/หลังเอง)
// เลือกหมู่บ้านต้นทางของเรา (จาก map.sql ตามชื่อผู้เล่นของฉัน) → กดปล่อย = เวลาถึง − เวลาเดินของตัวสอด · มีลิงก์ส่งในเกม
const meKey=()=>op().id;
// 🏠 เมืองสอด: เตรียมรายชื่อหมู่บ้านที่ใช้ส่งตัวสอดไว้ก่อน (ต่อโปรไฟล์/เซิร์ฟเวอร์ · เก็บเฉพาะเครื่องนี้) แล้วเลือกเมืองในตารางเวลากด
// 🏠 เมืองสอดของทีม: เก็บในตารางสอด (o.sv) แชร์ออนไลน์ให้ทุกคน · จ่ายงาน = เลือกเมืองสอดให้แต่ละคู่ (o.ass) ทุกคนเห็นเหมือนกัน
const svList=()=>{const o=op();if(!Array.isArray(o.sv)){o.sv=[];const old=(L.me.sv||{})[L.pcur];if(Array.isArray(old)&&old.length)o.sv=JSON.parse(JSON.stringify(old));}return o.sv;};
const svInfo=v=>{const r=v.x!==''&&v.y!==''&&vill(v.x,v.y);return {player:(r&&r.player)||v.player||'',ally:(r&&r.ally)||v.ally||''};};
function svAdd(r,quiet){if(!canEdit())return false;const S2=svList();if(S2.some(v=>v.x===r.x&&v.y===r.y)){if(!quiet)toast('มีเมืองนี้แล้ว');return false;}
  S2.push({vid:r.vid||0,x:r.x,y:r.y,name:r.name||'('+r.x+'/'+r.y+')',player:r.player||'',ally:r.ally||'',tribe:r.tribe,ts:0,art:''});if(!quiet){change();setTimeout(()=>{const q=$('pqS');if(q)q.focus();},0);}return true;}
function svAddPlayer(){if(!canEdit())return;mOpen('<h4>＋ เพิ่มทุกหมู่บ้านของผู้เล่น (จาก map.sql)</h4><input id="mn" style="width:100%" placeholder="ชื่อผู้เล่นในเกม · ใส่หลายคนได้ คั่นด้วยจุลภาค">',[{t:'เพิ่ม',c:'pri',f:()=>{
    const names=String($('mn').value||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(!names.length||!MP.rows)return;let n=0,miss=[];
    names.forEach(nm=>{const V=MP.rows.filter(r=>r.player.toLowerCase()===nm).sort((a,b)=>b.pop-a.pop);if(!V.length)miss.push(nm);V.forEach(r=>{if(svAdd(r,true))n++;});});
    change();toast('＋ '+n+' เมือง'+(miss.length?' · ไม่พบ: '+miss.join(', '):''));}},{t:'ยกเลิก'}]);setTimeout(()=>$('mn')&&$('mn').focus(),0);}
function svManual(){if(!canEdit())return;mOpen(`<h4>＋ ใส่เมืองสอดเอง</h4><div class="ef"><label>ชื่อ <input id="m1" style="width:140px"></label><label>X <input id="m2" type="number" style="width:70px"></label><label>Y <input id="m3" type="number" style="width:70px"></label>
    <label>ผู้เล่น <input id="m4" style="width:120px"></label><label>เผ่า <select id="m5">${Object.keys(SCOUT_U).map(t=>`<option>${t}</option>`).join('')}</select></label></div><p class="note">ไม่มี ID หมู่บ้าน (ไม่อยู่ใน map.sql) จะไม่มีปุ่มส่งในเกม แต่คำนวณเวลาได้</p>`,
    [{t:'เพิ่ม',c:'pri',f:()=>{const x=$('m2').value,y=$('m3').value;if(x===''||y===''){toast('ใส่พิกัดก่อน');return;}const t=Object.keys(MAP_TRIBE).find(k=>MAP_TRIBE[k]===$('m5').value);
      const r=vill(+x,+y);svAdd(r?r:{vid:0,x:+x,y:+y,name:$('m1').value.trim(),player:$('m4').value.trim(),tribe:+t});}},{t:'ยกเลิก'}]);}
function svDel(i){if(!canEdit())return;svList().splice(i,1);change();}
function svMove(i,d){if(!canEdit())return;const S2=svList(),j=i+d;if(j<0||j>=S2.length)return;[S2[i],S2[j]]=[S2[j],S2[i]];change();}
function svF(i,k,v){if(!canEdit())return;const it=svList()[i];if(!it)return;it[k]=k==='ts'?Math.max(0,Math.min(20,+v||0)):(k==='n'||k==='d')?(String(v).trim()===''?'':Math.max(0,Math.floor(+v||0))):k==='note'?String(v).slice(0,80):v;change();}
function myVills(){const me=String(L.me.player||'').trim().toLowerCase();if(!me||!MP.rows)return [];return MP.rows.filter(r=>r.player.toLowerCase()===me).sort((a,b)=>b.pop-a.pop);}
function myTribe(){const V=myVills();return V.length?MAP_TRIBE[V[0].tribe]:(L.me.tribe||'');}
function scoutOf(r){const tr=r.tn||MAP_TRIBE[r.tribe],U=UNITS[tr]||[],u=U.find(x=>x[0]===SCOUT_U[tr]);return u?{tribe:tr,i:u[0],n:u[1],v:u[2]*spdMul()}:null;}
function scoutSec(src,a){const s=scoutOf(src);if(!s||a.x==='')return null;const ts=+src.ts||0;return Math.round(troopH(dist(src,a),s.v*(ART[src.art]||1),ts,0)*3600);}   // เมืองสอดมี TS / อาร์ติแฟกต์ ของตัวเอง
// 🗺️ เปิดหน้าหมู่บ้านในเกม (karte.php = ข้อมูลหมู่บ้าน/โปรไฟล์ผู้เล่นบนแผนที่)
function kLink(v){const h=hostOf(op().s.host);return h&&v&&v.x!==''&&v.y!==''?`https://${h}/karte.php?x=${v.x}&y=${v.y}`:'';}
const kA=v=>{const u=kLink(v);return u?`<a class="kl" href="${esc(u)}" target="_blank" rel="noopener" title="ดูหมู่บ้านนี้ในเกม" onpointerdown="event.stopPropagation()">🗺️</a>`:'';};
function sendLink(src,a,n){const h=hostOf(op().s.host),s=scoutOf(src);if(!h||!src.vid||!s)return '';
  return `https://${h}/build.php?newdid=${src.vid}&id=39&tt=2&x=${a.x}&y=${a.y}${n>0?`&troop[t${s.i+1}]=${n}`:''}&c=3&gid=16&eventType=4`;}   // troop[tN] = ใส่จำนวนตัวสอดให้ในหน้าส่งทหาร
// 🔢 จำนวนตัวสอด: เมืองสอดมี n (มีสอด) · ส่งครั้งละ ผูกกับเมืองศัตรู (ass.d<ศัตรู> ใช้ทุกแถวของศัตรูนั้น) · โน้ตต่อคู่ (ass.t<คู่>) · ทั้งหมดแชร์ทั้งทีมแบบ field path
// เหลือ = มีสอด − ยอดที่ใช้ของทุกคู่ในคิว (รวมที่ส่งแล้วรอผล)
function cntOf(a){const v=a&&(op().ass||{})['d'+a.id];return +v>0?+v:0;}
function assSet(k,v,re){if(!canEdit())return;const o=op();o.ass=o.ass||{};if(v==null)delete o.ass[k];else o.ass[k]=v;save();
  if(o.online&&FB.user&&o.online.role!=='view'){const upd={};upd['ass.'+k]=v==null?firebase.firestore.FieldValue.delete():v;
    FB.db.collection(COL).doc(o.online.id).update(upd).catch(e=>toast('⚠ บันทึกการจ่ายงานไม่สำเร็จ ('+((e&&e.code)||e)+') · ตรวจ rules ของ Firestore'));}
  if(re){const sb=$('sendbox');if(sb){sb.dataset.sig='';renderSend();}}}
function setCnt(aid,v){assSet('d'+aid,String(v).trim()===''?null:Math.max(0,Math.floor(+v||0)),true);}
function setNote(key,v){v=String(v||'').trim().slice(0,80);assSet('t'+key,v||null,false);const sb=$('sendbox');if(sb)sb.dataset.sig='';}
function svUsed(out){const SV=svList(),u=new Map();out.forEach(k=>{if(k.off)return;let r=null,n=0;
    if(k.st==='wait'&&k.m){r=SV.find(v=>k.m.fv?v.vid===k.m.fv:v.name===k.m.from)||null;n=k.m.n!=null?(+k.m.n||0):cntOf(k.a);}
    else if(k.src){r=k.src.r;n=cntOf(k.a);}
    if(r)u.set(r,(u.get(r)||0)+n);});return u;}
function svUseTxt(v,used){const has=v.n!==''&&v.n!=null;if(!has&&!used)return '';const left=(+v.n||0)-used;
  return 'ใช้ '+fmt(used)+(has?' · เหลือ <b class="'+(left<0?'neg':'pos')+'">'+fmt(left)+'</b>':'');}
function svUseUI(out){const u=svUsed(out);svList().forEach((v,i)=>{const e=$('svu'+i);if(e)e.innerHTML=svUseTxt(v,u.get(v)||0);});}
function parseXY(q){q=normQ(q);const m=q.match(/^\(?\s*(-?\d+)\s*[\/|,\s]\s*(-?\d+)\s*\)?$/);return m?{x:+m[1],y:+m[2]}:null;}
function srcList(a,V,q){q=normQ(q);let L2=V;
  if(q){const ql=q.toLowerCase().replace(/[−–]/g,'-'),xy=parseXY(q);
    L2=V.filter(r=>r.name.toLowerCase().includes(ql)||(r.x+'/'+r.y).includes(ql.replace(/[|,\s]+/g,'/')));
    if(xy&&!L2.some(r=>r.x===xy.x&&r.y===xy.y)){const row=MP.rows&&MP.rows.find(r=>r.x===xy.x&&r.y===xy.y);
      L2=[row?Object.assign({},row,{tn:myTribe()||MAP_TRIBE[row.tribe]}):{x:xy.x,y:xy.y,name:'('+xy.x+'/'+xy.y+')',vid:0,tn:myTribe(),custom:1}];}}
  return L2;}
// คิวปล่อยตัวสอด: 1 แถว = ศัตรู 1 หมู่บ้าน → หมู่บ้านเรา 1 หมู่บ้าน (สอดทีละเมืองตามเวลา) · เฉพาะเวลาปล่อยที่ยังไม่ถึง และยังไม่ได้ผลสอด (ปลอดภัย/กองทัพหาย)

let SHOWHID=false;

function mClose(){$('modal').classList.remove('on');}
/* ============ ออนไลน์: ล็อกอิน Google + Firestore (ทุกคนในทีมเห็นสถานะเดียวกันทันที) ============ */
// scoutops/{id} = {owner, ownerEmail, ownerName, name, emails:[...], roles:{email:'edit'|'view'}, data (JSON: s,A,B,nextId,sv), ver, marks:{คู่:{s,at,by}}, ass:{คู่:vid}, updatedAt, by}
// แก้ข้อมูลหมู่บ้าน/ตั้งค่า: ส่งทั้งก้อนพร้อมเลขเวอร์ชัน (ชนกัน = ใช้ของคลาวด์แล้วแจ้ง) · สถานะการสอด: เขียนทีละช่อง (marks.<id>) ไม่ชนกัน
const FB={auth:null,db:null,user:null,ready:false,unsub:null,watch:'',push:0,fly:false,pend:null};
const meEmail=()=>FB.user&&FB.user.email?FB.user.email.trim().toLowerCase():'';
const shortMe=()=>FB.user?String(FB.user.displayName||meEmail().split('@')[0]).split(' ')[0]:'ฉัน';
const roleOf=d=>FB.user&&d.owner===FB.user.uid?'owner':((d.roles||{})[meEmail()]||'');
const DATA_KEYS=['s','A','B','nextId','sv'];
const pickData=o=>JSON.stringify({s:o.s,A:o.A,B:o.B,nextId:o.nextId,sv:o.sv||[]});   // การจ่ายงาน (ass) บันทึกแยกทีละคู่ ไม่อยู่ใน data
function putData(o,str){let d={};try{d=JSON.parse(str)||{};}catch(e){}DATA_KEYS.forEach(k=>{if(k!=='s'&&d[k]!==undefined)o[k]=d[k];});adoptS(o,d.s);if(!Array.isArray(o.A))o.A=[];if(!Array.isArray(o.B))o.B=[];}
function fbInit(){
  if(location.protocol==='file:'&&!window.firebase){renderUser();return;}
  if(window.firebase){fbSetup();return;}
  const S=['https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js','https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'];
  let i=0;const next=()=>{if(i>=S.length){fbSetup();return;}const sc=document.createElement('script');sc.src=S[i++];sc.onload=next;sc.onerror=()=>renderUser();document.head.appendChild(sc);};next();}
function fbSetup(){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);}catch(e){return;}
  FB.auth=firebase.auth();FB.db=firebase.firestore();FB.ready=true;FB.auth.onAuthStateChanged(u=>{FB.user=u||null;renderUser();if(u)olList();else{olUnwatch();render();}});}
function login(){if(!FB.ready){toast('ยังโหลดระบบล็อกอินไม่ได้ (ต้องเปิดจากลิงก์เว็บ https)');return;}
  FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{const c=(e&&e.code)||'';if(c==='auth/popup-blocked')FB.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else if(!/closed|cancelled/.test(c))toast('ล็อกอินไม่สำเร็จ: '+c);});}
function renderUser(){const e=$('user');if(!e)return;
  if(!FB.user){e.innerHTML=`<button onclick="login()">🔑 เข้าสู่ระบบ Google</button>`;return;}
  const n=FB.user.displayName||meEmail();e.innerHTML=`<span class="chip" onclick="userMenu()" title="${esc(meEmail())}"><span class="av">${esc(n.charAt(0).toUpperCase())}</span>${esc(n.split(' ')[0])} ▾</span>`;}
function userMenu(){mOpen(`<h4>👤 ${esc(FB.user.displayName||'')}</h4><p class="note">${esc(meEmail())}</p>`,[{t:'🔄 โหลดรายการทีมใหม่',f:()=>olList(true)},{t:'ออกจากระบบ',c:'dng',f:()=>FB.auth.signOut()},{t:'ปิด'}]);}
// รายการปฏิบัติการออนไลน์ที่เราเป็นหัวหน้าหรือได้รับเชิญ → ใส่ในรายการของเครื่องนี้
async function olList(manual){if(!FB.user)return;
  try{const c=FB.db.collection(COL),[a,b]=await Promise.all([c.where('owner','==',FB.user.uid).get(),c.where('emails','array-contains',meEmail()).get()]);
    const seen=new Set(),docs=[...a.docs,...b.docs].filter(x=>!seen.has(x.id)&&seen.add(x.id));let added=0;
    docs.forEach(x=>{const d=x.data(),role=roleOf(d);if(!role)return;let o=L.ops.find(z=>z.online&&z.online.id===x.id);
      if(!o){if(L.hidden&&L.hidden[x.id]&&!manual)return;if(L.hidden)delete L.hidden[x.id];o=newOpData(d.name);o.id='o'+x.id;L.ops.push(o);added++;}
      o.online={id:x.id,role,ownerName:d.ownerName||d.ownerEmail||'',n:(d.emails||[]).length,ver:+d.ver||0};o.name=d.name||o.name;putData(o,d.data);o.marks=d.marks||{};o.ass=d.ass||{};});
    L.ops=L.ops.filter(o=>!(o.id==='l0'));save();if(added)toast('🌐 มีตารางสอดของทีม '+added+' รายการ');if(manual)toast('🔄 โหลดรายการทีมแล้ว');
  }catch(e){toast('⚠ อ่านรายการทีมไม่ได้ — ตรวจ rules ของ Firestore ('+((e&&e.code)||e)+')',6000);}
  olWatch();render();}
function olUnwatch(){if(FB.unsub){try{FB.unsub();}catch(e){}}FB.unsub=null;FB.watch='';}
function olWatch(){const o=op();const id=o&&o.online&&FB.user?o.online.id:'';if(id===FB.watch)return;olUnwatch();if(!id)return;FB.watch=id;
  FB.unsub=FB.db.collection(COL).doc(id).onSnapshot(sn=>{const o=L.ops.find(z=>z.online&&z.online.id===id);if(!o)return;
    if(!sn.exists){olDetach(o,'หัวหน้าลบตารางนี้แล้ว · ข้อมูลยังอยู่ในเครื่องนี้');return;}
    const d=sn.data(),role=roleOf(d);if(!role){olDetach(o,'คุณไม่ได้อยู่ในทีมของตารางนี้แล้ว');return;}
    const go=()=>{const pend=FB.push||FB.fly;
      o.online.role=role;o.online.n=(d.emails||[]).length;o.online.ownerName=d.ownerName||d.ownerEmail||'';o.name=d.name||o.name;
      if(!pend&&(+d.ver||0)>o.online.ver){putData(o,d.data);o.online.ver=+d.ver||0;if(d.by&&d.by!==meEmail())toast('🌐 อัปเดตจาก '+d.by);}
      o.marks=Object.assign({},d.marks||{});o.ass=Object.assign({},d.ass||{});save();if(op()===o)render();};
    if(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)&&!document.activeElement.closest('.pick')){FB.pend=go;const h=()=>{document.removeEventListener('focusout',h,true);setTimeout(()=>{const f=FB.pend;FB.pend=null;if(f)f();},60);};document.addEventListener('focusout',h,true);}
    else go();
  },e=>{if((e&&e.code)==='permission-denied'){const o=L.ops.find(z=>z.online&&z.online.id===id);if(o)olDetach(o,'คุณไม่ได้อยู่ในทีมของตารางนี้แล้ว');}});}
function olDetach(o,msg){if(o.online)L.hidden=Object.assign(L.hidden||{},{[o.online.id]:1});o.online=null;save();olUnwatch();render();if(msg)toast('🌐 '+msg,5000);}
function olSchedule(){clearTimeout(FB.push);FB.push=setTimeout(()=>{FB.push=0;olPush();},800);}
async function olPush(o){o=o||op();if(!o||!o.online||!FB.user||o.online.role==='view')return;const id=o.online.id,base=o.online.ver,str=pickData(o);
  if(str.length>900000){toast('⚠ ข้อมูลใหญ่เกินไป');return;}FB.fly=true;
  try{const ref=FB.db.collection(COL).doc(id);
    const ver=await FB.db.runTransaction(async tx=>{const sn=await tx.get(ref);if(!sn.exists){const e=new Error('gone');e.gone=1;throw e;}const d=sn.data(),cur=+d.ver||0;
      if(cur!==base){const e=new Error('conflict');e.conflict=1;e.d=d;throw e;}
      tx.update(ref,{data:str,ver:cur+1,name:o.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:meEmail()});return cur+1;});
    o.online.ver=ver;save();if(pickData(o)!==str)olSchedule();
  }catch(e){if(e&&e.conflict){putData(o,e.d.data);o.online.ver=+e.d.ver||0;o.marks=e.d.marks||{};o.ass=e.d.ass||{};save();render();toast('⚠ มีคนแก้พร้อมกัน — ใช้ฉบับล่าสุดแล้ว กรุณาแก้อีกครั้ง',5000);}
    else if(e&&(e.gone||e.code==='permission-denied'))olDetach(o,'ซิงค์ไม่ได้ (ไม่มีสิทธิ์ หรือตารางถูกลบ)');else{toast('⚠ ซิงค์ไม่สำเร็จ — จะลองใหม่');setTimeout(olSchedule,15000);}}
  finally{FB.fly=false;}}
function olMark(id,v,silent){const o=op();if(v)o.marks[id]=v;else delete o.marks[id];save();if(!silent)render();
  if(o.online&&FB.user&&o.online.role!=='view'){const upd={};upd['marks.'+id]=v?v:firebase.firestore.FieldValue.delete();
    FB.db.collection(COL).doc(o.online.id).update(upd).catch(e=>toast('⚠ บันทึกสถานะไม่สำเร็จ ('+((e&&e.code)||e)+')'));}}
// จ่ายงาน: บันทึกทีละคู่ (ass.<คู่>) เหมือนสถานะ · หลายคนกดพร้อมกันได้ ไม่ชนกัน
function olAss(key,vid){const o=op();o.ass=o.ass||{};o.ass[key]=vid;save();
  if(o.online&&FB.user&&o.online.role!=='view'){const upd={};upd['ass.'+key]=vid;
    FB.db.collection(COL).doc(o.online.id).update(upd).catch(e=>toast('⚠ บันทึกการจ่ายงานไม่สำเร็จ ('+((e&&e.code)||e)+') · ตรวจ rules ของ Firestore'));}}
/* ----- หน้าต่างออนไลน์ / แชร์ ----- */
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function shareDlg(){const o=op();
  if(!FB.user){mOpen('<h4>👥 ออนไลน์ / แชร์ให้ทีม</h4><p>ล็อกอินด้วย Google ก่อน แล้วจะขึ้นตารางนี้ออนไลน์และเชิญทีมด้วย Gmail ได้</p>',[{t:'🔑 เข้าสู่ระบบ',c:'pri',f:login},{t:'ปิด'}]);return;}
  const what='<p class="note">ทุกคนในทีมเห็นหมู่บ้าน เวลา และสถานะการสอดเดียวกันทันที · ✏️ สอด/แก้ได้ = เพิ่มลบหมู่บ้านและกดสถานะได้ · 👁 ดูอย่างเดียว · คนที่ได้รับเชิญล็อกอินด้วย Gmail ที่ใส่ไว้แล้วจะเห็นปฏิบัติการนี้เอง</p>';
  if(o.online&&o.online.role!=='owner'){mOpen(`<h4>👥 ตารางสอดของทีม</h4><p>หัวหน้า <b>${esc(o.online.ownerName)}</b> · สิทธิ์ของคุณ: <b>${o.online.role==='view'?'👁 ดูอย่างเดียว':'✏️ สอด/แก้ได้'}</b></p>${what}`,
    [{t:'ออกจากทีม (เก็บข้อมูลไว้ในเครื่อง)',c:'dng',f:()=>olDetach(o,'ออกจากทีมแล้ว · ข้อมูลยังอยู่ในเครื่องนี้')},{t:'ปิด'}]);return;}
  let d=null;if(o.online){try{const sn=await FB.db.collection(COL).doc(o.online.id).get();d=sn.exists?sn.data():null;}catch(e){}if(!d){toast('⚠ อ่านข้อมูลทีมไม่ได้');return;}}
  const roles=(d&&d.roles)||{},emails=(d&&d.emails)||[];
  const sel=(id,v,del)=>`<select id="${id}"><option value="edit" ${v==='edit'?'selected':''}>✏️ สอด/แก้ได้</option><option value="view" ${v==='view'?'selected':''}>👁 ดูอย่างเดียว</option>${del?'<option value="del">✕ เอาออก</option>':''}</select>`;
  mOpen(`<h4>👥 ${o.online?'ทีมของ':'ขึ้นออนไลน์:'} "${esc(o.name)}"</h4>${what}${o.online?`<p><b>ทีม ${emails.length} คน</b></p>`+emails.map((e,i)=>`<div class="mrow"><span>${esc(e)}</span>${sel('me'+i,roles[e],1)}</div>`).join(''):''}
    <p style="margin:10px 0 4px"><b>เชิญเพิ่ม (Gmail)</b></p><div class="mrow"><input id="mnew" type="email" placeholder="friend@gmail.com, ..." style="flex:1">${sel('mnr','edit')}</div><p class="note">ใส่หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค</p>`,
    [{t:o.online?'บันทึก':'ขึ้นออนไลน์',c:'pri',f:()=>shareSave(o,d,emails,roles)},...(o.online?[{t:'ลบออนไลน์ (เหลือในเครื่อง)',c:'dng',f:()=>shareStop(o)}]:[]),{t:'ยกเลิก'}]);}
async function shareSave(o,d,emails,roles){const R={};emails.forEach((e,i)=>{const el=$('me'+i);const v=el?el.value:roles[e];if(v!=='del')R[e]=v||'edit';});
  const nr=($('mnr')||{}).value||'edit',raw=String(($('mnew')||{}).value||'').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const bad=raw.filter(e=>!okEmail(e));if(bad.length){toast('⚠ อีเมลไม่ถูกต้อง: '+bad.join(', '));return;}raw.filter(e=>e!==meEmail()).forEach(e=>R[e]=nr);const E=Object.keys(R);
  try{if(!o.online){const ref=FB.db.collection(COL).doc(),str=pickData(o);
      await ref.set({owner:FB.user.uid,ownerEmail:meEmail(),ownerName:FB.user.displayName||meEmail(),name:o.name,emails:E,roles:R,data:str,ver:1,marks:o.marks||{},ass:o.ass||{},updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:meEmail()});
      o.online={id:ref.id,role:'owner',ownerName:FB.user.displayName||meEmail(),n:E.length,ver:1};save();olWatch();render();toast('🌐 ขึ้นออนไลน์แล้ว'+(E.length?' · ให้ทีมเปิดแอปแล้วล็อกอินด้วย Gmail ที่ใส่ไว้':''),5000);}
    else{await FB.db.collection(COL).doc(o.online.id).update({emails:E,roles:R,name:o.name});o.online.n=E.length;save();render();toast('👥 บันทึกทีมแล้ว');}
  }catch(e){toast('⚠ บันทึกไม่สำเร็จ — ตรวจ rules ของ Firestore ('+((e&&e.code)||e)+')',6000);}}
async function shareStop(o){try{await FB.db.collection(COL).doc(o.online.id).delete();}catch(e){toast('⚠ ลบออนไลน์ไม่สำเร็จ');return;}olUnwatch();o.online=null;save();render();toast('ลบออนไลน์แล้ว · ข้อมูลยังอยู่ในเครื่องนี้');}
/* ============ เริ่ม ============ */
load();render();i18nInit();mpEnsure(false);fbInit();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&op().s.host)mpEnsure(false);});
</script>
</body>
