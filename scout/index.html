<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โปรแกรมสอดแนม · Travian Scout v0.4.1</title>
<style>
:root{--bg:#f3f1ea;--panel:#fff;--row:#f7f5ef;--ink:#1f2a25;--mute:#6b7a72;--line:#e2ddd0;--accent:#2f8f6b;--accent-soft:#dcefe6;--warn:#c98a00;--bad:#c0392b;--good:#2f8f4e;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191b;--panel:#202427;--row:#262b2f;--ink:#e7ece9;--mute:#9aa7a0;--line:#343a3e;--accent:#5fbf97;--accent-soft:#1f3a32;--warn:#e0b34a;--bad:#ef6b5e;--good:#5fbf7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191b;--panel:#202427;--row:#262b2f;--ink:#e7ece9;--mute:#9aa7a0;--line:#343a3e;--accent:#5fbf97;--accent-soft:#1f3a32;--warn:#e0b34a;--bad:#ef6b5e;--good:#5fbf7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:linear-gradient(120deg,#3a2d1c,#5b4426 55%,#7a5a2e);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 small{font-weight:400;opacity:.75;font-size:11px}
.hbox{display:inline-flex;gap:4px;align-items:center;background:rgba(255,255,255,.12);padding:3px 6px;border-radius:10px}
header select,header button,header input{font:inherit;font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;padding:4px 9px;cursor:pointer}
header select option{color:#111}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer}
.chip .av{width:24px;height:24px;border-radius:50%;background:#fff;color:#5b4426;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.box h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.note{color:var(--mute);font-size:12.5px}
.warn{color:var(--warn)}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.dng{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
input[type=number]{width:70px}
.lnk{background:none;border:0;color:var(--accent);padding:2px 6px;font-weight:600}
.set{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.set label{display:inline-flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.side h3 .cnt{margin-left:auto;font-weight:400}
.vl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.vc{display:grid;grid-template-columns:1fr auto;gap:4px 8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--row)}
.vc .t{font-weight:700}
.vc .f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;grid-column:1/-1;font-size:13px}
.vc .f label{display:inline-flex;align-items:center;gap:4px}
.vc .x{align-self:start}
.pick{position:relative;flex:1;min-width:200px}
.pick input{width:100%}
.pl{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:4px;padding:4px}
.pl.on{display:block}
.pi{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:6px 8px;font-size:13px}
.pi:hover,.pi.on{background:var(--accent-soft)}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.scroll{overflow:auto}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.mx thead th{position:sticky;top:0;background:var(--row);z-index:2;font-weight:700}
.mx th.rh,.mx td.rh{position:sticky;left:0;background:var(--panel);text-align:left;z-index:1;min-width:230px}
.mx thead th.rh{z-index:3;background:var(--row)}
.mx .d{color:var(--mute);font-size:11.5px}
.mx td.c b{font-variant-numeric:tabular-nums;font-size:13.5px}
.mx td.c{min-width:150px;border-left:1px solid var(--line)}
.mx td.c.s-none{background:rgba(230,184,77,.22)}   /* เหลือง = ยังไม่มีข้อมูล */
.mx td.c.s-safe{background:rgba(47,143,78,.24)}    /* เขียว = ปลอดภัย (ทัพอยู่บ้านหลังเวลาปล่อย) */
.mx td.c.s-gone{background:rgba(192,57,43,.26)}    /* แดง = ทัพหาย มีโอกาสโดน */
.mx td.c .soon{color:var(--warn);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.dot.none{background:#e6b84d}.dot.safe{background:#2f8f4e}.dot.gone{background:#c0392b}
.cb{display:flex;gap:4px;justify-content:center;margin-top:4px}
.cb button{padding:2px 8px;font-size:12px;border-radius:999px;background:var(--panel)}
.cb button.on.safe{background:#2f8f4e;border-color:#2f8f4e;color:#fff;font-weight:700}
.cb button.on.gone{background:#c0392b;border-color:#c0392b;color:#fff;font-weight:700}
.cby{font-size:11px;color:var(--mute);margin-top:2px}
.rsum{font-size:12px;margin-top:3px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:8px 16px;font-weight:600;border-radius:10px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tk{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 270px 150px;gap:8px 14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--row)}
@media(max-width:900px){.tk{grid-template-columns:1fr}}
.tk select{max-width:100%}
.sq{width:100%;box-sizing:border-box;margin-bottom:4px}
.tk .press{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tk .cd{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tk.u1{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,.25)}.tk.u1 .cd{color:#c0392b}
.tk.u2 .cd{color:var(--warn)}
.tk.late{opacity:.75}.tk.late .cd{color:#c0392b}
.go{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.go.off{background:var(--line);color:var(--mute);pointer-events:none}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft)}
.when{font-size:12px;margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.mcard{background:var(--panel);color:var(--ink);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.mcard h4{margin:0 0 10px;font-size:16px}
.mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;display:none;z-index:90;max-width:92vw}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-radius:10px;background:var(--accent-soft);margin-bottom:12px;font-size:13.5px}
.bar.ro{background:rgba(230,184,77,.2)}
.empty{padding:20px;text-align:center}
.help li{margin:4px 0}
.hset{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.hset:empty{display:none}
.hset label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hset .hnote{opacity:.85;font-size:12px}
.hset .hnote button{padding:1px 7px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.grp .gl{font-weight:700;margin-right:2px}
.grp .gt{padding:6px 12px;border-radius:999px;font-weight:600}
.grp .gt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.grp .gact{margin-left:auto;display:flex;gap:4px}
header .ver{cursor:pointer;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 8px;opacity:1}
header .ver:hover{background:rgba(255,255,255,.3)}
.hseg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
header .hseg button{border:0;border-radius:0;padding:4px 9px;min-width:34px;font-weight:700;background:transparent;color:#fff}
header .hseg button.on{background:#fff;color:#5b4426}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{font-size:13px;padding:5px 12px;border-radius:999px}
.hp details.box{padding:0;overflow:hidden}
.hp summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:15.5px;list-style:none}
.hp summary::-webkit-details-marker{display:none}
.hp summary::before{content:'▸ ';color:var(--accent)}
.hp details[open] summary::before{content:'▾ '}
.hp details[open] summary{border-bottom:1px solid var(--line)}
.hp details.qs{border:2px solid var(--accent)}
.hbody{padding:6px 20px 14px;line-height:1.7}
.hbody h4{margin:12px 0 4px;color:var(--accent)}
.hbody li{margin:3px 0}
.hbody code{background:var(--row);padding:1px 6px;border-radius:6px}
.hbody table{border-collapse:collapse;margin:6px 0}.hbody td,.hbody th{border:1px solid var(--line);padding:4px 10px;text-align:left}
.cl{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.clv{flex:none;width:150px;font-variant-numeric:tabular-nums}
.clv b{color:var(--accent)}
.clv b.new{background:var(--accent);color:#fff;border-radius:999px;padding:0 8px}
.cls{color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>🔭 โปรแกรมสอดแนม <small>Travian Scout</small> <small class="ver" title="ดู Change Log" onclick="openLog()">v0.4.1</small></h1>
  <span class="hbox" title="โปรไฟล์ = เซิร์ฟเวอร์ที่เล่น"><select id="prsel" onchange="selProf(this.value)" title="โปรไฟล์ (เซิร์ฟเวอร์)"></select>
    <button onclick="newProf()" title="เพิ่มโปรไฟล์ (เซิร์ฟเวอร์)">＋</button><button onclick="renameProf()" title="เปลี่ยนชื่อโปรไฟล์">✏️</button><button onclick="delProf()" title="ลบโปรไฟล์">🗑️</button></span>
  <span class="sp"></span>
  <span class="hseg" title="Language / ภาษา"><button id="lang-th" onclick="setLang('th')">TH</button><button id="lang-en" onclick="setLang('en')">EN</button></span>
  <span class="hseg" title="ธีม"><button id="th-light" onclick="setTheme('light')" title="ธีมสว่าง">☀️</button><button id="th-dark" onclick="setTheme('dark')" title="ธีมมืด">🌙</button></span>
  <span id="user"></span>
  <div id="hset" class="hset"></div>
</header>
<main id="app"></main>
<div id="modal" class="modal" onclick="if(event.target===this)mClose()"><div class="mcard" id="mcard"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ ข้อมูลเกม (จากแอป Travian Resource Manager) ============ */
const UNITS={"Romans": [[0, "Legionnaire", 6], [1, "Praetorian", 5], [2, "Imperian", 7], [3, "Equites Legati", 16], [4, "Equites Imperatoris", 14], [5, "Equites Caesaris", 10], [6, "Battering Ram", 4], [7, "Fire Catapult", 3], [8, "Senator", 4], [9, "Settler", 5]], "Teutons": [[0, "Clubswinger", 7], [1, "Spearman", 7], [2, "Axeman", 6], [3, "Scout", 9], [4, "Paladin", 10], [5, "Teutonic Knight", 9], [6, "Ram", 4], [7, "Catapult", 3], [8, "Chief", 4], [9, "Settler", 5]], "Gauls": [[0, "Phalanx", 7], [1, "Swordsman", 6], [2, "Pathfinder", 17], [3, "Theutates Thunder", 19], [4, "Druidrider", 16], [5, "Haeduan", 13], [6, "Ram", 4], [7, "Trebuchet", 3], [8, "Chieftain", 5], [9, "Settler", 5]], "Egyptians": [[0, "Slave Militia", 7], [1, "Ash Warden", 6], [2, "Khopesh Warrior", 7], [3, "Sopdu Explorer", 16], [4, "Anhur Guard", 15], [5, "Resheph Chariot", 10], [6, "Ram", 4], [7, "Stone Catapult", 3], [8, "Nomarch", 4], [9, "Settler", 5]], "Huns": [[0, "Mercenary", 6], [1, "Bowman", 6], [2, "Spotter", 19], [3, "Steppe Rider", 16], [4, "Marksman", 15], [5, "Marauder", 14], [6, "Ram", 4], [7, "Catapult", 3], [8, "Logades", 5], [9, "Settler", 5]], "Vikings": [[0, "Thrall", 7], [1, "Shield Maiden", 7], [2, "Berserker", 5], [3, "Heimdall's Eye", 9], [4, "Huskarl Rider", 12], [5, "Valkyrie's Blessing", 9], [6, "Ram", 4], [7, "Catapult", 3], [8, "Jarl", 5], [9, "Settler", 5]], "Spartans": [[0, "Hoplite", 6], [1, "Sentinel", 9], [2, "Shieldsman", 8], [3, "Twinsteel Therion", 6], [4, "Elpida Rider", 16], [5, "Corinthian Crusher", 9], [6, "Ram", 4], [7, "Ballista", 3], [8, "Ephor", 4], [9, "Settler", 5]]};   // เผ่า → [[index, ชื่อ, ความเร็ว x1]]
const MAP_TRIBE={1:'Romans',2:'Teutons',3:'Gauls',6:'Egyptians',7:'Huns',8:'Spartans',9:'Vikings',5:'Natars'};
const ART={'3':3,'2':2,'1.5':1.5,'0.67':2/3,'0.5':0.5,'0.33':1/3};
const BOOTS=[0,25,35,50,60,75,85,100,125];
const SCOUT_U={Romans:3,Teutons:3,Gauls:2,Egyptians:3,Huns:2,Vikings:3,Spartans:1};   // ตำแหน่งตัวสอดของแต่ละเผ่า (0 = หน่วยแรก)
const MIRROR='https://raw.githubusercontent.com/nawatnawat/Travian_Resource_Manager/mapdata/';   // สำเนา map.sql (workflow ของแอปหลัก)
const MIRROR_API='https://api.github.com/repos/nawatnawat/Travian_Resource_Manager/commits?sha=mapdata&per_page=1';
const FB_CONFIG={apiKey:"AIzaSyCHSWFwOZYoCGRV0i-Ai_LHBxD36AYkSRM",authDomain:"travian-manager-c3b13.firebaseapp.com",projectId:"travian-manager-c3b13",storageBucket:"travian-manager-c3b13.firebasestorage.app",messagingSenderId:"271817675852",appId:"1:271817675852:web:7e74d03b957f40a14890e9"};
const COL='scoutops';   // Firestore: ปฏิบัติการที่ออนไลน์
const LSK='scout-app';   // localStorage ของแอปนี้ (โดเมนเดียวกับแอปหลัก จึงขึ้นต้นด้วย scout- ทั้งหมด)
/* ============ ตัวช่วย ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
function toast(m,ms){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||3500);}
const pad=n=>String(n).padStart(2,'0');
// เวลา = นาฬิกาของเกม (เก็บเป็นสตริง YYYY-MM-DDTHH:MM:SS · คำนวณแบบ UTC ภายใน ไม่ให้เขตเวลาเครื่องมายุ่ง)
const parseDT=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})T(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(String(s||''));return m?Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)):null;};
const toDT=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());};
const MON='ม.ค.,ก.พ.,มี.ค.,เม.ย.,พ.ค.,มิ.ย.,ก.ค.,ส.ค.,ก.ย.,ต.ค.,พ.ย.,ธ.ค.'.split(',');
const clock=ms=>{const d=new Date(ms);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());};
const MON_EN='Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec'.split(',');
const dmy=ms=>{const d=new Date(ms);return d.getUTCDate()+' '+(LANG()==='en'?MON_EN:MON)[d.getUTCMonth()];};
const hms=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);};
const gameNow=()=>Date.now()-new Date().getTimezoneOffset()*60000;   // นาฬิกาเกม = นาฬิกาเครื่องนี้ (เวลาในเกมตั้งให้ตรงกับเวลาเครื่อง)
/* ============ ที่เก็บในเครื่อง ============ */
let L=null;
// โปรไฟล์ (L.profs) = เซิร์ฟเวอร์ที่เล่น: เก็บค่าเซิร์ฟ (s) · ในโปรไฟล์มีตารางสอดได้หลายกลุ่ม (L.ops ที่ pid ตรงกัน)
// ตารางสอดทุกอันในโปรไฟล์ใช้ s ก้อนเดียวกับโปรไฟล์ (o.s === prof.s) และส่ง s ไปกับข้อมูลออนไลน์ให้ทีม
const defS=()=>({host:'',size:200,round:true,speed:2,tz:-new Date().getTimezoneOffset()/60});
let _uid=0;const uid=p=>p+Date.now().toString(36)+(++_uid);
function newOpData(name,pid){const pr=(L&&L.profs&&(L.profs.find(x=>x.id===(pid||L.pcur))||L.profs[0]))||null;
  return {id:uid('l'),pid:pr?pr.id:'',name:name||'ตารางสอด 1',online:null,s:pr?pr.s:defS(),A:[],B:[],marks:{},nextId:1};}
const prof=()=>L.profs.find(p=>p.id===L.pcur)||L.profs[0];
const profOf=o=>L.profs.find(p=>p.id===o.pid);
const profOps=pid=>L.ops.filter(o=>o.pid===(pid||L.pcur));
function profName(p){return p.name||p.s.host||'เซิร์ฟเวอร์';}
function linkProfs(){ // ผูก o.s กับ s ของโปรไฟล์ · ย้ายตารางที่ไม่มีโปรไฟล์
  L.ops.forEach(o=>{let p=profOf(o);if(!p){const h=hostOf(o.s&&o.s.host);p=(h&&L.profs.find(x=>hostOf(x.s.host)===h))||null;
      if(!p){p={id:uid('p'),name:h||'',s:Object.assign(defS(),o.s||{})};L.profs.push(p);}o.pid=p.id;}o.s=p.s;});}

const MP={host:'',rows:null,at:0,xy:null,loading:false};
function hostOf(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).host.toLowerCase();}catch(e){return '';}}
function decHtml(s){if(!/&[#a-z0-9]+;/i.test(s))return s;const e=document.createElement('textarea');e.innerHTML=s;return e.value;}
function parseMapSql(t){const out=[],n=t.length;let i=0;
  while(true){const k=t.indexOf('VALUES',i);if(k<0)break;i=k+6;
    while(i<n){while(i<n&&(t[i]===','||t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;if(t[i]!=='(')break;i++;const v=[];
      while(i<n){while(t[i]===' ')i++;let x;

        else{let s='';while(i<n&&t[i]!==','&&t[i]!==')')s+=t[i++];x=s.trim();if(x==='NULL')x=null;}
        v.push(x);while(t[i]===' ')i++;if(t[i]===','){i++;continue;}if(t[i]===')'){i++;break;}break;}
      if(v.length>=11)out.push({vid:+v[4],x:+v[1],y:+v[2],tribe:+v[3],name:decHtml(v[5]||''),uid:+v[6],player:decHtml(v[7]||''),aid:+v[8],ally:decHtml(v[9]||''),pop:+v[10]||0,capital:String(v[12]).toUpperCase()==='TRUE'});}}
  return out;}
const pack=rows=>rows.map(r=>[r.vid,r.x,r.y,r.tribe,r.name,r.uid,r.player,r.aid,r.ally,r.pop,r.capital?1:0]);   // รูปแบบเดียวกับแอปหลัก
const unpack=a=>a.map(v=>({vid:v[0],x:v[1],y:v[2],tribe:v[3],name:v[4],uid:v[5],player:v[6],aid:v[7],ally:v[8],pop:v[9],capital:!!v[10]}));
function mpBoundary(now){const d=new Date(now);let b=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,10,0);if(now<b)b-=86400000;return b;}

async function mpEnsure(force){
  const h=hostOf(op().s.host);if(!h){MP.host='';MP.rows=null;return;}
  if(MP.host!==h){MP.host=h;MP.rows=null;try{const o=JSON.parse(localStorage.getItem('travian-mapsql:'+h)||'null');if(o&&Array.isArray(o.rows))mpSet(unpack(o.rows),o.at||0);}catch(e){}}
  if(!force&&MP.rows&&MP.at>=mpBoundary(Date.now()))return;
  if(MP.loading)return;MP.loading=true;render();

    let at=0;try{const r=await fetch(MIRROR_API,{cache:'no-store'});if(r.ok){const j=await r.json();at=Date.parse(j[0].commit.committer.date)||0;}}catch(e){}
    if(force||!MP.rows||!at||at>MP.at){

const vill=(x,y)=>MP.xy?MP.xy.get(x+'|'+y)||null:null;
function findV(q){if(!MP.rows)return [];q=String(q||'').trim().toLowerCase().replace(/[−–]/g,'-');if(!q)return [];
  const out=[],seen=new Set(),c=/^\(?\s*(-?\d+)\s*(?:([|/,\s])\s*(-?\d*))?\s*\)?$/.exec(q);
  if(c){const a=c[1],b=c[3]||'',T=[];for(const r of MP.rows){const xs=String(r.x),ys=String(r.y);let sc=-1;
      if(c[2]){if(xs===a&&ys.startsWith(b))sc=ys===b?0:1;}else if(xs===a||ys===a)sc=0;else if(xs.startsWith(a)||ys.startsWith(a))sc=1;if(sc>=0)T.push([sc,r]);}
    T.sort((p,s)=>p[0]-s[0]||p[1].x-s[1].x||p[1].y-s[1].y);T.forEach(([,r])=>{out.push(r);seen.add(r);});}

function dist(a,b){const s=op().s;let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);if(s.round){const n=2*s.size+1;dx=Math.min(dx,n-dx);dy=Math.min(dy,n-dy);}return Math.hypot(dx,dy);}   // โลกกลม: คิดข้ามขอบแยกแกน X/Y

  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1)doEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
}
function i18nRun(nodes){if(_i18nBusy)return;_i18nBusy=true;try{nodes.forEach(i18nNode);}finally{if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}}
function i18nRestore(){_i18nBusy=true;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){if(n._th!==undefined){n.nodeValue=n._th;delete n._th;}}else I18N_ATTR.forEach(a=>{const k='data-th-'+a;if(n.hasAttribute(k)){n.setAttribute(a,n.getAttribute(k));n.removeAttribute(k);}});}
  if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}
function themeCur(){return L&&L.theme?L.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function themeUI(){const t=themeCur();if(L&&L.theme)document.documentElement.setAttribute('data-theme',L.theme);else document.documentElement.removeAttribute('data-theme');
  ['light','dark'].forEach(x=>{const b=$('th-'+x);if(b)b.classList.toggle('on',x===t);});}
function setTheme(t){L.theme=t==='dark'?'dark':'light';save();themeUI();}
function langUI(){const l=LANG();document.documentElement.lang=l;document.title=(l==='en'?'Travian Scout':'โปรแกรมสอดแนม · Travian Scout')+' v'+APP_V;['th','en'].forEach(x=>{const b=$('lang-'+x);if(b)b.classList.toggle('on',x===l);});}
function setLang(l){L.lang=l==='en'?'en':'th';save();if(L.lang==='th'){i18nRestore();render();}else{render();i18nRun([document.body]);}langUI();}
function i18nInit(){
  _i18nObs=new MutationObserver(recs=>{if(_i18nBusy||LANG()!=='en')return;const ns=[];recs.forEach(r=>{if(r.type==='characterData'||r.type==='attributes')ns.push(r.target);else r.addedNodes.forEach(x=>ns.push(x));});i18nRun(ns);});
  _i18nObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:I18N_ATTR});
  langUI();themeUI();if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUI);if(LANG()==='en')i18nRun([document.body]);}

function helpData(){const T=TL;return [["h-quick",T("🚀 เริ่มต้นใช้งาน","🚀 Quick start"),T("<ol><li>ที่หัวเว็บ ใส่ <b>เซิร์ฟเวอร์</b> ของโปรไฟล์ เช่น <code>ts21.x2.asia.travian.com</code> แอปจะโหลด map.sql ให้เอง แล้วตั้ง <b>ความเร็ว</b>, <b>ขนาดแผนที่</b>, <b>โลกกลม/แบน</b> ให้ตรงกับเซิร์ฟ</li>\n<li>แท็บ <b>📊 ตารางเวลาปล่อย</b>: ซ้ายใส่หมู่บ้านศัตรูที่สงสัยว่ามาตี ขวาใส่หมู่บ้านเราที่โดนตีพร้อม <b>เวลาทัพเข้า</b></li>\n<li>ตารางตรงกลางบอก <b>เวลาที่ศัตรูต้องปล่อยทัพ</b> ไปสอดหลังเวลานั้น ถ้าทัพยังอยู่บ้าน = ไม่ใช่ตัวตีหมู่บ้านนั้น</li>\n<li>กด ✓ / ✗ ในแต่ละช่องเพื่อบอกผลการสอด</li>\n<li>แท็บ <b>🕵️ ปล่อยตัวสอด</b>: แอปบอกว่าต้องกดส่งตัวสอดจากหมู่บ้านไหนกี่โมง พร้อมนับถอยหลังและปุ่มส่งในเกม</li>\n<li>กด ＋ เพิ่ม ข้าง 🗂️ ตารางสอด เพื่อแยกตารางเป็นหลายกลุ่ม · กด 👥 เพื่อขึ้นออนไลน์และเชิญทีม</li></ol>","<ol><li>In the header, enter the profile's <b>server</b>, e.g. <code>ts21.x2.asia.travian.com</code>; the app loads map.sql by itself. Set <b>speed</b>, <b>map size</b>, <b>round/flat world</b> to match the server</li>\n<li><b>📊 Launch table</b> tab: enemy villages you suspect on the left, our targeted villages with their <b>arrival time</b> on the right</li>\n<li>The table shows <b>when the enemy must launch</b>. Scout after that time; if the army is still home, that village is not the attacker</li>\n<li>Press ✓ / ✗ in each cell to record the scout result</li>\n<li><b>🕵️ Send scouts</b> tab: shows which village to send scouts from and when, with a countdown and an in-game send button</li>\n<li>Press ＋ Add next to 🗂️ Scout tables to split into several groups · press 👥 to go online and invite your team</li></ol>")],["h-ops",T("🗂️ โปรไฟล์และตารางสอด","🗂️ Profiles and scout tables"),T("<ul><li><b>โปรไฟล์</b> (กล่องบนสุดของหัวเว็บ) = เซิร์ฟเวอร์ที่เล่น · <b>＋</b> เพิ่มโปรไฟล์ · <b>✏️</b> เปลี่ยนชื่อ · <b>🗑️</b> ลบ</li>\n<li>ค่าของเซิร์ฟอยู่ที่หัวเว็บใต้โปรไฟล์: <b>เซิร์ฟเวอร์</b>, <b>ความเร็ว</b>, <b>แผนที่ ±</b>, <b>โลกกลม/แบน</b> และสถานะ map.sql · ใช้กับทุกตารางในโปรไฟล์นั้น</li>\n<li><b>🗂️ ตารางสอด</b>: ในโปรไฟล์มีได้หลายกลุ่ม (เช่น แยกตามพันธมิตรที่มาตี หรือตามวัน) กด <b>＋ เพิ่ม</b> · กดชื่อเพื่อสลับ · ✏️ เปลี่ยนชื่อ · 👥 ออนไลน์/แชร์ · 🗑️ ลบ</li>\n<li>แต่ละตารางแชร์ออนไลน์แยกกันได้ ตารางที่ทีมแชร์มาจะเข้าโปรไฟล์ของเซิร์ฟเวอร์นั้นเอง (ถ้ายังไม่มีจะสร้างให้)</li>\n<li>ตารางที่ยังไม่ออนไลน์เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</li></ul>","<ul><li><b>Profile</b> (top box in the header) = the server you play · <b>＋</b> add profile · <b>✏️</b> rename · <b>🗑️</b> delete</li>\n<li>Server settings are in the header under the profile: <b>server</b>, <b>speed</b>, <b>map ±</b>, <b>round/flat world</b> and map.sql status · they apply to every table in that profile</li>\n<li><b>🗂️ Scout tables</b>: a profile can hold several groups (e.g. one per attacking alliance or per day). Press <b>＋ Add</b> · click a name to switch · ✏️ rename · 👥 online/share · 🗑️ delete</li>\n<li>Each table is shared online separately; tables shared by your team go into the profile of their server automatically (created if missing)</li>\n<li>Tables that are not online are stored only in this browser</li></ul>")],["h-table",T("📊 ตารางเวลาปล่อย","📊 Launch table"),T("<h4>⚔️ หมู่บ้านศัตรูที่มาตี (ซ้าย)</h4><ul><li>ค้นหาจาก map.sql ได้ทั้ง พันธมิตร · ผู้เล่น · ชื่อหมู่บ้าน · พิกัด (พิมพ์บางส่วนได้ เช่น <code>-114</code>) หรือกด ＋ ใส่เอง</li>\n<li>ตั้ง <b>เผ่า</b>, <b>หน่วยช้าสุด</b> ที่สงสัย (เช่น แคต), <b>ลาน (TS)</b>, <b>รองเท้า</b>, <b>อาร์ติแฟกต์</b> · ช่องความเร็วใส่เองได้ถ้ารู้ความเร็วจริง (ช่อง/ชม. รวมความเร็วเซิร์ฟแล้ว)</li></ul>\n<h4>🛡️ หมู่บ้านเราที่โดนตี (ขวา)</h4><ul><li>ใส่หมู่บ้านและ <b>เวลาทัพเข้า</b> ตามที่เห็นในเกม (เวลาเกม)</li></ul>\n<h4>🕒 ตาราง</h4><ul><li>แต่ละช่อง = เวลาที่ศัตรูหมู่บ้านนั้นต้องปล่อยทัพ เพื่อให้ถึงหมู่บ้านเราตามเวลาเข้า</li>\n<li>ไปสอดหลังเวลานั้น แล้วกด <b>✓ ปลอดภัย</b> (ทัพยังอยู่บ้าน) หรือ <b>✗ ทัพหาย</b> (มีโอกาสโดน) · กดปุ่มเดิมอีกครั้งเพื่อล้าง</li>\n<li>สีช่อง: 🟡 ยังไม่มีข้อมูล · 🟢 ปลอดภัย · 🔴 ทัพหาย</li>\n<li>กดเวลาใต้ปุ่มเพื่อแก้เป็นเวลาในรายงานการสอด</li>\n<li><b>📋 คัดลอกไปแชต</b> คัดลอกตารางเป็นข้อความไปวางในแชตทีม</li></ul>","<h4>⚔️ Enemy attacker villages (left)</h4><ul><li>Search map.sql by alliance · player · village name · coordinates (partial works, e.g. <code>-114</code>) or press ＋ to add manually</li>\n<li>Set <b>tribe</b>, suspected <b>slowest unit</b> (e.g. catapults), <b>TS</b>, <b>boots</b>, <b>artifact</b> · type a speed if you know the real one (fields/h, server speed included)</li></ul>\n<h4>🛡️ Our targeted villages (right)</h4><ul><li>Enter the village and the <b>arrival time</b> seen in the game (game time)</li></ul>\n<h4>🕒 Table</h4><ul><li>Each cell = when that enemy village must launch to arrive at our village on time</li>\n<li>Scout after that time, then press <b>✓ Safe</b> (army still home) or <b>✗ Army gone</b> (may be hit) · press the same button again to clear</li>\n<li>Cell colors: 🟡 no data · 🟢 safe · 🔴 army gone</li>\n<li>Click the time under the buttons to change it to the scout report time</li>\n<li><b>📋 Copy to chat</b> copies the table as text for your team chat</li></ul>")],["h-send",T("🕵️ ปล่อยตัวสอด","🕵️ Send scouts"),T("<h4>ตั้งค่าตัวสอดของฉัน (เก็บเฉพาะเครื่องนี้ ไม่แชร์)</h4><ul><li><b>ชื่อผู้เล่นของฉัน</b>: ชื่อในเกมตาม map.sql แอปดึงหมู่บ้านของคุณมาให้เลือก และรู้เผ่าเอง</li>\n<li><b>จำนวนตัวสอด</b> และ <b>ลาน (TS)</b> ของเรา · ถ้าไม่ใส่ชื่อผู้เล่น ให้เลือก <b>เผ่าของเรา</b></li></ul>\n<h4>คิวปล่อยตัวสอด</h4><ul><li>แสดงเฉพาะหมู่บ้านศัตรูที่ยังไม่ถึงเวลาปล่อย เรียงตามเวลาที่ต้องกด</li>\n<li><b>ยึดเวลาปล่อยของ</b>: ทุกหมู่บ้าน (เวลาล่าสุด) หรือเลือกหมู่บ้านเราหมู่บ้านเดียว</li>\n<li><b>ตัวสอดถึงตรงกับเวลาที่ศัตรูต้องปล่อยพอดี</b> อยากให้ถึงก่อนหรือหลังกี่วินาที ปรับตอนกดเอง</li>\n<li><b>ส่งจากหมู่บ้านของเรา</b>: เลือกหมู่บ้านใกล้สุดให้ก่อน เปลี่ยนได้ · พิมพ์พิกัด <code>x/y</code> หรือชื่อหมู่บ้านในช่อง 🔍 เพื่อกรอง</li>\n<li>พิมพ์พิกัดที่ไม่มีใน map.sql ได้ แอปคำนวณเวลาให้ แต่ไม่มีปุ่มส่ง (ไม่รู้ ID หมู่บ้าน)</li>\n<li><b>กดปล่อย</b> = เวลาถึง − เวลาเดินของตัวสอด · นับถอยหลังเป็นสีเหลืองเมื่อเหลือไม่ถึง 30 นาที และกรอบแดงเมื่อไม่ถึง 5 นาที · ถ้าเลยแล้วบอกว่าเลยมากี่นาทีและถ้าปล่อยตอนนี้จะถึงกี่โมง</li>\n<li><b>🕵️ ส่งตัวสอด ↗</b> เปิดหน้าส่งทหารในเกม ใส่พิกัดและตัวสอดให้แล้ว (ส่งแบบปล้น = สอดแนม) ต้องกดยืนยันในเกมเอง และเลือกสอดทรัพยากร/การป้องกันในหน้ายืนยัน · ใช้ได้กับหมู่บ้านในบัญชีที่ล็อกอินอยู่เท่านั้น</li></ul>","<h4>My scout settings (this device only, not shared)</h4><ul><li><b>My player name</b>: your in-game name as in map.sql. The app lists your villages and knows your tribe</li>\n<li>Number of <b>scouts</b> and our <b>TS</b> · without a player name, choose <b>our tribe</b></li></ul>\n<h4>Scout send queue</h4><ul><li>Only enemy villages whose launch time is still ahead, sorted by press time</li>\n<li><b>Use launch time of</b>: all villages (latest time) or a single one of our villages</li>\n<li><b>Scouts land exactly at the enemy's launch time.</b> If you want them earlier or later, adjust when you press</li>\n<li><b>Send from our village</b>: the nearest is picked first and can be changed · type <code>x/y</code> or a village name in the 🔍 box to filter</li>\n<li>Coordinates not in map.sql are allowed: you get the times, but no send button (village ID unknown)</li>\n<li><b>Press at</b> = arrival − scout travel time · the countdown turns yellow under 30 minutes and the card gets a red frame under 5 minutes · when late it shows by how much and when scouts would land if sent now</li>\n<li><b>🕵️ Send scouts ↗</b> opens the in-game send page with coordinates and scouts filled in (sent as raid = scouting). Confirm in the game and choose resources/defences on the confirm page · works only for villages of the account you are signed in to</li></ul>")],["h-online",T("🌐 ออนไลน์และทีม","🌐 Online and team"),T("<ul><li>กด <b>🔑 เข้าสู่ระบบ Google</b> แล้วกด <b>👥</b> (แถวตารางสอด) เพื่อขึ้นตารางนี้ออนไลน์ คุณจะเป็น <b>หัวหน้า</b></li>\n<li>ใส่ Gmail ของทีม (หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค) เลือกสิทธิ์ <b>✏️ สอด/แก้ได้</b> หรือ <b>👁 ดูอย่างเดียว</b></li>\n<li>ทีมเปิดแอปแล้วล็อกอินด้วย Gmail นั้น จะเห็นตารางเอง ทุกคนเห็นหมู่บ้าน เวลา และสถานะเดียวกันทันที</li>\n<li>หัวหน้าลบตารางออนไลน์ได้ · สมาชิกออกจากทีมได้ (ข้อมูลยังอยู่ในเครื่อง)</li>\n<li>ค่าในแท็บปล่อยตัวสอด (ชื่อผู้เล่น จำนวนตัวสอด ลาน) เป็นของแต่ละคน ไม่แชร์</li></ul>","<ul><li>Press <b>🔑 Sign in with Google</b>, then <b>👥</b> (scout table row) to put this table online; you become the <b>leader</b></li>\n<li>Enter the team's Gmail addresses (several allowed, separated by spaces or commas) and choose <b>✏️ scout/edit</b> or <b>👁 view only</b></li>\n<li>Team members open the app and sign in with that Gmail to see the table; everyone sees the same villages, times and status instantly</li>\n<li>The leader can delete the online table · members can leave the team (data stays on their device)</li>\n<li>Send scouts settings (player name, scout count, TS) are personal and not shared</li></ul>")],["h-map",T("🗺️ map.sql","🗺️ map.sql"),T("<ul><li>map.sql คือไฟล์ข้อมูลหมู่บ้านทั้งเซิร์ฟเวอร์ที่ Travian อัปเดตวันละครั้ง</li>\n<li>แอปโหลดจากสำเนาบน GitHub ของแอปหลัก (Travian Resource Manager) และใช้ข้อมูลที่โหลดไว้ร่วมกับแอปหลักในเบราว์เซอร์เดียวกัน</li>\n<li>กด ⟳ ข้าง map.sql เพื่อโหลดใหม่ · ต้องเปิดแอปจากลิงก์เว็บ (ไม่ใช่ไฟล์ในเครื่อง) ถึงจะโหลดได้</li></ul>","<ul><li>map.sql is the village data file of the whole server that Travian updates once a day</li>\n<li>The app loads it from the main app's GitHub copy (Travian Resource Manager) and shares the loaded data with the main app in the same browser</li>\n<li>Press ⟳ next to map.sql to reload · the app must be opened from the web link (not a local file) to load it</li></ul>")],["h-calc",T("🧮 การคำนวณ","🧮 How it's calculated"),T("<ul><li>ระยะทาง = √(dx² + dy²) · โลกกลม: แต่ละแกนเดินข้ามขอบได้ (ใช้ระยะที่สั้นกว่า)</li>\n<li>20 ช่องแรกเดินความเร็วปกติ ส่วนที่เกิน 20 ช่องคูณ (1 + (20×ลาน + รองเท้า)/100)</li>\n<li>อาร์ติแฟกต์ความเร็วคูณทั้งเส้นทาง · ความเร็วเซิร์ฟ x2 และ x3 ทหารเดินเร็ว ×2</li>\n<li>เวลาที่ศัตรูต้องปล่อย = เวลาทัพเข้า − เวลาเดิน · เวลากดส่งตัวสอด = เวลานั้น − เวลาเดินของตัวสอด</li>\n<li>เวลาทั้งหมดเป็นเวลาเกม แอปใช้นาฬิกาของเครื่องเป็นเวลาเกม เพื่อบอกว่าเลยเวลาแล้วหรือยังและนับถอยหลัง</li></ul>","<ul><li>Distance = √(dx² + dy²) · round world: each axis can wrap around the edge (shorter distance is used)</li>\n<li>The first 20 fields at normal speed; distance beyond 20 fields is multiplied by (1 + (20×TS + boots)/100)</li>\n<li>Speed artifacts multiply the whole trip · on x2 and x3 servers troops move ×2</li>\n<li>Enemy launch time = arrival − travel time · scout press time = that time − scout travel time</li>\n<li>All times are game time; the app uses the device clock as game time to tell whether a time has passed and for countdowns</li></ul>")],["h-faq",T("❓ ปัญหาที่พบบ่อย","❓ FAQ"),T("<ul><li><b>ไม่พบผู้เล่นใน map.sql</b>: พิมพ์ชื่อให้ตรงทุกตัวอักษร หรือ map.sql ยังไม่อัปเดต (ผู้เล่นใหม่/เปลี่ยนชื่อ) · พิมพ์พิกัดต้นทางเองแทนได้</li>\n<li><b>ลิงก์ส่งเปิดแล้วไม่ใช่หมู่บ้านเรา</b>: ลิงก์ใช้ได้เฉพาะหมู่บ้านในบัญชีที่ล็อกอินในเบราว์เซอร์นั้น</li>\n<li><b>เวลาเพี้ยนเป็นชั่วโมง</b>: ตั้งเขตเวลาในเกม (โปรไฟล์ → การตั้งค่า) ให้ตรงกับเวลาเครื่อง เช่น ไทย UTC+7</li>\n<li><b>ไม่เห็นตารางของทีม</b>: ล็อกอินด้วย Gmail ที่หัวหน้าเชิญ แล้วกดโหลดรายการทีมใหม่</li></ul>","<ul><li><b>Player not found in map.sql</b>: type the name exactly, or map.sql isn't updated yet (new player/renamed) · you can type source coordinates instead</li>\n<li><b>The send link opens a village that isn't ours</b>: links work only for villages of the account signed in in that browser</li>\n<li><b>Times off by hours</b>: set the in-game time zone (profile → settings) to match your device, e.g. UTC+7 for Thailand</li>\n<li><b>Team table not visible</b>: sign in with the Gmail the leader invited, then reload the team list</li></ul>")],["h-log","📝 Change Log",logHTML()]];}
function helpHTML(){const H=helpData(),en=LANG()==='en';
  return `<div data-noi18n><section class="box"><h3>📖 ${en?'User manual':'คู่มือการใช้งาน'} ${en?'Travian Scout':'โปรแกรมสอดแนม'} <span class="tag">v${APP_V}</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button onclick="document.querySelectorAll('.hp details').forEach(d=>d.open=true)">${en?'Expand all':'กางทั้งหมด'}</button><button onclick="document.querySelectorAll('.hp details').forEach(d=>d.open=false)">${en?'Collapse all':'พับทั้งหมด'}</button></span></h3>

  $('app').innerHTML=tabs+grp+bar+`
  ${L.tab==='send'?sendHTML():`<div class="cols">
    <section class="box side"><h3>⚔️ หมู่บ้านศัตรูที่มาตี <span class="cnt note">${o.A.length} หมู่บ้าน</span></h3>

function olUnwatch(){if(FB.unsub){try{FB.unsub();}catch(e){}}FB.unsub=null;FB.watch='';}
function olWatch(){const o=op();const id=o&&o.online&&FB.user?o.online.id:'';if(id===FB.watch)return;olUnwatch();if(!id)return;FB.watch=id;
  FB.unsub=FB.db.collection(COL).doc(id).onSnapshot(sn=>{const o=L.ops.find(z=>z.online&&z.online.id===id);if(!o)return;
    if(!sn.exists){olDetach(o,'หัวหน้าลบตารางนี้แล้ว · ข้อมูลยังอยู่ในเครื่องนี้');return;}
    const d=sn.data(),role=roleOf(d);if(!role){olDetach(o,'คุณไม่ได้อยู่ในทีมของตารางนี้แล้ว');return;}
    const go=()=>{const pend=FB.push||FB.fly;
      o.online.role=role;o.online.n=(d.emails||[]).length;o.online.ownerName=d.ownerName||d.ownerEmail||'';o.name=d.name||o.name;
      if(!pend&&(+d.ver||0)>o.online.ver){putData(o,d.data);o.online.ver=+d.ver||0;if(d.by&&d.by!==meEmail())toast('🌐 อัปเดตจาก '+d.by);}
      o.marks=Object.assign({},d.marks||{});save();if(op()===o)render();};
    if(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)&&!document.activeElement.closest('.pick')){FB.pend=go;const h=()=>{document.removeEventListener('focusout',h,true);setTimeout(()=>{const f=FB.pend;FB.pend=null;if(f)f();},60);};document.addEventListener('focusout',h,true);}
    else go();
  },e=>{if((e&&e.code)==='permission-denied'){const o=L.ops.find(z=>z.online&&z.online.id===id);if(o)olDetach(o,'คุณไม่ได้อยู่ในทีมของตารางนี้แล้ว');}});}
function olDetach(o,msg){if(o.online)L.hidden=Object.assign(L.hidden||{},{[o.online.id]:1});o.online=null;save();olUnwatch();render();if(msg)toast('🌐 '+msg,5000);}
function olSchedule(){clearTimeout(FB.push);FB.push=setTimeout(()=>{FB.push=0;olPush();},800);}
async function olPush(o){o=o||op();if(!o||!o.online||!FB.user||o.online.role==='view')return;const id=o.online.id,base=o.online.ver,str=pickData(o);
  if(str.length>900000){toast('⚠ ข้อมูลใหญ่เกินไป');return;}FB.fly=true;
  try{const ref=FB.db.collection(COL).doc(id);
    const ver=await FB.db.runTransaction(async tx=>{const sn=await tx.get(ref);if(!sn.exists){const e=new Error('gone');e.gone=1;throw e;}const d=sn.data(),cur=+d.ver||0;
      if(cur!==base){const e=new Error('conflict');e.conflict=1;e.d=d;throw e;}
      tx.update(ref,{data:str,ver:cur+1,name:o.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:meEmail()});return cur+1;});
    o.online.ver=ver;save();if(pickData(o)!==str)olSchedule();
  }catch(e){if(e&&e.conflict){putData(o,e.d.data);o.online.ver=+e.d.ver||0;o.marks=e.d.marks||{};save();render();toast('⚠ มีคนแก้พร้อมกัน — ใช้ฉบับล่าสุดแล้ว กรุณาแก้อีกครั้ง',5000);}
    else if(e&&(e.gone||e.code==='permission-denied'))olDetach(o,'ซิงค์ไม่ได้ (ไม่มีสิทธิ์ หรือตารางถูกลบ)');else{toast('⚠ ซิงค์ไม่สำเร็จ — จะลองใหม่');setTimeout(olSchedule,15000);}}
  finally{FB.fly=false;}}
function olMark(id,v,silent){const o=op();if(v)o.marks[id]=v;else delete o.marks[id];save();if(!silent)render();
  if(o.online&&FB.user&&o.online.role!=='view'){const upd={};upd['marks.'+id]=v?v:firebase.firestore.FieldValue.delete();
    FB.db.collection(COL).doc(o.online.id).update(upd).catch(e=>toast('⚠ บันทึกสถานะไม่สำเร็จ ('+((e&&e.code)||e)+')'));}}
/* ----- หน้าต่างออนไลน์ / แชร์ ----- */
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function shareDlg(){const o=op();
  if(!FB.user){mOpen('<h4>👥 ออนไลน์ / แชร์ให้ทีม</h4><p>ล็อกอินด้วย Google ก่อน แล้วจะขึ้นตารางนี้ออนไลน์และเชิญทีมด้วย Gmail ได้</p>',[{t:'🔑 เข้าสู่ระบบ',c:'pri',f:login},{t:'ปิด'}]);return;}
  const what='<p class="note">ทุกคนในทีมเห็นหมู่บ้าน เวลา และสถานะการสอดเดียวกันทันที · ✏️ สอด/แก้ได้ = เพิ่มลบหมู่บ้านและกดสถานะได้ · 👁 ดูอย่างเดียว · คนที่ได้รับเชิญล็อกอินด้วย Gmail ที่ใส่ไว้แล้วจะเห็นปฏิบัติการนี้เอง</p>';
  if(o.online&&o.online.role!=='owner'){mOpen(`<h4>👥 ตารางสอดของทีม</h4><p>หัวหน้า <b>${esc(o.online.ownerName)}</b> · สิทธิ์ของคุณ: <b>${o.online.role==='view'?'👁 ดูอย่างเดียว':'✏️ สอด/แก้ได้'}</b></p>${what}`,
    [{t:'ออกจากทีม (เก็บข้อมูลไว้ในเครื่อง)',c:'dng',f:()=>olDetach(o,'ออกจากทีมแล้ว · ข้อมูลยังอยู่ในเครื่องนี้')},{t:'ปิด'}]);return;}
  let d=null;if(o.online){try{const sn=await FB.db.collection(COL).doc(o.online.id).get();d=sn.exists?sn.data():null;}catch(e){}if(!d){toast('⚠ อ่านข้อมูลทีมไม่ได้');return;}}
  const roles=(d&&d.roles)||{},emails=(d&&d.emails)||[];
  const sel=(id,v,del)=>`<select id="${id}"><option value="edit" ${v==='edit'?'selected':''}>✏️ สอด/แก้ได้</option><option value="view" ${v==='view'?'selected':''}>👁 ดูอย่างเดียว</option>${del?'<option value="del">✕ เอาออก</option>':''}</select>`;
  mOpen(`<h4>👥 ${o.online?'ทีมของ':'ขึ้นออนไลน์:'} "${esc(o.name)}"</h4>${what}${o.online?`<p><b>ทีม ${emails.length} คน</b></p>`+emails.map((e,i)=>`<div class="mrow"><span>${esc(e)}</span>${sel('me'+i,roles[e],1)}</div>`).join(''):''}
    <p style="margin:10px 0 4px"><b>เชิญเพิ่ม (Gmail)</b></p><div class="mrow"><input id="mnew" type="email" placeholder="friend@gmail.com, ..." style="flex:1">${sel('mnr','edit')}</div><p class="note">ใส่หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค</p>`,
    [{t:o.online?'บันทึก':'ขึ้นออนไลน์',c:'pri',f:()=>shareSave(o,d,emails,roles)},...(o.online?[{t:'ลบออนไลน์ (เหลือในเครื่อง)',c:'dng',f:()=>shareStop(o)}]:[]),{t:'ยกเลิก'}]);}
async function shareSave(o,d,emails,roles){const R={};emails.forEach((e,i)=>{const el=$('me'+i);const v=el?el.value:roles[e];if(v!=='del')R[e]=v||'edit';});
  const nr=($('mnr')||{}).value||'edit',raw=String(($('mnew')||{}).value||'').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const bad=raw.filter(e=>!okEmail(e));if(bad.length){toast('⚠ อีเมลไม่ถูกต้อง: '+bad.join(', '));return;}raw.filter(e=>e!==meEmail()).forEach(e=>R[e]=nr);const E=Object.keys(R);
  try{if(!o.online){const ref=FB.db.collection(COL).doc(),str=pickData(o);
      await ref.set({owner:FB.user.uid,ownerEmail:meEmail(),ownerName:FB.user.displayName||meEmail(),name:o.name,emails:E,roles:R,data:str,ver:1,marks:o.marks||{},updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:meEmail()});
      o.online={id:ref.id,role:'owner',ownerName:FB.user.displayName||meEmail(),n:E.length,ver:1};save();olWatch();render();toast('🌐 ขึ้นออนไลน์แล้ว'+(E.length?' · ให้ทีมเปิดแอปแล้วล็อกอินด้วย Gmail ที่ใส่ไว้':''),5000);}
    else{await FB.db.collection(COL).doc(o.online.id).update({emails:E,roles:R,name:o.name});o.online.n=E.length;save();render();toast('👥 บันทึกทีมแล้ว');}
  }catch(e){toast('⚠ บันทึกไม่สำเร็จ — ตรวจ rules ของ Firestore ('+((e&&e.code)||e)+')',6000);}}
async function shareStop(o){try{await FB.db.collection(COL).doc(o.online.id).delete();}catch(e){toast('⚠ ลบออนไลน์ไม่สำเร็จ');return;}olUnwatch();o.online=null;save();render();toast('ลบออนไลน์แล้ว · ข้อมูลยังอยู่ในเครื่องนี้');}
/* ============ เริ่ม ============ */
load();render();i18nInit();mpEnsure(false);fbInit();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&op().s.host)mpEnsure(false);});
</script>
