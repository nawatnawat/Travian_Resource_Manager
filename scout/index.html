function dist(a,b){const s=op().s;let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);if(s.round){const n=2*s.size+1;dx=Math.min(dx,n-dx);dy=Math.min(dy,n-dy);}return Math.hypot(dx,dy);}   // โลกกลม: คิดข้ามขอบแยกแกน X/Y

function nid(){const o=op();return o.nextId++;}
function change(){save();if(op().online)olSchedule();render();}
function addA(r){if(!canEdit())return;const o=op(),tribe=r?MAP_TRIBE[r.tribe]:'Teutons';
  o.A.push({id:nid(),name:r?r.name:'',player:r?r.player:'',ally:r?r.ally:'',x:r?r.x:'',y:r?r.y:'',tribe:UNITS[tribe]?tribe:'Teutons',unit:7,ts:0,art:''});change();if(!r)edV('A',o.A[o.A.length-1].id);}
function addB(r){if(!canEdit())return;const o=op(),last=o.B[o.B.length-1],gn=gameNow();
  o.B.push({id:nid(),name:r?r.name:'',player:r?r.player:'',ally:r?r.ally:'',x:r?r.x:'',y:r?r.y:'',eta:last?last.eta:toDT(Math.ceil((gn+3600000)/3600000)*3600000)});change();if(!r)edV('B',o.B[o.B.length-1].id);}
function setF(side,id,k,v,re){if(!canEdit())return;const it=op()[side].find(x=>x.id===id);if(!it)return;
  if(k==='x'||k==='y')v=v===''?'':Math.round(+v);if(k==='ts')v=Math.max(0,Math.min(20,+v||0));
  it[k]=v;if((k==='x'||k==='y')&&it.x!==''&&it.y!==''){const r=vill(it.x,it.y);if(r){it.name=it.name||r.name;it.player=r.player;it.ally=r.ally;if(side==='A'&&MAP_TRIBE[r.tribe]&&UNITS[MAP_TRIBE[r.tribe]])it.tribe=MAP_TRIBE[r.tribe];}}
  if(k==='tribe'){const L2=UNITS[v]||[];if(!L2.some(u=>u[0]===+it.unit))it.unit=7;}
  save();if(op().online)olSchedule();if(re!==false)render();else renderMatrix();}
// 🗑️ ล้าง: เลือกได้ 3 แบบ · สถานะการสอดทุกช่องถูกล้างด้วย (ทุกช่องผูกกับทั้ง 2 ฝั่ง)
// 📋 คัดลอกเวลาเข้า → 📥 วางที่หมู่บ้านอื่น (กดวางได้หลายคอลัมน์) · หรือในหน้าต่างแก้ไข "ใช้เวลานี้กับหมู่บ้านอื่น"
function etaTxt(v){const t=parseDT(v);return t!=null?dmy(t)+' '+clock(t):'—';}
function etaCopy(id){const b=op().B.find(x=>x.id===id);if(!b||!b.eta){toast('หมู่บ้านนี้ยังไม่มีเวลาเข้า');return;}MX.clip=b.eta;MX.html='';renderMatrix();toast('📋 คัดลอกเวลาเข้า '+etaTxt(b.eta)+' · กด 📥 ที่หมู่บ้านอื่นเพื่อวาง');}
function etaPaste(id){if(!canEdit()||!MX.clip)return;const b=op().B.find(x=>x.id===id);if(!b)return;b.eta=MX.clip;change();}
function etaApply(id){if(!canEdit())return;const o=op(),b=o.B.find(x=>x.id===id);if(!b||!b.eta)return;
  const ids=[...document.querySelectorAll('#mcard .eapp input:checked')].map(c=>+c.value);if(!ids.length){toast('เลือกหมู่บ้านก่อน');return;}
  o.B.forEach(x=>{if(ids.includes(x.id))x.eta=b.eta;});toast('🕒 ใช้เวลาเข้า '+etaTxt(b.eta)+' กับ '+ids.length+' หมู่บ้าน');change();edV('B',id);}
function clearDlg(){if(!canEdit())return;const o=op(),T=TL,A=o.ass||{},nM=Object.keys(o.marks||{}).length,nPN=Object.keys(A).filter(k=>k[0]==='t').length,nEN=Object.keys(A).filter(k=>k[0]==='e').length,nT=o.B.filter(b=>b.eta).length;
  const b=(w,ic,th,en,dth,den)=>`<button class="clrb" onclick="mClose();clearSide('${w}')"><b>${ic} ${T(th,en)}</b><span>${T(dth,den)}</span></button>`;
  mOpen(`<div data-noi18n><h4>🗑️ ${T('ล้างข้อมูลในตาราง','Clear data in table')} "${esc(o.name)}"</h4><p class="note" style="margin:0 0 10px">${T('ศัตรู','Enemies')} ${o.A.length} · ${T('หมู่บ้านเรา','Our villages')} ${o.B.length} · ${T('ทำแล้วกู้คืนไม่ได้','This cannot be undone')}</p>
    <div class="clrg">${b('T','🕒','ล้างเวลาเข้าทั้งหมด','Clear all arrival times','ลบเวลาทัพเข้าของหมู่บ้านเรา '+nT+' หมู่บ้าน · หมู่บ้าน ผลสอด และโน้ตยังอยู่','Removes the arrival time of '+nT+' of our villages · villages, results and notes stay')}
      ${b('M','✅','ล้าง Mark ทั้งหมด + ลบโน้ต','Clear all marks + delete notes','ลบผลสอดและสถานะส่งแล้ว '+nM+' ช่อง และโน้ตของคู่ '+nPN+' รายการ · หมู่บ้านและเวลาเข้ายังอยู่','Removes '+nM+' results / sent marks and '+nPN+' pair notes · villages and arrival times stay')}</div>
    <div class="clrg">${b('A','⚔️','ล้างศัตรู + ลบโน้ต','Clear enemies + delete notes','ลบศัตรูทั้ง '+o.A.length+' หมู่บ้าน พร้อมโน้ตของศัตรู '+nEN+' รายการ โน้ตของคู่ ผลสอด และการตั้งค่าการสอด','Removes all '+o.A.length+' enemy villages with their '+nEN+' notes, the pair notes, results and scouting settings')}
      ${b('B','🛡️','ล้างฝั่งเรา','Clear our side','ลบหมู่บ้านเราทั้ง '+o.B.length+' หมู่บ้าน พร้อมผลสอดและโน้ตของคู่ · ศัตรู โน้ตของศัตรู และเมืองสอดยังอยู่','Removes all '+o.B.length+' of our villages with the results and pair notes · enemies, enemy notes and scout villages stay')}</div>
    <div class="clrg">${b('AB','🗑️','ล้างทั้งหมด','Clear everything','ลบศัตรู หมู่บ้านเรา ผลสอด โน้ต และการตั้งค่าการสอดทั้งหมด · เมืองสอดยังอยู่','Removes enemies, our villages, results, notes and scouting settings · scout villages stay')}</div></div>`,[{t:T('ยกเลิก','Cancel')}]);}
// w: T = เวลาเข้า · M = Mark + โน้ตของคู่ · A = ศัตรู (+ทุกอย่างที่ผูกกับศัตรู) · B = หมู่บ้านเรา (+ของคู่) · AB = ทั้งหมด
function clearSide(w){if(!canEdit())return;const o=op(),T=TL,fs=()=>firebase.firestore.FieldValue.delete(),onl=o.online&&FB.user&&o.online.role!=='view';
  const push=upd=>{if(onl&&Object.keys(upd).length)FB.db.collection(COL).doc(o.online.id).update(upd).catch(e=>toast('⚠ บันทึกสถานะไม่สำเร็จ ('+((e&&e.code)||e)+')'));};
  if(w==='T'){o.B.forEach(b=>b.eta='');toast('🕒 '+T('ล้างเวลาเข้าแล้ว','Arrival times cleared'));change();return;}
  o.ass=o.ass||{};const upd={marks:{}};o.marks={};
  if(w==='M'||w==='B'){Object.keys(o.ass).forEach(k=>{if(w==='M'?k[0]==='t':k.includes('_')){delete o.ass[k];upd['ass.'+k]=fs();}});}   // M: โน้ตของคู่ · B: ทุกคีย์ของคู่ (เมืองที่เลือก จำนวน โน้ต)
  else{o.ass={};delete upd.marks;upd.marks={};upd.ass={};}
  if(w.includes('A'))o.A=[];if(w.includes('B'))o.B=[];save();push(upd);
  toast((w==='M'?'✅ '+T('ล้าง Mark และโน้ตของคู่แล้ว','Marks and pair notes cleared'):w==='A'?'⚔️ '+T('ล้างศัตรูแล้ว','Enemies cleared'):w==='B'?'🛡️ '+T('ล้างฝั่งเราแล้ว','Our side cleared'):'🗑️ '+T('ล้างทั้งหมดแล้ว','Everything cleared')));
  if(w==='M'){render();return;}   // Mark/โน้ต เขียนแยกเป็นฟิลด์แล้ว ไม่ต้องส่งข้อมูลทั้งก้อน
  change();}
function delV(side,id,ok){if(!canEdit())return;const o=op(),it=o[side].find(x=>x.id===id);if(!it)return;
  if(!ok){mOpen(`<h4>🗑️ ลบ "${esc(it.name||'('+it.x+'/'+it.y+')')}"?</h4><p class="note">สถานะการสอดของ${side==='A'?'แถว':'คอลัมน์'}นี้จะถูกลบด้วย</p>`,[{t:'ลบ',c:'dng',f:()=>delV(side,id,true)},{t:'ยกเลิก'}]);return;}
  o[side]=o[side].filter(x=>x.id!==id);
  Object.keys(o.marks).filter(k=>side==='A'?k.startsWith(id+'_'):k.endsWith('_'+id)).forEach(k=>olMark(k,null,true));change();}   // ลบสถานะของช่องที่เกี่ยวข้องด้วย
function moveV(side,id,d){if(!canEdit())return;const a=op()[side],i=a.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];change();}
// สถานะของแต่ละช่อง (ศัตรู × หมู่บ้านเรา) เก็บที่ marks["<idศัตรู>_<idหมู่บ้านเรา>"]: safe = ปลอดภัย · gone = กองทัพหาย · (ไม่มี) = ยังไม่มีข้อมูล
const mk=(a,b)=>a+'_'+b;
function mark(a,b,s,set){if(!canEdit())return;const id=mk(a,b),cur=op().marks[id];
  const car=cur?{from:cur.from,fv:cur.fv,n:cur.n,w:cur.s==='wait'?cur.at:cur.w}:{};Object.keys(car).forEach(k=>{if(car[k]==null)delete car[k];});   // เก็บข้อมูลตอนส่ง (เมือง จำนวน เวลา) ไว้ เผื่อแก้ผลหรือย้อนกลับเป็นรอผล
  const v=cur&&cur.s===s&&!set?null:Object.assign({s,at:gameNow(),by:shortMe()},car);olMark(id,v);}
// ↩ กดผลผิด: ย้อนกลับเป็น รอผล (ถ้าเคยกด ส่งแล้ว) หรือเอาผลออก
function markBack(a,b){if(!canEdit())return;const id=mk(a,b),cur=op().marks[id];if(!cur)return;
  olMark(id,(cur.fv||cur.from||cur.w)?Object.assign({s:'wait',at:cur.w||cur.at,by:cur.by||shortMe()},cur.from?{from:cur.from}:{},cur.fv?{fv:cur.fv}:{},cur.n?{n:cur.n}:{}):null);}
function markTime(id){if(!canEdit())return;const m=op().marks[id];if(!m)return;
  mOpen(`<h4>⏱ เวลาที่สอด</h4><p class="note">ใช้เวลาตามรายงานการสอดในเกม (นาฬิกาเกม)</p>${dtInput(toDT(m.at),'()=>0','id="mt" style="width:100%"')}`,
    [{t:'บันทึก',c:'pri',f:()=>{const v=parseDT(dtParse($('mt').value));if(v!=null)olMark(id,Object.assign({},m,{at:v}));}},{t:'ยกเลิก'}]);}

  if(root.nodeType===1)doEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
}
function i18nRun(nodes){if(_i18nBusy)return;_i18nBusy=true;try{nodes.forEach(i18nNode);}finally{if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}}
function i18nRestore(){_i18nBusy=true;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){if(n._th!==undefined){n.nodeValue=n._th;delete n._th;}}else I18N_ATTR.forEach(a=>{const k='data-th-'+a;if(n.hasAttribute(k)){n.setAttribute(a,n.getAttribute(k));n.removeAttribute(k);}});}
  if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}
function themeCur(){return L&&L.theme?L.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function themeUI(){const t=themeCur();if(L&&L.theme)document.documentElement.setAttribute('data-theme',L.theme);else document.documentElement.removeAttribute('data-theme');
  ['light','dark'].forEach(x=>{const b=$('th-'+x);if(b)b.classList.toggle('on',x===t);});}
function setTheme(t){L.theme=t==='dark'?'dark':'light';save();themeUI();}
function langUI(){const l=LANG();document.documentElement.lang=l;document.title='Travian Scout v'+APP_V;['th','en'].forEach(x=>{const b=$('lang-'+x);if(b)b.classList.toggle('on',x===l);});}
function setLang(l){L.lang=l==='en'?'en':'th';save();if(L.lang==='th'){i18nRestore();render();}else{render();i18nRun([document.body]);}langUI();}
function i18nInit(){
  _i18nObs=new MutationObserver(recs=>{if(_i18nBusy||LANG()!=='en')return;const ns=[];recs.forEach(r=>{if(r.type==='characterData'||r.type==='attributes')ns.push(r.target);else r.addedNodes.forEach(x=>ns.push(x));});i18nRun(ns);});
  _i18nObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:I18N_ATTR});
  langUI();themeUI();if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUI);if(LANG()==='en')i18nRun([document.body]);}

ด: จำนวนตัวสอดต่อครั้งและเมืองสอดที่จะส่ง ใช้กับทุกรายการของศัตรูนั้น (หรือทุกหมู่บ้านของผู้เล่นนั้น) · ในคิวแก้จำนวนและเมืองสอดแยกทีละรายการได้ · ข้างปุ่มส่งแสดงเวลาที่ตัวสอดต้องถึง · กดปลอดภัย / ทัพหายผิด แก้ได้ (กดอีกปุ่ม หรือ ↩ ย้อนกลับ · แถวที่เพิ่งใส่ผลอยู่ท้ายคิว 10 นาที) · แสดงชื่อคนกดและเวลากดในคิว · 📊 ตารางเวลาปล่อย: ติ๊กแล้วตารางไม่เด้งกลับ · มุมมองย่อก็แสดงชื่อคนกดและเวลา · ช่อง 🕒 ทัพเข้า ที่ว่าง คลิกแล้วใส่วันนี้ 00:00:00 ให้", "🕵️ Send scouts: scout villages are managed right in the queue table (the add search box sits above the table · column headers have ✏️ to edit TS, artefact and scout count · ✕ removes · drag a header to move it left or right); the separate 🏠 Team scout villages section is gone · ⚙ next to the enemy name = scouting settings popup: scouts per send and the scout village for every row of that enemy (or every village of that player) · in the queue the count and village can still be changed row by row · the time the scouts must arrive is shown next to the Send button · a wrong Safe / Gone press can be fixed (press the other button, or ↩ to undo · a row that just got a result stays at the end of the queue for 10 minutes) · who pressed and when is shown in the queue · 📊 Launch time table: ticking no longer makes the table jump back · the compact view also shows who pressed and when · an empty 🕒 Arrival box fills in today 00:00:00 when clicked"], ["0.23.2", "⛶ เต็มจอ: มีปุ่มสลับหน้า 📊 ตารางเวลาปล่อย ↔ 🕵️ ปล่อยตัวสอด ที่มุมซ้ายบน สลับไปมาได้โดยไม่ออกจากเต็มจอ · ปุ่ม ปล่อยตัวสอด แสดงตัวเลข 🔔 ตัวสอดถึงแล้วด้วย", "⛶ Full screen: buttons at the top left switch between 📊 Launch time table and 🕵️ Send scouts without leaving full screen · the Send scouts button also shows the 🔔 scouts-arrived count", ".1–.2", "หน้า ปล่อยตัวสอด สะอาดขึ้น: กรอบคำอธิบาย ปล่อยตัวสอด หมายถึงอะไร และข้อความยาวใต้ตาราง ย้ายไปอยู่ในปุ่ม ? ข้างหัวข้อคิว (จัดเป็นหัวข้อย่อย อ่านง่าย) · ใต้ตารางไม่มีข้อความแล้ว จำนวนคู่ที่เลยเวลา/ได้ผลแล้วแสดงสั้น ๆ ข้างปุ่มเลือกศัตรู · 🏠 เมืองสอดของทีม แสดงเมืองละ 1 บรรทัด ช่องกรอกเรียงตรงกันทุกแถว", "Cleaner Send scouts page: the What sending scouts means box and the long text under the table moved into the ? button next to the queue heading (grouped into short points) · nothing under the table any more; the counts of passed / finished pairs show briefly next to the enemy picker · 🏠 Team scout villages are listed one per line with the input boxes lined up"], ["0.22.0", "🔔 แจ้งเตือนตัวสอดถึงแล้ว: คู่ที่กด ส่งแล้ว (รอผล) เมื่อถึงเวลาที่ตัวสอดไปถึง แอปจะแจ้งเตือน (ข้อความเด้ง · ตัวเลขบนแท็บ ปล่อยตัวสอด · 🔔 ที่ชื่อแท็บของเบราว์เซอร์) แถวนั้นเป็นสีเหลืองและขึ้นไปบนสุด · ใส่ผลได้จากหน้า ปล่อยตัวสอด เลย ด้วยปุ่ม ปลอดภัย (เขียว) / ทัพหาย (แดง) · ก่อนถึงจะนับถอยหลัง ถึงใน … · คู่ที่รอผลจะอยู่ในคิวจนกว่าจะใส่ผล แม้เลยเวลาที่ศัตรูปล่อยแล้ว", "🔔 Scouts arrived alert: for pairs marked Sent (awaiting report), when the scouts reach the target the app alerts you (pop-up message · a number on the Send scouts tab · 🔔 in the browser tab title); the row turns yellow and moves to the top · enter the result right on the Send scouts page with the Safe (green) / Gone (red) buttons · before arrival it counts down arrives in … · awaiting pairs stay in the queue until a result is entered, even past the enemy launch time"], ["0.21.0", "⏱ คิวปล่อยตัวสอด: คลิกค้างแล้วลากเพื่อเลื่อนตารางได้ทุกทิศทาง · มีปุ่ม ⛶ เต็มจอ (Esc หรือ ⛶ ย่อ เพื่อออก) เลือกเมือง แก้จำนวน เขียนโน้ต หรือกดส่งแล้ว ไม่หลุดออกจากเต็มจอและคงตำแหน่งเลื่อนเดิม", "⏱ Scout queue: click and drag to scroll the table in any direction · new ⛶ Full screen button (Esc or ⛶ Shrink to leave); picking a village, changing the count, writing a note or pressing Sent keeps full screen and the scroll position"], ["0.20.0", "📝 โน้ตในคิวปล่อยตัวสอดเขียนได้ยาว: คลิกช่องโน้ตเพื่อเปิดหน้าต่างเขียน (สูงสุด 500 ตัวอักษร หลายบรรทัด มีตัวนับ) ในแถวแสดงย่อ 1 บรรทัด ชี้เพื่ออ่านทั้งหมด · แถวในคิวจัดบรรทัดใหม่: บรรทัด 1 = ศัตรู พิกัด ผู้เล่น กิล → หมู่บ้านเรา · บรรทัด 2 = ตัวสอดถึง (เน้นเวลา) และคำเตือนไม่มีเมืองสอดที่วิ่งทัน", "📝 Notes in the scout queue can be long: click the note box to open an editor (up to 500 characters, several lines, with a counter); the row shows one line, hover to read all · queue rows re-laid out: line 1 = enemy, coordinates, player, alliance → our village · line 2 = scouts arrive (time highlighted) and the no scout village can make it warning"], ["0.19.2", "⏱ คิวปล่อยตัวสอด: ตารางแถวบางลง (ข้อมูลศัตรู 2 บรรทัด · ช่องเวลากด 1 บรรทัด · ส่งครั้งละ ปุ่มส่ง ส่งแล้ว และโน้ต เรียงแนวนอน) · มี 2 โหมด: ⏱ เรียงตามเวลากด (แถวที่ส่งแล้วย้ายไปท้าย แถวที่เลยเวลาหรือได้ผลแล้วไม่แสดง แบบเดิม) และ 📌 เรียงตามเวลาปล่อย (แถวอยู่ที่เดิมตลอด ไม่ย้าย ไม่หาย เลื่อนดูตามเวลาเอง)", "⏱ Scout queue: thinner table rows (enemy info in 2 lines · press time cells in 1 line · Per target, Send, Sent and note side by side) · 2 modes: ⏱ Sort by press time (sent rows move to the end, rows past their time or with a result are not shown, as before) and 📌 Sort by launch time (rows always stay in place, never move or disappear; scroll by time yourself)", ".1–.2", "โหมด 📌 แถวไม่ย้าย: เรียงตามเวลากดของเมืองที่เลือก (ช่องเขียว) แทนเวลาที่ศัตรูปล่อย · แถวขยับเฉพาะตอนเลือกเมืองสอดอื่น ไม่ย้ายเองเมื่อเวลาผ่าน · ช่องเขียวเริ่มต้น = เมืองที่เดินเร็วที่สุด และจำตามที่เลือกเอง · คิวปล่อยตัวสอด: หัวตารางค้างอยู่ด้านบนเมื่อเลื่อนลง (ตารางเลื่อนในกรอบของตัวเอง) · หัวคอลัมน์เมืองสอดแบ่งเป็น 4 บรรทัด (ชื่อ พิกัด / ผู้เล่น กิล / TS / ใช้ เหลือ)", "📌 Rows stay mode: ordered by the press time of the picked village (green cell) instead of the enemy launch time · a row moves only when another scout village is picked, never by itself as time passes · the default green cell = the fastest village, and your own choice is kept · scout queue: the table header stays at the top while scrolling down (the table scrolls inside its own frame) · scout village column headers are split into 4 lines (name coordinates / player alliance / TS / used left)"], ["0.18.1", "📊 ตารางเวลาปล่อย: หัวแถวศัตรูเป็น 4 บรรทัด (ชื่อ พิกัด / ผู้เล่น กิล / speed TS / เวลาปล่อยที่ใกล้ที่สุด + ⏱ นับถอยหลัง) · นับถอยหลังเป็นสีแดงเมื่อเหลือน้อยกว่า 10 นาที · ปุ่ม ▲ ย่อมุมมอง ซ่อนจุดสรุปฝั่งหมู่บ้านเราด้วย", "📊 Launch time table: the enemy row header has 4 lines (name coordinates / player alliance / speed TS / nearest launch time + ⏱ countdown) · the countdown turns red under 10 minutes · the ▲ compact view button also hides the summary dots on our villages side", ".1", "ชื่อหมู่บ้านและชื่อผู้โจมตีที่ยาวจะตัดเป็น … ไม่ขึ้นบรรทัดใหม่ (ทั้งตารางเวลาปล่อยและคิวปล่อยตัวสอด) · ช่องโน้ตของแต่ละคู่ย้ายไปอยู่ใต้ปุ่ม ส่งแล้ว รอผล · หน้าปล่อยตัวสอดมีคำอธิบายว่าเวลากดคืออะไร", "Long village and attacker names are cut with … instead of wrapping (launch time table and scout queue) · each pair's note box moved under the Sent, await report button · the Send scouts page explains what the press time means"], ["0.17.1", "🔢 ส่งครั้งละ ย้ายไปผูกกับเมืองศัตรู (ใส่ครั้งเดียว ใช้ทุกแถวของศัตรูนั้น · ลิงก์ 🕵️ ส่ง ใส่จำนวนให้) · 📝 โน้ตย้ายไปอยู่ในแต่ละแถวของคิว (ต่อคู่ ศัตรู → หมู่บ้านเรา) ใช้เขียนก่อนและระหว่างสอด ทีมเห็นร่วมกัน · เมืองสอดเหลือช่อง มีสอด และ ใช้ / เหลือ", "🔢 Per target now belongs to the enemy village (enter once, used by every row of that enemy · the 🕵️ Send link fills in the number) · 📝 the note moved into each queue row (per pair enemy → our village) for use before and during scouting, shared with the team · scout villages keep Scouts and Used / Left", ".1", "ตารางหน้าแรกแบบเต็มจอ: เพิ่ม ลบ หรือแก้ไขหมู่บ้านแล้วไม่หลุดออกจากโหมดเต็มจอ และคงตำแหน่งเลื่อนเดิม", "First tab table in full screen: adding, removing or editing villages no longer leaves full screen, and the scroll position is kept"], ["0.16.0", "🔢 จำนวนตัวสอด: เมืองสอดแต่ละเมืองใส่ มีสอด (จำนวนที่มี) · ส่งครั้งละ (จำนวนต่อ 1 เป้า) และโน้ต ได้ · แต่ละคู่ในคิวมีช่อง จำนวน แก้รายเป้าได้ · แอปคำนวณ ใช้ / เหลือ ของแต่ละเมืองให้ (เหลือ = มีสอด − ยอดที่ใช้ของทุกคู่ในคิว) · ลิงก์ 🕵️ ส่ง ใส่จำนวนตัวสอดให้ในเกม · ข้อมูลทั้งหมดทีมเห็นร่วมกัน · แก้แถวที่ส่งแล้วรอผลในตารางคิวแสดงเพี้ยน (ช่องไม่ตรงคอลัมน์)", "🔢 Scout counts: each scout village has Scouts (how many it has) · Per target (how many to send per target) and a note · every pair in the queue has a Count box to change per target · the app works out Used / Left for each village (left = scouts − amount used by all pairs in the queue) · the 🕵️ Send link fills in the scout count in the game · everything is shared with the team · fixed sent rows in the queue table showing out of line with the columns"], ["0.15.6", "👥 สอดเป็นทีม: เอากล่องตั้งค่าตัวสอดของฉันออก · 🏠 เมืองสอดของทีม เก็บในตารางสอดและแชร์ออนไลน์ให้ทุกคน (เพิ่มจาก map.sql ทีละหมู่บ้าน / ＋ ทุกหมู่บ้านของผู้เล่น / ＋ ใส่เอง) · แสดงชื่อหมู่บ้าน ผู้เล่น (ID) และกิล · ลานเริ่มต้น 0 อาร์ติไม่มี · จ่ายงาน: คลิกเลือกเมืองสอดของแต่ละคู่ ทีมเห็นเหมือนกัน", "👥 Team scouting: the My scout settings box is gone · 🏠 Team scout villages are stored in the scout table and shared online with everyone (add from map.sql one by one / ＋ All villages of a player / ＋ Add manually) · shows village name, player (ID) and alliance · TS starts at 0, no artifact · assigning: click a scout village for each pair, the team sees the same", ".1–.6", "หัวแถวศัตรู: แทน สอดหลัง ด้วยนับถอยหลัง ⏱ ถึงเวลาปล่อยที่ใกล้ที่สุด (ต่อท้ายบรรทัด speed) · ปุ่ม ▲/▼ ที่มุมตาราง ย่อมุมมองเหลือ 3 บรรทัด (หมู่บ้าน พิกัด / ผู้เล่น กิล / speed ⏱) และช่องเหลือเวลา + ปุ่ม · เอากล่องวิธีใช้ใต้ตารางออก (อยู่ในคู่มือ) แทนด้วย 🔴 สรุปหมู่บ้านเราที่โดนมาร์ค กองทัพหาย เรียงจากมากไปน้อย · เลือกศัตรูที่จะสอด ย้ายเป็นปุ่ม 🎯 เปิดหน้าต่าง มี ใส่หมด / เอาออกหมด · เมืองสอด: เอาปุ่ม ทุกหมู่บ้านของผู้เล่น ออก เพิ่มจากช่องค้นหา map.sql (กิล · ผู้เล่น · หมู่บ้าน · X/Y) ส่วน ใส่เอง ใช้ตอนไม่มีใน map.sql · การจ่ายงานบันทึกออนไลน์ทีละคู่ หลายคนกดพร้อมกันได้ไม่ชนกัน (ต้องอัปเดต Firestore rules)\n• ช่องค้นหาทุกช่องรับพิกัดที่คัดลอกจากเกมได้ตรง ๆ: 3 (−16|106) · (−16|106) · −16|106", "Enemy row headers: scout after replaced by a ⏱ countdown to the nearest launch time (at the end of the speed line) · ▲/▼ button in the table corner compacts rows to 3 lines (village coordinates / player alliance / speed ⏱) and cells to the time + buttons · the how-to box under the table is gone (it is in the manual), replaced by 🔴 Our villages marked army gone, most first · Enemies to scout moved into a 🎯 button that opens a window with Select all / Clear all · scout villages: the All villages of a player button is gone; add from the map.sql search (alliance · player · village · X/Y), Add manually is for villages not in map.sql · assignments are saved online one pair at a time, so several people can assign at once without conflicts (update the Firestore rules)\n• Every search box accepts coordinates copied straight from the game: 3 (−16|106) · (−16|106) · −16|106"], ["0.14.0", "🕵️ คิวปล่อยตัวสอด: กดส่งแล้วไม่ติ๊กรอผลให้เอง (กด ส่งแล้ว รอผล เองเมื่อส่งจริง แอปจำเมืองที่เลือกไว้) · เลือกศัตรูที่จะสอดได้ (ติ๊กออก = ไม่แสดงในคิว เช่น เมืองที่มีตัวสอดเยอะ) · 🚫 ไม่สอด ซ่อนทีละคู่ได้ และ แสดงคู่ที่ไม่สอด เพื่อเอากลับ · แถวมีเลขลำดับ 1 2 3 …", "🕵️ Scout queue: sending no longer marks awaiting by itself (press Sent, awaiting when you really sent; the selected village is remembered) · choose which enemies to scout (untick = not shown in the queue, e.g. villages with many scouts) · 🚫 Skip hides one pair, Show skipped pairs brings them back · rows are numbered 1 2 3 …", "", "", ""], ["0.13.1", "🕵️ คิวปล่อยตัวสอดสอดทีละเมือง: 1 แถว = ศัตรู 1 หมู่บ้าน → หมู่บ้านเรา 1 หมู่บ้าน เรียงตามเวลาที่ต้องกด (เอาตัวเลือก ทุกหมู่บ้าน ออก) · กดส่งแล้วติ๊ก ⏳ รอผลสอด เฉพาะคู่ที่พึ่งส่งไป · คู่ที่ได้ผลแล้ว (ปลอดภัย/กองทัพหาย) ไม่แสดงในคิว", "🕵️ The scout queue goes one village at a time: one row = one enemy village → one of our villages, sorted by press time (the all-villages option is gone) · sending marks ⏳ Awaiting report only for the pair just sent · pairs with a result (safe/army gone) leave the queue", ".1", "⏰ ตารางเมืองสอดไฮไลต์ ใกล้สุด (กรอบส้ม) = เมืองที่ต้องกดเร็วที่สุดของแต่ age column headers count 🟡 🟦 🟢 🔴 statuses like the enemy row headers"], ["0.10.1", "🏠 เมืองสอด: เตรียมรายชื่อหมู่บ้านที่ใช้ส่งตัวสอดไว้ก่อน (ค้นหาจาก map.sql หรือ ＋ ทุกหมู่บ้านของฉัน · ตั้งจำนวนตัวสอดแต่ละเมือง · ◀▶ เรียง) · คิวปล่อยตัวสอดเป็นตาราง: แถว = ศัตรู · คอลัมน์ = เมืองสอด · ทุกช่องบอกเวลากดและนับถอยหลังของเมืองนั้น · คลิกช่องเพื่อเลือกเมือง แถวเรียงตามเวลากดของเมืองที่เลือก", "🏠 Scout villages: set up the villages you send scouts from (search map.sql or ＋ All my villages · scout count per village · ◀▶ to order) · the scout queue becomes a table: rows = enemies · columns = scout villages · every cell shows that village's press time and countdown · click a cell to pick the village; rows sort by the picked village's press time", ".1", "🗺️ ปุ่มดูหมู่บ้านในเกม (หน้าแผนที่ karte.php: ข้อมูลหมู่บ้าน ผู้เล่น พันธมิตร) ข้างพิกัดของหมู่บ้านศัตรูและหมู่บ้านเรา ทั้งในตารางและคิวปล่อยตัวสอด", "🗺️ View-in-game button (map page karte.php: village, player, alliance) next to the coordinates of enemy and our villages, in the table and in the scout queue"], ["0.9.0", "⏳ สถานะใหม่ รอผลสอด (สีฟ้า): กดปุ่ม ⏳ ในช่อง หรือกด 🕵️ ส่งตัวสอด ในแท็บปล่อยตัวสอดแล้วติ๊กให้เอง (เฉพาะช่องที่ยังไม่มีข้อมูล) · ได้รายงานแล้วกด 🛡 / ⚠ ทับ · หัวแถวนับจำนวน 🟦 ด้วย · ซ่อนศัตรูที่สอดครบแล้ว ไม่ซ่อนแถวที่ยังรอผล", "⏳ New status Awaiting report (blue): press ⏳ in a cell, or press 🕵️ Send scouts in the Send scouts tab and it is marked for you (only cells with no data) · when the report arrives press 🛡 / ⚠ over it · row headers count 🟦 too · Hide fully scouted enemies keeps rows still awaiting", "", "", ""], ["0.8.0", "👢 เอารองเท้าฮีโร่ออก (ปกติไม่ใส่ตอนปล่อยทัพ) · หัวแถวศัตรูแสดง speed หน่วยช้าสุด · TS · ×อาร์ติแฟกต์ (ถ้ามี) แทนเผ่าและชื่อหน่วย · หัวคอลัมน์หมู่บ้านเราเป็นแบบเดียวกันทุกอัน: ชื่อ / พิกัด / ผู้เล่น พันธมิตร / วันที่ / เวลา ", "👢 Hero boots removed (usually not worn when sending) · enemy row headers show the slowest unit's speed · TS · ×artifact (if any) instead of tribe and unit name · our village column headers share one layout: name / coordinates / player alliance / date / time", "", "", ""], ["0.7.5", "↔️ ลากจัดลำดับในตาราง: คลิกค้างที่หัวคอลัมน์ (หมู่บ้านเรา) แล้วลากไปซ้าย/ขวา · คลิกค้างที่หัวแถว (ศัตรู) แล้วลากขึ้น/ลง · มีเส้นบอกตำแหน่งที่จะวาง · ลากชิดขอบแล้วตารางเลื่อนให้เอง · เอาปุ่ม ▲▼ ◀▶ ออก", "↔️ Drag to reorder in the table: click and hold a column header (our village) and drag left/right · click and hold a row header (enemy) and drag up/down · a line shows where it will drop · dragging near the edge scrolls the table · ▲▼ ◀▶ buttons removed", ".1–.5", "🕒 ปุ่ม 🗑️ ล้าง เพิ่มแบบ ล้างเฉพาะเวลาเข้า · คัดลอกเวลาเข้าง่ายๆ: 📋 ที่หัวคอลัมน์ แล้ว 📥 ที่หมู่บ้านอื่นเพื่อวาง · ในหน้าต่างแก้ไขหมู่บ้านเรามี ใช้เวลาเข้านี้กับหมู่บ้านอื่น (ติ๊กเลือก / เลือกทั้งหมด / เฉพาะที่ยังไม่มีเวลา) · คลิกค้างที่ช่องในตารางหรือมุมซ้ายบนแล้วลาก = เลื่อนตาราง ไม่ต้องใช้ scroll bar · ปุ่มสถานะเป็นไอคอน 🛡 ปลอดภัย / ⚠ อันตราย · ช่องที่เลยเวลาปล่อยแล้วและยังไม่มีข้อมูล ไม่มีพื้นสีเหลือง · ช่องเวลาเป็นแบบ 24 ชม. (วว/ดด/ปปปป ชช:นน:วว) ไม่มี AM/PM · กดลูกศร ↑↓ ปรับเวลาได้ต่อเนื่อง ช่องไม่หลุด · ชื่อผู้เล่นตัวหนา และพันธมิตรเป็นป้ายสี ให้เด่นกว่าข้อมูลอื่นในตาราง", "🕒 🗑️ Clear gets a clear-arrival-times-only option · easy arrival time copying: 📋 in a column header, then 📥 on other villages to paste · our village editor has Use this arrival time for other villages (tick / select all / only those without a time) · click and hold a table cell or the top-left corner and drag to scroll, no scroll bar needed · status buttons are now icons: 🛡 safe / ⚠ danger · cells past their launch time with no data lose the yellow background · time boxes are 24-hour (dd/mm/yyyy hh:mm:ss) with no AM/PM · ↑↓ arrows adjust the time continuously without losing focus · player names in bold and alliances as colored tags so they stand out in the table"], ["0.6.2", "✏️ แก้ทุกอย่างที่ตารางได้เลย: เอารายการซ้าย/ขวาออก · เพิ่มศัตรู (แถว) และหมู่บ้านเรา (คอลัมน์) จากช่องค้นหา map.sql เหนือตาราง หรือ ＋ ใส่เอง · กดชื่อหรือ ✏️ ที่หัวแถว/หัวคอลัมน์เพื่อเปิดหน้าต่างแก้ไข (ค้นหา map.sql เพื่อเปลี่ยนหมู่บ้าน, ลาน, เผ่า, หน่วยช้าสุด, รองเท้า, อาร์ติแฟกต์, เวลาทัพเข้า) · กดเวลาเข้าที่หัวคอลัมน์เพื่อแก้ · ▲▼ ◀▶ ย้าย · ✕ ลบ (ถามยืนยัน)\nหัวแถวศัตรูแสดงหน่วยช้าสุดและเผ่า", "✏️ Edit everything in the table: left/right lists removed · add enemies (rows) and our villages (columns) with the map.sql search boxes above the table, or ＋ Add manually · click a name or ✏️ in a row/column header to open the editor (search map.sql to change village, TS, tribe, slowest unit, boots, artifact, arrival time) · click the arrival time in a column header to edit it · ▲▼ ◀▶ move · ✕ delete (with confirmation)\nEnemy row headers show the slowest unit and tribe", ".1–.2", "สีแดงเรียกว่า ✗ กองทัพหาย (เอาคำว่า มีโอกาสโดน ออก) · ปุ่ม 🗑️ ล้าง เลือกได้ 3 แบบ: ล้างฝั่งศัตรู / ล้างฝั่งหมู่บ้านเรา / ล้างทั้งหมด", "Red is now just ✗ Army gone (\"may be hit\" removed) · 🗑️ Clear button with 3 choices: clear enemy side / clear our side / clear all"], ["0.5.1", "📊 ตารางเวลาปล่อยรองรับข้อมูลเยอะ (20–30 หมู่บ้านต่อฝั่ง): หัวตารางและคอลัมน์ศัตรูค้างไว้ตอนเลื่อน · ช่องเล็กลง ปุ่ม ✓ ✗ · ไฮไลต์คอลัมน์ตามเมาส์ · ⛶ เต็มจอ (Esc ปิด) · กรองศัตรู / กรองหมู่บ้านเรา · เรียงศัตรูตามเวลาสอดหลัง / ยังไม่มีข้อมูล / กองทัพหาย · ซ่อนศัตรูที่สอดครบแล้ว · เลื่อนตารางค้างไว้ได้ไม่เด้งกลับทุกวินาที\n🛡️ หัวคอลัมน์หมู่บ้านเราแสดง ผู้เล่น · พันธมิตร\n🗂️ รายการซ้าย/ขวาแบบกะทัดรัด: 1 หมู่บ้าน = 2 บรรทัด (ศัตรูเลือกหน่วยช้าสุดได้เลย · หมู่บ้านเราแก้เวลาทัพเข้าได้เลย) กด ✏️ เพื่อแก้ค่าอื่น · รายการยาวเลื่อนในกล่อง", "📊 Launch table handles lots of data (20–30 villages per side): header row and enemy column stay put while scrolling · smaller cells with ✓ ✗ buttons · column highlight under the mouse · ⛶ full screen (Esc to close) · filter enemies / our villages · sort enemies by scout-after time / no data / army gone · hide fully scouted enemies · the table keeps its scroll position instead of jumping back every second\n🛡️ Our village column headers show player · alliance\n🗂️ Compact left/right lists: one village = 2 lines (pick the enemy's slowest unit or edit our arrival time directly), press ✏️ for the other fields · long lists scroll inside their box", ".1", "ชื่อหลักของแอปเป็น Travian Scout · กด ✏️ แก้ไขหมู่บ้านแล้วค้นหาจาก map.sql เพื่อเปลี่ยนเป็นหมู่บ้านอื่นได้ (หน่วย ลาน รองเท้า เวลาทัพเข้า และสถานะที่กดไว้คงเดิม)", "App name is now just Travian Scout · press ✏️ on a village and search map.sql to switch it to another village (unit, TS, boots, arrival time and marked statuses are kept)"], ["0.4.2", "🗂️ โปรไฟล์ = เซิร์ฟเวอร์ที่เล่น อยู่บนสุดของหัวเว็บ พร้อมตั้งค่าเซิร์ฟ (เซิร์ฟเวอร์ ความเร็ว แผนที่ โลกกลม/แบน เวลาเกม) ย้ายขึ้นไปไว้ที่หัวเว็บ · ในแต่ละโปรไฟล์มีตารางสอดได้หลายกลุ่ม กด ＋ เพิ่ม · ข้อมูลเดิมแยกเป็นโปรไฟล์ตามเซิร์ฟเวอร์ให้เอง\n📖 หน้าคู่มือการใช้งาน (แท็บ 📖 คู่มือ) และ Change Log · กดเลขเวอร์ชันที่หัวเว็บเพื่อเปิด Change Log\n☀️/🌙 ธีมสว่าง/มืด และ TH/EN สลับภาษาได้ที่หัวเว็บ แบบเดียวกับแอปหลัก", "🗂️ Profile = the server you play, at the top of the header, with the server settings (server, speed, map, round/flat world, game time) moved into the header · each profile can hold several scout tables, press ＋ Add · existing data is split into profiles by server automatically\n📖 User manual page (📖 Manual tab) and Change Log · click the version number in the header to open the Change Log\n☀️/🌙 light/dark theme and TH/EN language switch in the header, same as the main app", ".1–.2", "เอาช่องเวลาเกม GMT ออก · ใช้นาฬิกาของเครื่องเป็นเวลาเกมแทน (ตั้งเขตเวลาในเกมให้ตรงกับเครื่อง) · เอาช่อง \"หรือความเร็ว\" ของหมู่บ้านศัตรูออก ใช้ความเร็วจากหน่วยที่เลือก", "Removed the game time GMT box · the device clock is used as game time (set the in-game time zone to match your device) · removed the enemy \"or speed\" box, speed comes from the selected unit"], ["0.3.1", "🕵️ แท็บใหม่ ปล่อยตัวสอด: คิวหมู่บ้านศัตรูที่ยังไม่ถึงเวลาปล่อย เรียงตามเวลาที่ต้องกด · เลือกหมู่บ้านเราที่จะส่ง (จาก map.sql ตามชื่อผู้เล่น เรียงจากใกล้สุด) · บอกเวลากดปล่อย นับถอยหลัง เปลี่ยนสีเมื่อใกล้ถึง · ปุ่มส่งตัวสอดเปิดหน้าส่งทหารในเกมพร้อมใส่ตัวสอดให้", "🕵️ New Send scouts tab: queue of enemy villages whose launch time is still ahead, sorted by press time · pick our village to send from (from map.sql by player name, nearest first) · shows press time with a countdown that changes color as it gets close · the Send scouts button opens the in-game send page with scouts filled in", ".1", "ตัวสอดถึงตรงกับเวลาที่ศัตรูต้องปล่อยพอดี (เอาช่องเผื่อเวลาออก ผู้เล่นปรับก่อน/หลังเอง) · พิมพ์พิกัด/ชื่อเพื่อกรองหมู่บ้านต้นทางได้ · พิกัดที่ไม่มีใน map.sql ยังคำนวณเวลาได้แต่ไม่มีปุ่มส่ง · เลือกเผ่าเองได้เมื่อไม่มีชื่อผู้เล่น · แก้: นับถอยหลังทุกวินาทีทำให้ช่องเลือกที่เปิดอยู่ปิดเอง", "Scouts land exactly at the enemy's launch time (margin box removed, players adjust earlier/later themselves) · type coordinates/name to filter source villages · coordinates not in map.sql still get times but no send button · choose your tribe when no player name is set · fix: the per-second countdown closed open dropdowns"], ["0.2.0", "สถานะต่อช่องเวลา: 🟡 ยังไม่มีข้อมูล · 🟢 ปลอดภัย · 🔴 กองทัพหาย · กดเวลาใต้ปุ่มเพื่อแก้เป็นเวลาในรายงานสอด\n🌐 ขึ้นออนไลน์และเชิญทีมด้วย Gmail (✏️ สอด/แก้ได้ · 👁 ดูอย่างเดียว) ซิงค์ทันที · ออกจากทีม / ลบออนไลน์", "Per-cell status: 🟡 no data · 🟢 safe · 🔴 army gone · click the time under the buttons to set the scout report time\n🌐 Go online and invite the team by Gmail (✏️ scout/edit · 👁 view only) with live sync · leave team / delete online", "", "", ""], ["0.1.0", "เวอร์ชันแรก: แยกจากแอปหลักเป็นโปรแกรมสอดแนมสำหรับวางแผนป้องกัน · หลายปฏิบัติการ · ซ้ายหมู่บ้านศัตรู ขวาหมู่บ้านเราที่โดนตี (ค้นหาจาก map.sql ร่วมกับแอปหลัก หรือใส่เอง) · ตารางเวลาที่ศัตรูต้องปล่อยทัพ = เวลาเข้า − เวลาเดิน · คิดลาน รองเท้า อาร์ติแฟกต์ ความเร็วเซิร์ฟ โลกกลม/แบน · คัดลอกไปแชต", "First version: split from the main app as a scout program for defense planning · multiple operations · enemy villages on the left, our targeted villages on the right (search the map.sql shared with the main app, or enter manually) · table of enemy launch times = arrival − travel time · counts TS, boots, artifacts, server speed, round/flat world · copy to chat", "", "", ""]];

function helpGo(id){const e=$(id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});}}
function helpData(){const T=TL;return [["h-quick",T("🚀 เริ่มต้นใช้งาน","🚀 Quick start"),T("<ol><li>ที่หัวเว็บ ใส่ <b>เซิร์ฟเวอร์</b> ของโปรไฟล์ เช่น <code>ts21.x2.asia.travian.com</code> แอปจะโหลด map.sql ให้เอง แล้วตั้ง <b>ความเร็ว</b>, <b>ขนาดแผนที่</b>, <b>โลกกลม/แบน</b> ให้ตรงกับเซิร์ฟ</li>\n<li>แท็บ <b>📊 ตารางเวลาปล่อย</b>: เพิ่มหมู่บ้านศัตรู (แถว) และหมู่บ้านเราที่โดนตี (คอลัมน์) จากช่องค้นหาเหนือตาราง แล้วกดชื่อหมู่บ้านเราเพื่อใส่ <b>เวลาทัพเข้า</b></li>\n<li>ตารางตรงกลางบอก <b>เวลาที่ศัตรูต้องปล่อยทัพ</b> ไปสอดหลังเวลานั้น ถ้าทัพยังอยู่บ้าน = ไม่ใช่ตัวตีหมู่บ้านนั้น</li>\n<li>กด ✓ / ✗ ในแต่ละช่องเพื่อบอกผลการสอด</li>\n<li>แท็บ <b>🕵️ ปล่อยตัวสอด</b>: แอปบอกว่าต้องกดส่งตัวสอดจากหมู่บ้านไหนกี่โมง พร้อมนับถอยหลังและปุ่มส่งในเกม</li>\n<li>กด ＋ เพิ่ม ข้าง 🗂️ ตารางสอด เพื่อแยกตารางเป็นหลายกลุ่ม · กด 👥 เพื่อขึ้นออนไลน์และเชิญทีม</li></ol>","<ol><li>In the header, enter the profile's <b>server</b>, e.g. <code>ts21.x2.asia.travian.com</code>; the app loads map.sql by itself. Set <b>speed</b>, <b>map size</b>, <b>round/flat world</b> to match the server</li>\n<li><b>📊 Launch table</b> tab: add suspected enemy villages (rows) and our targeted villages (columns) with the search boxes above the table, then click our village's name to set its <b>arrival time</b></li>\n<li>The table shows <b>when the enemy must launch</b>. Scout after that time; if the army is still home, that village is not the attacker</li>\n<li>Press ✓ / ✗ in each cell to record the scout result</li>\n<li><b>🕵️ Send scouts</b> tab: shows which village to send scouts from and when, with a countdown and an in-game send button</li>\n<li>Press ＋ Add next to 🗂️ Scout tables to split into several groups · press 👥 to go online and invite your team</li></ol>")],["h-ops",T("🗂️ โปรไฟล์และตารางสอด","🗂️ Profiles and scout tables"),T("<ul><li><b>โปรไฟล์</b> (กล่องบนสุดของหัวเว็บ) = เซิร์ฟเวอร์ที่เล่น · <b>＋</b> เพิ่มโปรไฟล์ · <b>✏️</b> เปลี่ยนชื่อ · <b>🗑️</b> ลบ</li>\n<li>ค่าของเซิร์ฟอยู่ที่หัวเว็บใต้โปรไฟล์: <b>เซิร์ฟเวอร์</b>, <b>ความเร็ว</b>, <b>แผนที่ ±</b>, <b>โลกกลม/แบน</b> และสถานะ map.sql · ใช้กับทุกตารางในโปรไฟล์นั้น</li>\n<li><b>🗂️ ตารางสอด</b>: ในโปรไฟล์มีได้หลายกลุ่ม (เช่น แยกตามพันธมิตรที่มาตี หรือตามวัน) กด <b>＋ เพิ่ม</b> · กดชื่อเพื่อสลับ · ✏️ เปลี่ยนชื่อ · 📑 ทำสำเนา · 🗑️ ลบ</li>\n<li>การแชร์ทำทั้งโปรไฟล์: กด <b>👥</b> ข้างโปรไฟล์ ทุกตารางในโปรไฟล์ใช้รายชื่อทีมชุดเดียวกัน ตารางที่เพิ่มภายหลังแชร์ให้อัตโนมัติ · ตารางที่ทีมแชร์มาจะอยู่ในโปรไฟล์ของทีมที่แอปสร้างให้</li>\n<li>เมื่อเข้าสู่ระบบ Google โปรไฟล์ ตารางที่ไม่ได้แชร์ และการตั้งค่าส่วนตัวซิงค์กับ Gmail ของคุณ เปิดเครื่องอื่นก็เห็นข้อมูลเดียวกัน · ถ้ายังไม่เข้าสู่ระบบ ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น</li>\n<li><b>💾 Save</b> (ข้างโปรไฟล์) = บันทึกโปรไฟล์นี้เป็นไฟล์ .json (ค่าเซิร์ฟ + ตารางสอดทุกตาราง + เมืองสอด) · <b>📂 Load</b> = เปิดไฟล์ ถ้ามีโปรไฟล์เซิร์ฟเดียวกันอยู่ เลือกเพิ่มตารางเข้าโปรไฟล์เดิม หรือสร้างโปรไฟล์ใหม่ · ใช้สำรองข้อมูล ย้ายเครื่อง หรือส่งให้เพื่อน (การแชร์ออนไลน์ไม่ไปกับไฟล์)</li></ul>","<ul><li><b>Profile</b> (top box in the header) = the server you play · <b>＋</b> add profile · <b>✏️</b> rename · <b>🗑️</b> delete</li>\n<li>Server settings are in the header under the profile: <b>server</b>, <b>speed</b>, <b>map ±</b>, <b>round/flat world</b> and map.sql status · they apply to every table in that profile</li>\n<li><b>🗂️ Scout tables</b>: a profile can hold several groups (e.g. one per attacking alliance or per day). Press <b>＋ Add</b> · click a name to switch · ✏️ rename · 📑 copy · 🗑️ delete</li>\n<li>Sharing is per profile: press <b>👥</b> next to the profile; every table in the profile uses the same team list and tables added later are shared automatically · tables shared with you go into a team profile the app creates</li>\n<li>When signed in with Google, profiles, unshared tables and personal settings sync with your Gmail, so other devices show the same data · without signing in, the data stays in this browser only</li>\n<li><b>💾 Save</b> (next to the profile) saves this profile as a .json file (server settings + every scout table + scout villages) · <b>📂 Load</b> opens a file; if a profile for the same server exists, add the tables to it or create a new profile · for backups, moving devices or sending to a friend (online sharing is not included)</li></ul>")],["h-table",T("📊 ตารางเวลาปล่อย","📊 Launch table"),T("<p>ทุกอย่างทำที่ตารางเดียว: <b>แถว</b> = ⚔️ หมู่บ้านศัตรูที่สงสัยว่ามาตี · <b>คอลัมน์</b> = 🛡️ หมู่บ้านเราที่โดนตี · <b>ช่อง</b> = เวลาที่ศัตรูหมู่บ้านนั้นต้องปล่อยทัพ เพื่อให้ถึงหมู่บ้านเราตามเวลาเข้า</p>\n<h4>➕ เพิ่ม</h4><ul><li>แถบเหนือตาราง: <b>⚔️ เพิ่มศัตรู</b> และ <b>🛡️ เพิ่มหมู่บ้านเรา</b> พิมพ์ค้นหาจาก map.sql ได้ทั้ง พันธมิตร · ผู้เล่น · ชื่อหมู่บ้าน · พิกัด (พิมพ์บางส่วนได้ เช่น <code>-114</code>) แล้วกด Enter หรือคลิกรายการ</li>\n<li><b>＋ ใส่เอง</b> สำหรับหมู่บ้านที่ไม่มีใน map.sql จะเปิดหน้าต่างแก้ไขให้ทันที</li>\n<li>เผ่าของศัตรูใส่ให้เองจาก map.sql · หมู่บ้านเราใหม่ใช้เวลาทัพเข้าเดียวกับอันล่าสุด</li></ul>\n<h4>✏️ แก้ไข / ย้าย / ลบ</h4><ul><li>กด <b>ชื่อ</b> หรือ <b>✏️</b> ที่หัวแถว/หัวคอลัมน์ เพื่อเปิดหน้าต่างแก้ไข</li>\n<li>ช่องเวลาเป็นแบบ 24 ชม. <code>วว/ดด/ปปปป ชช:นน:วว</code> พิมพ์เองได้ หรือวางเคอร์เซอร์ที่ชั่วโมง/นาที/วินาทีแล้วกด <b>↑↓</b> (Shift+↑↓ = ทีละ 10) · Enter หรือออกจากช่อง = บันทึก</li>\n<li>ศัตรู: <b>ลาน (TS)</b>, <b>เผ่า</b>, <b>หน่วยช้าสุด</b> ที่สงสัย (เช่น แคต), <b>อาร์ติแฟกต์</b> · หัวแถวแสดง speed · TS · ×อาร์ติแฟกต์ · หมู่บ้านเรา: <b>เวลาทัพเข้า</b> ตามที่เห็นในเกม (กดเวลา \"เข้า\" ที่หัวคอลัมน์ก็เปิดได้)</li>\n<li>ช่อง <b>🔍 เปลี่ยนหมู่บ้าน</b> ในหน้าต่างแก้ไข: ค้นหาจาก map.sql เพื่อเปลี่ยนเป็นหมู่บ้านอื่น ค่าอื่นและสถานะที่กดไว้ยังอยู่</li>\n<li>↔️ <b>จัดลำดับ</b>: คลิกค้างที่หัวคอลัมน์แล้วลากไปซ้าย/ขวา · คลิกค้างที่หัวแถวแล้วลากขึ้น/ลง (มีเส้นสีบอกตำแหน่งที่จะวาง ลากชิดขอบแล้วตารางเลื่อนให้เอง) · ลากแถวได้เมื่อ เรียงศัตรู = ตามลำดับที่ใส่</li>\n<li>✕ ลบ (ถามยืนยัน สถานะของแถว/คอลัมน์นั้นจะถูกลบด้วย)</li>\n<li><b>🗑️ ล้าง</b> (ขวาสุดของแถบเพิ่ม): <b>ล้างเฉพาะเวลาเข้า</b> (หมู่บ้านและสถานะยังอยู่) · <b>ล้างฝั่งศัตรู</b> · <b>ล้างฝั่งหมู่บ้านเรา</b> · <b>ล้างทั้งหมด</b> (3 แบบหลังล้างสถานะ ✓ ✗ ทุกช่องด้วย)</li>\n<li>🕒 <b>คัดลอกเวลาเข้า</b>: กด 📋 ใต้เวลาเข้าที่หัวคอลัมน์ แล้วกด 📥 ที่หมู่บ้านอื่น (วางได้หลายหมู่บ้าน) · หรือเปิดหน้าต่างแก้ไขหมู่บ้านเรา แล้วใช้ <b>ใช้เวลาเข้านี้กับหมู่บ้านอื่น</b> ติ๊กเลือกหลายหมู่บ้านทีเดียว</li></ul>\n<h4>🕒 สถานะ</h4><ul><li>ไปสอดหลังเวลาในช่อง แล้วกด <b>🛡</b> ปลอดภัย (ทัพยังอยู่บ้าน) หรือ <b>⚠</b> กองทัพหาย · กดปุ่มเดิมอีกครั้งเพื่อล้าง</li>\n<li><b>⏳ รอผลสอด</b> (สีฟ้า): ส่งตัวสอดแล้ว ยังไม่ได้รายงาน · กด ⏳ ในช่อง หรือกด 🕵️ ส่งตัวสอด ในแท็บปล่อยตัวสอด แอปติ๊กให้เอง · ได้รายงานแล้วกด 🛡 / ⚠ ทับ</li>\n<li>สีช่อง: 🟡 ยังไม่มีข้อมูล (ยังไม่ถึงเวลาปล่อย) · 🟦 รอผลสอด · ไม่มีสี = เลยเวลาปล่อยแล้วแต่ยังไม่มีข้อมูล · 🟢 ปลอดภัย · 🔴 กองทัพหาย · กดเวลาใต้ปุ่มเพื่อแก้เป็นเวลาในรายงานการสอด</li>\n<li>หัวแถวบอก <b>⏱ นับถอยหลัง</b> ถึงเวลาปล่อยที่ใกล้ที่สุดของศัตรูหมู่บ้านนั้น และจำนวน 🟡🟦🟢🔴 (ช่องที่เลยเวลาแล้วไม่นับในสีเหลือง) · หัวคอลัมน์หมู่บ้านเราก็นับจำนวนเหมือนกัน (อยู่บนสุด)</li>\n<li><b>🗺️</b> ข้างพิกัด = เปิดหน้าหมู่บ้านนั้นในเกม (ดูข้อมูลหมู่บ้าน โปรไฟล์ผู้เล่น พันธมิตร) · มีทั้งในตารางและคิวปล่อยตัวสอด</li>\n<li><b>🔴 สรุปหมู่บ้านเราที่โดนมาร์ค กองทัพหาย</b> (ใต้ตาราง): หมู่บ้านเรา ผู้เล่น · กิล เวลาทัพเข้า จำนวน 🔴 และชื่อศัตรูที่กองทัพหาย เรียงจากมากไปน้อย</li>\n<li><b>📋 คัดลอกไปแชต</b> คัดลอกตารางเป็นข้อความไปวางในแชตทีม</li></ul>\n<h4>📚 ข้อมูลเยอะ (20–30 หมู่บ้านต่อฝั่ง)</h4><ul><li>ตารางเลื่อนได้ในกล่อง: <b>คลิกค้างที่ช่องในตาราง (หรือมุมซ้ายบน) แล้วลาก</b> ไม่ต้องใช้ scroll bar หรือใช้ล้อเมาส์ (Shift+ล้อ = ซ้าย/ขวา) · หัวตารางและคอลัมน์ศัตรูค้างไว้ · คอลัมน์ที่เมาส์ชี้จะไฮไลต์ · <b>⛶ เต็มจอ</b> (Esc ปิด)</li>\n<li><b>▲/▼</b> ที่มุมซ้ายบนของตาราง = ย่อมุมมอง: หัวแถวเหลือ 4 บรรทัด (หมู่บ้าน พิกัด / ผู้เล่น กิล / speed TS / เวลาปล่อย ⏱) ซ่อนจุดสรุปทั้งฝั่งศัตรูและฝั่งหมู่บ้านเรา ช่องเหลือเวลา + ปุ่ม · กดอีกครั้ง = ขยาย</li>\n<li><b>บรรทัดที่ 4 ของหัวแถวศัตรู</b>: เวลาปล่อยที่ใกล้ที่สุดของศัตรูหมู่บ้านนั้น พร้อม ⏱ นับถอยหลัง · เป็นสีแดงเมื่อเหลือน้อยกว่า 10 นาที · เลยทุกเวลาแล้วจะแสดงเวลาปล่อยล่าสุดเป็นสีจาง</li>\n<li><b>🔍 กรองศัตรู / กรองหมู่บ้านเรา</b>: พิมพ์ชื่อหมู่บ้าน ผู้เล่น พันธมิตร หรือพิกัด</li>\n<li><b>เรียงศัตรู</b>: ตามลำดับที่ใส่ · ควรสอดหลัง (เร็วสุดก่อน) · ยังไม่มีข้อมูลมากสุดก่อน · กองทัพหายมากสุดก่อน · ติ๊ก <b>ซ่อนศัตรูที่สอดครบแล้ว</b> เพื่อเหลือเฉพาะที่ต้องสอด</li></ul>","<p>Everything happens in one table: <b>rows</b> = ⚔️ suspected enemy attacker villages · <b>columns</b> = 🛡️ our targeted villages · <b>cells</b> = when that enemy village must launch to arrive at our village on time</p>\n<h4>➕ Add</h4><ul><li>Bar above the table: <b>⚔️ Add enemy</b> and <b>🛡️ Add our village</b> search map.sql by alliance · player · village name · coordinates (partial works, e.g. <code>-114</code>), then press Enter or click an item</li>\n<li><b>＋ Add manually</b> for villages not in map.sql; the editor opens right away</li>\n<li>The enemy tribe comes from map.sql · a new village of ours copies the latest arrival time</li></ul>\n<h4>✏️ Edit / move / delete</h4><ul><li>Click the <b>name</b> or <b>✏️</b> in a row/column header to open the editor</li>\n<li>Time boxes are 24-hour <code>dd/mm/yyyy hh:mm:ss</code>: type it, or put the cursor on hour/minute/second and press <b>↑↓</b> (Shift+↑↓ = by 10) · Enter or leaving the box saves</li>\n<li>Enemy: <b>TS</b>, <b>tribe</b>, suspected <b>slowest unit</b> (e.g. catapults), <b>artifact</b> · the row header shows speed · TS · ×artifact · our village: <b>arrival time</b> as seen in the game (clicking the \"arrives\" time in the column header also opens it)</li>\n<li><b>🔍 Change village</b> box in the editor: search map.sql to switch to another village; other values and marked statuses are kept</li>\n<li>↔️ <b>Reorder</b>: click and hold a column header and drag left/right · click and hold a row header and drag up/down (a colored line shows where it drops; dragging near the edge scrolls the table) · rows can be dragged when Sort enemies = As entered</li>\n<li>✕ delete (with confirmation; that row/column's statuses are deleted too)</li>\n<li><b>🗑️ Clear</b> (right end of the add bar): <b>clear arrival times only</b> (villages and statuses stay) · <b>clear enemy side</b> · <b>clear our side</b> · <b>clear all</b> (the last 3 also clear ✓ ✗ in every cell)</li>\n<li>🕒 <b>Copy arrival time</b>: press 📋 under the arrival time in a column header, then 📥 on other villages (paste as many as you like) · or open our village's editor and use <b>Use this arrival time for other villages</b> to tick several at once</li></ul>\n<h4>🕒 Status</h4><ul><li>Scout after the time in the cell, then press <b>🛡</b> safe (army still home) or <b>⚠</b> army gone · press the same button again to clear</li>\n<li><b>⏳ Awaiting report</b> (blue): scouts sent, no report yet · press ⏳ in the cell, or press 🕵️ Send scouts in the Send scouts tab and the app marks it · when the report arrives press 🛡 / ⚠ over it</li>\n<li>Cell colors: 🟡 no data (launch time not reached) · 🟦 awaiting report · no color = launch time passed but no data yet · 🟢 safe · 🔴 army gone · click the time under the buttons to set the scout report time</li>\n<li>Row headers show a <b>⏱ countdown</b> to that enemy village's nearest launch time, and the 🟡🟦🟢🔴 counts (cells past their time are not counted as yellow) · our village column headers show the counts too (at the top)</li>\n<li><b>🗺️</b> next to coordinates opens that village in the game (village info, player profile, alliance) · in the table and in the scout queue</li>\n<li><b>🔴 Our villages marked army gone</b> (under the table): village, player · alliance, arrival time, 🔴 count and the enemies whose army is gone, most first</li>\n<li><b>📋 Copy to chat</b> copies the table as text for your team chat</li></ul>\n<h4>📚 Lots of data (20–30 villages per side)</h4><ul><li>The table scrolls inside its box: <b>click and hold a cell (or the top-left corner) and drag</b>, no scroll bar needed, or use the mouse wheel (Shift+wheel = left/right) · header and enemy column stay put · the column under the mouse is highlighted · <b>⛶ Full screen</b> (Esc to close)</li>\n<li><b>▲/▼</b> in the table's top-left corner = compact view: row headers keep 4 lines (village coordinates / player alliance / speed TS / launch time ⏱), the summary dots are hidden on both the enemy side and our villages side, cells keep the time + buttons · press again to expand</li>\n<li><b>Line 4 of the enemy row header</b>: that enemy village's nearest launch time with a ⏱ countdown · red when under 10 minutes · once every time has passed it shows the last launch time in a faded colour</li>\n<li><b>🔍 Filter enemies / our villages</b>: type a village name, player, alliance or coordinates</li>\n<li><b>Sort enemies</b>: as entered · scout after (earliest first) · most with no data first · most army gone first · tick <b>Hide fully scouted enemies</b> to keep only the ones still to scout</li></ul>")],["h-send",T("🕵️ ปล่อยตัวสอด","🕵️ Send scouts"),T("<h4>🏠 เมืองสอด</h4><ul><li><b>เมืองสอดของทีม</b> = หมู่บ้านที่ทุก ID ในทีมใช้ส่งตัวสอด · เพิ่มจากช่องค้นหา map.sql (กิล · ผู้เล่น · หมู่บ้าน · X/Y) · <b>＋ ใส่เอง</b> ใช้ตอนหมู่บ้านไม่มีใน map.sql · แสดงชื่อหมู่บ้าน ผู้เล่น และกิล · <b>TS</b> เริ่มต้น 0 · <b>อาร์ติ</b> เริ่มต้นไม่มี · ◀▶ เรียงคอลัมน์ · ✕ เอาออก · เก็บในตารางสอดนี้และแชร์ออนไลน์ให้ทีม</li>\n<li><b>จ่ายงาน</b>: คลิกช่องเพื่อเลือกเมืองสอดของแต่ละคู่ ทีมเห็นเหมือนกัน แต่ละคนกด 🕵️ ส่ง เฉพาะแถวที่เป็นหมู่บ้านของตัวเอง (ลิงก์ใช้ได้กับบัญชีเจ้าของหมู่บ้าน)</li>\n<li>มีเมืองสอดแล้ว คิวจะเป็น <b>ตาราง</b>: แถว = ศัตรู · คอลัมน์ = เมืองสอด · แต่ละช่องบอก <b>เวลากด</b> เวลาเดิน และนับถอยหลังของเมืองนั้น · <b>คลิกช่อง</b> = เลือกเมืองนั้น (กรอบเขียว) แล้วปุ่ม 🕵️ ส่ง ทางขวาใช้เมืองนี้ · แถวเรียงตามเวลากดของเมืองที่เลือก ไล่กดได้ทีละแถว · <b>⏰ ใกล้สุด</b> (กรอบส้ม) = เมืองที่ต้องกดเร็วที่สุดของแถวนั้น</li>\n<li>กด <b>ส่งแล้ว รอผล</b> แล้ว แถวนั้นย้ายไปท้ายคิว แสดง <b>ส่งแล้ว</b> เฉพาะเมืองที่ส่ง เมืองอื่นซ่อนและไม่มีปุ่มส่งซ้ำ (กด รอผล อีกครั้ง = ยกเลิก กลับมาเลือกใหม่ได้)</li>\n<li>ช่องที่เมืองนั้นส่งไปไม่ทันแล้วขึ้น <b>ไม่ทัน</b> (เลือกไม่ได้) · แถวที่ไม่มีเมืองไหนวิ่งทันจะจางและอยู่ท้าย </li>\n<li><b>🏠 เมืองสอด จัดการในตารางคิว</b>: เพิ่มจากช่องค้นหาเหนือตาราง · ที่หัวคอลัมน์ของแต่ละเมือง กด <b>✏️</b> เพื่อแก้ TS อาร์ติแฟกต์ และ <b>มีสอด</b> (จำนวนตัวสอดของเมือง) · <b>✕</b> ลบ · <b>ลากหัวคอลัมน์</b>เพื่อย้ายซ้ายขวา</li>\n<li><b>⚙ ตั้งค่าการสอด</b> (ปุ่มเหนือตารางคิว): หน้าต่างเดียวรวมศัตรูทุกหมู่บ้าน ใส่ <b>จำนวนตัวสอดต่อครั้ง</b> และเลือก <b>เมืองสอดที่จะส่ง</b> ของแต่ละหมู่บ้าน ใช้กับทุกรายการของหมู่บ้านนั้น · <b>สรุปบนสุด</b> บอกว่าเมืองสอดแต่ละเมือง มี · ใช้ · เหลือ ตัวสอดเท่าไร คิดจากค่าที่กรอกอยู่ทันที (ติดลบ = สีแดง) · แถว <b>ใส่ให้ทุกแถว</b> ใช้กรอกทีเดียวทุกหมู่บ้าน · ปุ่ม <b>🗺️ เปิด</b> ท้ายแถว เปิดหน้าหมู่บ้านของศัตรูในเกม · ในคิวยังแก้แยกทีละรายการได้: <b>ช่องจำนวน</b>ของแถว (ว่าง = ใช้ค่าจากหน้านี้) และคลิกช่องเวลาเพื่อเปลี่ยนเมืองสอด</li>\n<li><b>🔢 ใช้ / เหลือ</b> ของแต่ละเมืองสอด: เหลือ = มีสอด − ยอดที่ใช้ของทุกคู่ในคิว (รวมคู่ที่ส่งแล้วรอผล · คู่ที่ได้ผลสอดแล้วหรือเลยเวลาไม่นับ) ติดลบเป็นสีแดง · ลิงก์ 🕵️ ส่ง ใส่พิกัดและจำนวนตัวสอดให้ · <b>ถึง hh:mm:ss</b> ข้างปุ่มส่ง = เวลาที่ตัวสอดต้องถึงเมืองศัตรู</li>\n<li><b>แก้ผลที่กดผิด</b>: แถวที่กด ปลอดภัย / ทัพหาย ไปแล้ว กดอีกปุ่มเพื่อเปลี่ยนผล หรือ ↩ เพื่อย้อนกลับเป็นรอผล · โหมดผ่านแล้วไปท้าย แถวที่เพิ่งใส่ผลยังอยู่ท้ายคิว 10 นาที · โหมดแถวไม่ย้าย แก้ได้ตลอด</li>\n<li><b>📝 โน้ตของหมู่บ้านศัตรู</b>: ปุ่ม 📝 ข้างชื่อศัตรู (ทั้งหน้าตารางเวลาปล่อยและหน้าปล่อยตัวสอด) เขียนได้สูงสุด 500 ตัวอักษร หลายบรรทัด · มีโน้ตแล้วปุ่มเป็นสีเน้น ชี้เพื่ออ่าน คลิกเพื่อดู/แก้ไข · ทีมเห็นร่วมกัน</li>\n<li><b>📝 โน้ตของคู่ในตารางเวลาปล่อย</b>: โน้ตที่เขียนในคิว จะขึ้นเป็นปุ่ม 📝 ในช่องของคู่นั้นในตารางเวลาปล่อยด้วย เขียนหรือแก้จากหน้าไหนก็ได้</li>\n<li><b>📝 โน้ต</b>: แต่ละแถวของคิว (ศัตรู → หมู่บ้านเรา) มีช่องโน้ตของตัวเอง ใช้เขียนก่อนและระหว่างสอด · <b>คลิกช่องโน้ต</b>เพื่อเปิดหน้าต่างเขียน พิมพ์ได้สูงสุด 500 ตัวอักษร หลายบรรทัด · ในแถวแสดงย่อ 1 บรรทัด (ช่องสีเขียว = มีโน้ต) ชี้ที่ช่องเพื่ออ่านทั้งหมด · ทีมเห็นร่วมกัน</li>\n<li><b>2 โหมดของคิว</b> (ปุ่มเหนือตาราง): <b>⏱ เรียงตามเวลากด</b> = เรียงตามเวลาที่ต้องกด แถวที่ส่งแล้วย้ายไปท้าย แถวที่เลยเวลาหรือได้ผลสอดแล้วไม่แสดง · <b>📌 เรียงตามเวลากด (แถวไม่ย้าย)</b> = เรียงตามเวลากดของเมืองที่เลือก (ช่องเขียว) แถวอยู่ที่เดิมตลอด ไม่ย้ายเอง แถวที่เลยเวลาหรือได้ผลแล้วยังอยู่แต่เป็นสีจาง เลื่อนดูตามเวลาเอง · แถวจะขยับเฉพาะตอนเลือกเมืองสอดอื่นที่เวลากดต่างออกไป · ช่องเขียวเริ่มต้น = เมืองที่เดินเร็วที่สุด เมื่อเลือกเองแล้วแอปจำตามที่เลือก · แอปจำโหมดที่เลือกไว้ในเครื่องนี้</li>\n<li><b>🔔 ตัวสอดถึงแล้ว</b>: แถวที่กด <b>ส่งแล้ว</b> จะนับถอยหลัง <b>ถึงใน …</b> (เวลาที่กดส่ง + เวลาเดินของเมืองที่ส่ง) · เมื่อถึงแล้ว แอปแจ้งเตือนด้วยข้อความเด้ง ตัวเลขบนแท็บ ปล่อยตัวสอด และ 🔔 ที่ชื่อแท็บของเบราว์เซอร์ · แถวเป็นสีเหลือง (โหมดเรียงตามเวลากดแบบผ่านแล้วไปท้าย จะขึ้นไปบนสุด) และมีปุ่ม <b>ปลอดภัย</b> (เขียว = ทัพยังอยู่บ้าน) / <b>ทัพหาย</b> (แดง) ให้ใส่ผลจากหน้านี้ได้เลย · ↩ = ยกเลิกรอผล · แถวที่รอผลจะอยู่ในคิวจนกว่าจะใส่ผล</li>\n<li><b>ตำแหน่งที่เลื่อนไว้</b>: สลับหน้าไปมาแล้วกลับมา ตารางของแต่ละหน้าอยู่ตำแหน่งที่เลื่อนค้างไว้ (ทั้งปกติและเต็มจอ)</li>\n<li><b>สลับหน้าตอนเต็มจอ</b>: ในโหมดเต็มจอมีปุ่ม 📊 ตารางเวลาปล่อย / 🕵️ ปล่อยตัวสอด ที่มุมซ้ายบน กดสลับได้โดยยังเต็มจออยู่ (ใช้ได้ทั้งสองหน้า)</li>\n<li><b>เลื่อนตาราง</b>: คลิกค้างที่ตารางแล้วลากเพื่อเลื่อนได้ทุกทิศทาง · <b>⛶ เต็มจอ</b> (มุมขวาของหัวข้อคิว) ขยายตารางเต็มจอ กด Esc หรือ ⛶ ย่อ เพื่อออก การแก้ไขใด ๆ ไม่ทำให้หลุดจากเต็มจอ</li>\n<li>แถวของตารางบาง: ชี้ที่ช่องเวลากดเพื่อดูวันที่และเวลาเดิน · ⏰ = เมืองที่ต้องกดเร็วที่สุดของแถวนั้น · ช่องตัวเลข = ส่งครั้งละ · 🚫 = ไม่สอดคู่นั้น</li>\n<li>ต้องมีเมืองสอดอย่างน้อย 1 หมู่บ้าน คิวถึงจะแสดงเวลา</li></ul>\n<h4>คิวปล่อยตัวสอด</h4><ul><li>แสดงเฉพาะหมู่บ้านศัตรูที่ยังไม่ถึงเวลาปล่อย เรียงตามเวลาที่ต้องกด</li>\n<li><b>1 แถว = ศัตรู 1 หมู่บ้าน → หมู่บ้านเรา 1 หมู่บ้าน</b> (สอดทีละเมืองตามเวลา) เรียงตามเวลาที่ต้องกด · คู่ที่เลยเวลาปล่อย หรือได้ผลสอดแล้ว (ปลอดภัย/กองทัพหาย) ไม่แสดง</li>\n<li><b>ตัวสอดถึงตรงกับเวลาที่ศัตรูต้องปล่อยพอดี</b> อยากให้ถึงก่อนหรือหลังกี่วินาที ปรับตอนกดเอง</li>\n<li><b>กดปล่อย</b> = เวลาถึง − เวลาเดินของตัวสอด · นับถอยหลังเป็นสีเหลืองเมื่อเหลือไม่ถึง 30 นาที และกรอบแดงเมื่อไม่ถึง 5 นาที · ถ้าเลยแล้วบอกว่าเลยมากี่นาทีและถ้าปล่อยตอนนี้จะถึงกี่โมง</li>\n<li><b>🕵️ ส่งตัวสอด ↗</b> เปิดหน้าส่งทหารในเกม ใส่พิกัดและจำนวนตัวสอดให้แล้ว (จำนวนมาจากช่อง ส่งครั้งละ ของเมืองศัตรูนั้น · ถ้าไม่ได้ใส่ ให้กรอกในเกมเอง) (ส่งแบบปล้น = สอดแนม) ต้องกดยืนยันในเกมเอง และเลือกสอดทรัพยากร/การป้องกันในหน้ายืนยัน · ใช้ได้กับหมู่บ้านในบัญชีที่ล็อกอินอยู่เท่านั้น</li>\n<li>ส่งตัวสอดจริงแล้ว กด <b>ส่งแล้ว รอผล</b> เพื่อติ๊ก <b>⏳ รอผลสอด</b> (สีฟ้า) ให้คู่นั้น (แอปไม่ติ๊กให้เองตอนกดลิงก์) · กดอีกครั้ง = ยกเลิก</li>\n<li><b>🎯 เลือกศัตรูที่จะสอด</b> (ปุ่มเหนือคิว เปิดหน้าต่าง มี ใส่หมด / เอาออกหมด): ติ๊กออก = ไม่แสดงในคิว (เช่น เมืองที่มีตัวสอดป้องกันเยอะ) · <b>🚫 ไม่สอด</b> ซ่อนทีละคู่ · <b>แสดงคู่ที่ไม่สอด</b> เพื่อดู/เอากลับ (↩ กลับมาสอด) · แถวมีเลขลำดับ (เก็บเฉพาะเครื่องนี้)</li></ul>","<h4>🏠 Scout villages</h4><ul><li><b>Team scout villages</b> = the villages every team member sends scouts from · add from the map.sql search (alliance · player · village · X/Y) · <b>＋ Add manually</b> is for villages not in map.sql · shows village name, player and alliance · <b>TS</b> starts at 0 · <b>artifact</b> starts at none · ◀▶ order columns · ✕ remove · stored in this scout table and shared online with the team</li>\n<li><b>Assigning</b>: click a cell to pick the scout village for each pair; the team sees the same; each member presses 🕵️ Send only on rows with their own village (links work only for the village owner's account)</li>\n<li>With scout villages the queue becomes a <b>table</b>: rows = enemies · columns = scout villages · each cell shows that village's <b>press time</b>, travel time and countdown · <b>click a cell</b> to pick that village (green frame) and the 🕵️ Send button on the right uses it · rows sort by the picked village's press time so you can work down the list · <b>⏰ Soonest</b> (orange frame) = the village you must press first in that row</li>\n<li>After <b>Sent, awaiting</b> the row moves to the end and shows <b>Sent</b> only for the sending village; other villages are hidden and there is no second send button (press Awaiting again to undo and pick again)</li>\n<li>Cells a village can no longer make show <b>too late</b> (not selectable) · rows no village can make are faded and go last</li>\n<li><b>2 queue modes</b> (buttons above the table): <b>⏱ Sort by press time</b> = ordered by when to press; sent rows move to the end, rows past their time or with a result are not shown · <b>📌 Sort by press time (rows stay)</b> = ordered by the press time of the picked village (green cell); rows always stay in place and never move by themselves, rows past their time or with a result remain but faded; scroll by time yourself · a row moves only when you pick another scout village with a different press time · the default green cell = the village with the shortest travel time; once you pick one yourself the app keeps your choice · the chosen mode is remembered on this device</li>\n<li><b>🔔 Scouts arrived</b>: a row marked <b>Sent</b> counts down <b>arrives in …</b> (time you pressed Sent + the sending village's travel time) · on arrival the app alerts you with a pop-up message, a number on the Send scouts tab and 🔔 in the browser tab title · the row turns yellow (in the press-time mode with passed rows last it moves to the top) and gets <b>Safe</b> (green = army still home) / <b>Gone</b> (red) buttons so the result can be entered right here · ↩ = cancel awaiting · awaiting rows stay in the queue until a result is entered</li>\n<li><b>Scroll position</b>: when you switch pages and come back, each page's table is where you left it (normal and full screen)</li>\n<li><b>Switching pages in full screen</b>: in full screen the top left has 📊 Launch time table / 🕵️ Send scouts buttons; press to switch while staying in full screen (works on both pages)</li>\n<li><b>Scrolling</b>: click and drag on the table to scroll in any direction · <b>⛶ Full screen</b> (right of the queue heading) fills the screen; press Esc or ⛶ Shrink to leave; no edit drops out of full screen</li>\n<li>Thin rows: hover a press time cell for the date and travel time · ⏰ = the village that has to press first in that row · the number box = Per target · 🚫 = do not scout that pair</li>\n<li><b>🏠 Scout villages are managed in the queue table</b>: add them with the search box above the table · on each village's column header press <b>✏️</b> to edit TS, artefact and <b>Scouts</b> (how many it has) · <b>✕</b> removes · <b>drag the header</b> to move it left or right</li>\n<li><b>⚙ Scouting settings</b> (button above the queue table): one page with every enemy village; enter <b>scouts per send</b> and choose the <b>scout village to send from</b> for each, used by every row of that village · the <b>summary at the top</b> shows how many scouts each scout village has · uses · has left, worked out live from what is entered (negative = red) · the <b>Fill every row</b> line fills all villages at once · the <b>🗺️ Open</b> button at the end of a row opens that enemy village in the game · in the queue you can still change one row at a time: the row's <b>number box</b> (empty = the value from this page) and clicking a time cell to change the village</li>\n<li><b>🔢 Used / Left</b> for each scout village: left = scouts − amount used by all pairs in the queue (pairs sent and awaiting a report included · pairs with a result or past their time are not counted), negative in red · the 🕵️ Send link fills in the coordinates and the scout count · <b>at hh:mm:ss</b> next to the Send button = when the scouts must reach the enemy village</li>\n<li><b>Fixing a wrong result</b>: on a row already marked Safe / Gone press the other button to change it, or ↩ to go back to awaiting · in the passed-go-last mode a row that just got a result stays at the end of the queue for 10 minutes · in the rows-stay mode it can always be changed</li>\n<li><b>📝 Enemy village note</b>: the 📝 button next to the enemy name (on both the Launch time table and the Send scouts page), up to 500 characters over several lines · highlighted when there is a note; hover to read, click to view / edit · shared with the team</li>\n<li><b>📝 Pair notes in the Launch time table</b>: a note written in the queue also shows as a 📝 button in that pair's cell of the Launch time table; write or edit it from either page</li>\n<li><b>📝 Note</b>: every queue row (enemy → our village) has its own note box, for use before and during scouting · <b>click the note box</b> to open an editor, up to 500 characters over several lines · the row shows one line (green box = has a note), hover to read all · shared with the team</li>\n<li>The queue needs at least one scout village to show times</li></ul>\n<h4>Scout send queue</h4><ul><li>Only enemy villages whose launch time is still ahead, sorted by press time</li>\n<li><b>One row = one enemy village → one of our villages</b> (scout one village at a time) sorted by press time · pairs past their launch time or already scouted (safe/army gone) are not shown</li>\n<li><b>Scouts land exactly at the enemy's launch time.</b> If you want them earlier or later, adjust when you press</li>\n<li><b>Press at</b> = arrival − scout travel time · the countdown turns yellow under 30 minutes and the card gets a red frame under 5 minutes · when late it shows by how much and when scouts would land if sent now</li>\n<li><b>🕵️ Send scouts ↗</b> opens the in-game send page with the coordinates and scout count filled in (the count comes from that enemy village's Per target box · if none is set, enter it in the game) (sent as raid = scouting). Confirm in the game and choose resources/defences on the confirm page · works only for villages of the account you are signed in to</li>\n<li>After really sending, press <b>Sent, awaiting</b> to mark <b>⏳ Awaiting report</b> (blue) for that pair (the link no longer marks it) · press again to undo</li>\n<li><b>🎯 Enemies to scout</b> (button above the queue, opens a window with Select all / Clear all): untick = not shown in the queue (e.g. villages with many defending scouts) · <b>🚫 Skip</b> hides one pair · <b>Show skipped pairs</b> to see them / bring back (↩ Scout again) · rows are numbered (kept on this device)</li></ul>")],["h-online",T("🌐 ออนไลน์และทีม","🌐 Online and team"),T("<ul><li>กด <b>🔑 เข้าสู่ระบบ Google</b> แล้วกด <b>👥</b> ข้างโปรไฟล์ด้านบน เพื่อแชร์ <b>ทุกตารางในโปรไฟล์</b> คุณจะเป็น <b>หัวหน้า</b> · ตารางที่เพิ่มหรือทำสำเนาภายหลังแชร์ให้อัตโนมัติ</li>\n<li>ใส่ Gmail ของทีม (หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค) เลือกสิทธิ์ <b>✏️ สอด/แก้ได้</b> หรือ <b>👁 ดูอย่างเดียว</b></li>\n<li>ทีมเปิดแอปแล้วล็อกอินด้วย Gmail นั้น แอปจะสร้างโปรไฟล์ของทีม (เช่น \"ts21 · ทีม ชื่อหัวหน้า\") ที่มีทุกตารางให้เอง ทุกคนเห็นหมู่บ้าน เวลา และสถานะเดียวกันทันที</li>\n<li>หัวหน้ากด <b>หยุดแชร์</b> ได้ · สมาชิกกด 👥 แล้ว <b>ออกจากทีม</b> ได้ (ข้อมูลยังอยู่ในเครื่องทั้งสองแบบ) · 📑 ทำสำเนาโปรไฟล์ = สำเนาในเครื่อง ไม่แชร์</li>\n<li>เมืองสอดของทีมและการจ่ายงานแชร์ไปกับตาราง · การเลือกศัตรูที่จะสอด / 🚫 ไม่สอด เป็นของแต่ละเครื่อง</li></ul>","<ul><li>Press <b>🔑 Sign in with Google</b>, then <b>👥</b> next to the profile at the top to share <b>every table in the profile</b>; you become the <b>leader</b> · tables added or copied later are shared automatically</li>\n<li>Enter the team's Gmail addresses (several allowed, separated by spaces or commas) and choose <b>✏️ scout/edit</b> or <b>👁 view only</b></li>\n<li>Team members open the app and sign in with that Gmail; the app creates a team profile (e.g. \"ts21 · team leader name\") holding every table; everyone sees the same villages, times and status instantly</li>\n<li>The leader can <b>stop sharing</b> · members press 👥 and <b>leave the team</b> (the data stays on the device in both cases) · 📑 copy profile = a local copy, not shared</li>\n<li>Team scout villages and assignments are shared with the table · enemy selection / 🚫 Skip are per device</li></ul>")],["h-map",T("🗺️ map.sql","🗺️ map.sql"),T("<ul><li>map.sql คือไฟล์ข้อมูลหมู่บ้านทั้งเซิร์ฟเวอร์ที่ Travian อัปเดตวันละครั้ง</li>\n<li>แอปโหลดจากสำเนาบน GitHub ของแอปหลัก (Travian Resource Manager) และใช้ข้อมูลที่โหลดไว้ร่วมกับแอปหลักในเบราว์เซอร์เดียวกัน</li>\n<li>กด ⟳ ข้าง map.sql เพื่อโหลดใหม่ · ต้องเปิดแอปจากลิงก์เว็บ (ไม่ใช่ไฟล์ในเครื่อง) ถึงจะโหลดได้</li></ul>","<ul><li>map.sql is the village data file of the whole server that Travian updates once a day</li>\n<li>The app loads it from the main app's GitHub copy (Travian Resource Manager) and shares the loaded data with the main app in the same browser</li>\n<li>Press ⟳ next to map.sql to reload · the app must be opened from the web link (not a local file) to load it</li></ul>")],["h-calc",T("🧮 การคำนวณ","🧮 How it's calculated"),T("<ul><li>ระยะทาง = √(dx² + dy²) · โลกกลม: แต่ละแกนเดินข้ามขอบได้ (ใช้ระยะที่สั้นกว่า)</li>\n<li>20 ช่องแรกเดินความเร็วปกติ ส่วนที่เกิน 20 ช่องคูณ (1 + 20×ลาน/100) · ไม่คิดรองเท้าฮีโร่</li>\n<li>อาร์ติแฟกต์ความเร็วคูณทั้งเส้นทาง · ความเร็วเซิร์ฟ x2 และ x3 ทหารเดินเร็ว ×2</li>\n<li>เวลาที่ศัตรูต้องปล่อย = เวลาทัพเข้า − เวลาเดิน · เวลากดส่งตัวสอด = เวลานั้น − เวลาเดินของตัวสอด</li>\n<li>เวลาทั้งหมดเป็นเวลาเกม แอปใช้นาฬิกาของเครื่องเป็นเวลาเกม เพื่อบอกว่าเลยเวลาแล้วหรือยังและนับถอยหลัง</li></ul>","<ul><li>Distance = √(dx² + dy²) · round world: each axis can wrap around the edge (shorter distance is used)</li>\n<li>The first 20 fields at normal speed; distance beyond 20 fields is multiplied by (1 + 20×TS/100) · hero boots are not counted</li>\n<li>Speed artifacts multiply the whole trip · on x2 and x3 servers troops move ×2</li>\n<li>Enemy launch time = arrival − travel time · scout press time = that time − scout travel time</li>\n<li>All times are game time; the app uses the device clock as game time to tell whether a time has passed and for countdowns</li></ul>")],["h-faq",T("❓ ปัญหาที่พบบ่อย","❓ FAQ"),T("<ul><li><b>ไม่พบผู้เล่นใน map.sql</b>: พิมพ์ชื่อให้ตรงทุกตัวอักษร หรือ map.sql ยังไม่อัปเดต (ผู้เล่นใหม่/เปลี่ยนชื่อ) · พิมพ์พิกัดต้นทางเองแทนได้</li>\n<li><b>ลิงก์ส่งเปิดแล้วไม่ใช่หมู่บ้านเรา</b>: ลิงก์ใช้ได้เฉพาะหมู่บ้านในบัญชีที่ล็อกอินในเบราว์เซอร์นั้น</li>\n<li><b>เวลาเพี้ยนเป็นชั่วโมง</b>: ตั้งเขตเวลาในเกม (โปรไฟล์ → การตั้งค่า) ให้ตรงกับเวลาเครื่อง เช่น ไทย UTC+7</li>\n<li><b>ไม่เห็นตารางของทีม</b>: ล็อกอินด้วย Gmail ที่หัวหน้าเชิญ แล้วกดโหลดรายการทีมใหม่</li></ul>","<ul><li><b>Player not found in map.sql</b>: type the name exactly, or map.sql isn't updated yet (new player/renamed) · you can type source coordinates instead</li>\n<li><b>The send link opens a village that isn't ours</b>: links work only for villages of the account signed in in that browser</li>\n<li><b>Times off by hours</b>: set the in-game time zone (profile → settings) to match your device, e.g. UTC+7 for Thailand</li>\n<li><b>Team table not visible</b>: sign in with the Gmail the leader invited, then reload the team list</li></ul>")],["h-log","📝 Change Log",logHTML()]];}

// 📑 ทำสำเนา: ตารางใหม่เป็นของเครื่องนี้ ไม่ออนไลน์ (ไม่กระทบตารางที่แชร์อยู่) · คัดลอกหมู่บ้าน เวลา ผลสอด โน้ต การตั้งค่า เมืองสอด
function opClone(o,pid,name){const c=JSON.parse(JSON.stringify({A:o.A||[],B:o.B||[],marks:o.marks||{},ass:o.ass||{},sv:o.sv||[],nextId:o.nextId||1}));const n=newOpData(name,pid);return Object.assign(n,c);}
function copyName(base,used){let n=base+' ('+TL('สำเนา','copy')+')',i=2;while(used.includes(n))n=base+' ('+TL('สำเนา','copy')+' '+(i++)+')';return n;}
function opCopy(){const o=op();if(!o)return;const c=opClone(o,o.pid,copyName(o.name,profOps(o.pid).map(x=>x.name)));L.ops.push(c);L.cur=c.id;save();olWatch();render();toast('📑 '+TL('ทำสำเนาตารางแล้ว: ','Table copied: ')+c.name);profAuto(c);}
function profCopy(){const p=prof(),os=profOps(p.id);const q={id:uid('p'),name:copyName(profName(p),L.profs.map(profName)),s:JSON.parse(JSON.stringify(p.s))};   // สำเนาไม่แชร์ (ไม่มี share / team)
 L.profs.push(q);
  os.forEach(o=>{const c=opClone(o,q.id,o.name);c.s=q.s;L.ops.push(c);});L.pcur=q.id;L.cur=profOps(q.id)[0].id;save();olWatch();mpEnsure(false);render();toast('📑 '+TL('ทำสำเนาโปรไฟล์แล้ว: ','Profile copied: ')+q.name+' ('+os.length+' '+TL('ตาราง','tables')+')');}

  const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  const fn=('travian-scout_'+(profName(p)||'profile')+'_'+ds+'.json').replace(/[\\/:*?"<>|\s]+/g,'_');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('💾 Save แล้ว: '+fn+' ('+os.length+' ตาราง)');}
function profLoad(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result);}catch(e){toast('⚠ ไฟล์ไม่ถูกต้อง (ไม่ใช่ JSON)');return;}
    if(!d||d.app!=='travian-scout'||!d.profile||!Array.isArray(d.tables)){toast('⚠ ไม่ใช่ไฟล์โปรไฟล์ของ Travian Scout');return;}
    const h=hostOf(d.profile.s&&d.profile.s.host),same=h&&L.profs.find(x=>hostOf(x.s.host)===h);
    const doIt=into=>{let p=into;
      if(!p&&L.profs.length===1&&!hostOf(L.profs[0].s.host)&&profOps(L.profs[0].id).every(o=>!o.online&&!o.A.length&&!o.B.length)){const e=L.profs[0];L.ops=L.ops.filter(o=>o.pid!==e.id);L.profs=[];}   // เครื่องใหม่: แทนโปรไฟล์ว่างที่สร้างไว้ให้
      if(!p){p={id:uid('p'),name:d.profile.name||'',s:Object.assign(defS(),d.profile.s||{})};L.profs.push(p);}
      const ids=[];d.tables.forEach(t=>{const o=newOpData(t.name||'ตารางสอด',p.id);o.A=Array.isArray(t.A)?t.A:[];o.B=Array.isArray(t.B)?t.B:[];o.marks=t.marks||{};o.sv=Array.isArray(t.sv)?t.sv:(Array.isArray(d.scoutVillages)?JSON.parse(JSON.stringify(d.scoutVillages)):[]);o.ass=t.ass||{};o.nextId=+t.nextId||Math.max(0,...o.A.map(x=>x.id),...o.B.map(x=>x.id))+1;o.s=p.s;L.ops.push(o);ids.push(o.id);});
      if(!profOps(p.id).length)L.ops.push(newOpData('',p.id));
      L.pcur=p.id;L.cur=ids[0]||profOps(p.id)[0].id;save();olWatch();mpEnsure(false);render();ids.forEach(id=>{const o=L.ops.find(x=>x.id===id);if(o)profAuto(o);});toast('📂 Load แล้ว: '+profName(p)+' · '+d.tables.length+' ตาราง');};
    const info=`<p class="note">${esc(d.profile.name||h||'')} · ${d.tables.length} ตาราง · เมืองสอด ${d.tables.reduce((n,t)=>n+((t.sv||[]).length),0)||(d.scoutVillages||[]).length} · บันทึกเมื่อ ${esc(String(d.at||'').replace('T',' ').slice(0,16))}</p>`;
    if(same)mOpen(`<h4>📂 Load โปรไฟล์</h4>${info}<p>มีโปรไฟล์เซิร์ฟเวอร์นี้อยู่แล้ว: <b>${esc(profName(same))}</b></p>`,[{t:'เพิ่มตารางเข้าโปรไฟล์เดิม',c:'pri',f:()=>doIt(same)},{t:'สร้างเป็นโปรไฟล์ใหม่',f:()=>doIt(null)},{t:'ยกเลิก'}]);
    else mOpen(`<h4>📂 Load โปรไฟล์</h4>${info}`,[{t:'Load เป็นโปรไฟล์ใหม่',c:'pri',f:()=>doIt(null)},{t:'ยกเลิก'}]);};
  rd.readAsText(f);}

    [{t:'ลบ',c:'dng',f:()=>{os.forEach(o=>{if(o.online)L.hidden=Object.assign(L.hidden||{},{[o.online.id]:1});});L.ops=L.ops.filter(o=>o.pid!==p.id);L.profs=L.profs.filter(x=>x!==p);
      if(!L.profs.length)L.profs.push({id:uid('p'),name:'',s:defS()});selProf(L.profs[0].id);}},{t:'ยกเลิก'}]);}

/* ============ ออนไลน์: ล็อกอิน Google + Firestore (ทุกคนในทีมเห็นสถานะเดียวกันทันที) ============ */
// scoutops/{id} = {owner, ownerEmail, ownerName, name, emails:[...], roles:{email:'edit'|'view'}, data (JSON: s,A,B,nextId,sv), ver, marks:{คู่:{s,at,by}}, ass:{คู่:vid}, updatedAt, by}
// แก้ข้อมูลหมู่บ้าน/ตั้งค่า: ส่งทั้งก้อนพร้อมเลขเวอร์ชัน (ชนกัน = ใช้ของคลาวด์แล้วแจ้ง) · สถานะการสอด: เขียนทีละช่อง (marks.<id>) ไม่ชนกัน
const FB={auth:null,db:null,user:null,ready:false,unsub:null,watch:'',push:0,fly:false,pend:null};
const meEmail=()=>FB.user&&FB.user.email?FB.user.email.trim().toLowerCase():'';
const shortMe=()=>FB.user?String(FB.user.displayName||meEmail().split('@')[0]).split(' ')[0]:'ฉัน';
const roleOf=d=>FB.user&&d.owner===FB.user.uid?'owner':((d.roles||{})[meEmail()]||'');
const DATA_KEYS=['s','A','B','nextId','sv'];
const pickData=o=>JSON.stringify({s:o.s,A:o.A,B:o.B,nextId:o.nextId,sv:o.sv||[]});   // การจ่ายงาน (ass) บันทึกแยกทีละคู่ ไม่อยู่ใน data
function putData(o,str){let d={};try{d=JSON.parse(str)||{};}catch(e){}DATA_KEYS.forEach(k=>{if(k!=='s'&&d[k]!==undefined)o[k]=d[k];});adoptS(o,d.s);if(!Array.isArray(o.A))o.A=[];if(!Array.isArray(o.B))o.B=[];}
function fbInit(){
  if(location.protocol==='file:'&&!window.firebase){renderUser();return;}
  if(window.firebase){fbSetup();return;}
  const S=['https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js','https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'];
  let i=0;const next=()=>{if(i>=S.length){fbSetup();return;}const sc=document.createElement('script');sc.src=S[i++];sc.onload=next;sc.onerror=()=>renderUser();document.head.appendChild(sc);};next();}
function fbSetup(){try{if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);}catch(e){return;}
  FB.auth=firebase.auth();FB.db=firebase.firestore();FB.ready=true;FB.auth.onAuthStateChanged(u=>{FB.user=u||null;renderUser();if(u){olList();meStart();if(MP.need)mpReq(MP.need);}else{meStop();olUnwatch();if(FB.lunsub){try{FB.lunsub();}catch(e){}}FB.lunsub=null;FB.lsig=null;render();}});}
function login(){if(!FB.ready){toast('ยังโหลดระบบล็อกอินไม่ได้ (ต้องเปิดจากลิงก์เว็บ https)');return;}
  FB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{const c=(e&&e.code)||'';if(c==='auth/popup-blocked')FB.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else if(!/closed|cancelled/.test(c))toast('ล็อกอินไม่สำเร็จ: '+c);});}
function renderUser(){const e=$('user');if(!e)return;
  if(!FB.user){e.innerHTML=`<button onclick="login()">🔑 เข้าสู่ระบบ Google</button>`;return;}
  const n=FB.user.displayName||meEmail();e.innerHTML=`<span class="chip" onclick="userMenu()" title="${esc(meEmail())}"><span class="av">${esc(n.charAt(0).toUpperCase())}</span>${esc(n.split(' ')[0])} ▾</span>`;}
function userMenu(){const sy=meSync();mOpen(`<h4>👤 ${esc(FB.user.displayName||'')}</h4><p class="note">${esc(meEmail())}</p><p class="note" data-noi18n>☁️ ${FB.meOn?TL('ซิงค์ข้อมูลส่วนตัวกับ Gmail อยู่','Personal data synced with Gmail')+(sy.at?' · '+TL('ล่าสุด','last')+' '+clock(locMs(sy.at)):''):TL('ยังไม่ได้ซิงค์ข้อมูลส่วนตัวในรอบนี้','Personal data not synced this session')}</p>`,[{t:'🔄 โหลดรายการทีมใหม่',f:()=>olList(true)},...(FB.meOn?[]:[{t:TL('☁️ ซิงค์กับ Gmail','☁️ Sync with Gmail'),f:meStart}]),{t:'ออกจากระบบ',c:'dng',f:()=>FB.auth.signOut()},{t:'ปิด'}]);}
// รายการปฏิบัติการออนไลน์ที่เราเป็นหัวหน้าหรือได้รับเชิญ → ใส่ในรายการของเครื่องนี้
async function olList(manual){if(!FB.user)return;
  try{const c=FB.db.collection(COL),[a,b]=await Promise.all([c.where('owner','==',FB.user.uid).get(),c.where('emails','array-contains',meEmail()).get()]);
    const seen=new Set(),docs=[...a.docs,...b.docs].filter(x=>!seen.has(x.id)&&seen.add(x.id));let added=0;const joined=new Set(),cur=prof();
    docs.forEach(x=>{const d=x.data(),role=roleOf(d);if(!role)return;let o=L.ops.find(z=>z.online&&z.online.id===x.id);
      if(!o){if(L.hidden&&L.hidden[x.id]&&!manual)return;if(L.hidden)delete L.hidden[x.id];o=newOpData(d.name);o.id='o'+x.id;L.ops.push(o);added++;}
      const tp=teamProf(d,role,o);if(tp&&o.pid!==tp.id){o.pid=tp.id;o.s=tp.s;if(role!=='owner')joined.add(tp);}
      o.online={id:x.id,role,ownerName:d.ownerName||d.ownerEmail||'',n:(d.emails||[]).length,ver:+d.ver||0};o.name=d.name||o.name;putData(o,d.data);o.marks=d.marks||{};o.ass=d.ass||{};});
    L.ops=L.ops.filter(o=>!(o.id==='l0'));
    L.profs.forEach(p=>{if(!profOps(p.id).length&&(p.team||p.share))L.ops.push(newOpData('',p.id));});   // โปรไฟล์ทีมที่ตารางย้ายออกหมด
    if(joined.size){const j=[...joined][0];const empty=profOps(cur.id).every(o=>!o.online&&!o.A.length&&!o.B.length);if(empty||!profOps(cur.id).length){L.pcur=j.id;L.cur=profOps(j.id)[0].id;}toast('👥 '+TL('ได้รับเชิญเข้าทีม: ','Joined team: ')+[...joined].map(profName).join(', '),6000);}
    else if(added)toast('🌐 มีตารางสอดของทีม '+added+' รายการ');
    if(!profOps().find(o=>o.id===L.cur))L.cur=profOps()[0].id;save();if(manual)toast('🔄 โหลดรายการทีมแล้ว');olListen();
  }catch(e){toast('⚠ อ่านรายการทีมไม่ได้ — ตรวจ rules ของ Firestore ('+((e&&e.code)||e)+')',6000);}
  olWatch();olDraw(true);}
/* ----- ☁️ ซิงค์ข้อมูลส่วนตัวกับ Gmail: scoutme/{uid} = {data (JSON), ver, dev, updatedAt} ----- */
// data = โปรไฟล์ทั้งหมด + ตารางที่ไม่ได้แชร์ (ตารางออนไลน์ซิงค์ผ่าน scoutops อยู่แล้ว) + ค่าส่วนตัว L.me + ศัตรูที่ซ่อน L.hidden + ภาษา
// เครื่องนี้จำ {uid, ver, h} ที่ซิงค์ล่าสุดใน scout-mesync · ล็อกอินแล้วข้อมูลต่างกันทั้งสองฝั่ง = ถามผู้ใช้ (ผู้ใช้เลือก 13 พ.ย.)
const ME_COL='scoutme',MESK='scout-mesync';
const DEV=(()=>{let d='';try{d=localStorage.getItem('scout-dev')||'';if(!d){d=uid('d');localStorage.setItem('scout-dev',d);}}catch(e){d=uid('d');}return d;})();
function meStr(){const ops=L.ops.filter(o=>!o.online).map(o=>({id:o.id,pid:o.pid,name:o.name,A:o.A||[],B:o.B||[],marks:o.marks||{},ass:o.ass||{},sv:o.sv||[],nextId:o.nextId||1}));
  return JSON.stringify({profs:L.profs,ops,me:L.me||{},hidden:L.hidden||{},lang:L.lang||'th'});}
const meHash=str=>{let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return str.length+':'+h;};
function meSync(){try{return JSON.parse(localStorage.getItem(MESK)||'null')||{};}catch(e){return {};}}
function meMark(ver,str){try{localStorage.setItem(MESK,JSON.stringify({uid:FB.user.uid,ver,h:meHash(str),at:Date.now()}));}catch(e){}}
function meEmpty(){return L.ops.filter(o=>!o.online).every(o=>!(o.A||[]).length&&!(o.B||[]).length&&!(o.sv||[]).length)&&L.profs.every(p=>!hostOf(p.s.host)||p.team||p.share);}
function meSum(d){const ops=(d.ops||[]),n=ops.filter(o=>(o.A||[]).length||(o.B||[]).length).length;return `${(d.profs||[]).length} ${TL('โปรไฟล์','profiles')} · ${ops.length} ${TL('ตาราง','tables')} (${TL('มีข้อมูล','with data')} ${n})`;}
async function meStart(){if(!FB.user||!FB.db)return;const ref=FB.db.collection(ME_COL).doc(FB.user.uid);let sn;
  try{sn=await ref.get();}catch(e){toast('⚠ '+TL('ซิงค์กับ Gmail ไม่ได้ — ตรวจ rules ของ Firestore','Could not sync with Gmail — check the Firestore rules')+' ('+((e&&e.code)||e)+')',7000);return;}
  const loc=meStr(),sy=meSync(),mine=sy.uid===FB.user.uid,dirty=!mine||meHash(loc)!==sy.h;
  if(!sn.exists){FB.meOn=true;await mePush(true);meListen();return;}
  const d=sn.data(),ver=+d.ver||0,str=String(d.data||'');
  const go=fn=>{FB.meOn=true;fn();meListen();};
  if(meHash(str)===meHash(loc))return go(()=>meMark(ver,str));
  if(meEmpty()||(mine&&!dirty))return go(()=>meApply(str,ver,true));
  if(mine&&sy.ver===ver)return go(()=>mePush());

  mOpen(`<div data-noi18n><h4>👥 ${T('แชร์โปรไฟล์','Share profile')} "${esc(profName(p))}"</h4>${info}
    <p class="note">${T('ตารางในโปรไฟล์นี้','Tables in this profile')} ${os.length}${p.share?' · '+T('แชร์อยู่','shared')+' '+mine.length:''}${others.length?' · '+T('ตารางที่ผู้อื่นแชร์มา '+others.length+' ตาราง ไม่ถูกแชร์ต่อ','tables shared by others: '+others.length+', not re-shared'):''}${!p.share&&mine.length?' · '+T('รายชื่อด้านล่างรวมมาจากตารางที่เคยแชร์แยกไว้','the list below merges the members of tables shared before'):''}</p>
    ${E.length?`<p><b>${T('ทีม','Team')} ${E.length} ${T('คน','people')}</b></p>`+E.map((e,i)=>`<div class="mrow"><span>${esc(e)}</span>${sel('me'+i,R[e],1)}</div>`).join(''):''}
    <p style="margin:10px 0 4px"><b>${T('เชิญเพิ่ม (Gmail)','Invite (Gmail)')}</b></p><div class="mrow"><input id="mnew" type="email" placeholder="friend@gmail.com, ..." style="flex:1">${sel('mnr','edit')}</div><p class="note">${T('ใส่หลายคนได้ คั่นด้วยเว้นวรรคหรือจุลภาค','Several at once: separate with spaces or commas')}</p></div>`,
    [{t:p.share?T('บันทึก','Save'):T('แชร์ทั้งโปรไฟล์','Share the whole profile'),c:'pri',f:()=>profShareSave(p,E,R)},...(p.share||mine.length?[{t:T('หยุดแชร์ (เหลือในเครื่อง)','Stop sharing (keep on this device)'),c:'dng',f:()=>profUnshare(p)}]:[]),{t:T('ยกเลิก','Cancel')}]);}
async function profShareSave(p,E0,R0){const T=TL,R={};E0.forEach((e,i)=>{const el=$('me'+i);const v=el?el.value:R0[e];if(v!=='del')R[e]=v||'edit';});
  const nr=($('mnr')||{}).value||'edit',raw=String(($('mnew')||{}).value||'').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const bad=raw.filter(e=>!okEmail(e));if(bad.length){toast('⚠ '+T('อีเมลไม่ถูกต้อง: ','Invalid email: ')+bad.join(', '));return;}raw.filter(e=>e!==meEmail()).forEach(e=>R[e]=nr);const E=Object.keys(R);
  if(E.length>30){toast('⚠ '+T('เชิญได้สูงสุด 30 คน','At most 30 people'));return;}
  const team=teamOf(p);let ok=0,fail=0;
  for(const o of profOps(p.id)){if(o.online&&o.online.role!=='owner')continue;try{await shUp(o,p,E,R,team);ok++;}catch(e){fail++;}}
  p.share={id:team.id,emails:E,roles:R};save();olWatch();render();
  toast(fail?'⚠ '+T('แชร์ไม่สำเร็จ '+fail+' ตาราง — ตรวจการเชื่อมต่อแล้วกดบันทึกอีกครั้ง','Could not share '+fail+' table(s) — check the connection and save again'):'👥 '+T('แชร์ทั้งโปรไฟล์แล้ว · '+ok+' ตาราง · ทีม '+E.length+' คน','Whole profile shared · '+ok+' table(s) · team of '+E.length),6000);}
async function profUnshare(p){const T=TL;let fail=0;
  for(const o of profOps(p.id)){if(!o.online||o.online.role!=='owner')continue;try{await FB.db.collection(COL).doc(o.online.id).delete();o.online=null;}catch(e){fail++;}}
  if(!fail)delete p.share;olUnwatch();save();olWatch();render();toast(fail?'⚠ '+T('ลบออนไลน์ไม่สำเร็จ '+fail+' ตาราง','Could not remove '+fail+' table(s) from online'):T('หยุดแชร์แล้ว · ข้อมูลยังอยู่ในเครื่องนี้','Sharing stopped · the data stays on this device'),5000);}
function profLeave(p){profOps(p.id).forEach(o=>{if(o.online&&o.online.role!=='owner'){L.hidden=Object.assign(L.hidden||{},{[o.online.id]:1});o.online=null;}});delete p.team;delete p.teamRole;save();olUnwatch();olWatch();render();toast('👥 '+TL('ออกจากทีมแล้ว · ข้อมูลยังอยู่ในเครื่องนี้','Left the team · the data stays on this device'),5000);}
/* ============ เริ่ม ============ */
load();render();i18nInit();mpEnsure(false);fbInit();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&op().s.host)mpEnsure(false);});
</script>
