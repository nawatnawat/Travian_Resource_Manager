const ctrItemTxt=(boots,map,art)=>[art&&art!==1?'💎×'+(+art.toFixed(2)):'',boots?'👢+'+boots+'%':'',map?'🗺️+'+map+'%':''].filter(Boolean).join(' ');
const ctrNum=v=>v===''||v==null||isNaN(+v)?null:Math.round(+v);

// เวลาทั้งหมดคิดเป็น "นาฬิกาของเกม" ตรงๆ (คิดแบบ UTC ภายใน เพื่อไม่ให้เขตเวลาเครื่องมายุ่ง)
function ctrLandMs(){const c=ctrCfg(),d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(c.landDate||'')),m=/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(String(c.land||'').trim());

// เดาหน่วย + ลาน: เวลาที่เห็นการโจมตี → ทัพเขาเดินทางอย่างน้อย (เวลาเข้า − เวลาที่เห็น) · ตัวเลือกที่เวลาเดินทางจริง ≥ ค่านั้นและใกล้ที่สุด = เป็นไปได้มากที่สุด (ถ้าเห็นทันทีที่เขาปล่อย)
function ctrGuess(){
  const c=ctrCfg(),A=ctrPt(c.att),G=ctrPt(c.tgt),land=ctrLandMs(),seen=ctrSeenMs();if(!A||!G||land==null||seen==null)return null;

  const units=ctrUnits(tribe);
  ctrGroups(tribe).forEach(g=>{const unitIdx=(units.find(u=>u.sp===g.sp)||{}).i;
    for(let ts=0;ts<=(far?20:0);ts++){const T=Math.round(mpTroopH(d1,g.sp*mul*artA,ts,bootsA)*3600)*1000;if(T<obs-2000)continue;list.push({g,ts,T,diff:T-obs,launch:land-T,unitIdx,any:!far});}});

// ---------- ค้นหาหมู่บ้านจาก map.sql: ชื่อพันธมิตร / ผู้เล่น / หมู่บ้าน (หลายคำ = ต้องตรงทุกคำ) หรือพิกัด "x/y" ----------
// ค้นหาด้วยพิกัด (ใช้ทั้งหน้าแผนที่และตีสวน): "-114" = X หรือ Y เป็น -114 (ตรงเป๊ะก่อน แล้วขึ้นต้นด้วย) · "-114/" หรือ "-114/5" = X = -114 และ Y ขึ้นต้นด้วย 5
// ไม่ใช่รูปแบบพิกัด = null
function mpFindXY(q){
  if(!MP.rows)return null;q=String(q||'').trim().replace(/[−–]/g,'-');
  const c=/^\(?\s*(-?\d+)\s*(?:([|/,\s])\s*(-?\d*))?\s*\)?$/.exec(q);if(!c)return null;
  const a=c[1],b=c[3]||'',L=[];
  for(const r of MP.rows){const xs=String(r.x),ys=String(r.y);let sc=-1;
    if(c[2]){if(xs===a&&ys.startsWith(b))sc=ys===b?0:1;}
    else if(xs===a||ys===a)sc=0;else if(xs.startsWith(a)||ys.startsWith(a))sc=1;
    if(sc>=0)L.push([sc,r]);}
  L.sort((p,s)=>p[0]-s[0]||p[1].x-s[1].x||p[1].y-s[1].y);return L.map(x=>x[1]);
}
function ctrFind(q){
  if(!MP.rows)return [];q=String(q||'').trim().toLowerCase().replace(/[−–]/g,'-');if(!q)return [];
  const out=[],seen=new Set();
  const xy=mpFindXY(q);if(xy)xy.forEach(r=>{out.push(r);seen.add(r);});
  // ชื่อพันธมิตร / ผู้เล่น / หมู่บ้าน (หลายคำ = ต้องตรงทุกคำ)
  const tk=q.split(/\s+/),N=[];
  for(const r of MP.rows){if(seen.has(r))continue;const n=r.name.toLowerCase(),p=r.player.toLowerCase(),a=(r.ally||'').toLowerCase();let sc=0,ok=true;
    for(const w of tk){const s=(p===w||a===w||n===w)?0:(p.startsWith(w)||a.startsWith(w)||n.startsWith(w))?1:(p.includes(w)||a.includes(w)||n.includes(w))?2:-1;if(s<0){ok=false;break;}sc+=s;}
    if(ok)N.push([sc,r]);}
  N.sort((x,y)=>x[0]-y[0]||y[1].pop-x[1].pop);N.forEach(([,r])=>out.push(r));return out;
}
const CTRF={};   // สถานะรายการค้นหาของแต่ละช่อง: att = ผู้ตี · tgt = เมืองที่โดนตี
function ctrPickHTML(k,label){
  const ph=LN('พันธมิตร · ผู้เล่น · หมู่บ้าน · X/Y หรือ X อย่างเดียว','Alliance · player · village · X/Y or just X');
  return `<label class="f">${label}<div class="ctrpick"><input type="search" id="ctrq_${k}" autocomplete="off" enterkeyhint="search" placeholder="${MP.rows?ph:LN('เปิดแผนที่สักครั้งก่อน เพื่อให้ค้นหาได้','Open the map once to enable search')}" ${MP.rows?'':'disabled'} oninput="ctrPickQ('${k}',this.value)" onfocus="ctrPickQ('${k}',this.value)" onkeydown="ctrPickKey(event,'${k}')" onblur="setTimeout(()=>ctrPickClose('${k}'),150)"><div class="ctrpl" id="ctrpl_${k}"></div></div></label>`;}
function ctrPickQ(k,v){
  let L=ctrFind(v);
  if(!String(v||'').trim()&&k!=='att')L=mpMine();   // ช่องว่าง: เมืองที่โดนตี / เมืองที่จะสวน แสดงหมู่บ้านของเราให้เลือก
  CTRF[k]={list:L.slice(0,40),n:L.length,i:0,q:String(v||'').trim()};ctrPickDraw(k);}
function ctrPickDraw(k){
  const el=document.getElementById('ctrpl_'+k),st=CTRF[k];if(!el||!st)return;
  if(!st.list.length){el.innerHTML=st.q?`<div class="note">${LN('ไม่พบ','No match')}</div>`:'';el.classList.toggle('on',!!st.q);return;}
  el.innerHTML=st.list.map((r,i)=>`<button type="button" class="ctrpi${i===st.i?' on':''}" onpointerdown="event.preventDefault()" onclick="ctrPick('${k}',${i})"><b data-noi18n>${esc(r.name)}</b> <span class="note">(${r.x}/${r.y})</span><br><span class="note"><span data-noi18n>${esc(r.player)}${r.ally?' · '+esc(r.ally):''}</span> · ${esc(MAP_TRIBE[r.tribe]||'?')} · ${fmt(r.pop)} ${LN('ประชากร','pop')}</span></button>`).join('')+
    (st.n>st.list.length?`<div class="note">… ${LN('อีก','and')} ${fmt(st.n-st.list.length)} ${LN('รายการ · พิมพ์เพิ่มเพื่อกรอง (เช่น ชื่อพันธมิตร ตามด้วยชื่อผู้เล่น หรือ -114/5)','more · type more to narrow (e.g. alliance then player, or -114/5)')}</div>`:'');
  el.classList.add('on');const on=el.querySelector('.ctrpi.on');if(on)on.scrollIntoView({block:'nearest'});}
function ctrPickClose(k){const el=document.getElementById('ctrpl_'+k);if(el){el.innerHTML='';el.classList.remove('on');}}
function ctrPickKey(e,k){const st=CTRF[k];if(e.key==='Escape'){ctrPickClose(k);return;}if(!st||!st.list.length)return;
  if(e.key==='ArrowDown'){st.i=Math.min(st.list.length-1,st.i+1);ctrPickDraw(k);e.preventDefault();}
  else if(e.key==='ArrowUp'){st.i=Math.max(0,st.i-1);ctrPickDraw(k);e.preventDefault();}
  else if(e.key==='Enter'){e.preventDefault();ctrPick(k,st.i);}}
function ctrPick(k,i){const st=CTRF[k],r=st&&st.list[i];if(!r)return;const c=ctrCfg();
  if(k==='att'){c.att={x:String(r.x),y:String(r.y)};const mt=MAP_TRIBE[r.tribe];c.attTribe=TRIBES[mt]&&ctrUnits(mt).length?mt:'';c.attUnit=-1;}   // เผ่าตาม map.sql
  else{const t=S.towns.find(t=>t.x!=null&&t.x!==''&&+t.x===r.x&&+t.y===r.y);   // ตรงกับเมืองในแอป = เลือกเมืองนั้น
    if(k==='tgt')c.tgt=t?{town:t.id,x:'',y:''}:{town:null,x:String(r.x),y:String(r.y)};
    else{const row=c.rows[+k.slice(1)];if(!row)return;const mt=MAP_TRIBE[r.tribe];
      if(t){row.town=t.id;}else{row.town=null;row.x=String(r.x);row.y=String(r.y);if(TRIBES[mt]&&ctrUnits(mt).length)row.tribe=mt;}
      const tr=t?t.tribe:row.tribe;if(!ctrUnits(tr).some(u=>u.i===+row.unit))row.unit=6;}}
  delete CTRF[k];ctrSave(true);}
// ล้างข้อมูล: 1 = ทัพที่มาตี (พิกัด เมืองที่โดนตี เวลา เผ่า หน่วย TS ไอเทม อาร์ติแฟกต์) · 2 = เมืองที่จะตีสวนทั้งหมด + เผื่อเพิ่ม
function ctrClear(part){const c=ctrCfg();
  if(part===1)dlg(LN('ล้างข้อมูลทัพที่มาตี?\nพิกัดผู้ตี เมืองที่โดนตี วันเวลา เผ่า หน่วย Tournament Square ไอเทมฮีโร่ และอาร์ติแฟกต์ของเขา\n(เมืองที่จะตีสวนยังอยู่)','Clear the incoming attack?\nAttacker, town being hit, date and time, tribe, unit, Tournament Square, hero items and artefact\n(the counter-attacking towns stay)'),
    ()=>{S.ctr={rows:c.rows,extra:c.extra};ctrCfg();delete CTRF.att;delete CTRF.tgt;ctrSave(true);},LN('ล้างข้อมูล','Clear'),true);
  else{if(!c.rows.length&&!+c.extra)return;dlg(LN('ล้างเมืองที่จะตีสวนทั้งหมด? ('+c.rows.length+' เมือง)\n(ข้อมูลทัพที่มาตียังอยู่)','Remove all counter-attacking towns? ('+c.rows.length+')\n(the incoming attack stays)'),
    ()=>{c.rows=[];c.extra=0;Object.keys(CTRF).forEach(k=>{if(k[0]==='r')delete CTRF[k];});ctrSave(true);},LN('ล้างข้อมูล','Clear'),true);}}
function ctrTick(on){if(on&&mpReady()&&!MP.rows){try{mpLoadCache();if(MP.rows)renderAll();}catch(e){}}}
function ctrCopy(){const r=ctrCompute();if(!r.ok){fbToast(LN('ยังไม่มีผลลัพธ์','Nothing to copy yet'));return;}
  const W=ms=>ctrDate(ms)+' '+ctrClock(ms);
  const gName=r.G.t?r.G.t.name+' ':(()=>{const v=ctrVill(r.G.x,r.G.y);return v?v.name+' ':'';})();
  const L=[`⚔️ ${LN('ตีสวน','Counter-attack')}`,
    `🎯 ${LN('เป้าหมาย (ผู้ตี)','Target (attacker)')}: ${ctrTgtTxt(r)}`,
    `🛡️ ${LN('โดนตี','Hit')}: ${gName}(${r.G.x}/${r.G.y}) · ${LN('ทัพเข้า','lands')} ${W(r.land)}`];
  if(r.bootsA||r.mapA||r.artA!==1)L.push(`   ${LN('ไอเทม/อาร์ติแฟกต์ผู้ตี','attacker items/artefact')}: ${ctrItemTxt(r.bootsA,r.mapA,r.artA)}`);
  r.res.forEach(g=>{L.push(`— ${r.res.length>1?LN('ถ้าหน่วยช้าสุดเป็น ','if slowest is '):''}${g.g.label}: ${LN('ทัพเขาถึงบ้าน','their army home')} ${W(g.home)}`);
    g.rows.slice().sort((a,b)=>a.send-b.send).forEach(x=>L.push(`   ${x.name===`(${x.P.x}/${x.P.y})`?'':x.name+(x.player?' · '+x.player:'')+' '}(${x.P.x}/${x.P.y}) → (${r.A.x}/${r.A.y}) · ${x.u.n}${x.ts?' TS'+x.ts:''}${x.boots||x.art!==1?' '+ctrItemTxt(x.boots,0,x.art):''} · ${LN('กดปล่อย','send')} ${W(x.send)} → ${LN('เข้า','lands')} ${W(x.hit)}`+(ctrLink(x,r.A)?`\n      🔗 ${ctrLink(x,r.A)}`:'')));});
  const txt=L.join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>fbToast('📋 '+LN('คัดลอกแล้ว','Copied'))).catch(()=>{window.prompt(LN('คัดลอกข้อความนี้','Copy this text'),txt);});}

if(!autoload())initM();

document.getElementById('appver').textContent='v'+APP_VERSION;
i18nInit();
renderAll();
mobAll();
mnavLbl();
fbInit();
setTimeout(()=>{try{mpAuto();}catch(e){}},2500);

function setHH(){const r=document.documentElement.style;r.setProperty('--hh',document.querySelector('header').offsetHeight+'px');r.setProperty('--nh',document.getElementById('mainnav').offsetHeight+'px');}
setHH();window.addEventListener('resize',setHH);
if(window.ResizeObserver){const ro=new ResizeObserver(setHH);ro.observe(document.querySelector('header'));ro.observe(document.getElementById('mainnav'));}
