<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travian Resource Manager v1.65.1</title>
<style>
:root{
  /* ☀️ ธีมสว่าง: โทนขาวนวล ไม่จ้า */
  --bg:#e4e1d8; --panel:#f3f1eb; --ink:#23272b; --mute:#646a70; --line:#d4cfc2;
  --accent:#2d6a56; --accent2:#3f8a71; --accent-soft:#d9ebe2; --accent-ink:#ffffff;
  --bad:#b3261e; --good:#1d6b3a; --warn:#9a6a00;
  --w:#8a5a2b; --c:#c0532f; --i:#5a6672; --f:#a8860f;
  --row:#ebe8df; --shadow:0 1px 2px rgba(30,40,35,.08),0 4px 14px rgba(30,40,35,.06); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15181a; --panel:#1f2326; --ink:#e9e7e1; --mute:#9aa1a8; --line:#33383d;
    --accent:#5fb69b; --accent2:#7fcab2; --accent-soft:#1f3a32; --accent-ink:#0d1f19;
    --bad:#ff8a80; --good:#7fd69b; --warn:#e6b84d;
    --w:#d0a173; --c:#e69470; --i:#aeb8c2; --f:#dcc65f; --row:#262b2f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#15181a; --panel:#1f2326; --ink:#e9e7e1; --mute:#9aa1a8; --line:#33383d;
    --accent:#5fb69b; --accent2:#7fcab2; --accent-soft:#1f3a32; --accent-ink:#0d1f19;
    --bad:#ff8a80; --good:#7fd69b; --warn:#e6b84d;
    --w:#d0a173; --c:#e69470; --i:#aeb8c2; --f:#dcc65f; --row:#262b2f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:linear-gradient(120deg,#23483c,#2d6a56 55%,#3f8a71);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{flex:none;white-space:nowrap;font-size:19px;margin:0 22px 0 0;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
header h1 .logo{font-size:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
header h1 .ver{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);vertical-align:middle;margin-left:4px}
header h1 small{display:block;font-size:11px;font-weight:400;opacity:.8}
header label.f{color:#fff}
header select,header button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff}
header select option{color:#22262a}
header button:hover{background:rgba(255,255,255,.26);border-color:#fff}
header button.clr{border-color:#ffb4ab;color:#ffd9d4}
header button.clr:hover{background:#b3261e;border-color:#b3261e;color:#fff}
header button.pri{background:#fff;color:#23483c;border-color:#fff;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;transition:.12s}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri:hover{background:var(--accent2)}
button.del{color:var(--bad)}
button.del:hover{border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=number]{width:104px;text-align:right}
input.sm{width:92px}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 62px)}
/* หน้าจัดการเมือง: 3 คอลัมน์ [แถบซ้าย ≥297px | เนื้อหา ≤1120px | ว่าง] ให้เนื้อหาอยู่กลางหน้าตำแหน่งเดียวกับหน้าอื่น (หน้าต่างแคบ: แถบซ้ายไม่ถูกบีบ เนื้อหาขยับขวา) */
.layout:not(.nosb){grid-template-columns:minmax(297px,1fr) minmax(0,1120px) minmax(0,1fr)}
.layout:not(.nosb) aside{grid-column:1;width:297px;justify-self:start}
.layout:not(.nosb) main{grid-column:2}
aside{border-right:1px solid var(--line);padding:14px;background:var(--panel)}
aside .addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
main{padding:18px 22px;max-width:1120px;width:100%}
.tab{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);width:fit-content;max-width:100%}
.tab button{border:0;background:transparent;border-radius:8px;padding:7px 14px;color:var(--mute)}

  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

#ctx.on{display:block}

.tbd{display:inline-flex;align-items:center;justify-content:center;width:1.45em;height:1.45em;border-radius:50%;color:#fff;font-size:13px;font-weight:700;line-height:1;font-family:system-ui,sans-serif}
.town .ti .tbd{width:26px;height:26px;font-size:14px}.town.c .ti .tbd{width:20px;height:20px;font-size:12px}
.town .ti{display:inline-flex;align-items:center;gap:3px;flex:none}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 14px}

.stat.good{border-color:var(--good)}.stat.good b{color:var(--good)}
.bcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bcat{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--row)}
.bcath{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:2px 4px 8px}
.bcath .cnt{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.bbtn{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 10px;border-radius:8px;font-size:14px}
.bbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.bbtn.none{opacity:.45;cursor:not-allowed;border-style:dashed;background:transparent}
.btab tr.pick{cursor:pointer}
.btab tr.pick:hover td{background:var(--row)}
.btab tr.selr td{background:var(--accent-soft)}
.btab tr.anchor td{box-shadow:inset 0 0 0 9999px rgba(63,138,113,.18);font-weight:600}
.btab tr.rsum td{border-top:2px solid var(--accent)}
.rangebar{margin:0 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}
table tr.grand td,table tr.grand:hover td{background:var(--accent);color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.35)}
table tr.sum:hover td{background:var(--accent-soft)}
#calcres td.tot{font-weight:700;border-left:2px solid var(--line)}
#calcres td:not(:first-child),#calc td:not(:first-child),#sumbox td:not(:first-child),#trsum td:not(:first-child),.stat b{cursor:copy}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
a{color:var(--accent)}
.impstep{display:flex;align-items:center;gap:10px;margin-top:10px}
.impstep .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.dlbtn{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink)!important;text-decoration:none;font-weight:600;word-break:break-all}
.dlbtn:hover{background:var(--accent2)}
.drop{flex:1;display:block;padding:14px;border:2px dashed var(--accent);border-radius:10px;text-align:center;cursor:pointer;color:var(--ink);background:var(--panel)}

.cb{position:relative;width:100%}

.cbi{padding:7px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.cbi:hover,.cbi.act{background:var(--accent-soft)}
.cbh{padding:6px 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.cbm{color:var(--accent)}
.addbtn{width:100%;padding:10px 14px;font-size:16px;font-weight:700;border-radius:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(45,106,86,.3)}
.subbtn{width:100%;margin-bottom:14px;font-size:13px;color:var(--mute);background:transparent;border-style:dashed}
.subbtn:hover{color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:55;padding:16px}
.modal.on{display:flex}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:520px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.35)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:17px}
.mx{border:0;background:transparent;font-size:18px;padding:2px 8px;color:var(--mute)}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px;border:2px solid var(--line);border-radius:14px;background:var(--row);text-align:center;transition:.15s}
.tcard .ti{font-size:38px;line-height:1}
.tcard b{font-size:17px}
.tcard.tdng b{color:var(--bad)}.tcard.tdng:hover{border-color:var(--bad);background:rgba(179,38,30,.08)}
.tcard:hover,.tcard:focus-visible{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}

.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{font-size:13px;padding:5px 12px;border-radius:999px}

  table.mcards td{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:0;border:0!important;background:transparent!important;text-align:left!important;min-width:0;white-space:normal;font-size:14px}
  table.mcards td::before{content:attr(data-label);font-size:11px;color:var(--mute);font-weight:400;line-height:1.2;text-shadow:none}
  table.mcards td.mtitle{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px;font-weight:700;font-size:15px;padding-bottom:5px;border-bottom:1px solid var(--line)!important}

  table.mcards td.mwide{grid-column:1/-1}
  table.mcards td.mtool{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:8px;order:9}
  table.mcards td.mempty{display:none}
  table.mcards.mgrp tr{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 6px}
  table.mcards.mgrp td{align-items:center;text-align:center!important}
  table.mcards.mgrp td.mtitle{align-items:center;justify-content:flex-start;text-align:left!important}
  table.mcards td.mcap{grid-column:1/-1;flex-direction:row;justify-content:flex-start;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:4px;text-align:left!important}
  table.mcards td.mcap::before{display:none}
  table.mcards tr.grand{background:var(--accent);color:#fff}
  table.mcards tr.grand td::before{color:rgba(255,255,255,.85)}
  /* ตารางอัปเกรดเกราะ (20 เลเวล): ย่อคอลัมน์แทนการ์ด — ซ่อน "รวม 4 ชนิด" และ "รวมสะสม" */
  .upgt th,.upgt td{padding:4px 3px;font-size:11.5px}

  .upgt th:nth-child(7){max-width:64px;width:64px;overflow-wrap:anywhere}
  .upgt td{white-space:nowrap}
  .upgt td[colspan]{white-space:normal}
  .upgt th:nth-child(6),.upgt td:nth-child(6),.upgt th:nth-child(8),.upgt td:nth-child(8){display:none}
  /* มุมมองเมืองทหาร: ชื่อเมืองบรรทัดบน ตัวเลข 2 แถว (① ส่งให้/ต้องการ ② เหลือ/ขาดสุทธิ) แถวละ 4 ชนิดแร่ */
  .milwrap{overflow:visible}
  .milctl{display:flex;flex-wrap:wrap;gap:6px 8px;max-width:100%;align-items:center}
  .milctl .icoact{margin-left:auto}
  .mrow{grid-template-columns:repeat(4,minmax(0,1fr));min-width:0;row-gap:2px;padding-bottom:4px}
  .mrow>.mname{grid-column:1/-1;padding:4px 8px;white-space:normal;flex-wrap:wrap}
  .mrow>.mn{padding:2px;font-size:12.5px;text-align:center}
  .mrow>.sep{border-left:0}
  .mrow>.mn:nth-child(n+6){border-top:1px dashed var(--line)}

  .mrow.mhd2{padding:4px 8px}
  .mhd2>.hcity,.mhd2>.rr:nth-child(n+8){display:none}
  .mhd2>.mgl{grid-row:auto!important;grid-column:1/-1!important;text-align:left;border-bottom:0;font-size:12px;padding:2px 4px;white-space:normal}
  .mhd2>.rr{grid-row:auto!important;text-align:center;padding:2px;font-size:12px}
  .mhd2>.mgl:nth-child(2)::before{content:"① "}
  .mhd2>.mgl:nth-child(3)::before{content:"② "}
}

<script>
/* กล่องยืนยันในหน้าเอง (ไม่ใช้ confirm/alert ของเบราว์เซอร์ เพราะบางสภาพแวดล้อมบล็อกไว้) */
// กล่องเลือกหลายปุ่ม (คืนค่า Promise เป็น key ของปุ่ม) · b.raw = ไม่แปลข้อความปุ่ม (มีชื่อโปรไฟล์)
function askChoice(title,msgHTML,btns){return new Promise(res=>{
  window._cbRes=res;document.getElementById('cb-title').textContent=title;document.getElementById('cb-msg').innerHTML=msgHTML;
  document.getElementById('cb-btns').innerHTML=btns.map(b=>`<button class="${b.cls||''}" ${b.raw?'data-noi18n':''} onclick="choiceClose('${b.key}')">${b.raw?esc(b.label):b.label}</button>`).join('');
  document.getElementById('choicebox').classList.add('on');});}
function choiceClose(k){document.getElementById('choicebox').classList.remove('on');const r=window._cbRes;window._cbRes=null;if(r)r(k);}
const LN=(th,en)=>LANG()==='en'?en:th;
// คำอธิบายเล็กๆ ทุกหน้า → ไอคอน (?) แสดงเป็น tooltip เมื่อชี้/แตะ (แปลเป็นอังกฤษอัตโนมัติเมื่อ EN)
const tipTxt=h=>String(h).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const tip=(h,cls)=>{let t=tipTxt(h);if(LANG()==='en')t=trText(t);return `<span class="qtip${cls?' '+cls:''}" tabindex="0" role="note" data-noi18n aria-label="${esc(t)}" data-tip="${esc(t)}">?</span>`;};
function dlgR(msg,onOk,okLabel,danger,inputVal){window._dlgRaw=true;dlg(msg,onOk,okLabel,danger,inputVal);}
function dlg(msg,onOk,okLabel,danger,inputVal){
  const d=document.getElementById('dlg'),ok=document.getElementById('dlgok'),no=document.getElementById('dlgno'),inp=document.getElementById('dlginp');
  const raw=!!window._dlgRaw;window._dlgRaw=false;const mEl=document.getElementById('dlgmsg');if(raw)mEl.setAttribute('data-noi18n','');else mEl.removeAttribute('data-noi18n');
  mEl.textContent=msg;
  const hasIn=inputVal!==undefined;
  inp.style.display=hasIn?'':'none';inp.value=hasIn?inputVal:'';
  no.style.display=onOk?'':'none';
  ok.textContent=onOk?(okLabel||'ยืนยัน'):'ตกลง';
  ok.className=danger?'dng':'pri';
  const close=()=>{d.classList.remove('on');ok.onclick=null;no.onclick=null;inp.onkeydown=null;};
  ok.onclick=()=>{const v=inp.value;close();if(onOk)onOk(v);};
  no.onclick=close;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok.click();}if(e.key==='Escape')close();};
  d.classList.add('on');(hasIn?inp:ok).focus();if(hasIn)inp.select();
}
/* คัดลอกตัวเลข: บนจอแสดง , แต่เวลาคัดลอกจะได้ตัวเลขล้วน (วางในเกมได้เลย) */
const plainNum=t=>t.replace(/(\d),(?=\d{3}(?!\d))/g,'$1');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
function copyText(txt){
  const done=()=>toast('📋 คัดลอกแล้ว: '+txt);
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,()=>fb());return;}}catch(e){}
  fb();
  function fb(){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('คัดลอกไม่สำเร็จ');}ta.remove();}
}
document.addEventListener('copy',e=>{const t=String(window.getSelection());if(/\d,\d{3}/.test(t)){e.clipboardData.setData('text/plain',plainNum(t));e.preventDefault();}});
document.addEventListener('click',e=>{
  const el=e.target.closest('#calcres td, #calc td, #sumbox td, #trsum td, .stat b');if(!el||String(window.getSelection()))return;
  const raw=el.childNodes.length&&el.querySelector('b')&&el.tagName==='TD'?el.querySelector('b').textContent:el.textContent;
  const m=raw.trim().match(/^[+\-−]?[\d,]+$/);if(!m)return;
  copyText(plainNum(m[0]).replace(/^\+/,'').replace('−','-'));
});
/* ============ ข้อมูลเกม (ตั้งต้น · แท็บ "ข้อมูลทหาร" / "ข้อมูล Celebration" แสดงอย่างเดียว ไม่มีช่องแก้ไข) ============ */
const RES=['🌲 ไม้','<i class="ric"></i> โคลน','⛏️ เหล็ก','🌾 ข้าว'], RCLS=['rw','rc','ri','rf'];
const BLD={B:'ค่ายทหาร (Barracks)',GB:'ค่ายทหารใหญ่ (Great Barracks) — ใช้แร่ ×3',S:'โรงม้า (Stable)',GS:'โรงม้าใหญ่ (Great Stable) — ใช้แร่ ×3',W:'ห้องเครื่อง (Workshop)'};
const BSHORT={B:'ค่ายทหาร',GB:'ค่ายทหารใหญ่',S:'โรงม้า',GS:'โรงม้าใหญ่',W:'ห้องเครื่อง',P:'Residence / Palace'};
const noGreat=b=>b==='W'||b==='P';
const BICON={B:'🛡️',GB:'🏯',S:'🐴',GS:'🏇',W:'🛠️'};
const TRIBE_BADGE={Romans:['R','#b3261e'],Teutons:['T','#7a5230'],Gauls:['G','#2d6a56'],Egyptians:['E','#b8860b'],Huns:['H','#5a4b8a'],Vikings:['V','#1f5f8b'],Spartans:['S','#8a2e5c']};
const tribeBadge=tr=>{const b=TRIBE_BADGE[tr]||['?','#666'];return `<span class="tbd" style="background:${b[1]}">${b[0]}</span>`;};
// ไอคอนตามบทบาท: 🗡️ ราบโจมตี · 🛡️ ราบป้องกัน · 🏇 ม้าโจมตี · 🐴 ม้าป้องกัน · 🕵️ สอดแนม · 🐏 เครื่องกระแทก · ☄️ เครื่องยิงหิน
// อาวุธเฉพาะ: 🔱 หอก(โจมตี) · ⚔️ ดาบคู่ · ⚒️ ขวาน
const UNIT_ICON={
  'Legionnaire':'🗡️','Praetorian':'🛡️','Imperian':'🗡️','Equites Legati':'🕵️','Equites Imperatoris':'🏇','Equites Caesaris':'🏇',
  'Clubswinger':'🗡️','Spearman':'🛡️','Axeman':'⚒️','Scout':'🕵️','Paladin':'🐴','Teutonic Knight':'🏇',
  'Phalanx':'🛡️','Swordsman':'🗡️','Pathfinder':'🕵️','Theutates Thunder':'🏇','Druidrider':'🐴','Haeduan':'🏇',
  'Slave Militia':'🛡️','Ash Warden':'🛡️','Khopesh Warrior':'🗡️','Sopdu Explorer':'🕵️','Anhur Guard':'🐴','Resheph Chariot':'🐴',
  'Mercenary':'🗡️','Bowman':'🗡️','Spotter':'🕵️','Steppe Rider':'🏇','Marksman':'🏇','Marauder':'🏇',
  'Thrall':'🗡️','Shield Maiden':'🛡️','Berserker':'⚒️',"Heimdall's Eye":'🕵️','Huskarl Rider':'🐴',"Valkyrie's Blessing":'🏇',
  'Hoplite':'🔱','Sentinel':'🕵️','Shieldsman':'🛡️','Twinsteel Therion':'⚔️','Elpida Rider':'🐴','Corinthian Crusher':'🏇'
};
function uIcon(tribe,i){
  const un=TRIBES[tribe][i],n=un.n.toLowerCase();
  if(un.b==='P')return i===8?'👑':'🏠';
  if(UNIT_ICON[un.n])return UNIT_ICON[un.n];
  if(/\bram\b/.test(n))return '🐏';
  if(/catapult|trebuchet|ballista/.test(n))return '☄️';
  return un.b==='S'?'🏇':'🗡️';
}
const BKEYS=['B','GB','S','GS','W'];
const BTYPE={B:'B',GB:'B',S:'S',GS:'S',W:'W'};      // อาคารใหญ่ฝึกหน่วยชุดเดียวกับอาคารปกติ ความเร็วเท่ากัน
const BCOST={B:1,GB:3,S:1,GS:3,W:1};               // ต้นทุนแร่ต่อหน่วยของอาคารใหญ่ ×3

const horseMult=(t,k)=>((k==='S'||k==='GS')&&t.tribe==='Romans')?(1-0.01*Math.min(20,Math.max(0,t.horse||0))):1;
// โบนัสลดเวลาฝึก (คูณกันทั้งหมด ยืนยันจากภาพ kirilloid): กิลด์ x หมวก Hero (ราบ/ม้า ไม่มีใน Workshop) x อาติแฟค (เวลาเหลือ 75%/50%) x Horse Drinking Trough
const artMul=t=>{const a=+t.art;return a>0&&a<=100?a/100:1;};
// หมวก Hero: ชื่อ/เปอร์เซ็นต์ตามระดับ (tier 1-3) และ rarity (มีเฉพาะเซิร์ฟเวอร์ที่มี Item Crafting)
const RARITIES=['common','uncommon','rare','epic'];
const HELM_T={
  1:{I:'Helmet of the Mercenary',C:'Helmet of the Horseman',pct:[10,12,15,20]},
  2:{I:'Helmet of the Warrior',C:'Helmet of the Cavalry',pct:[15,17,20,25]},

function helmKey(v){ // รองรับค่าเก่าที่เก็บเป็นตัวเลข 10/15/20
  if(typeof v==='number'||/^\d+$/.test(String(v))){const n=+v;return n===10?'1:common':n===15?'2:common':n===20?'3:common':'';}
  return /^[123]:(common|uncommon|rare|epic)$/.test(v||'')?v:'';
}
function helmPct(t,g){
  const key=helmKey(g==='I'?t.helmI:t.helmC);if(!key)return 0;
  const [tier,rar]=key.split(':');
  const ri=S.crafting?RARITIES.indexOf(rar):0;
  return HELM_T[tier].pct[ri];
}
const bonusMul=(t,k)=>{

  if(BTYPE[k]==='B')m*=1-helmPct(t,'I')/100;
  if(BTYPE[k]==='S')m*=1-helmPct(t,'C')/100;
  return m;
};

const getBH=b=>(b.hours===undefined||b.hours===''||isNaN(+b.hours)||+b.hours<0)?24:+b.hours; // ชั่วโมงที่กดฝึกต่อรอบ 24 ชม. ของแต่ละอาคาร (เกิน 24 ได้)

function parseHMS(str){const p=String(str).trim().split(':').map(Number);if(p.some(x=>isNaN(x)||x<0)||p.length<2||p.length>3)return null;

function celebHour(t){
  const z=[0,0,0,0]; if(t.celeb==='none')return {h:z,warn:''};
  const big=t.celeb==='large', lv=Math.min(20,Math.max(1,t.th));
  const cost=big?S.celeb.large:S.celeb.small;
  const sec=S.celeb.tbl[celGroup()][big?'l':'s'][lv-1];
  if(!sec)return {h:z,warn:'Celebration ใหญ่ต้องใช้ Town Hall เลเวล 10 ขึ้นไป (ยังไม่คิดต้นทุน)',dur:0};
  return {h:cost.map(x=>x/(sec/3600)),warn:'',dur:sec};
}
// โหมด "จำนวนตัว": ระบุจำนวนทหารที่ต้องการต่อหน่วย -> คำนวณเวลารวมและแร่รวม
function bldCount(t,k){
  const b=t.bld[k],items=[];let secTot=0;
  for(const key of Object.keys(b.qty||{})){
    const i=+key,q=Math.floor(+b.qty[key]||0);
    if(q<=0||!TRIBES[t.tribe][i]||TRIBES[t.tribe][i].b!==BTYPE[k])continue;
    const un=unit(t.tribe,i),sec=un.t/bSpeed(b.lvl)/S.speed*timeMult(t,k);
    items.push({i,q,un,sec});secTot+=q*sec;
  }
  return {items,secTot};
}
function troopHour(t){
  const tot=[0,0,0,0],detail=[];
  for(const k of BKEYS){
    const b=t.bld[k]; if(!b||!b.on||!b.lvl)continue;
    if(b.mode==='count'){
      const r=bldCount(t,k); if(!r.items.length||r.secTot<=0)continue;
      const Th=r.secTot/3600; // ฝึกต่อเนื่องจนครบจำนวน: แร่ต่อชม. = แร่รวม / เวลารวม
      for(const it of r.items){
        const batch=it.un.c.map(x=>x*it.q*BCOST[k]),cost=batch.map(v=>v/Th);
        cost.forEach((v,j)=>tot[j]+=v);
        detail.push({k,i:it.i,icon:uIcon(t.tribe,it.i),name:it.un.n+(BCOST[k]>1?' (Great)':''),perH:it.q/Th,sec:it.sec,hrs:Th,f:1,mode:'count',qty:it.q,cost,batch});
      }
      continue;
    }
    if(!(b.sel||[]).length)continue;
    const n=b.sel.length,f=getBH(b)/24;
    for(const i of b.sel){
      const un=unit(t.tribe,i);
      const sec=un.t/bSpeed(b.lvl)/S.speed*timeMult(t,k);
      const perH=3600/sec/n; // จำนวนที่ผลิตได้ต่อชม (แบ่งเวลาเท่ากันถ้าติ๊กหลายตัว)
      un.c.forEach((x,j)=>tot[j]+=x*perH*BCOST[k]*f);
      detail.push({k,i,icon:uIcon(t.tribe,i),name:un.n+(BCOST[k]>1?' (Great)':''),perH,sec,hrs:getBH(b),f,cost:un.c.map(x=>x*perH*BCOST[k]*f),batch:un.c.map(x=>x*perH*BCOST[k]*getBH(b))});
    }
  }
  return {h:tot,detail};
}
function importsOf(t){
  const r=[0,0,0,0];
  S.towns.forEach(o=>o.exports.forEach(e=>{if(e.to===t.id)e.r.forEach((x,j)=>r[j]+=x);}));
  return r;
}
function calc(t){
  const imp=importsOf(t), ce=celebHour(t), tr=t.type==='mil'?troopHour(t):{h:[0,0,0,0],detail:[]};
  ce.h=ce.h.map(ceilN);tr.h=tr.h.map(ceilN);
  const up=[0,0,0,0];
  const avail=[0,1,2,3].map(j=>t.prod[j]+imp[j]-ce.h[j]-tr.h[j]-up[j]);
  const out=[0,0,0,0];t.exports.forEach(e=>e.r.forEach((x,j)=>out[j]+=x));
  const net=avail.map((a,j)=>a-out[j]);
  return {imp,ce,tr,up,avail,out,net};
}

function mergePlans(list){
  if(!Array.isArray(list)||!list.length)return 0;ensurePlans();let add=0;
  list.forEach(p=>{if(!p||!Array.isArray(p.items))return;
    const same=M.plans.find(x=>x.name===p.name);
    if(same&&JSON.stringify(same.items)===JSON.stringify(p.items))return;
    let name=p.name||'แผน',nm=name;if(same){nm=name+' (ไฟล์)';let k=2;while(M.plans.some(x=>x.name===nm))nm=name+' (ไฟล์ '+(k++)+')';}
    M.plans.push({id:Math.max(0,...M.plans.map(x=>x.id))+1,name:nm,items:JSON.parse(JSON.stringify(p.items))});add++;});
  return add;
}
async function importData(d){
  let servers;
  if(d&&Array.isArray(d.servers)&&d.servers.length)servers=d.servers;
  else if(d&&Array.isArray(d.towns))servers=[Object.assign({},d,{name:d.name||'เซิร์ฟเวอร์ 1'})];
  else throw new Error('ไฟล์ไม่ใช่ข้อมูลของแอปนี้');
  const conflicts=servers.filter(x=>M.servers.some(e=>e.towns.length&&nameKey(e.name)===nameKey(x.name||'เซิร์ฟเวอร์ 1'))).length;
  const res={added:0,replaced:0,skipped:0};let last=null,ci=0,cancelled=false;
  for(let k=0;k<servers.length;k++){
    const sv=normServer(servers[k]);sv.name=String(servers[k].name||('เซิร์ฟเวอร์ '+(k+1))).trim();
    const ex=M.servers.find(e=>nameKey(e.name)===nameKey(sv.name));
    if(!ex){sv.id=M.nextSid++;M.servers.push(sv);res.added++;last=sv.id;continue;}
    if(!ex.towns.length){const keep=ex.id,nm=ex.name;Object.keys(ex).forEach(key=>delete ex[key]);Object.assign(ex,sv,{id:keep,name:nm});res.replaced++;last=keep;continue;} // โปรไฟล์เดิมว่างเปล่า: แทนที่เลย ไม่ต้องถาม
    ci++;const ch=await askConflict(sv.name,ex,sv,ci,conflicts);
    if(ch==='cancel'){cancelled=true;break;}
    if(ch==='skip'){res.skipped++;continue;}
    if(ch==='replace'){const keep=ex.id,nm=ex.name;Object.keys(ex).forEach(key=>delete ex[key]);Object.assign(ex,sv,{id:keep,name:nm});res.replaced++;last=keep;}
    else{sv.name=uniqueName(sv.name);sv.id=M.nextSid++;M.servers.push(sv);res.added++;last=sv.id;}
  }
  const pl=cancelled?0:mergePlans(d.plans);
  if(last!=null){switchServer(last);}else{renderAll();autosave();}
  const parts=[];if(res.added)parts.push(LN('สร้างโปรไฟล์ใหม่ ','New profiles: ')+res.added);if(res.replaced)parts.push(LN('ทับข้อมูล ','Overwritten: ')+res.replaced);if(res.skipped)parts.push(LN('ข้าม ','Skipped: ')+res.skipped);if(pl)parts.push(LN('เพิ่มแผนสร้างเมือง '+pl+' แผน','Added '+pl+' build plan(s)'));
  dlgR((cancelled?LN('ยกเลิกการโหลดที่เหลือ','Remaining profiles cancelled'):LN('โหลดเสร็จ','Load finished'))+'\n'+(parts.length?parts.join(' · '):LN('ไม่มีการเปลี่ยนแปลง','No changes')));
}

function parseDorf1(raw){
  const txt=raw.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'');
  const i0=txt.search(/กำลังผลิตต่อชั่วโมง|Production per hour/i);
  const seg=i0>=0?txt.slice(i0):txt;
  const keys=[['ไม้','Lumber','Wood'],['โคลน','Clay'],['เหล็ก','Iron'],['ธัญพืช','ข้าว','Crop']];
  const prod=[];
  for(const labels of keys){
    let v=null;
    for(const l of labels){
      const m=seg.match(new RegExp(l+'\\s*[:：]+\\s*([−–-]?\\s*\\d[\\d,. ]*)','i'));
      if(m){v=parseInt(m[1].replace(/[−–]/g,'-').replace(/[,.\s]/g,''),10);break;}
    }
    if(v===null||isNaN(v))return {ok:false};
    prod.push(v);
  }
  // ชื่อเมือง = บรรทัดที่อยู่ก่อนบรรทัด "ประชากร"
  let name='';
  const lines=txt.split(/\r?\n/).map(x=>x.trim());
  const pi=lines.findIndex(x=>/^(ประชากร|Population)/i.test(x));
  if(pi>0){for(let j=pi-1;j>=0;j--){if(lines[j]){name=lines[j];break;}}}
  // พิกัด X/Y: หาชื่อเมืองนี้ในรายชื่อหมู่บ้าน (หลังบรรทัดประชากร) แล้วอ่านบรรทัดพิกัดถัดไป เช่น (−14|109)
  let x=null,y=null;const cre=/^\(\s*([−–-]?\d+)\s*\|\s*([−–-]?\d+)\s*\)$/;
  if(name&&pi>0){for(let j=pi+1;j<lines.length;j++){if(lines[j]!==name)continue;
    let k=j+1;while(k<lines.length&&!lines[k])k++;
    const m=(lines[k]||'').match(cre);if(m){x=parseInt(m[1].replace(/[−–]/,'-'),10);y=parseInt(m[2].replace(/[−–]/,'-'),10);break;}}}
  return {ok:true,prod,name,x,y};
}

// map.sql: (id, x, y, tribe, villageId, villageName, playerId, playerName, allianceId, allianceTag, population, region, capital, city, harbor, VP)
const MAP_TRIBE={1:'Romans',2:'Teutons',3:'Gauls',6:'Egyptians',7:'Huns',8:'Spartans',9:'Vikings',5:'Natars'};
function parseMapSql(t){
  const out=[],n=t.length;let i=0;
  while(true){
    const k=t.indexOf('VALUES',i);if(k<0)break;i=k+6;
    while(i<n){
      while(i<n&&(t[i]===','||t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;
      if(t[i]!=='(')break;i++;const v=[];
      while(i<n){
        while(t[i]===' ')i++;
        let x;
        if(t[i]==="'"||t[i]==='"'){const q=t[i++];let s='';
          while(i<n){if(t[i]==='\\'){s+=t[i+1];i+=2;}else if(t[i]===q&&t[i+1]===q){s+=q;i+=2;}else if(t[i]===q){i++;break;}else s+=t[i++];}
          x=s;}
        else{let s='';while(i<n&&t[i]!==','&&t[i]!==')')s+=t[i++];x=s.trim();if(x==='NULL')x=null;}
        v.push(x);while(t[i]===' ')i++;
        if(t[i]===','){i++;continue;}
        if(t[i]===')'){i++;break;}
        break;
      }
      if(v.length>=11)out.push({fid:+v[0],vid:+v[4],x:+v[1],y:+v[2],tribe:+v[3],name:decHtml(v[5]||''),uid:+v[6],player:decHtml(v[7]||''),aid:+v[8],ally:decHtml(v[9]||''),pop:+v[10]||0,capital:String(v[12]).toUpperCase()==='TRUE'});
    }
  }
  return out;
}

function mapBase(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return x.origin+'/';}catch(e){return '';}}

    const fb=document.getElementById('impfb');if(fb){fb.classList.add('hl');fb.scrollIntoView({behavior:'smooth',block:'center'});}

function impDrop(e){const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impLoadText(r.result,'ไฟล์ '+esc(f.name));r.readAsText(f);}
function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impLoadText(r.result,'ไฟล์ '+esc(f.name));r.readAsText(f);inp.value='';}
function impLoadText(txt,src){
  const rows=parseMapSql(txt);
  if(!rows.length){impStatus('⚠ ไม่พบข้อมูลหมู่บ้านในไฟล์ (ต้องเป็น map.sql ของ Travian)',true);return;}
  window._mapRows=rows;window._mapAllies=null;if(mpHost()){try{mpStore(rows,'file',false);}catch(e){}}
  impStatus('✓ อ่าน '+src+' แล้ว: '+fmt(rows.length)+' หมู่บ้าน · เลือกกิลด์ในขั้นที่ 4 แล้วเลือกชื่อผู้เล่น');renderImp4();
  if(String(S.mapPlayer||'').trim())impFind();else renderImp();
}
function impFind(){
  const rows=window._mapRows;if(!rows)return;
  const q=String(S.mapPlayer||'').trim();window._imp=null;window._impCand=null;
  let uid=null;
  if(/^\d+$/.test(q)&&rows.some(r=>r.uid===+q))uid=+q;
  else{const ql=q.toLowerCase(),ex=rows.find(r=>r.player.toLowerCase()===ql);
    if(ex)uid=ex.uid;
    else{const m=new Map();rows.forEach(r=>{if(q&&r.player.toLowerCase().includes(ql)&&!m.has(r.uid))m.set(r.uid,r);});window._impCand=[...m.values()].slice(0,30);}}
  if(uid!=null){
    const vs=rows.filter(r=>r.uid===uid).sort((a,b)=>(b.capital-a.capital)||b.pop-a.pop);
    const sel={},type={};vs.forEach(v=>{const ex=impExisting(v);sel[v.vid]=!ex;type[v.vid]=ex?ex.type:'ore';});
    window._imp={uid,vs,sel,type};
  }
  renderImp();
}
function impPick(uid){const r=window._mapRows.find(x=>x.uid===uid);if(r){S.mapPlayer=r.player;S.mapAlly=r.aid||0;autosave();renderImp4();impFind();}}
// เช็กเมืองที่มีแล้วจากพิกัด X/Y (ชื่อเมืองเปลี่ยนบ่อย)
function impExisting(v){return S.towns.find(t=>t.x!=null&&t.y!=null&&+t.x===v.x&&+t.y===v.y);}
function impToggle(vid,on){const v=window._imp.vs.find(x=>x.vid===vid);if(v&&impExisting(v))return;window._imp.sel[vid]=on;renderImp();}
function impType(vid,v){window._imp.type[vid]=v;}
function impAll(on){window._imp.vs.forEach(v=>window._imp.sel[v.vid]=on&&!impExisting(v));renderImp();}
function impAllType(tp){window._imp.vs.forEach(v=>{if(!impExisting(v))window._imp.type[v.vid]=tp;});renderImp();}
function impDo(){
  const I=window._imp;if(!I)return;let add=0,upd=0,last=null;
  I.vs.forEach(v=>{if(!I.sel[v.vid])return;
    const tribe=MAP_TRIBE[v.tribe];const ex=impExisting(v);
    if(ex){upd++;return;} // มีเมืองที่พิกัดนี้แล้ว: ข้าม ไม่สร้างและไม่แก้ไข
    const t=newTown(I.type[v.vid]||'ore');Object.assign(t,{name:v.name,vid:v.vid,x:v.x,y:v.y,pop:v.pop,capital:v.capital});if(tribe&&TRIBES[tribe])t.tribe=tribe;
    S.towns.push(t);add++;last=t.id;});
  if(!add){dlg(upd?'ทุกหมู่บ้านที่เลือกมีในแอปแล้ว (พิกัดตรงกัน) ไม่ได้สร้างเพิ่ม':'ยังไม่ได้เลือกหมู่บ้านใหม่');return;}
  autosave();cur=last;
  dlg('นำเข้าเสร็จ: เพิ่มเมืองใหม่ '+add+' เมือง'+(upd?' · ข้ามเมืองที่มีพิกัดซ้ำ '+upd+' เมือง':''),()=>{view='town';renderAll();},'ไปหน้าจัดการเมือง');
  window._imp=null;impFind();
}

    <div class="impstep"><span class="num">1</span><label class="f" style="flex:1">ใส่ที่อยู่เซิร์ฟเวอร์<input value="${esc(S.mapUrl||'')}" placeholder="https://ts21.x2.asia.travian.com/" oninput="impSet('mapUrl',this.value)" style="width:100%"></label></div>
    <div class="impstep"><span class="num">2</span><div style="flex:1"><a id="impdl" class="dlbtn" href="${b?b+'map.sql':'#'}" target="_blank" rel="noopener" onclick="return impGet(event)">⬇ ${b?'ดึง SQL: '+esc(b)+'map.sql':'ดึง SQL (ใส่ที่อยู่เซิร์ฟเวอร์ก่อน)'}</a>${tip(`ไฟล์จะเปิดในแท็บใหม่หรือดาวน์โหลดลงเครื่อง · ถ้าเปิดเป็นข้อความ: กด Ctrl+A, Ctrl+C แล้ววางในช่องขั้นที่ 3 · ถ้าดาวน์โหลดเป็นไฟล์: ลากไฟล์มาวาง หรือคลิกเลือกไฟล์`)}</div></div>

      <label class="drop" style="margin-top:6px" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');impDrop(event)">
        <input type="file" accept=".sql,.txt,text/plain" onchange="impFile(this)" hidden>📂 หรือคลิกเลือกไฟล์ map.sql / ลากไฟล์มาวางตรงนี้</label></div></div>
    <p id="impst" class="note" style="margin-top:8px">${has?'✓ มีข้อมูล SQL ในหน้านี้แล้ว '+fmt(window._mapRows.length)+' หมู่บ้าน':''}</p>
    <div id="imp4"></div>

// ขั้น 4: เลือกกิลด์ (Tag) ก่อน → ขั้น 5: เลือกชื่อผู้เล่นในกิลด์นั้น
function mapAllies(){
  if(window._mapAllies)return window._mapAllies;
  const A=new Map();
  window._mapRows.forEach(r=>{if(!(r.uid>0)||r.tribe===5)return;const k=r.aid||0;
    if(!A.has(k))A.set(k,{aid:k,tag:k?(r.ally||('#'+k)):'(ไม่มีกิลด์)',m:new Map()});
    const a=A.get(k);if(!a.m.has(r.uid))a.m.set(r.uid,{uid:r.uid,name:r.player,v:0,pop:0});const p=a.m.get(r.uid);p.v++;p.pop+=r.pop;});
  window._mapAllies=[...A.values()].map(a=>({aid:a.aid,tag:a.tag,members:[...a.m.values()].sort((x,y)=>x.name.localeCompare(y.name))}))
    .sort((x,y)=>(x.aid===0)-(y.aid===0)||y.members.length-x.members.length||x.tag.localeCompare(y.tag));
  return window._mapAllies;
}
function renderImp4(){
  const el=document.getElementById('imp4');if(!el)return;

  const cur=AL.find(a=>String(a.aid)===String(S.mapAlly));

      <div class="cb"><input id="imp${k}a" value="${esc(val)}" placeholder="${ph}" autocomplete="off" onfocus="this.select();cbList(${k})" oninput="cbList(${k})" onkeydown="cbKey(event,${k})" onblur="setTimeout(()=>cbHide(${k}),150)" style="width:100%">
      <div class="cbl" id="imp${k}l"></div></div></label></div>`;
  el.innerHTML=box(4,`กิลด์ (Tag) · ${AL.length} กิลด์`,cur?cur.tag:'','พิมพ์ชื่อกิลด์เพื่อค้นหา เช่น อา หรือ War')+
    (cur?box(5,`ชื่อผู้เล่น (Avatar Name) ในกิลด์ ${esc(cur.tag)} · ${cur.members.length} คน`,S.mapPlayer||'','พิมพ์ชื่อเพื่อค้นหา เช่น อา'):'');

// ช่องพิมพ์ค้นหาแบบมีรายการให้เลือก (ค้นจากตัวอักษรที่อยู่ส่วนไหนของชื่อก็ได้)
function cbItems(k){
  const AL=mapAllies();

  const cur=AL.find(a=>String(a.aid)===String(S.mapAlly));if(!cur)return [];
  return cur.members.map(m=>({id:m.uid,key:m.name,label:m.name,sub:`${m.v} หมู่บ้าน · ประชากร ${fmt(m.pop)}`}));
}
function cbList(k){
  const inp=document.getElementById('imp'+k+'a'),box=document.getElementById('imp'+k+'l');if(!inp||!box)return;
  const q=inp.value.trim().toLowerCase(),all=cbItems(k),hit=all.filter(x=>!q||x.key.toLowerCase().includes(q));

    (hit.slice(0,100).map((x,i)=>`<div class="cbi ${i===0?'act':''}" onmousedown="event.preventDefault();cbPick(${k},${x.id})">${hl(x.label)} <span class="note">${esc(x.sub)}</span></div>`).join('')||'<div class="cbh">ไม่พบ</div>');

function cbHide(k){const b=document.getElementById('imp'+k+'l');if(b)b.style.display='none';}
function cbKey(e,k){

  if(e.key==='Enter'){e.preventDefault();const x=box._hit[box._act];if(x)cbPick(k,x.id);}

function cbPick(k,id){

function impAlly(v){S.mapAlly=v===''?null:+v;S.mapPlayer='';autosave();window._imp=null;window._impCand=null;renderImp4();renderImp();}

function impGet(e){

  // ลองดึงตรงๆ เผื่อเบราว์เซอร์อนุญาต (ถ้าได้จะโหลดเองเลย) และเปิดลิงก์ในแท็บใหม่ไปพร้อมกัน
  impStatus('⏳ เปิด '+esc(b)+'map.sql ในแท็บใหม่แล้ว · วาง SQL หรือเลือกไฟล์ในขั้นที่ 3');

function impPaste(el){const v=el.value;if(!v.trim())return;if(!/INSERT\s+INTO/i.test(v)){impStatus('⚠ ข้อความที่วางไม่ใช่ SQL ของ map.sql',true);return;}impLoadText(v,'SQL ที่วาง');el.value='';}

}

function trText(s){
  if(!/[\u0E00-\u0E7F]/.test(s))return s;
  I18N_PH.forEach(([a,b])=>{if(s.includes(a))s=s.split(a).join(b);});
  if(!/[\u0E00-\u0E7F]/.test(s))return s;
  return s.replace(THRUN,m=>I18N[m]!==undefined?I18N[m]:m.split(' ').map(p=>I18N[p]!==undefined?I18N[p]:p).join(' '));
}

  const doEl=el=>{if(el.closest&&el.closest('[data-noi18n]'))return;I18N_ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&/[\u0E00-\u0E7F]/.test(v)){if(!el.hasAttribute('data-th-'+a))el.setAttribute('data-th-'+a,v);el.setAttribute(a,trText(v));}});};
  if(root.nodeType===3){doText(root);return;}
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1)doEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
}
function i18nRun(nodes){if(_i18nBusy)return;_i18nBusy=true;try{nodes.forEach(i18nNode);}finally{if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}}
function i18nRestore(){ // กลับเป็นภาษาไทย: คืนข้อความเดิมของส่วนที่ไม่ได้สร้างใหม่
  _i18nBusy=true;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3){if(n._th!==undefined){n.nodeValue=n._th;delete n._th;}}else I18N_ATTR.forEach(a=>{const k='data-th-'+a;if(n.hasAttribute(k)){n.setAttribute(a,n.getAttribute(k));n.removeAttribute(k);}});}
  if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;
}
function themeCur(){return M&&M.theme?M.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function themeUI(){const t=themeCur();if(M&&M.theme)document.documentElement.setAttribute('data-theme',M.theme);else document.documentElement.removeAttribute('data-theme');
  ['light','dark'].forEach(x=>{const b=document.getElementById('th-'+x);if(b)b.classList.toggle('on',x===t);});}
function setTheme(t){M.theme=t==='dark'?'dark':'light';autosave();themeUI();}
function langUI(){if(typeof mnavLbl==='function')setTimeout(mnavLbl,0);const l=LANG();document.documentElement.lang=l==='en'?'en':'th';['th','en'].forEach(x=>{const b=document.getElementById('lang-'+x);if(b)b.classList.toggle('on',x===l);});}
function setLang(l){M.lang=l==='en'?'en':'th';autosave();if(typeof fbRenderUI==='function')fbRenderUI();if(M.lang==='th'){i18nRestore();renderAll();}else{renderAll();i18nRun([document.body]);}langUI();}
function i18nInit(){
  _i18nObs=new MutationObserver(recs=>{if(_i18nBusy||LANG()!=='en')return;const ns=[];recs.forEach(r=>{if(r.type==='characterData')ns.push(r.target);else if(r.type==='attributes')ns.push(r.target);else r.addedNodes.forEach(x=>ns.push(x));});i18nRun(ns);});
  _i18nObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:I18N_ATTR});
  langUI();themeUI();if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeUI);if(LANG()==='en')i18nRun([document.body]);
}

const CHANGELOG=[["1.65.1", "แก้: จุดสถานะซิงค์มุมโปรไฟล์ค้างเป็นสีเหลืองกะพริบ (กำลังบันทึก) ทั้งที่ข้อมูลตรงกับคลาวด์แล้ว · ตอนนี้เปลี่ยนเป็นเขียว (บันทึกแล้ว) แล้วหายเอง หรือแดงถ้าซิงค์ไม่ได้ · ชี้ที่จุดเพื่อดูความหมาย", ".1", "\n• แก้: ภาษาอังกฤษ คำอธิบายของปุ่มแชร์ยังเป็นภาษาไทย", "\n• Fix: in English the Share button tooltip stayed in Thai"], ["1.64.9", "🔗 แชร์โปรไฟล์ให้เพื่อน (Dual): กด 🔗 ข้างชื่อโปรไฟล์ → ใส่ Gmail เพื่อน + สิทธิ์ ดูอย่างเดียว / แก้ไขได้ · แชร์เฉพาะ จัดการเมือง · เส้นทางขนส่ง · สรุปทุกเมือง (ซิงค์ทันที) ส่วนอื่นของใครของมัน · เพื่อนล็อกอินด้วย Gmail นั้นแล้วแอปถามให้เพิ่มเป็นโปรไฟล์ (หรือเมนูบัญชี → 📥 โปรไฟล์ที่แชร์ให้ฉัน) · ต้องเพิ่ม rules ของ Firestore", ".1-.9", "\n• 🗺️ ขนาดแผนที่ (±200/250/400) และต่อขอบ ย้ายไปไว้บนหัวแอป ข้างความเร็วเซิร์ฟเวอร์ · ตีสวนคิดระยะทางตามค่านี้ (แสดงในผลลัพธ์)\n• 🌍 \"ต่อขอบ\" เปลี่ยนเป็น 🌍 โลก กลม / แบน (ปกติ ±200 โลกกลม)\n• ปุ่มแชร์โปรไฟล์เป็นไอคอนสีขาวที่เห็นชัด · ปุ่มลบโปรไฟล์ 🗑️ อยู่ขวาสุด · โปรไฟล์ที่แชร์มีไอคอนแชร์ข้างชื่อ (หายเมื่อเลิกแชร์) · กรอบโปรไฟล์กว้างพอดีปุ่ม · ช่องชื่อโปรไฟล์ยาวตามชื่อ ได้ถึง 300px\n• แก้: เอาทุกคนออกจากการแชร์แล้วไอคอนแชร์ไม่หาย → ตอนนี้ถือว่าเลิกแชร์ให้เอง\n• แก้: โปรไฟล์ที่แชร์แบบดูอย่างเดียว กดเลือกเมืองอื่น สลับแท็บเส้นทาง/สรุป กรอง และเรียงได้แล้ว (แก้ข้อมูลยังไม่ได้) · ค่าในช่องที่ล็อกอ่านชัดเหมือนปกติ\n• ดูอย่างเดียว: หน้าต่างการไหลของแร่กดแก้ไข / รับแร่ / ส่งแร่ไม่ได้ · มีไอคอนตา (ข้างชื่อโปรไฟล์ แถบสถานะ และหน้าต่างแชร์) ให้รู้ทันทีว่าดูอย่างเดียว", "\n• 🗺️ Map size (±200/250/400) and wrap-around moved to the top bar beside the server speed · the counter-attack uses them for distances (shown in the result)\n• 🌍 \"Wrap-around\" is now 🌍 World: Round / Flat (default ±200, round)\n• Clearer white Share icon button · the delete-profile 🗑️ button sits at the far right · shared profiles show a share icon beside the name (gone once sharing stops) · the profile box is only as wide as its buttons · the profile name field grows with the name up to 300px\n• Fix: removing everyone from a share left the share icon on → this now stops sharing\n• Fix: in a view-only shared profile you can pick other towns, switch the routes/summary tabs, filter and sort again (editing stays blocked) · locked fields stay easy to read\n• View only: the resource-flow window can no longer edit / add routes · an eye icon (beside the profile name, in the status bar and the share window) shows it is view only"], ["1.63.1", "⚔️ ตีสวน: ลิงก์ ⚔️ ส่งทัพ ↗ ของแต่ละเมือง เปิดหน้าส่งทัพในเกมของหมู่บ้านนั้น (newdid) ไปที่พิกัดผู้ตี ใส่หน่วยช้าสุดที่เลือก 99999 + ฮีโร่ 1 เป็นการโจมตี · มีในตารางและในข้อความคัดลอก (เจ้าของหมู่บ้านกดได้เลย) · ต้องกดยืนยันในเกมเอง", ".1", "\n• ตีสวน: เวลาทัพสวนเข้าไฮไลต์ชัดขึ้น · ลิงก์ส่งทัพอยู่ขวาสุด · เมืองที่ข้อมูลไม่ครบ (ไม่มี ID หมู่บ้าน / ที่อยู่เซิร์ฟเวอร์) ไม่แสดงลิงก์", "\n• Counter-attack: the landing time stands out · the Send link sits at the far right · towns missing data (no village ID / server address) show no link"], ["1.62.9", "⚔️ ตีสวน: ใส่ไอเทมฮีโร่ได้ — ทัพที่มาตี: รองเท้า (เร็วขึ้นหลัง 20 ช่อง ทั้งขามาและขากลับ) + แผนที่มือซ้าย (เร็วขึ้นเฉพาะขากลับ) · ทัพที่จะสวน: รองเท้า · เซิร์ฟเวอร์ที่ติ๊ก 🔨 Item Crafting เลือก rarity ได้ (common/uncommon/rare/epic)", ".1-.9", "\n• ตีสวน: ใส่อาร์ติแฟกต์ความเร็วได้ทั้งผู้ตีและเมืองที่จะสวน (×1.5 / ×2 / ×3 และ Fool's ×0.67 / ×0.5 / ×0.33) · มีผลทั้งขาไปและขากลับ\n• ตีสวน: ค้นหาเมืองที่จะสวนจากแผนที่ได้ · ตารางกดปล่อยและข้อความคัดลอกบอกชื่อ ผู้เล่น พิกัดของเมืองเรา และเป้าหมาย (ชื่อ พิกัด ผู้เล่น พันธมิตร) ชัดเจน\n• 🗺️ แผนที่: พอดีจอและหน้าเว็บไม่เลื่อนลงจนแถบเมนูบังแผนที่ · ช่องค้นหาหาจากพิกัดได้ (บางส่วนก็ได้ เช่น -114 หรือ -114/5)\n• 🗺️ แผนที่: แถบสถานะ map.sql มุมล่างซ้ายกด ✕ ซ่อนได้ และซ่อนเองหลัง 6 วินาที (เหลือปุ่ม ⓘ กดดูใหม่) · ตอนโหลดไม่ได้หรือมีการเปลี่ยนแปลงในบัญชี จะไม่ซ่อนเอง\n• ตีสวน: แถบเลื่อน Tournament Square สั้นลง ตัวเลขอยู่ติดแถบและอ่านง่ายขึ้น\n• ตีสวน: ไอคอนอาร์ติแฟกต์เปลี่ยนเป็น 💎 (ไอคอนเดิมขึ้นเป็นกล่องเปล่าในบางเครื่อง)\n• ตีสวน: ปุ่ม 🗑️ ล้างข้อมูล แยกสำหรับทัพที่มาตี และเมืองที่จะตีสวน (ถามยืนยันก่อน)\n• ไอคอนที่บางเครื่องขึ้นเป็นกล่องเปล่า เปลี่ยนเป็นไอคอนที่แสดงได้ทุกเครื่อง (ปุ่มล้างข้อมูล 🗑️ · หน่วย Bowman ของ Huns)", "\n• Counter-attack: speed artefacts for the attacker and each counter-attacking town (×1.5 / ×2 / ×3 and Fool's ×0.67 / ×0.5 / ×0.33) · counts both ways\n• Counter-attack: find counter-attacking towns on the map · the send table and the copied text show our town name, player and coordinates and the target (name, coordinates, player, alliance)\n• 🗺️ Map: fits the screen and the page no longer scrolls down under the menu bar · search finds villages by coordinates (part of them works too, e.g. -114 or -114/5)\n• 🗺️ Map: the map.sql status in the bottom-left corner has ✕ to hide it and hides itself after 6 seconds (an ⓘ button brings it back) · it stays when loading fails or your account changed\n• Counter-attack: shorter Tournament Square sliders with the level shown right beside them\n• Counter-attack: the artefact icon is now 💎 (the old one showed as an empty box on some devices)\n• Counter-attack: separate 🗑️ Clear buttons for the incoming attack and the counter-attacking towns (asks first)\n• Icons that showed as empty boxes on some devices replaced (Clear button 🗑️ · Huns Bowman)"], ["1.61.4", "⚔️ ตีสวน: ค้นหาผู้ตีและเมืองที่โดนตีจากแผนที่ได้ — พิมพ์ชื่อพันธมิตร / ผู้เล่น / หมู่บ้าน / พิกัด แล้วเลือกจากรายการ (พิมพ์หลายคำได้ เช่น ชื่อพันธมิตร + ชื่อผู้เล่น) · เลือกผู้ตีจากแผนที่แล้วใส่เผ่าให้เอง · ยังใส่ X Y เองได้เหมือนเดิม", ".1-.4", "\n• พิกัดแสดงเป็น X/Y ทุกที่ (เดิม X|Y) · ช่องค้นหาพิมพ์ได้ทั้ง 23/43 และ 23|43\n• ตีสวน: ค้นหาด้วยพิกัดบางส่วนได้ เช่น -114 = หมู่บ้านที่ X หรือ Y เป็น -114 · -114/5 = X -114 และ Y ขึ้นต้นด้วย 5\n• ตีสวน: วันที่ + เวลาที่ทัพเข้า รวมเป็นช่องเดียว เลือกครั้งเดียว (วันที่ + เวลาที่เห็นการโจมตีก็เช่นกัน)\n• ตีสวน: เรียงใหม่ — 1. ทัพที่มาตี + การโจมตีนี้คาดว่าเป็น · 2. เมืองที่จะตีสวน + ตารางกดปล่อย", "\n• Coordinates are shown as X/Y everywhere (was X|Y) · search accepts both 23/43 and 23|43\n• Counter-attack: search by part of the coordinates, e.g. -114 = villages with X or Y of -114 · -114/5 = X -114 and Y starting with 5\n• Counter-attack: arrival date + time are one field, picked in one go (same for the time you saw it)\n• Counter-attack: new order: 1. incoming attack + its likely unit · 2. our counter-attacking towns + the send table"], ["1.60.3", "🚫 เอาส่วนรับข้อมูลจาก extension \"TRM Bridge\" ออกทั้งหมด (Travian แจ้งว่า extension และโปรแกรมที่อ่านหน้าเกมผิดกฎ อนุญาตเฉพาะคัดลอก-วาง) · 📋 ช่องวางข้อมูลรับซอร์สของหน้า (Ctrl+U) ได้ ทั้งหน้าทรัพยากรและหน้าเส้นทางการค้า ได้เส้นทางครบแม้ส่วนที่พับไว้ · วางช่องไหนก็ได้ · ไม่มีอะไรเปลี่ยน = ไม่บันทึก · ไม่ทับแผนเส้นทาง 🆕/✏️/🗑️ · หน้าโหมดผู้ดูแลไม่นำเข้า", ".1-.3", "\n• ตีสวน: ใส่วันที่ + เวลาเข้า (ชม:นาที:วินาที) · ผลลัพธ์บอกวันและเวลากดปล่อย (นาฬิกาเดียวกับในเกม ไม่ต้องตั้งเวลา) · ทัพสวนเข้าวินาทีเดียวกับทัพกลับได้ (ถ้าต้องปล่อยก่อนทัพเขาชน เลื่อนเป็น +1 วินาทีเอง)\n• ตีสวน: ใส่วันที่ + เวลาที่เห็นการโจมตี แล้วแอปเดา 5 อันดับว่าเป็นหน่วยอะไร ลานเท่าไร (กด \"ใช้\" เพื่อคำนวณด้วยตัวเลือกนั้น)\n• 🗺️ แผนที่: เวลาอัปเดต map.sql เผื่อทั้งช่วงเวลาฤดูร้อน/ฤดูหนาวของเซิร์ฟเวอร์ (โหลดใหม่หลัง 07:10 น.) · สำเนา GitHub บอกวันที่ของไฟล์ ถ้าสำเนาวันนี้ยังไม่มา แอปจะลองใหม่เองทุก 20 นาที แทนการค้างข้อมูลเมื่อวานทั้งวัน · เลื่อนแผงข้อมูลหมู่บ้าน/แผง ☰ จนสุดแล้วหน้าเว็บไม่เลื่อนตาม", "\n• Counter-attack: enter the arrival date + time (h:m:s) · the result gives the date and time to press send (game clock, no clock setting) · the counter may land in the same second as their return (moved +1 s by itself if it must be sent before their attack lands)\n• Counter-attack: enter the date + time you saw the attack and the app lists the 5 most likely unit + Tournament Square options (press \"Use\" to time the counter with one)\n• 🗺️ Map: the map.sql update time allows for the server’s summer/winter time (reloads after 07:10 Thailand) · the GitHub copy carries its date; if today’s copy is not there yet the app retries every 20 minutes instead of keeping yesterday’s data all day · scrolling the village info / ☰ panel to the end no longer scrolls the page"], ["1.59.0", "⚔️ เครื่องมือใหม่ \"ตีสวน\" (beta): ใส่ทัพที่มาตีกับเวลาเข้า แอปคำนวณเวลาที่ทัพเขากลับถึงบ้าน และเวลาที่แต่ละเมืองของเราต้องปล่อยทัพ (ตามหน่วยช้าสุดและ Tournament Square ทั้งสองฝั่ง) พร้อมนับถอยหลังและคัดลอกไปแชต", null], ["1.58.4", "🗺️ แผนที่: พิมพ์ชื่อพันธมิตรแล้วมีรายการแนะนำให้เลือก · เปลี่ยนสีพันธมิตรเองได้ (หมู่บ้านของเราใช้สีพันธมิตรเรา) · พื้นที่พันธมิตรสีสม่ำเสมอพร้อมเส้นขอบจางๆ · ขอบโลกเป็นเส้นประ", ".1-.4", "\n• อาณาเขตพันธมิตรคิดจากอิทธิพลรวมของหมู่บ้าน: รวมเป็นก้อนเดียวต่อพันธมิตร มีเส้นขอบ · ตรงที่ทับกัน ฝั่งที่หนาแน่นกว่าได้พื้นที่มากกว่า\n• ชื่อพันธมิตรวางตรงที่โล่งกว้างที่สุดของอาณาเขต ขนาดตามพื้นที่ ทับหมู่บ้านได้ ซูมเข้าแล้วค่อยๆ จางหาย · พื้นอาณาเขตบางลง (เข้มขึ้นเล็กน้อยตรงที่หนาแน่น) เส้นขอบจางลง\n• ปุ่มซ่อน/แสดงทั้งหมด · ซ่อนพันธมิตรเราได้ (หมู่บ้านของเราเองยังแสดงเสมอ) · ช่องว่างเล็กๆ ในอาณาเขตพันธมิตรเดียวกันเชื่อมเป็นพื้นที่เดียว", "\n• Alliance territory comes from the total influence of the villages: one area per alliance with a border · where two overlap the denser side gets more\n• Alliance names sit in the roomiest spot of the territory, sized to it, over the villages, and fade out while zooming in · lighter territory tint (slightly stronger where dense) and fainter borders\n• Hide all / show all button · our alliance can be hidden (our own villages stay visible) · small gaps inside one alliance's territory are joined"], ["1.57.1", "🗺️ สำเนา map.sql อัตโนมัติตามเซิร์ฟเวอร์ที่ผู้ใช้เลือก: ผู้ที่ล็อกอินจะลงชื่อเฉพาะชื่อเซิร์ฟเวอร์ (สัปดาห์ละครั้ง) ให้ GitHub ดึงให้ทุกวัน · ต้องอัปเดตกฎ Firestore และไฟล์ workflow ด้วย", ".1", "แก้: ข้อมูลจาก TRM Bridge ทับแผนเส้นทางที่ตั้งไว้ในแอป (🆕/✏️/🗑️) ระหว่างกำลังไปปรับในเกม · ตอนนี้คงแผนไว้ และติ๊กทำแล้วให้เองเมื่อเกมตรงกับแผน", "Fix: data from TRM Bridge overwrote route plans made in the app (🆕/✏️/🗑️) while you were adjusting them in the game · plans now stay and are marked done by themselves when the game matches"], ["1.56.0", "🗺️ แผนที่: ตั้งค่า แผนที่ต่อขอบ ใช่/ไม่ และขนาด ±200/±250/±400 (เทียบกับ map.sql) · เวลาทหารเลือกฝั่งเขา/ฝั่งเรา พร้อม Tournament Square 0–20 · ดึง map.sql ไม่ได้: ลองสำเนาที่ GitHub แล้วให้ดาวน์โหลด/เลือก/ลากไฟล์ได้ในหน้าแผนที่ · map.sql จากหน้าดึงเมืองใช้กับแผนที่ด้วย", null], ["1.55.1", "🗺️ แผนที่จาก map.sql ในเมนู \"เครื่องมือ\" (เดิมชื่อ วางแผน): ซูม/เลื่อน เต็มจอ ไอคอนหมู่บ้านและเมืองหลวง พันธมิตรและพื้นที่ ค้นหา ข้อมูลหมู่บ้าน เวลาเดินทางพ่อค้าตามเผ่าและหน่วยทหาร · เครื่องหมายของฉัน (ทหารตี / ทหารเรน / สอดแนม) · map.sql อัปเดตเองวันละครั้งหลัง 07:05 น. · แจ้งหมู่บ้านใหม่/หายไป/เผ่าไม่ตรง ให้เลือกเอง", ".1", "ป้าย \"beta\" ที่เมนูแผนที่ หัวข้อ แถบสถานะ และคู่มือ", "\"beta\" label on the map menu item, title, status bar and manual"], ["1.54.2", "🔌 TRM Bridge 1.1: เลือกในเมนูของ extension ว่าเซิร์ฟเวอร์ Travian ไหนใส่โปรไฟล์อะไร (ยังไม่เลือก = เก็บรอไว้) · ไม่อ่านข้อมูลตอนเป็นผู้ดูแล (sitter) · หมู่บ้านใหม่ได้เผ่าตามบัญชี", ".1-.2", "\n• ข้อมูลจาก TRM Bridge ที่เหมือนเดิม: ไม่บันทึก ไม่แจ้ง · ซิงค์ไม่เขียนขึ้นคลาวด์ถ้าเนื้อหาเหมือนตอนซิงค์ล่าสุด (ประหยัดโควตา)\n• ข้อความแจ้งมุมจอเล็กลง ปิดเองเร็วขึ้น (8 วิ) มีปุ่ม ✕ และหายเมื่อเลื่อนหน้า ไม่บังข้อมูล", "\n• Unchanged data from TRM Bridge is not saved or announced · sync does not write to the cloud when the content equals the last sync (saves quota)\n• Corner messages are smaller, close sooner (8 s), have an ✕ button and disappear when you scroll, so they no longer cover the data"], ["1.53.0", "🔌 รับข้อมูลจาก Chrome extension \"TRM Bridge\": การผลิตต่อชั่วโมง (หน้าทรัพยากร) และเส้นทางการค้าทั้งหมดรวมส่วนที่พับไว้ เข้าแอปอัตโนมัติ · จับคู่หมู่บ้านด้วยรหัสเกมหรือพิกัด · หมู่บ้านใหม่ถามก่อนเพิ่ม · มีปุ่มเลิกทำ", null], ["1.52.3", "📱 ปรับให้ใช้ได้กับมือถือและแท็บเล็ต (ส่วนหัวย่อได้ เมนูแบบกดเลือก รายชื่อเมืองพับได้ ตารางกว้างแสดงเป็นการ์ด) โดยจอคอมเหมือนเดิม · เอากล่อง \"ภาพรวมทุกเซิร์ฟเวอร์\" ที่เอาหลายเวิลด์มารวมกันออก แต่ละหน้าแสดงเฉพาะเซิร์ฟเวอร์ที่ใช้อยู่", ".1-.3", "\n• ตารางกว้างบนมือถือแสดงเป็นการ์ด (ชื่อคอลัมน์กำกับค่าแต่ละช่อง) ไม่ต้องเลื่อนซ้าย-ขวา · มุมมองเมืองทหารเรียงตัวเลข 4 ชนิดแร่ต่อแถว · ตารางอัปเกรดเกราะซ่อนคอลัมน์รวมบนมือถือ\n• มือถือ: ป้ายกำกับในการ์ดมีไอคอนโคลนเหมือนหัวตาราง · กันรูดหน้าลงสุดแล้วเบราว์เซอร์รีเฟรชหน้าเอง\n• มือถือ: ส่วนหัวย่อได้ (ปิดไว้แสดงแค่ชื่อแอป ชื่อเวิลด์ ปุ่ม Google · กด ⚙️ เพื่อเปิดตัวเลือก)\n• มือถือ: เลื่อนลงสุดแล้วไม่กระตุก (ไม่จัดการ์ดใหม่ตอนแถบที่อยู่โผล่) · ขนาดตัวอักษร/ช่องไฟกะทัดรัดขึ้น ปุ่มยังสูงอย่างน้อย 32–34px · เมนูหลักแบบกด \"☰ เมนู\" แล้วเลือกจากไอคอน + ชื่อหน้า", "\n• Wide tables on phones are shown as cards (the column name labels each value), no sideways scrolling · the military-town view lists 4 resources per row · the armor-upgrade table hides its total columns on phones\n• Phones: the card labels show the clay icon like the table headers · swiping down at the top of the page no longer makes the browser reload it\n• Phones: the header folds (closed it shows only the app name, the world name and the Google button, press ⚙️ for the options)\n• Phones: no more jerk at the bottom of the page (cards are not rebuilt when the address bar shows) · more compact text and spacing, buttons stay at least 32–34px tall · main menu: tap \"☰ Menu\" and pick from the icon + name list"], ["1.51.1", "☁️ ล็อกอิน Google (เมนูโปรไฟล์มุมขวาบน) + ซิงค์ข้อมูลขึ้นคลาวด์อัตโนมัติ ใช้ได้ทุกเครื่อง · ถามเมื่อข้อมูลชนกัน ไม่เขียนทับเงียบๆ · สำรองก่อนทับและกู้ข้อมูลก่อนหน้าได้ · ไม่ล็อกอินก็ใช้ได้เหมือนเดิม", ".1-.3", "\n• \n• ระบบล็อกอิน: ต้องตั้งค่าโปรเจกต์ Firebase ของตัวเองก่อนจึงจะแสดงปุ่มเข้าสู่ระบบ\n• ตั้งค่าโปรเจกต์ Firebase ของระบบนี้แล้ว (ปุ่มเข้าสู่ระบบแสดงที่มุมขวาบน)\n• ซิงค์: แก้บั๊กข้อมูลที่เพิ่งแก้ถูกทับด้วยฉบับเก่า (แก้ก่อนล็อกอินกู้เสร็จ / เปิดหลายแท็บ) — ตรวจการเปลี่ยนแปลงจากเนื้อหาจริง ถ้ามีงานค้างจะถามก่อนเสมอ · แท็บของเบราว์เซอร์เดียวกันซิงค์ข้อมูลกันเอง · หลังดึงข้อมูลจากอีกเครื่องมีปุ่มเลิกทำ", "\n• \n• Sign-in: the button only appears once your own Firebase project is configured\n• This app's Firebase project is configured (the Sign in button shows at the top right)\n• Sync: fixed fresh edits being overwritten by an older copy (editing before the sign-in is restored / several tabs) — pending changes are now detected from the real content and the app always asks first · tabs of the same browser keep each other up to date · an Undo button after data is pulled from another device"], ["1.50.1", "➗ หน้าคำนวณแร่: ซ่อนส่วนที่ไม่ได้ใช้ ผู้ใช้คลิกเลือกเปิดเองจากแถบด้านบน · สรุปการผลิตทหาร: ตารางล่างเพิ่มคอลัมน์ \"เพิ่มอัตรากินข้าว/วัน\" · ข้อมูล Celebration ไม่มีช่องกรอกแล้ว · เอาป้าย \"ตรวจกับ kirilloid แล้ว\" ออก", ".1", "หน้าคำนวณแร่: ส่วนที่มีรายการก็ซ่อนได้ — ซ่อนแล้วไม่นับในสรุป ข้อมูลยังอยู่ เปิดกลับมาเห็นเหมือนเดิม (มีตัวเลขจำนวนรายการบนปุ่มและบรรทัดเตือนส่วนที่ซ่อน)", "Calculator: sections that hold items can be hidden too — hidden means not counted in the summary, the data is kept and is back when you show it again (item count on the buttons and a warning line for hidden sections)"], ["1.49.4", "🛡️ อัปเกรดเกราะ/วิจัยครบทุกเผ่า: ถอดสูตรจากข้อมูล Romans (ตรง kirilloid ทุกค่า 835 ค่า) คำนวณจากต้นทุนฝึก ข้าวที่กิน เวลาฝึก · หน่วยตั้งต้นไม่ต้องวิจัย · ตัวยึดมีแต่วิจัย · ผู้ตั้งถิ่นฐานไม่มีทั้งสอง · ตรวจกับ kirilloid แล้ว 30 หน่วยจากทั้ง 7 เผ่า", ".1-.4", "\n• ตัวยึดครบทุกเผ่า (สูตรตรง Senator / Ephor / Jarl) · แถววิจัยเขียนว่า \"ไม่ต้องวิจัย\" สำหรับหน่วยตั้งต้นและผู้ตั้งถิ่นฐาน\n• เวลาอัปเกรดตาม Smithy Lv ตรง kirilloid ที่ Smithy Lv 20 ครบ 20 เลเวล (ปัดเศษครั้งเดียวท้ายสุด) · เวลาวิจัยไม่ขึ้นกับ Smithy Lv · ตรวจเพิ่ม Vikings Ram, Egyptians Ash Warden, Nomarch รวม 30 หน่วย\n• เวลาอัปเกรด/วิจัยตามความเร็วเซิร์ฟเวอร์: ค่า 1800 วินาทีคงที่ ไม่หารด้วย x (ตรง kirilloid ที่ x1/x2/x3 และ Smithy Lv 1/10/20) · เวลาวิจัยไม่ขึ้นกับ Smithy Lv และ Academy Lv · เอาข้อความ \"≈ คำนวณจากสูตร\" ออก\n• ปรับปรุงภายในระบบ", "\n• chief units for every tribe (formula matches Senator / Ephor / Jarl) · the research row says \"No research needed\" for the starting unit and settlers\n• upgrade times by Smithy Lv now match kirilloid at Smithy Lv 20 on all 20 levels (rounded once at the end) · research time does not depend on the Smithy Lv · also checked Vikings Ram, Egyptians Ash Warden and Nomarch, 30 units in total\n• upgrade/research times by server speed: the 1800 seconds are constant, not divided by x (matches kirilloid at x1/x2/x3 and Smithy Lv 1/10/20) · research time does not depend on the Smithy Lv or the Academy Lv · removed the \"≈ calculated by the formula\" note\n• Internal improvements"], ["1.48.2", "🛡️ อัปเกรดเกราะ (Smithy) เลเวล 1-20 + วิจัยหน่วย (Academy): คลิกที่หน่วยในข้อมูลทหารเพื่อดูตารางต้นทุน/เวลา · ส่วนใหม่ในหน้าคำนวณแร่ (ต่อจากสิ่งก่อสร้าง) เข้าตารางสรุป · มีข้อมูล Romans Praetorian (ตรวจกับ kirilloid ครบ 20 เลเวล) หน่วยอื่นเพิ่มเมื่อส่งภาพมา", ".1-.2", "\n• เอาช่องกรอกในตารางอัปเกรดเกราะ/วิจัยออก · ป้ายแถวเป็น \"🛡️ อัปเกรดเกราะ Lv N\"\n• ตารางข้อมูลทหาร: เอาช่องกรอกต้นทุนและเวลาฝึกออก เหลือเป็นตัวเลข · ป้าย \"Smithy Lv (building)\" · Smithy Lv เริ่มต้นที่ 20", "\n• removed the input fields from the armor upgrade/research table · row labels read \"🛡️ Armor upgrade Lv N\"\n• Troop data table: removed the cost and training-time input boxes (plain numbers now) · label \"Smithy Lv (building)\" · Smithy Lv now defaults to 20"], ["1.47.0", "แก้บั๊ก: แผนสร้างเมืองหายเมื่อปิดแล้วเปิดหน้าเว็บใหม่ (ข้อมูลแผนถูกบันทึกไว้แต่ไม่ถูกโหลดกลับ)", null], ["1.46.4", "สรุปทุกเมือง: แท็บมุมขวาบน ⛏️ แร่ / ⚔️ ทหาร · แท็บทหาร = สรุปการผลิตทหารต่อวัน แต่ละเมืองผลิตหน่วยอะไรกี่ตัว พร้อมผลรวมรายเมือง รวมทุกเมืองแยกตามหน่วย และรวมทุกหน่วย", ".1-.4", "\n• ทหาร: เอาการ์ด 3 ใบด้านบนออก · เพิ่มข้าวกินเพิ่ม/ชม.\n• ทหาร: ตารางบนเพิ่ม Def/day (ราบ/ม้า/รวม) และแถวรวมทั้งบัญชี · ตารางล่างแยกแท็บ ⚔️ พลังตี (รายหมู่บ้าน) / 🛡️ พลังป้องกัน (รวมทั้งบัญชี) · นับเฉพาะหน่วยที่กำหนด (Ram/Catapult ทุกเผ่านับเป็นตี)\n• ทหาร: ตารางบนเพิ่มคอลัมน์ ⚔️ Atk/day (หน้า Def/day ราบ) รายหมู่บ้าน เฉพาะหน่วยที่นับเป็นตี\n• ทหาร: ตารางบนเว้นช่องว่างแทน – และ 0 · แถวล่างสุดเป็น \"รวมพลังป้องกัน ทั้งบัญชี\"", "\n• Troops: removed the 3 cards at the top · added extra crop upkeep/h\n• Troops: the top table gets Def/day (infantry/cavalry/total) and a whole-account row · the bottom table is split into tabs ⚔️ Attack (per village) / 🛡️ Defense (whole account) · only the listed units count (Rams/Catapults of every tribe count as attack)\n• Troops: the top table gets an ⚔️ Atk/day column (before Def/day inf.) per village, only units counted as attack\n• Troops: the top table leaves empty cells instead of – and 0 · the last row reads \"Total defense — whole account\""], ["1.45.5", "ฟอร์มส่งแร่: แสดงผลลัพธ์ทันทีที่พิมพ์จำนวนแร่ — เมืองต้นทางตอนนี้/หลังส่งเหลือหรือขาดเท่าไร เมืองปลายทางตอนนี้/หลังรับ พร้อมเตือนเมืองที่ขาดแร่", ".1-.5", "\n• ⚔️ เมืองทหาร: คลิกแถวเมืองหรือหัวการ์ดเปิดหน้าต่างการไหลของแร่เหมือนโหมดทุกเมือง (เอาแผงรายละเอียดในหน้าและปุ่มรายละเอียดออก) · เมืองแร่ที่ยังไม่ได้ส่งให้เมืองทหารรวมเป็นการ์ดกลุ่มเดียว มียอดรวมและกาง/หุบได้\n• ⚔️ เมืองทหาร: กาง/หุบด้วยลูกศรทางซ้ายของหัวการ์ด · ย่อชื่อกลุ่มเมืองแร่ให้ข้อความไม่ตก\n• ⚔️ เมืองทหาร: จำสถานะกาง/หุบของการ์ด ปิดแล้วเปิดใหม่ไม่รีเซ็ต (บันทึกต่อเซิร์ฟเวอร์ และอยู่ในไฟล์ Save)\n• จัดการเมือง: รายชื่อเมืองด้านซ้ายแสดงไอคอน 🎉 กำลังจัด Celebration และ ⚔️ กำลังฝึกทหาร (ชี้เมาส์ดูรายละเอียด · อัปเดตทันที)\n• ⚔️ เมืองทหาร: หัวการ์ดเมืองทหารมีพิกัด · แถวเมืองแร่ที่ส่งแร่ให้มีไอคอน 🎉 / ⚔️", "\n• ⚔️ Military towns: clicking a town row or card header opens the resource-flow window like the All towns view (inline detail panels and the Details button are gone) · resource towns not supplying a military town form one group card with a total, expandable/collapsible\n• ⚔️ Military towns: expand/collapse with the arrow at the left of the card header · shortened the resource-town group title so the text no longer drops\n• ⚔️ Military towns: remembers each card's expanded/collapsed state, no reset after reopening (per server, also in the Save file)\n• Manage towns: the left town list shows 🎉 (holding a Celebration) and ⚔️ (training troops) icons (hover for details · updated live)\n• ⚔️ Military towns: the military-town card header shows coordinates · the supplying resource-town rows show the 🎉 / ⚔️ icons"], ["1.44.10", "คำนวณแร่: ลบแถวทหารได้จนหมด (ไม่มีแถวว่างเด้งกลับมา) · เพิ่มส่วนฉลอง Celebration เล็ก/ใหญ่ × จำนวนครั้ง · เพิ่มส่วนค่าใช้จ่ายอื่นๆ (รายละเอียด · ไม้ โคลน เหล็ก ข้าว · จำนวน) · แร่ที่มีอยู่เพิ่มได้หลายรายการ พร้อมช่องรายละเอียด · สรุปรวมทุกส่วนในตารางเดียว", ".1-.10", "\n• คำนวณแร่: แยกส่วนค่าใช้จ่าย (ขีดแดงที่ขอบซ้าย) กับแร่ที่มีอยู่ (ขีดเขียวที่ขอบซ้าย) พื้นกล่องเป็นสีปกติ · แถวรวมแต่ละส่วนแดงอ่อน รวมทั้งหมดแดงเข้ม · แร่ที่มีอยู่แจกแจงทีละรายการแล้วรวม (เขียวอ่อน)\n• ทุกหน้า: คำอธิบายเล็กๆ เปลี่ยนเป็นไอคอน (?) แสดงเมื่อชี้/แตะ · คำนวณแร่: ย้ายปุ่ม ＋ เพิ่ม / ♻️ ล้าง ไปมุมขวาบนของแต่ละส่วน และเอาแถบหัวกลุ่มออก\n• สรุปทุกเมือง: เลือกเรียงตาม ลำดับที่จัดไว้ / ชื่อ / ขาดแร่ก่อน (ทั้งตารางภาพรวมและมุมมองเมืองทหาร) · ลำดับที่จัดไว้ = ตามรายชื่อเมืองด้านซ้าย (โฟลเดอร์ก่อน ไม่จัดกลุ่มไว้หลังสุด) ใช้กับหน้าสรุป เส้นทางขนส่ง และช่องเลือกเมือง\n• สรุปทุกเมือง: สีโฟลเดอร์เป็นเส้นสีบางๆ ทางซ้ายของแถว แทนจุดสีใหญ่ (ไม่กินพื้นที่)\n• สรุปทุกเมือง: ชี้เมาส์ที่ ⚔️ เพื่อดูว่าฝึกกี่หน่วย หน่วยอะไรบ้าง (อาคาร · ตัว/ชม.)\n• ⚔️ เมืองทหาร: เอาขอบการ์ดสีแดง/เขียว/เทา และสีของแถบสรุปล่างสุดออก เหลือเครื่องหมาย ⚠ ✓ ⛏️ กับเส้นสีโฟลเดอร์\n• จัดการเส้นทางขนส่ง: สีโฟลเดอร์เป็นเส้นบางๆ ทางซ้ายของแถว แทนจุดสีที่เกะกะ\n• จัดการเมือง: รายการเลือกเผ่าที่กางออกเป็นพื้นสีอ่อน ไม่แสบตา (ช่องที่เลือกยังสีตามตราเผ่า)", "\n• Calculator: expense sections (red left stripe) and resources on hand (green left stripe) are visually separated, box background unchanged · section subtotals light red, grand total darker red · resources on hand listed per entry, then totalled (light green)\n• All pages: small explanations are now (?) icons shown on hover/tap · Calculator: ＋ Add / ♻️ Clear buttons moved to the top right of each section and the group bars removed\n• All towns: sort by Custom order / Name / Short first (both the overview table and the military view) · Custom order = the left list's order (folders first, no-folder last), also used on the Routes page and in town selects\n• All towns: folder color is a thin colored line at the left of the row instead of the big dot (takes no space)\n• All towns: hover ⚔️ to see how many unit types are training and which ones (building · units/h)\n• ⚔️ Military towns: removed the red/green/gray card edges and the colors of the bottom summary bar, leaving the ⚠ ✓ ⛏️ marks and the folder color line\n• Manage routes: folder color is a thin line at the left of the row instead of the cluttering dots\n• Manage towns: the opened tribe list uses soft tinted backgrounds instead of glaring solid colors (the selected value keeps the tribe color)"], ["1.43.19", "⚔️ เมืองทหาร: แยกคอลัมน์ \"แร่ที่ส่งให้\" ต่อชนิด ข้างตัวเลขเหลือ/ขาด แถวบางลง · มีรายการเมืองแร่ที่ยังไม่ได้ส่งให้เมืองทหารไว้ท้ายหน้า · รายชื่อเมือง: จัดเรียงเอง ลากวาง/▲▼ และโฟลเดอร์ 1 ชั้น ใส่สีได้ · Save/Load ตรวจชื่อโปรไฟล์ซ้ำ ให้เลือกทับข้อมูลหรือสร้างโปรไฟล์ใหม่ ชื่อใหม่สร้างโปรไฟล์ให้เอง", ".1-.19", "\n• ⚔️ เมืองทหาร: แก้ช่องว่างหัวการ์ด · ปุ่มกาง/หุบเป็นไอคอน · แถวเมืองทหารแสดงแร่ที่ต้องการใช้ (หักการผลิตเองแล้ว) · เลขสีฟ้า = ผลิตเองพอ · ปุ่มสลับคอลัมน์ซ้ายเป็น \"ผลิตในเมือง\" · สรุปกลุ่มอยู่ล่างสุด · หัวตารางเหมือนตารางภาพรวมและตรงกับตัวเลข\n• จัดการเมือง: แถบซ้ายกว้างขึ้น 10% เนื้อหาอยู่ตรงกลางเหมือนหน้าอื่น · แก้หัวโฟลเดอร์ที่ทับกัน\n• คำนวณแร่: ปุ่มลบแถวไม่ตกบรรทัด · หน้ากว้างขึ้นเล็กน้อย\n• ข้อมูลทหาร: ตารางแคบลง ตัวเลขตรงหัวคอลัมน์\n• ข้อมูล Celebration: ตารางกระชับ อยู่กลางหน้า จัดเวลา Lv 1–10 / 11–20 เป็นสองฝั่ง\n• คู่มือครบทุกหัวข้อ (แผนสร้างเมืองกลับมา) · ปุ่มกาง/พับเป็นไอคอน · Change Log จัดแบบรุ่นหลัก + สรุปรุ่นย่อย\n• หัวเว็บ: จัด 2 แถว โปรไฟล์/ตั้งค่าเซิร์ฟเวอร์ชิดซ้ายถัดจากชื่อแอป · Save/Load/ล้าง และ TH/EN/ธีมชิดขวา ย่ออุปกรณ์ให้ความสูงเท่าเดิม\n• จัดการเมือง: ป้ายเมืองทหารเป็นสีแดง · ช่องเลือกเผ่ามีสีตามตราเผ่าในรายชื่อเมือง", "\n• ⚔️ Military towns: fixed the card header gap · expand/collapse icons · military-town rows show the resources needed (minus own production) · blue = self-sufficient · switch the left columns to \"Own production\" · group summary at the bottom · table header styled like the overview table and aligned with the numbers\n• Manage towns: left bar 10% wider, content centered like other pages · fixed the overlapping folder header\n• Calculator: delete-row button stays on its line · slightly wider page\n• Troop data: narrower table, values aligned under headers\n• Celebration data: compact centered tables, times for Lv 1–10 / 11–20 side by side\n• Manual complete (Build plans section is back) · expand/collapse as icons · Change Log lists main releases + a summary of minor updates\n• Header: two rows, profile/server settings flush left next to the app name · Save/Load/Clear and TH/EN/theme flush right, controls shrunk so the header height is unchanged\n• Manage towns: military-town badge is red · the tribe select uses the tribe-badge color from the town list"], ["1.42.0", "การฝึกทหาร: ติ๊กอาคารครั้งแรกตั้งที่ Lv20 ให้ และเอาเลเวล 0 ออก (1–20) · ⚔️ เมืองทหาร: แบ่งเป็นกลุ่ม ⚠ ขาดแร่ / ✓ ไม่ขาดแร่ แต่ละเมืองเป็นการ์ดแยกชัดเจน กาง/หุบรายชื่อเมืองที่ส่งแร่ให้ได้", null], ["1.41.1", "ข้อมูลทหาร: ใส่ Chief/Settler ครบทุกเผ่า (Teutons Gauls Egyptians Huns Vikings Spartans จาก kirilloid) · ตารางข้อมูลทหารขยายเต็มจอ ไม่ต้อง scroll · แก้ป้ายโคลนที่ขึ้นบรรทัดใหม่ และจัดปุ่มลบให้ตรงช่องกรอก · สรุปทุกเมือง เพิ่มมุมมอง ⚔️ เมืองทหาร (ใครซับแร่)", ".1", "มุมมอง ⚔️ เมืองทหาร: ย่อให้อ่านง่าย แสดงเหลือ/ขาดสุทธิของเมืองทหารและเมืองที่ส่งแร่ให้ · คลิกแถวเพื่อดูรายละเอียด", "⚔️ Military towns view made compact: net surplus/shortage of each military town and its supplying towns · click a row for details"], ["1.40.0", "เมนูเมือง/วางแผนแสดงเสมอ ย่อเฉพาะกลุ่มข้อมูล · หน้าใหม่ 🚚 จัดการเส้นทางขนส่ง · ส่งแร่เลือกปลายทาง เมืองของเรา / WW / อาติแฟค แล้วใส่พิกัดได้ทันที (ไ   ['h-formula',L('📏 สูตรที่ใช้','📏 Formulas'),L(`
    <ul>
      <li><b>เวลาฝึก</b> = เวลา(x1, Lv1) × 0.9^(Lv−1) ÷ x × (1−หมวก) × อาติแฟค × (1−กิลด์) × (1−1%×Horse Drinking Trough)</li>
      <li><b>เวลาสร้าง</b> = เวลา(x1, MB1) × 0.964^(MB−1) ÷ x (ปัดหลัก 10 วินาที, คลาดได้ ±10 วิ)</li>
      <li><b>ค่าสถานะที่ upgrade lvl</b> = ฐาน + (ฐาน + 298/7 × ข้าวที่กิน) × (1.007^Lv − 1)</li>
      <li><b>วิจัย (Academy)</b> ต่อแร่ = α × ต้นทุนฝึก + K (α = 6/4/8/6 ไม้/โคลน/เหล็ก/ข้าว · K = 100/100/200/160) · เวลา = 1800 + 3 × เวลาฝึก (ที่ความเร็วเซิร์ฟเวอร์นั้น วินาที · ค่า 1800 ไม่หารด้วยความเร็ว · ไม่ขึ้นกับ Smithy Lv และ Academy Lv) · หน่วยตั้งต้นไม่ต้องวิจัย · <b>ตัวยึด</b> (มีแต่วิจัย): แร่ = 0.5/0.5/0.8/0.6 × ต้นทุนฝึก + 500/200/400/160 · เวลา = 1800 + เวลาฝึก ÷ 4 (เวลาฝึกที่ความเร็วนั้น) (ตรง Senator, Ephor, Jarl) · ค่าอาจลงท้าย .5</li>
      <li><b>อัปเกรดเกราะ (Smithy) Lv 1</b> ต่อแร่ = (7 × ต้นทุนฝึก + K) ÷ ข้าวที่กิน · เวลา = 1800 + 3 × เวลาฝึก · <b>เลเวล L</b> = ค่า Lv 1 (ไม่ปัด) × L^0.8 แล้วปัดแร่เป็น 5 และเวลาเป็นวินาที · เวลาจริง = ปัดครั้งเดียว: (1800 + 3 × เวลาฝึกที่ x) × L^0.8 × 0.964^(Smithy Lv−1) (ตรง kirilloid ที่ x1/x2/x3 และ Smithy Lv 1/10/20) · สูตรตรงกับ kirilloid ทุกค่า: Romans ครบ 8 หน่วย (835 ค่า) และอีก 21 หน่วยจาก Teutons Gauls Egyptians Huns Spartans Vikings (วิจัย + เลเวล 1, 2, 10, 20 + ตัวยึด) รวมถึงเวลาที่ Smithy Lv 20 ครบ 20 เลเวล</li>
      <li><b>Celebration/ชม.</b> = ต้นทุน ÷ เวลางาน · <b>เส้นทางการค้า/ชม.</b> = Σ(แร่ × ครั้ง) ต่อวัน ÷ 24</li>
      <li>แร่ที่ใช้ปัดขึ้น · จำนวนทหารปัดลง</li>
    </ul>`,`
    <ul>
      <li><b>Training time</b> = time(x1, Lv1) × 0.9^(Lv−1) ÷ x × (1−helmet) × artifact × (1−guild) × (1−1%×Horse Drinking Trough)</li>
      <li><b>Building time</b> = time(x1, MB1) × 0.964^(MB−1) ÷ x (rounded to 10 s, may differ ±10 s)</li>
      <li><b>Stats at the upgrade lvl</b> = base + (base + 298/7 × upkeep) × (1.007^Lv − 1)</li>
      <li><b>Research (Academy)</b> per resource = α × training cost + K (α = 6/4/8/6 lumber/clay/iron/crop · K = 100/100/200/160) · time = 1800 + 3 × training time (at that server speed, in seconds · the 1800 is not divided by the speed · independent of the Smithy Lv and the Academy Lv) · the starting unit needs no research · <b>chief units</b> (research only): resources = 0.5/0.5/0.8/0.6 × training cost + 500/200/400/160 · time = 1800 + training time ÷ 4 (matches Senator, Ephor, Jarl) · values may end in .5</li>
      <li><b>Armor upgrade (Smithy) Lv 1</b> per resource = (7 × training cost + K) ÷ upkeep · time = 1800 + 3 × training time · <b>level L</b> = the unrounded Lv 1 value × L^0.8, then resources rounded to 5 and time to seconds · real time = rounded once: (1800 + 3 × training time at x) × L^0.8 × 0.964^(Smithy Lv−1) (matches kirilloid at x1/x2/x3 and Smithy Lv 1/10/20) · the formulas match kirilloid on every value checked: all 8 Romans units (835 values) plus 21 units from Teutons, Gauls, Egyptians, Huns, Spartans and Vikings (research + levels 1, 2, 10, 20 + chiefs), and the times at Smithy Lv 20 on all 20 levels</li>
      <li><b>Celebration/h</b> = cost ÷ duration · <b>Trade route/h</b> = Σ(resources × times) per day ÷ 24</li>
      <li>Resources used are rounded up · troop counts rounded down</li>
    </ul>`)],

function dupTown(id){const t=T(id==null?cur:id);if(!t)return;const n=JSON.parse(JSON.stringify(t));n.id=S.nextId++;n.name=t.name+' (สำเนา)';n.exports=[];S.towns.splice(S.towns.indexOf(t)+1,0,n);cur=n.id;view='town';renderAll();autosave();}
function clearTown(id){
  const t=T(id==null?cur:id);if(!t)return;
  dlg('ล้างข้อมูลของ "'+t.name+'" ?\nจะรีเซ็ตการผลิต เส้นทางส่งออก Celebration อาคารฝึกทหาร และโบนัสของเมืองนี้ให้เป็นค่าเริ่มต้น\nชื่อ ประเภท และเผ่าของเมืองยังอยู่ · เส้นทางที่เมืองอื่นส่งมาที่เมืองนี้ไม่ถูกลบ\nกู้คืนไม่ได้ (ยกเว้นโหลดจากไฟล์ Save)',()=>{
    const f=newTown(t.type);
    Object.assign(t,{prod:[0,0,0,0],exports:[],th:1,celeb:'none',horse:0,helmI:'',helmC:'',art:100,bld:f.bld});
    window._pasteMsg='';renderAll();autosave();
  },'ล้างข้อมูล',true);
}
function delTown(id){
  const t=T(id==null?cur:id);if(!t)return;
  dlg('ลบ "'+t.name+'" ?\nเส้นทางส่งออกที่ชี้มาเมืองนี้จะถูกลบด้วย และกู้คืนไม่ได้ (ยกเว้นโหลดจากไฟล์ Save)',()=>{
    const tid=t.id;
    S.towns=S.towns.filter(x=>x.id!==tid);
    S.towns.forEach(o=>o.exports=o.exports.filter(e=>e.to!==tid));
    if(cur===tid)cur=S.towns.length?S.towns[0].id:null;
    renderAll();autosave();
  },'ลบเมือง',true);

function addExp(){const t=T(cur);const o=S.towns.find(x=>x.id!==cur&&!t.exports.some(e=>e.to===x.id))||S.towns.find(x=>x.id!==cur);
  if(o)newRoute(t,o.id,[0,0,0,0]);else newRoute(t,extAdd('ww','',null).id,[0,0,0,0]); // มีเมืองเดียว: เริ่มที่ WW (ใส่พิกัดต่อ)

function moveExp(i,newTo){const t=T(cur),e=t.exports[i];pendDel(t,e);t.exports.splice(i,1);
  const r=isArt(newTo)?[0,0,0,e.r[3]]:e.r.slice();newRoute(t,newTo,r);t.exports.splice(i,0,t.exports.pop());extGc();renderAll();autosave();}
function setExpDK(i,kind){const t=T(cur),e=t.exports[i];if(!e)return;const d=D(e.to)||{};
  if(kind==='own'){if(e.to>0)return;const o=S.towns.find(x=>x.id!==cur&&!t.exports.some(z=>z.to===x.id))||S.towns.find(x=>x.id!==cur);if(!o){dlg('ต้องมีเมืองอื่นอย่างน้อย 1 เมืองถึงจะเลือกเมืองของเราได้');renderAll();return;}moveExp(i,o.id);return;}
  if(e.to<0&&d.kind===kind)return;
  moveExp(i,extAdd(kind,'',null).id);}
function setExpXY(i){const t=T(cur),e=t.exports[i];if(!e||e.to>=0)return;const d=D(e.to);
  const xs=document.getElementById('exx-'+i).value.trim(),ys=document.getElementById('exy-'+i).value.trim();
  if(xs===''||ys===''||isNaN(+xs)||isNaN(+ys))return; // รอให้กรอกครบทั้ง X และ Y
  const x=Math.round(+xs),y=Math.round(+ys),other=extFind(d.kind,x,y);
  if(other&&other.id!==d.id){moveExp(i,other.id);return;}
  const users=S.towns.reduce((a,o)=>a+o.exports.filter(z=>z.to===d.id).length,0);
  if(users<=1){const auto=d.name===extAutoName(d.kind,d.x,d.y)||/^(WW|Artifact|อาติแฟค) ?\d*$/.test(d.name);d.x=x;d.y=y;if(auto)d.name=extAutoName(d.kind,x,y);update();autosave();}
  else moveExp(i,extEnsure(d.kind,x,y,''));}
function setExp(i,k,v){const t=T(cur),e=t.exports[i];
  if(k==='to'){moveExp(i,+v);return;}
  const before=e.r.slice();e.r[k]=+v||0;pendMark(e,before);update();autosave();
  const row=document.getElementById('exrow-'+i);if(row){row.className='grid exrow'+(e.pend?' pend':'');const b=row.querySelector('.pbx');if(b)b.innerHTML=pBadge(e)+(e.pend?` <button onclick="syncRoute(${t.id},${i})">✓ ตั้งในเกมแล้ว</button>`:'');}}
function delExp(i){const t=T(cur);const old=t.exports.splice(i,1)[0];if(old)pendDel(t,old);extGc();renderAll();autosave();}

function toggleFolder(fid){const f=(S.folders||[]).find(x=>x.id===fid);if(!f)return;f.closed=!f.closed;renderList();autosave();}
function setTownFolder(id,fid){const t=T(id);if(!t)return;t.folder=(fid===''||fid==null)?null:+fid;renderAll();autosave();}
// ลำดับเมือง = ลำดับใน S.towns (ใช้ทุกหน้า) · ▲▼ สลับกับเมืองก่อน/หลังในโฟลเดอร์เดียวกัน
function nudgeTown(id,dir){const t=T(id);if(!t)return;const same=S.towns.filter(x=>(x.folder??null)===(t.folder??null));const i=same.indexOf(t),j=i+dir;if(j<0||j>=same.length)return;
  const a=S.towns.indexOf(t),b=S.towns.indexOf(same[j]);[S.towns[a],S.towns[b]]=[S.towns[b],S.towns[a]];renderAll();autosave();}
// ย้ายเมือง: beforeId = วางไว้ก่อนเมืองนั้น (ใช้โฟลเดอร์เดียวกับเมืองนั้น) · ไม่ระบุ = ท้ายโฟลเดอร์ fid (null = ไม่จัดกลุ่ม)
function moveTown(id,beforeId,fid){
  const t=T(id);if(!t||id===beforeId)return;
  S.towns.splice(S.towns.indexOf(t),1);
  if(beforeId!=null){const b=T(beforeId);if(!b){S.towns.push(t);}else{t.folder=b.folder??null;S.towns.splice(S.towns.indexOf(b),0,t);}}
  else{t.folder=fid??null;let last=-1;S.towns.forEach((x,i)=>{if((x.folder??null)===(fid??null))last=i;});S.towns.splice(last>=0?last+1:S.towns.length,0,t);}
  renderAll();autosave();
}
function dragTown(e,id){window._drag=id;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));}catch(x){}}
function dragOverRow(e){e.preventDefault();e.currentTarget.classList.add('dov');}
function dragLeaveRow(e){e.currentTarget.classList.remove('dov');}
function dropTown(e,beforeId){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dov');const d=window._drag;window._drag=null;if(d!=null)moveTown(d,beforeId,undefined);}
function dropFolder(e,fid){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dov');const d=window._drag;window._drag=null;if(d!=null)moveTown(d,null,fid);}

  b.innerHTML=`<span>🏘️ ${LN('รายชื่อเมือง','Town list')} (${S.towns.length})${t&&view==='town'?' · <b data-noi18n>'+esc(t.name)+'</b>':''}</span><span>${open?'▴':'▾'}</span>`;
}

function renderList(){
  const L=document.getElementById('townlist');
  const q=(window._q||'').trim().toLowerCase(),flt=window._flt||'all',srt=window._sort||'created',dense=window._dense!==false,edit=!!window._edit;
  S.folders=S.folders||[];
  const eb=document.getElementById('tedit');if(eb){eb.textContent=edit?'✓ เสร็จสิ้น':'✏️ จัดเรียง / จัดกลุ่ม';eb.classList.toggle('pri',edit);}
  const info=new Map(S.towns.map(t=>[t.id,calc(t)]));
  const negs=t=>info.get(t.id).net.filter(x=>Math.round(x)<0).length;
  let vis=S.towns.filter(t=>(!q||t.name.toLowerCase().includes(q))&&(flt!=='bad'||negs(t)>0));
  if(srt==='name')vis=vis.slice().sort((a,b)=>a.name.localeCompare(b.name,'th',{numeric:true}));
  if(srt==='bad')vis=vis.slice().sort((a,b)=>negs(b)-negs(a));
  const card=t=>{
    const ic=tribeBadge(t.tribe)+`<span class="ttype" title="${t.type==='ore'?'เมืองแร่':'เมืองทหาร'}">${t.type==='ore'?'⛏️':'🗡️'}</span>`,on=(t.id===cur&&view==='town')?'on':'',clk=`cur=${t.id};view='town';renderAll();asideClose()`;
    if(dense)return `<button class="town c ${on}" data-id="${t.id}" onclick="${clk}" oncontextmenu="townMenu(event,${t.id})"><span class="ti">${ic}</span><span class="tn" data-noi18n>${esc(t.name)}</span><span class="tacts" id="ta-${t.id}">${actIcons(t,info.get(t.id))}</span>${t.x!=null&&t.y!=null?`<span class="xy">(${t.x}/${t.y})</span>`:''}<span class="dot ${negs(t)?'bad':'ok'}" id="dot-${t.id}"></span></button>`;
    return `<button class="town ${on}" data-id="${t.id}" onclick="${clk}" oncontextmenu="townMenu(event,${t.id})"><span class="ti">${ic}</span><span class="tx"><span class="tn" data-noi18n>${esc(t.name)}</span><small>${t.type==='ore'?'เมืองแร่':'เมืองทหาร · '+t.tribe}${t.x!=null?` · (${t.x}/${t.y})`:''}<span class="tacts" id="ta-${t.id}">${actIcons(t,info.get(t.id))}</span></small><small id="tl-${t.id}"></small></span></button>`;
  };
  const row=t=>{const f=folderOf(t),btn=card(t),st=f?` style="--fc:${f.color}"`:'';
    if(!edit)return `<div class="trow"${st}>${btn}</div>`;
    const opts=`<option value="">${NOF()}</option>`+S.folders.map(x=>`<option value="${x.id}" ${t.folder===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
    return `<div class="trow edit"${st} draggable="true" ondragstart="dragTown(event,${t.id})" ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropTown(event,${t.id})"><span class="grab" title="ลากเพื่อย้าย">⠿</span>${btn}<span class="tmv"><button onclick="nudgeTown(${t.id},-1)" title="ขึ้น">▲</button><button onclick="nudgeTown(${t.id},1)" title="ลง">▼</button></span>${S.folders.length?`<select class="tfs" data-noi18n onchange="setTownFolder(${t.id},this.value)">${opts}</select>`:''}</div>`;};
  const cnt=(n,all)=>n===all?all:n+'/'+all;
  const secs=[];
  S.folders.forEach(f=>{
    const list=vis.filter(t=>t.folder===f.id),all=S.towns.filter(t=>t.folder===f.id).length;
    if(!edit&&!list.length)return;
    secs.push(`<div class="fld" style="--fc:${f.color}"><div class="fldh" ${edit?`ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropFolder(event,${f.id})"`:''}><button class="fldt" onclick="toggleFolder(${f.id})"><span>${f.closed?'▸':'▾'}</span><span class="fdot" style="background:${f.color}"></span><b data-noi18n>${esc(f.name)}</b><span class="cnt">${cnt(list.length,all)}</span></button>${edit?`<span class="fedit"><input type="color" value="${f.color}" title="สี" onchange="setFolderColor(${f.id},this.value)"><button onclick="renameFolder(${f.id})" title="เปลี่ยนชื่อ">✏️</button><button onclick="moveFolder(${f.id},-1)" title="ขึ้น">▲</button><button onclick="moveFolder(${f.id},1)" title="ลง">▼</button><button onclick="delFolder(${f.id})" title="ลบโฟลเดอร์">🗑️</button></span>`:''}</div>${f.closed?'':(list.map(row).join('')||`<p class="note" style="margin:2px 6px 8px">ลากเมืองมาวางที่นี่</p>`)}</div>`);

  else if(!S.folders.length)secs.push(un.map(row).join(''));
  const tools=edit?`<div class="etools"><button class="pri" onclick="addFolder()">＋ โฟลเดอร์</button><span class="note">ลากเมือง (⠿) เพื่อย้าย · หรือใช้ ▲▼ · เลือกโฟลเดอร์ที่ช่องใต้ชื่อเมือง</span></div>`:'';
  L.innerHTML=S.towns.length?(tools+(secs.join('')||'<p class="note" style="margin:4px">ไม่พบเมือง</p>')):(tools+'<p class="note">ยังไม่มีเมือง กดปุ่มด้านบนเพื่อเพิ่ม</p>');
  asideLbl();
}

/* ============ วางหน้า "เส้นทางการค้า" จากตลาดสินค้า → อัปเดตการส่งออกตามของจริง ============ */
function pageLines(raw){return raw.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').split(/\r?\n/).map(x=>x.trim().replace(/^[*•]\s+/,''));}
function villageInfo(lines){ // ชื่อหมู่บ้านปัจจุบัน + รายชื่อหมู่บ้านพร้อมพิกัด (ท้ายหน้า)
  const pi=lines.findIndex(x=>/^(ประชากร|Population)/i.test(x));let name='';
  if(pi>0)for(let j=pi-1;j>=0;j--){if(lines[j]){name=lines[j];break;}}
  const cre=/^\(\s*([−–-]?\d+)\s*\|\s*([−–-]?\d+)\s*\)$/,list={};
  if(pi>0)for(let j=pi+1;j<lines.length;j++){let k=j+1;while(k<lines.length&&!lines[k])k++;const m=lines[j]&&(lines[k]||'').match(cre);
    if(m&&!cre.test(lines[j]))list[lines[j]]={x:parseInt(m[1].replace(/[−–]/,'-'),10),y:parseInt(m[2].replace(/[−–]/,'-'),10)};}
  return {name,list,me:list[name]||null};
}
function parseTradeRoutes(raw){
  const L=pageLines(raw),vi=villageInfo(L),nz=L.filter(x=>x);
  const dests={};let cur=null;
  for(let i=0;i<nz.length;i++){
    const m=nz[i].match(/^(ไปยัง|To|Target)\s*:\s*(.+)$/i);if(m){cur=m[2].trim();dests[cur]=dests[cur]||{day:[0,0,0,0],rows:0};continue;}
    if(cur&&/^\d+$/.test(nz[i])&&/^\d+$/.test(nz[i+1]||'')&&/^\d+$/.test(nz[i+2]||'')&&/^\d+$/.test(nz[i+3]||'')){
      // รูปแบบ: ไม้ โคลน เหล็ก ข้าว [N×] เวลา พ่อค้า  (ถ้าส่งครั้งเดียว เกมไม่แสดง N×)
      const tre=/^\d{1,2}:\d{2}$/,rm=(nz[i+4]||'').match(/^(\d+)\s*[×x]$/i);
      let rep=0,step=0;
      if(rm&&tre.test(nz[i+5]||'')){rep=+rm[1];step=6;}else if(tre.test(nz[i+4]||'')){rep=1;step=5;}
      if(rep){const r=[0,1,2,3].map(j=>+nz[i+j]*rep);const d=dests[cur]=dests[cur]||{day:[0,0,0,0],rows:0};r.forEach((v,j)=>d.day[j]+=v);d.rows++;i+=step;}
    }
  }
  return {src:vi.name,srcXY:vi.me,list:vi.list,dests,isTrade:/เส้นทางการค้า|trade route/i.test(raw)};
}
function findTownBy(name,xy){return (xy&&S.towns.find(t=>t.x!=null&&+t.x===xy.x&&+t.y===xy.y))||S.towns.find(t=>t.name===name)||null;}
