.ctrtip{background:rgba(52,120,220,.10);border:1px solid rgba(52,120,220,.45);border-radius:10px;padding:8px 12px;margin:8px 0}
.ctrtip details{margin-top:4px}
.ctrsimple .cstep{margin-bottom:12px}.ctrsimple .cstep.cur{box-shadow:0 0 0 2px var(--accent)}.ctrsimple .cstep.dim{opacity:.5}
.ctrsimple .mphd .cn{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-right:6px}
.ctrsimple .cstep.ok .mphd .cn{background:#2f8f4e}.ctrsimple .cstep.dim .mphd .cn{background:var(--line);color:var(--ink)}
.ctrsum{background:var(--row,rgba(127,127,127,.08));border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.7}
.ctrhome{font-size:16px;margin:2px 0}.ctrhome b{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.ctrsum .arr{margin:0 6px;color:var(--mute)}
.ctradv,.ctrman{margin-top:8px}.ctradv>summary,.ctrman>summary{cursor:pointer;font-weight:600;padding:4px 0}
.ctrneed{background:rgba(230,126,34,.12);border:1px solid #e67e22;border-radius:10px;padding:8px 10px;margin-top:8px}
.ctrpaste.big textarea{min-height:64px;font-size:13px}
.ctrpaste textarea{width:100%;font-size:12.5px;resize:vertical;min-height:38px}
.ctrplist{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px}.ctrplist .ctrpi{text-align:left}
.ctrguess{border:1px solid var(--line);border-radius:12px;padding:10px;margin:12px 0 0;background:var(--row)}
#ctrgs>p{margin:10px 0 0}
.ctrbest td{background:var(--accent-soft)!important;font-weight:600}
.ctrsend b{color:var(--accent);font-size:1.05em}
.ctrhit b{display:inline-block;background:rgba(230,184,77,.28);color:var(--ink);border:1px solid var(--warn);border-radius:6px;padding:0 6px;font-size:1.08em;font-variant-numeric:tabular-nums}
.ctrhit .note{font-size:11.5px}.ctrd{color:var(--mute)}
.ctrts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;font-size:13.5px}
.ctrts>span{flex:0 0 auto}
.ctrts input{flex:0 1 220px;width:220px;min-width:140px;accent-color:var(--accent)}
.ctrts b{min-width:34px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:1px 8px}
.ctrgrp .ttab td,.ctrgrp .ttab th{white-space:nowrap}
.shbadge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:#fff;color:#23483c;cursor:pointer;flex:none}
.shbadge[hidden]{display:none}
.shbadge.ro{background:#e6b84d;color:#3a2a05}
.shbtn{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.shbtn svg{flex:none}
.hworld .seg{border-color:rgba(255,255,255,.45)}
.hworld .seg button{padding:3px 11px;min-height:0;font-size:12.5px;background:rgba(255,255,255,.1);color:#fff;border:0}
.hworld .seg button.on{background:#fff;color:#23483c;font-weight:700}
.shbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;padding:7px 12px;margin:0 0 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line)}
.shbar.ro{background:rgba(230,184,77,.18);border-color:var(--warn)}
.shbar .mplnk{margin-left:auto}
.shinfo{list-style:none;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:grid;gap:8px;font-size:.92em;line-height:1.45}.shinfo li{display:flex;gap:10px;align-items:flex-start}.shinfo li>span{flex:none;width:1.5em;text-align:center}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.shrow select{min-width:0}
body.shro input.shdis,body.shro select.shdis,body.shro textarea.shdis{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);cursor:default}   /* ดูอย่างเดียว: ค่ายังอ่านชัด */
body.shro .shdis::placeholder{-webkit-text-fill-color:var(--mute);color:var(--mute);opacity:.6}
body.shro button.shdis{opacity:.4;cursor:not-allowed}
body.shro input[type=checkbox].shdis,body.shro input[type=radio].shdis{opacity:.85}
.ctrtgt{font-size:14.5px;margin:0 0 6px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.ctrpick{position:relative;margin:4px 0 6px}
.ctrpick input{width:100%}
.ctrpl{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:320px;overflow:auto;overscroll-behavior:contain;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-top:4px;padding:4px}
.ctrpl.on{display:block}
.ctrpl .note{padding:6px 8px;margin:0}
.ctrpi{display:block;width:100%;text-align:left;padding:6px 8px;border:0;border-radius:8px;background:none;color:var(--ink);min-height:0;font-size:13.5px;line-height:1.35}
.ctrpi.on,.ctrpi:hover{background:var(--accent-soft)}
.rndbar{background:#fff7e0;border:1px solid #f0c36d;color:#6b4d12;border-radius:10px;padding:8px 12px;margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}.rndbar button{margin-left:auto}
[data-theme=dark] .rndbar{background:#3a2f17;border-color:#7a5d22;color:#f3dca0}
.mpgl{color:inherit;text-decoration:none;border-bottom:1px dashed currentColor}.mpgl:hover{color:var(--acc,#2e7d5b)}.mpglx{font-size:11px;margin-left:3px;opacity:.6}
/* v1.76.4 มือถือ: กันล้นจอ + ปุ่มเล็กกดง่ายขึ้น */
@media (max-width:700px){
 main label.f{max-width:100%;min-width:0;flex-wrap:wrap}
 main label.f select,main label.f input:not([type=checkbox]):not([type=radio]):not([type=range]){max-width:100%;min-width:0}
 .ctr2col{grid-template-columns:minmax(0,1fr)!important}.ctr2col>*,.ctrsec,.ctrsh,.ctrpick{min-width:0;max-width:100%}
 .ctrsh input,.ctrpick input{width:100%;box-sizing:border-box}
 a.trl,span.trl,button.mplnk{min-height:34px;display:inline-flex;align-items:center}
 main input[type=checkbox]{width:20px;height:20px}
}

.tdd{display:inline-flex;align-items:center;gap:6px;min-width:128px;min-height:34px;padding:5px 10px;border-radius:8px;text-align:left}
.tdd .tdc{margin-left:auto;color:var(--mute);font-size:11px}
#tddpop{position:fixed;z-index:85;display:none;flex-direction:column;min-width:170px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:4px}
#tddpop.on{display:flex}#tddpop{overscroll-behavior:contain}
/* v2.6.2 (ผู้ใช้ 25 พ.ย. 2026): มือถือ = แผ่นรายการจากด้านล่าง (bottom sheet) พื้นหลังมืด แตะพื้นหลังเพื่อปิด หน้าไม่เลื่อนระหว่างเปิด */
@media (pointer:coarse){#tddpop.on{left:8px!important;right:8px!important;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;max-height:62vh!important;min-width:0;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.3)}#tddpop.on::before{content:"";position:fixed;inset:0;z-index:-1}#tddpop button{min-height:44px}html:has(#tddpop.on){overflow:hidden}}

#tddpop button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:4px 10px;text-align:left;color:var(--ink)}
#tddpop button:hover{background:var(--row)}#tddpop button.on{background:var(--accent-soft);font-weight:700}

/* 🎨 ธีม (v1.88.0): html[data-skin=<ธีม>][data-mode=light|dark] ตั้งตัวแปรสี · โครงด้านล่างใช้ร่วมทุกธีม */
html[data-skin] body{background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed}
html[data-skin] header{background:linear-gradient(180deg,var(--hd1),var(--hd2))!important;border-bottom:3px solid var(--hdl);box-shadow:0 4px 14px rgba(0,0,0,.4)!important}
html[data-skin] header h1>span:nth-child(2),html[data-skin] header h1 .ttl{color:var(--hdt);text-shadow:0 2px 0 rgba(0,0,0,.45)}
html[data-skin] header h1>span:nth-child(2) small,html[data-skin] header h1 .ttl small{color:var(--hds);text-shadow:none}
html[data-skin] header h1,html[data-skin] h2,html[data-skin] h3,html[data-skin] .mhead,html[data-skin] table th{font-family:var(--hfont)}
html[data-skin] section.box,html[data-skin] .mcard,html[data-skin] .box,html[data-skin] #mcard{border:2px solid var(--line);box-shadow:var(--shadow),inset 0 0 40px var(--cin);background-image:var(--cimg)}
html[data-skin] aside{background:linear-gradient(90deg,var(--panel),var(--row));border-right:3px double var(--line)}
html[data-skin] section.box>h3,html[data-skin] .box>h3{color:var(--accent);border-bottom:2px solid;border-image:linear-gradient(90deg,var(--accent),transparent 85%) 1;padding-bottom:6px}
html[data-skin] button.pri,html[data-skin] .addbtn{background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);border-color:var(--bb);font-weight:700}
html[data-skin] #mainnav{background:linear-gradient(180deg,var(--nv1),var(--nv2));border-bottom:2px solid var(--hdl)}
html[data-skin] #mainnav button{color:var(--nvt)}
html[data-skin] #mainnav button:hover{background:rgba(255,255,255,.1)}
html[data-skin] #mainnav button.on{background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);border-radius:6px}
html[data-skin] #mainnav .nlab,html[data-skin] #mainnav .nhead{color:var(--nvl)!important}
html[data-skin] #mainnav .ngrp+.ngrp{border-left-color:rgba(255,255,255,.18)}
html[data-skin] .town.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--hdl)}
html[data-skin] .tab button.on,html[data-skin] .seg button.on,html[data-skin] .tabs button.on{background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);border-color:var(--bb)}
html[data-skin] header .hseg button.on{background:var(--hdt);color:#1a1206}
/* ⚙️ หน้าต่างตั้งค่า */
#setpop{position:fixed;z-index:80;width:min(380px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:14px 16px;font-size:14px;display:none}
#setpop.on{display:block}
#setpop .sph{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:8px}
#setpop .sph button{border:0;background:transparent;font-size:18px;padding:0 6px;color:var(--mute);cursor:pointer}
#setpop .spl{margin:10px 0 4px;color:var(--mute);font-size:12px}
#setpop .sps{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#setpop .sps button{flex:1;border:0;border-radius:0;padding:6px 8px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
#setpop .sps button+button{border-left:1px solid var(--line)}
#setpop .sps button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
#setpop .spg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#setpop .spc{border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--panel);color:var(--ink);text-align:center;cursor:pointer;font:inherit}
#setpop .spc:hover{border-color:var(--accent)}
#setpop .spc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
#setpop .spc>i{display:grid;grid-template-rows:14px 1fr;height:40px;border-radius:7px;overflow:hidden;font-style:normal}
#setpop .spc>i b{display:flex;align-items:center;justify-content:center}
#setpop .spc>i b s{width:60%;height:10px;border-radius:3px;text-decoration:none}
#setpop .spc span{display:block;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#setpop .spc.on span{font-weight:700}

// กล่องเลือกหลายปุ่ม (คืนค่า Promise เป็น key ของปุ่ม) · b.raw = ไม่แปลข้อความปุ่ม (มีชื่อโปรไฟล์)
function askChoice(title,msgHTML,btns){return new Promise(res=>{
  window._cbRes=res;document.getElementById('cb-title').textContent=title;document.getElementById('cb-msg').innerHTML=msgHTML;
  document.getElementById('cb-btns').innerHTML=btns.map(b=>`<button class="${b.cls||''}" ${b.raw?'data-noi18n':''} onclick="choiceClose('${b.key}')">${b.raw?esc(b.label):b.label}</button>`).join('');
  document.getElementById('choicebox').classList.add('on');});}
function choiceClose(k){document.getElementById('choicebox').classList.remove('on');const r=window._cbRes;window._cbRes=null;if(r)r(k);}
const LN=(th,en)=>LANG()==='en'?en:th;
// คำอธิบายเล็กๆ ทุกหน้า → ไอคอน (?) แสดงเป็น tooltip เมื่อชี้/แตะ (แปลเป็นอังกฤษอัตโนมัติเมื่อ EN)
const tipTxt=h=>String(h).replace(/\n\s*•/g,'\u0001•').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().replace(/\s*\u0001/g,'\n');   // บรรทัดที่ขึ้นต้นด้วย • คงการขึ้นบรรทัดใหม่
const tip=(h,cls)=>{let t=tipTxt(h);if(LANG()==='en')t=trText(t);return `<span class="qtip${cls?' '+cls:''}" tabindex="0" role="note" data-noi18n aria-label="${esc(t)}" data-tip="${esc(t)}">?</span>`;};
function dlgR(msg,onOk,okLabel,danger,inputVal){window._dlgRaw=true;dlg(msg,onOk,okLabel,danger,inputVal);}
function dlg(msg,onOk,okLabel,danger,inputVal){
  const d=document.getElementById('dlg'),ok=document.getElementById('dlgok'),no=document.getElementById('dlgno'),inp=document.getElementById('dlginp');
  const raw=!!window._dlgRaw;window._dlgRaw=false;const mEl=document.getElementById('dlgmsg');if(raw)mEl.setAttribute('data-noi18n','');else mEl.removeAttribute('data-noi18n');
  mEl.textContent=msg;
  const hasIn=inputVal!==undefined;
  inp.style.display=hasIn?'':'none';inp.value=hasIn?inputVal:'';
  no.style.display=onOk?'':'none';
  ok.textContent=onOk?(okLabel||'ยืนยัน'):'ตกลง';
  ok.className=danger?'dng':'pri';
  const close=()=>{d.classList.remove('on');ok.onclick=null;no.onclick=null;inp.onkeydown=null;};
  ok.onclick=()=>{const v=inp.value;close();if(onOk)onOk(v);};
  no.onclick=close;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok.click();}if(e.key==='Escape')close();};
  d.classList.add('on');(hasIn?inp:ok).focus();if(hasIn)inp.select();

/* คัดลอกตัวเลข: บนจอแสดง , แต่เวลาคัดลอกจะได้ตัวเลขล้วน (วางในเกมได้เลย) */

function copyText(txt){
  const done=()=>toast('📋 คัดลอกแล้ว: '+txt);
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,()=>fb());return;}}catch(e){}
  fb();
  function fb(){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('คัดลอกไม่สำเร็จ');}ta.remove();}
}
document.addEventListener('copy',e=>{const t=String(window.getSelection());if(/\d,\d{3}/.test(t)){e.clipboardData.setData('text/plain',plainNum(t));e.preventDefault();}});

  const v=plainNum(m[0]).replace(/^\+/,'').replace('−','-');

function helmKey(v){ // รองรับค่าเก่าที่เก็บเป็นตัวเลข 10/15/20
  if(typeof v==='number'||/^\d+$/.test(String(v))){const n=+v;return n===10?'1:common':n===15?'2:common':n===20?'3:common':'';}
  return /^[123]:(common|uncommon|rare|epic)$/.test(v||'')?v:'';
}
function helmPct(t,g){
  const key=helmKey(g==='I'?t.helmI:t.helmC);if(!key)return 0;
  const [tier,rar]=key.split(':');

}
const bonusMul=(t,k)=>{
  let m=(1-(+S.guild||0)/100)*artMul(t);
  if(BTYPE[k]==='B')m*=1-helmPct(t,'I')/100;
  if(BTYPE[k]==='S')m*=1-helmPct(t,'C')/100;

};
const timeMult=(t,k)=>horseMult(t,k)*bonusMul(t,k);

function newState(){return {v:1,guild:0,crafting:false,speed:1,levelFactor:0.9,nextId:1,towns:[],unitOv:{},celeb:defaultCeleb()};}
function newTown(type){

}
function T(id){return S.towns.find(t=>t.id===id);}
function unit(tribe,i){
  const b=TRIBES[tribe][i], o=S.unitOv[tribe+':'+i]||{};
  const c=o.c||b.c;
  return {n:b.n,b:b.b,c,t:o.t||b.t,unk:!!b.unk&&!c.some(x=>x>0),role:b.b==='P'?(i===8?'chief':'settler'):''};
}
const getBH=b=>(b.hours===undefined||b.hours===''||isNaN(+b.hours)||+b.hours<0)?24:+b.hours; // ชั่วโมงที่กดฝึกต่อรอบ 24 ชม. ของแต่ละอาคาร (เกิน 24 ได้)
const fH=h=>Number.isInteger(h)?String(h):String(Math.round(h*100)/100); // แสดงชั่วโมง
const ceilN=x=>Math.ceil(x-1e-9); // แร่ที่ใช้: ถ้าเป็นทศนิยมให้ปัดขึ้น
const fmt=n=>Math.round(n).toLocaleString('en-US');

const hmsp=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};
function parseHMS(str){const p=String(str).trim().split(':').map(Number);if(p.some(x=>isNaN(x)||x<0)||p.length<2||p.length>3)return null;
  if(p.length===2)p.unshift(0);return p[0]*3600+p[1]*60+p[2];}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ คำนวณ ============ */
function celebHour(t){
  const z=[0,0,0,0]; if(t.celeb==='none')return {h:z,warn:''};
  const big=t.celeb==='large', lv=Math.min(20,Math.max(1,t.th));
  const cost=big?S.celeb.large:S.celeb.small;
  const sec=S.celeb.tbl[celGroup()][big?'l':'s'][lv-1];
  if(!sec)return {h:z,warn:'Celebration ใหญ่ต้องใช้ Town Hall เลเวล 10 ขึ้นไป (ยังไม่คิดต้นทุน)',dur:0};
  return {h:cost.map(x=>x/(sec/3600)),warn:'',dur:sec};
}
// โหมด "จำนวนตัว": ระบุจำนวนทหารที่ต้องการต่อหน่วย -> คำนวณเวลารวมและแร่รวม
function bldCount(t,k){
  const b=t.bld[k],items=[];let secTot=0;
  for(const key of Object.keys(b.qty||{})){
    const i=+key,q=Math.floor(+b.qty[key]||0);
    if(q<=0||!TRIBES[t.tribe][i]||TRIBES[t.tribe][i].b!==BTYPE[k])continue;
    const un=unit(t.tribe,i),sec=un.t/bSpeed(b.lvl)/S.speed*timeMult(t,k);
    items.push({i,q,un,sec});secTot+=q*sec;
  }
  return {items,secTot};
}
function troopHour(t){
  const tot=[0,0,0,0],detail=[];
  for(const k of BKEYS){
    const b=t.bld[k]; if(!b||!b.on||!b.lvl)continue;
    if(b.mode==='count'){
      const r=bldCount(t,k); if(!r.items.length||r.secTot<=0)continue;
      const Th=r.secTot/3600; // ฝึกต่อเนื่องจนครบจำนวน: แร่ต่อชม. = แร่รวม / เวลารวม
      for(const it of r.items){
        const batch=it.un.c.map(x=>x*it.q*BCOST[k]),cost=batch.map(v=>v/Th);
        cost.forEach((v,j)=>tot[j]+=v);
        detail.push({k,i:it.i,icon:uIcon(t.tribe,it.i),name:it.un.n+(BCOST[k]>1?' (Great)':''),perH:it.q/Th,sec:it.sec,hrs:Th,f:1,mode:'count',qty:it.q,cost,batch});
      }
      continue;
    }
    if(!(b.sel||[]).length)continue;
    const n=b.sel.length,f=getBH(b)/24;
    for(const i of b.sel){
      const un=unit(t.tribe,i);
      const sec=un.t/bSpeed(b.lvl)/S.speed*timeMult(t,k);
      const perH=3600/sec/n; // จำนวนที่ผลิตได้ต่อชม (แบ่งเวลาเท่ากันถ้าติ๊กหลายตัว)
      un.c.forEach((x,j)=>tot[j]+=x*perH*BCOST[k]*f);
      detail.push({k,i,icon:uIcon(t.tribe,i),name:un.n+(BCOST[k]>1?' (Great)':''),perH,sec,hrs:getBH(b),f,cost:un.c.map(x=>x*perH*BCOST[k]*f),batch:un.c.map(x=>x*perH*BCOST[k]*getBH(b))});
    }
  }
  return {h:tot,detail};
}
function importsOf(t){
  const r=[0,0,0,0];
  S.towns.forEach(o=>o.exports.forEach(e=>{if(e.to===t.id)e.r.forEach((x,j)=>r[j]+=x);}));
  return r;
}
function calc(t){
  const imp=importsOf(t), ce=celebHour(t), tr=t.type==='mil'?troopHour(t):{h:[0,0,0,0],detail:[]};
  ce.h=ce.h.map(ceilN);tr.h=tr.h.map(ceilN);
  const up=[0,0,0,0];
  const avail=[0,1,2,3].map(j=>t.prod[j]+imp[j]-ce.h[j]-tr.h[j]-up[j]);
  const out=[0,0,0,0];t.exports.forEach(e=>e.r.forEach((x,j)=>out[j]+=x));
  const net=avail.map((a,j)=>a-out[j]);
  return {imp,ce,tr,up,avail,out,net};
}

// Load: จับคู่ตามชื่อโปรไฟล์ · ชื่อใหม่ = สร้างโปรไฟล์ใหม่ · ชื่อซ้ำ = ถามว่าทับข้อมูลหรือสร้างโปรไฟล์ใหม่
function askConflict(name,ex,sv,i,n){

  return askChoice(LN('📂 Load ไฟล์','📂 Load file')+(n>1?` (${i}/${n})`:''),
    `<div data-noi18n><p>${LN('มีโปรไฟล์ชื่อ','A profile named')} <b>${esc(name)}</b> ${LN('อยู่แล้ว','already exists')}</p>
     <p class="note">${LN('ในแอป','In the app')}: ${ex.towns.length} ${LN('เมือง','towns')} · ${LN('ในไฟล์','In the file')}: ${sv.towns.length} ${LN('เมือง','towns')}</p>
     <p class="note"><b>${LN('ทับข้อมูล','Overwrite')}</b> = ${LN('แทนที่ข้อมูลของโปรไฟล์เดิมด้วยข้อมูลในไฟล์',"replace the existing profile's data with the file's data")}<br><b>${LN('สร้างโปรไฟล์ใหม่','New profile')}</b> = ${LN('บันทึกเป็น','save as')} <b>${esc(nn)}</b> ${LN('(ไม่แตะโปรไฟล์เดิม)','(the existing profile is left untouched)')}</p></div>`,
    [{key:'replace',label:LN('ทับข้อมูล','Overwrite'),cls:'dng',raw:true},{key:'new',label:LN('สร้างโปรไฟล์ใหม่','New profile'),cls:'pri',raw:true},{key:'skip',label:LN('ข้ามโปรไฟล์นี้','Skip this profile'),raw:true},{key:'cancel',label:LN('ยกเลิกทั้งหมด','Cancel all'),raw:true}]);

function mergePlans(list){
  if(!Array.isArray(list)||!list.length)return 0;ensurePlans();let add=0;
  list.forEach(p=>{if(!p||!Array.isArray(p.items))return;
    const same=M.plans.find(x=>x.name===p.name);
    if(same&&JSON.stringify(same.items)===JSON.stringify(p.items))return;
    let name=p.name||'แผน',nm=name;if(same){nm=name+' (ไฟล์)';let k=2;while(M.plans.some(x=>x.name===nm))nm=name+' (ไฟล์ '+(k++)+')';}
    M.plans.push({id:Math.max(0,...M.plans.map(x=>x.id))+1,name:nm,items:JSON.parse(JSON.stringify(p.items))});add++;});
  return add;

async function importData(d){
  let servers;
  if(d&&Array.isArray(d.servers)&&d.servers.length)servers=d.servers;
  else if(d&&Array.isArray(d.towns))servers=[Object.assign({},d,{name:d.name||'เซิร์ฟเวอร์ 1'})];
  else throw new Error('ไฟล์ไม่ใช่ข้อมูลของแอปนี้');
  const conflicts=servers.filter(x=>M.servers.some(e=>e.towns.length&&nameKey(e.name)===nameKey(x.name||'เซิร์ฟเวอร์ 1'))).length;
  const res={added:0,replaced:0,skipped:0};let last=null,ci=0,cancelled=false;
  for(let k=0;k<servers.length;k++){
    const sv=normServer(servers[k]);sv.name=String(servers[k].name||('เซิร์ฟเวอร์ '+(k+1))).trim();
    const ex=M.servers.find(e=>nameKey(e.name)===nameKey(sv.name));
    if(!ex){sv.id=M.nextSid++;M.servers.push(sv);res.added++;last=sv.id;continue;}
    if(!ex.towns.length){const keep=ex.id,nm=ex.name;Object.keys(ex).forEach(key=>delete ex[key]);Object.assign(ex,sv,{id:keep,name:nm});res.replaced++;last=keep;continue;} // โปรไฟล์เดิมว่างเปล่า: แทนที่เลย ไม่ต้องถาม
    ci++;const ch=await askConflict(sv.name,ex,sv,ci,conflicts);
    if(ch==='cancel'){cancelled=true;break;}
    if(ch==='skip'){res.skipped++;continue;}
    if(ch==='replace'){const keep=ex.id,nm=ex.name;Object.keys(ex).forEach(key=>delete ex[key]);Object.assign(ex,sv,{id:keep,name:nm});res.replaced++;last=keep;}
    else{sv.name=uniqueName(sv.name);sv.id=M.nextSid++;M.servers.push(sv);res.added++;last=sv.id;}
  }
  const pl=cancelled?0:mergePlans(d.plans);
  if(last!=null){switchServer(last);}else{renderAll();autosave();}
  const parts=[];if(res.added)parts.push(LN('สร้างโปรไฟล์ใหม่ ','New profiles: ')+res.added);if(res.replaced)parts.push(LN('ทับข้อมูล ','Overwritten: ')+res.replaced);if(res.skipped)parts.push(LN('ข้าม ','Skipped: ')+res.skipped);if(pl)parts.push(LN('เพิ่มแผนสร้างเมือง '+pl+' แผน','Added '+pl+' build plan(s)'));
  dlgR((cancelled?LN('ยกเลิกการโหลดที่เหลือ','Remaining profiles cancelled'):LN('โหลดเสร็จ','Load finished'))+'\n'+(parts.length?parts.join(' · '):LN('ไม่มีการเปลี่ยนแปลง','No changes')));
}

function parseDorf1(raw){
  const txt=raw.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'');
  const i0=txt.search(/กำลังผลิตต่อชั่วโมง|Production per hour/i);
  const seg=i0>=0?txt.slice(i0):txt;
  const keys=[['ไม้','Lumber','Wood'],['โคลน','Clay'],['เหล็ก','Iron'],['ธัญพืช','ข้าว','Crop']];
  const prod=[];
  for(const labels of keys){
    let v=null;
    for(const l of labels){
      const m=seg.match(new RegExp(l+'\\s*[:：]+\\s*([−–-]?\\s*\\d[\\d,. ]*)','i'));
      if(m){v=parseInt(m[1].replace(/[−–]/g,'-').replace(/[,.\s]/g,''),10);break;}
    }
    if(v===null||isNaN(v))return {ok:false};
    prod.push(v);
  }
  // ชื่อเมือง = บรรทัดที่อยู่ก่อนบรรทัด "ประชากร"
  let name='';
  const lines=txt.split(/\r?\n/).map(x=>x.trim());
  const pi=lines.findIndex(x=>/^(ประชากร|Population)/i.test(x));
  if(pi>0){for(let j=pi-1;j>=0;j--){if(lines[j]){name=lines[j];break;}}}
  // พิกัด X/Y: หาชื่อเมืองนี้ในรายชื่อหมู่บ้าน (หลังบรรทัดประชากร) แล้วอ่านบรรทัดพิกัดถัดไป เช่น (−14|109)
  let x=null,y=null;const cre=/^\(\s*([−–-]?\d+)\s*\|\s*([−–-]?\d+)\s*\)$/;
  if(name&&pi>0){for(let j=pi+1;j<lines.length;j++){if(lines[j]!==name)continue;
    let k=j+1;while(k<lines.length&&!lines[k])k++;
    const m=(lines[k]||'').match(cre);if(m){x=parseInt(m[1].replace(/[−–]/,'-'),10);y=parseInt(m[2].replace(/[−–]/,'-'),10);break;}}}
  return {ok:true,prod,name,x,y};
}

// map.sql: (id, x, y, tribe, villageId, villageName, playerId, playerName, allianceId, allianceTag, population, region, capital, city, harbor, VP)
const MAP_TRIBE={1:'Romans',2:'Teutons',3:'Gauls',6:'Egyptians',7:'Huns',8:'Spartans',9:'Vikings',5:'Natars'};
function parseMapSql(t){
  const out=[],n=t.length;let i=0;
  while(true){
    const k=t.indexOf('VALUES',i);if(k<0)break;i=k+6;
    while(i<n){
      while(i<n&&(t[i]===','||t[i]===' '||t[i]==='\n'||t[i]==='\r'||t[i]==='\t'))i++;
      if(t[i]!=='(')break;i++;const v=[];
      while(i<n){
        while(t[i]===' ')i++;
        let x;
        if(t[i]==="'"||t[i]==='"'){const q=t[i++];let s='';
          while(i<n){if(t[i]==='\\'){s+=t[i+1];i+=2;}else if(t[i]===q&&t[i+1]===q){s+=q;i+=2;}else if(t[i]===q){i++;break;}else s+=t[i++];}
          x=s;}
        else{let s='';while(i<n&&t[i]!==','&&t[i]!==')')s+=t[i++];x=s.trim();if(x==='NULL')x=null;}
        v.push(x);while(t[i]===' ')i++;
        if(t[i]===','){i++;continue;}
        if(t[i]===')'){i++;break;}
        break;
      }
      if(v.length>=11)out.push({fid:+v[0],vid:+v[4],x:+v[1],y:+v[2],tribe:+v[3],name:decHtml(v[5]||''),uid:+v[6],player:decHtml(v[7]||''),aid:+v[8],ally:decHtml(v[9]||''),pop:+v[10]||0,capital:String(v[12]).toUpperCase()==='TRUE',region:v[11]?decHtml(v[11]):'',city:String(v[13]).toUpperCase()==='TRUE',cityF:String(v[13]).toUpperCase()==='FALSE',harbor:String(v[14]).toUpperCase()==='TRUE',vp:+v[15]||0});   // v[11] แคว้น (เฉพาะแผนที่ยุโรป) · v[13] City · v[14] ท่าเรือ (Harbor, เฉพาะบางเซิร์ฟ) · v[15] Victory Points ของหมู่บ้าน
    }
  }
  return out;
}
function decHtml(s){if(!/&[#a-z0-9]+;/i.test(s))return s;const e=document.createElement('textarea');e.innerHTML=s;return e.value;}
// ลิงก์ไปหน้าในเกม (ผู้ใช้กดเอง เปิดแท็บใหม่) · ไม่มีที่อยู่เซิร์ฟเวอร์ = ข้อความธรรมดา

window._impAuto={host:'',state:''};
async function impAuto(force){

  if(!force&&A.host===host&&A.state)return;A.host=host;A.state='check';impBox();
  const fmtAt=t=>t?new Date(t).toLocaleString(LN('th-TH','en-GB'),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  // 1) ที่เครื่องนี้มีอยู่แล้ว

  // 2) ฐานข้อมูลของเรา (สำเนา GitHub)
  const mir=mpMirror();
  if(!mir){if(A.state!=='have'){A.state='nomirror';impBox();}return;}
  try{let at=0;const r=await fetch(mir.replace(/[^/]+$/,'_index.json'),{cache:'no-store'});
    if(mpHost()!==host)return;
    if(r.ok){const j=await r.json();at=Date.parse(j&&j[host]&&j[host].at)||0;if(!j||!j[host])throw new Error('absent');}
    if(A.state==='have'&&at&&at<=(MP.at||0)+60000)return;   // ของเครื่องนี้ใหม่เท่ากันหรือใหม่กว่า
    const q=await fetch(mir,{cache:'no-store'});if(!q.ok)throw new Error('absent');const txt=await q.text();if(mpHost()!==host)return;
    const rows=parseMapSql(txt);if(!rows.length)throw new Error('absent');
    window._mapRows=rows;window._mapAllies=null;try{mpStore(rows,'github',false,at||Date.now());}catch(e){}
    A.state='have';A.at=at||Date.now();A.n=rows.length;impBox();impAfter();
  }catch(e){if(mpHost()!==host||A.state==='have')return;
    A.state=String(e&&e.message)==='absent'?'absent':'neterr';
    if(A.state==='absent'){A.req=impRequest(host);}
    impBox();}
}

function impDrop(e){const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impLoadText(r.result,'ไฟล์ '+esc(f.name));r.readAsText(f);}
function impFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>impLoadText(r.result,'ไฟล์ '+esc(f.name));r.readAsText(f);inp.value='';}
// keep=true เฉพาะไฟล์ที่แอปดึงจากเกมเอง · ไฟล์ที่ผู้ใช้วาง/เลือกเอง ใช้เลือกเมืองในหน้านี้เท่านั้น ไม่เก็บลงฐานข้อมูลแผนที่ (ระบบดึงของจริงเอง)
function impLoadText(txt,src,keep){
  const rows=parseMapSql(txt);
  if(!rows.length){impStatus('⚠ ไม่พบข้อมูลหมู่บ้านในไฟล์ (ต้องเป็น map.sql ของ Travian)',true);return;}
  window._mapRows=rows;window._mapAllies=null;if(keep&&mpHost()){try{mpStore(rows,'game',false);}catch(e){}}
  impStatus('✓ อ่าน '+src+' แล้ว: '+fmt(rows.length)+' หมู่บ้าน · เลือกกิลด์ในขั้นที่ 4 แล้วเลือกชื่อผู้เล่น');renderImp4();
  if(String(S.mapPlayer||'').trim())impFind();else renderImp();
}
function impFind(){
  const rows=window._mapRows;if(!rows)return;
  const q=String(S.mapPlayer||'').trim();window._imp=null;window._impCand=null;
  let uid=null;
  if(/^\d+$/.test(q)&&rows.some(r=>r.uid===+q))uid=+q;
  else{const ql=q.toLowerCase(),ex=rows.find(r=>r.player.toLowerCase()===ql);
    if(ex)uid=ex.uid;
    else{const m=new Map();rows.forEach(r=>{if(q&&r.player.toLowerCase().includes(ql)&&!m.has(r.uid))m.set(r.uid,r);});window._impCand=[...m.values()].slice(0,30);}}
  if(uid!=null){
    const vs=rows.filter(r=>r.uid===uid).sort((a,b)=>(b.capital-a.capital)||b.pop-a.pop);
    const sel={},type={};vs.forEach(v=>{const ex=impExisting(v);sel[v.vid]=!ex;type[v.vid]=ex?ex.type:'ore';});
    window._imp={uid,vs,sel,type};
  }
  renderImp();
}
function impPick(uid){const r=window._mapRows.find(x=>x.uid===uid);if(r){S.mapPlayer=r.player;S.mapAlly=r.aid||0;autosave();renderImp4();impFind();}}
// เช็กเมืองที่มีแล้วจากพิกัด X/Y (ชื่อเมืองเปลี่ยนบ่อย)
function impExisting(v){return S.towns.find(t=>t.x!=null&&t.y!=null&&+t.x===v.x&&+t.y===v.y);}
function impToggle(vid,on){const v=window._imp.vs.find(x=>x.vid===vid);if(v&&impExisting(v))return;window._imp.sel[vid]=on;renderImp();}
function impType(vid,v){window._imp.type[vid]=v;}
function impAll(on){window._imp.vs.forEach(v=>window._imp.sel[v.vid]=on&&!impExisting(v));renderImp();}
function impAllType(tp){window._imp.vs.forEach(v=>{if(!impExisting(v))window._imp.type[v.vid]=tp;});renderImp();}
function impDo(){
  const I=window._imp;if(!I)return;let add=0,upd=0,last=null;
  I.vs.forEach(v=>{if(!I.sel[v.vid])return;
    const tribe=MAP_TRIBE[v.tribe];const ex=impExisting(v);
    if(ex){upd++;return;} // มีเมืองที่พิกัดนี้แล้ว: ข้าม ไม่สร้างและไม่แก้ไข
    const t=newTown(I.type[v.vid]||'ore');Object.assign(t,{name:v.name,vid:v.vid,x:v.x,y:v.y,pop:v.pop,capital:v.capital});if(tribe&&TRIBES[tribe])t.tribe=tribe;
    S.towns.push(t);add++;last=t.id;});
  if(!add){dlg(upd?'ทุกหมู่บ้านที่เลือกมีในแอปแล้ว (พิกัดตรงกัน) ไม่ได้สร้างเพิ่ม':'ยังไม่ได้เลือกหมู่บ้านใหม่');return;}
  autosave();cur=last;
  dlg('นำเข้าเสร็จ: เพิ่มเมืองใหม่ '+add+' เมือง'+(upd?' · ข้ามเมืองที่มีพิกัดซ้ำ '+upd+' เมือง':''),()=>{view='town';renderAll();},'ไปหน้าจัดการเมือง');
  window._imp=null;impFind();
}

// ขั้น 4: เลือกกิลด์ (Tag) ก่อน → ขั้น 5: เลือกชื่อผู้เล่นในกิลด์นั้น
function mapAllies(){
  if(window._mapAllies)return window._mapAllies;
  const A=new Map();
  window._mapRows.forEach(r=>{if(!(r.uid>0)||r.tribe===5)return;const k=r.aid||0;
    if(!A.has(k))A.set(k,{aid:k,tag:k?(r.ally||('#'+k)):'(ไม่มีกิลด์)',m:new Map()});
    const a=A.get(k);if(!a.m.has(r.uid))a.m.set(r.uid,{uid:r.uid,name:r.player,v:0,pop:0});const p=a.m.get(r.uid);p.v++;p.pop+=r.pop;});
  window._mapAllies=[...A.values()].map(a=>({aid:a.aid,tag:a.tag,members:[...a.m.values()].sort((x,y)=>x.name.localeCompare(y.name))}))
    .sort((x,y)=>(x.aid===0)-(y.aid===0)||y.members.length-x.members.length||x.tag.localeCompare(y.tag));
  return window._mapAllies;
}

  const cur=AL.find(a=>String(a.aid)===String(S.mapAlly));

      <div class="cbl" id="imp${k}l"></div></div></label></div>`;
  el.innerHTML=box(4,`กิลด์ (Tag) · ${AL.length} กิลด์`,cur?cur.tag:'',LN('พิมพ์ชื่อกิลด์เพื่อค้นหา เช่น อา หรือ War','Type a guild name to search, e.g. War'))+
    (cur?box(5,`ชื่อผู้เล่น (Avatar Name) ในกิลด์ ${esc(cur.tag)} · ${cur.members.length} คน`,S.mapPlayer||'',LN('พิมพ์ชื่อเพื่อค้นหา เช่น อา','Type a name to search')):'');

function cbHide(k){const b=document.getElementById('imp'+k+'l');if(b)b.style.display='none';}
function cbKey(e,k){

function trText(s){
  if(!/[\u0E00-\u0E7F]/.test(s))return s;
  I18N_PH.forEach(([a,b])=>{if(s.includes(a))s=s.split(a).join(b);});
  if(!/[\u0E00-\u0E7F]/.test(s))return s;
  return s.replace(THRUN,m=>I18N[m]!==undefined?I18N[m]:m.split(' ').map(p=>I18N[p]!==undefined?I18N[p]:p).join(' '));
}

function i18nNode(root){
  if(LANG()!=='en'||!root)return;

  const doEl=el=>{if(el.closest&&el.closest('[data-noi18n]'))return;I18N_ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v&&/[\u0E00-\u0E7F]/.test(v)){if(!el.hasAttribute('data-th-'+a))el.setAttribute('data-th-'+a,v);el.setAttribute(a,trText(v));}});};
  if(root.nodeType===3){doText(root);return;}
  if(root.nodeType!==1&&root.nodeType!==9)return;
  if(root.nodeType===1)doEl(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
}
function i18nRun(nodes){if(_i18nBusy)return;_i18nBusy=true;try{nodes.forEach(i18nNode);}finally{if(_i18nObs)_i18nObs.takeRecords();_i18nBusy=false;}}
function i18nRestore(){ // กลับเป็นภาษาไทย: คืนข้อความเดิมของส่วนที่ไม่ได้สร้างใหม่
  _i18nBusy=true;

  while((n=w.nextNode())){if(n.nodeType===3){if(n._th!==undefined){n.nodeValue=n._th;delete n._th;}}else I18N_ATTR.forEach(a=>{const k='data-th-'+a;if(n.hasAttribute(k)){n.setAttribute(a,n.getAttribute(k));n.removeAttribute(k);}});}

// Change Log: 1 รายการต่อสายเวอร์ชัน · มีรุ่นย่อย = เลขล่าสุด + "(สรุป .1-.N)" · c = [เลข, ข้อความรุ่น .0, ".1-.N", สรุปรุ่นย่อย TH, สรุปรุ่นย่อย EN]
const clRng=c=>c[2]?c[2].replace(/^\.1-\./,'.1–.'):'';
const clTH=c=>c[1]+(c[3]?`\nสรุป ${clRng(c)}:${c[3].startsWith('\n')?'':' '}${c[3]}`:'');
const clEN=c=>(CHANGELOG_EN[c[0].split('.').slice(0,2).join('.')+'.0']||trText(c[1]))+(c[4]?`\nSummary ${clRng(c)}:${c[4].startsWith('\n')?'':' '}${c[4]}`:'');
function openLog(){view='help';renderAll();setTimeout(()=>helpGo('h-log'),30);}
function helpGo(id){const e=document.getElementById(id);if(e){e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});}}

      <li><b>เพิ่ม/แก้เส้นทาง</b>: ฟอร์มกรอกก่อนบันทึก · เลือกปลายทาง <b>🏘️ เมืองของเรา / 🏛️ WW / 💎 อาติแฟค</b> · WW และอาติแฟค <b>ใส่พิกัด X/Y</b> แล้วแอปสร้างปลายทางให้เอง ไม่ต้องสร้างล่วงหน้า (พิกัดเดิมใช้ปลายทางเดิมซ้ำ) · <b>WW รับแร่ได้ทุกชนิด · อาติแฟครับได้แค่ข้าว</b></li>
      <li>เมื่อเลือกเมืองของเรา ตารางแสดงแร่เหลือ/ขาดของทุกเมือง คลิกเลือกต้นทาง (รับแร่) หรือปลายทาง (ส่งแร่) ได้</li>
      <li><b>ผลลัพธ์หลังบันทึก</b>: ขณะพิมพ์จำนวนแร่ในฟอร์ม จะมีตารางบอกทันทีว่า <b>เมืองต้นทางตอนนี้เหลือ/ขาดเท่าไร และหลังส่งจะเหลือเท่าไร</b> · <b>เมืองปลายทางตอนนี้และหลังรับ</b> พร้อมข้อความเตือนว่าเมืองไหนขาดแร่ชนิดใด (ถ้าปลายทางเป็น WW/อาติแฟค แสดงแร่ที่ส่งไปให้) · ตอนแก้เส้นทางเดิม ตัวเลขไม่นับเส้นทางเดิมซ้ำ</li>
      <li><b>เส้นทางขนส่ง</b> 3 แท็บ: ➡ ส่งไปไหน / ⬅ มาจากไหน / 🏛️ ภายนอก · กรองเฉพาะเมืองได้</li>

      <li><b>สถานะต้องแก้ในเกม</b>: 🆕 ต้องสร้าง · ✏️ ต้องแก้ (เดิม → ใหม่) · 🗑️ ต้องลบ → ตั้งในเกมแล้วกด ✓ (หรือวางหน้าเส้นทางการค้าใหม่)</li>
      <li><b>🔗 สร้างในเกม</b> (เฉพาะเส้นทาง 🆕 ต้องสร้าง, ต้องมี Gold Club): เปิดหน้าสร้างเส้นทางการค้าของหมู่บ้านต้นทาง โดยกรอกปลายทางและจำนวนแร่ให้แล้ว · ส่งทุก 1 ชั่วโมง เริ่ม 0:00 รอบละยอดต่อชั่วโมงในแอป · ตรวจแล้วกดบันทึกในเกม จากนั้นกด ✓ ตั้งในเกมแล้ว · การแก้และลบเส้นทางเดิมยังต้องทำในเกมเอง (ไม่มีลิงก์ให้) · ปุ่มจาง = ยังไม่รู้รหัสหมู่บ้าน (วางเมาส์ดูเหตุผล)</li>

      <li><b>🐎 พ่อค้า</b> (ป้ายเล็ก "🐎 2/20" ในแถวหัวเมืองของแท็บ ➡ ส่งไปไหน และข้างหัวข้อ 🚚 ส่งออก ในหน้าเมือง · กดป้ายเพื่อดูรายละเอียด): แอปคิดว่าตลาดเลเวล 20 = พ่อค้า 20 คน · ความจุต่อคน = ความจุของเผ่า (โรมัน 500 · ทิวตัน 1,000 · กอล 750 · อียิปต์ 750 · ฮั่น 500 · สปาร์ตัน 500 · ไวกิ้ง 750) × ความเร็วเซิร์ฟ × (1 + 20% ต่อเลเวล<b>สำนักงานการค้า</b>, โรมัน 40%) × (1 + <b>โบนัสการค้า</b>ของพันธมิตร) · ตั้งเลเวลสำนักงานการค้าที่หัวหน้าเมือง และโบนัสการค้าที่หัวแอป · บอกจำนวนพ่อค้าที่ออกไปพร้อมกันสูงสุด / 20 ถ้าเกิน ⚠️ บอกว่าส่งได้ประมาณกี่ % (เกมส่งเท่าที่มีพ่อค้าว่าง)</li>
      <li><b>💡 คำแนะนำการตั้งเส้นทางในเกม</b>: ทุกเส้นทางส่งทุก 1 ชม. · แอปเลือก <b>ทำซ้ำ ×1–3</b> ให้ใช้พ่อค้าน้อยที่สุด (พ่อค้าชุดเดิมวิ่งไปกลับต่อกันได้ไม่เกิน 60 นาที) และ<b>นาทีเริ่ม</b>ของแต่ละเส้นทางให้พ่อค้าที่ออกพร้อมกันน้อยที่สุด · ยอดในตาราง = ต่อเที่ยว · ปุ่ม 🔗 สร้างในเกม ใส่นาทีเริ่ม ทำซ้ำ และยอดต่อเที่ยวให้ตามคำแนะนำ</li>
      <li><b>ปลายทางภายนอกที่ใช้อยู่</b>: รายการที่สร้างอัตโนมัติ แก้ชื่อ/พิกัด/เจ้าของได้ · <b>แก้ X/Y แล้วแอปดึงชื่อหมู่บ้านและเจ้าของจาก map.sql ให้</b> (ถ้าโหลด map.sql แล้ว · ชื่อที่พิมพ์เองไม่ถูกทับ) · หายเองเมื่อไม่มีเส้นทางส่งไปแล้ว</li>
    </ul>`,`
    <ul>
      <li><b>Paste the page source (computer)</b>: on the game's trade routes or resources page press <b>Ctrl+U</b> (view page source) → Ctrl+A → Ctrl+C and paste into any paste box · every route group comes in, <b>folded (V) ones too</b> · it is still your own copy and paste, no program reads the game page (Travian allows copy and paste but forbids extensions/programs that read the game page) · sitter-mode pages are not imported · nothing changed = nothing saved · routes with a 🆕/✏️/🗑️ plan waiting in the game are not overwritten (marked done by themselves when they match)</li>

      <li><b>Add/edit routes</b>: a form filled before saving · pick the destination <b>🏘️ our town / 🏛️ WW / 💎 artifact</b> · for WW and artifacts <b>enter X/Y coordinates</b> and the app creates the destination itself, no need to create it first (same coordinates reuse the destination) · <b>WW accepts all resources · artifacts accept crop only</b></li>
      <li>When our own town is chosen, a table shows every town's surplus/shortage; click to pick the source (receive) or destination (send)</li>
      <li><b>Result after saving</b>: while you type the amounts in the form, a table immediately shows <b>how much the source town has now and after sending</b> · <b>the destination now and after receiving</b>, with a warning of which town is short of which resource (for a WW/artifact destination it shows what is sent) · when editing an existing route its old amounts are not counted twice</li>
      <li><b>Transport routes</b> in 3 tabs: ➡ Sent to where / ⬅ From where / 🏛️ External · filter by town</li>
      <li><b>📋 Paste the trade routes page</b> (Thai/English): <b>click V to expand every route before copying</b> · the app sums resources × times for the day ÷ 24 · replaces all exports of that village (no routes = deleted) · unexpanded destinations keep old values · destinations that are not our villages (WW/artifact) offer a button to add them as external destinations · if the village name can't be read, choose the "Source town" manually</li>
      <li><b>Needs-update status</b>: 🆕 must create · ✏️ must edit (old → new) · 🗑️ must delete → set it in game and click ✓ (or paste the trade routes page again)</li>
      <li><b>🔗 Create in game</b> (🆕 routes only, Gold Club needed): opens the create trade route page of the source village with the target and amounts filled in · every 1 hour from 0:00, each trip = the hourly amount in the app · check it, save in the game, then click ✓ Set in game · editing and deleting old routes is still done in the game (there is no link for that) · a faded button = village id not known yet (hover for the reason)</li>
      <li><b>🔁 Re-create by the plan</b> (in the 🐎 Merchants window): for when you have deleted a town's trade routes in the game and will set them again as suggested · every route of that town becomes 🆕 with a 🔗 button · press it before pasting the now-empty trade routes page (if you paste first, the app removes the routes that were set)</li>
      <li><b>🐎 Merchants</b> (a small "🐎 2/20" chip in each town header row of the ➡ Sent to where tab and next to the 🚚 Exports heading on the town page · click it for details): the app assumes Marketplace 20 = 20 merchants · capacity per merchant = tribe capacity (Romans 500 · Teutons 1,000 · Gauls 750 · Egyptians 750 · Huns 500 · Spartans 500 · Vikings 750) × server speed × (1 + 20% per <b>Trade Office</b> level, Romans 40%) × (1 + alliance <b>Commerce</b> bonus) · set the Trade Office level in the town header and the Commerce bonus in the app header · shows the most merchants out at the same time / 20; above 20 ⚠️ shows about how many % still arrive (the game sends what free merchants can carry)</li>
      <li><b>💡 Suggested trade route settings</b>: every route every 1 h · the app picks <b>repeat ×1–3</b> to use the fewest merchants (the same merchants may run back-to-back for up to 60 minutes) and a <b>start minute</b> for each route so the fewest merchants are out at once · amounts in the table are per trip · 🔗 Create in game fills in the start minute, repeat and per-trip amounts</li>
      <li><b>External destinations in use</b>: auto-created list; edit name/coordinates/owner · <b>changing X/Y fills the village name and owner from map.sql</b> (when map.sql is loaded · a name you typed is kept) · removed automatically when no route sends there any more</li>
    </ul>`)],

  ['h-crop',L('🌾 ลำดับปั่นข้าว','🌾 Crop upgrade order'),L(`<ul><li><b>ใช้ทำอะไร</b>: บอกว่าควรอัปอะไรก่อนเพื่อเพิ่มข้าวให้คุ้มที่สุด: ทุ่งข้าว · โรงสีธัญพืช · เบเกอร์รี่ · คฤหาสน์ฮีโร่ (ยึดโอเอซิสข้าว) · การประปา (อียิปต์)</li>
      <li><b>วิธีคิด</b>: ทุกขั้นเลือกสิ่งที่คืนทุนเร็วที่สุด = แร่ที่ใช้ทั้งหมด ÷ ข้าวที่เพิ่มต่อชั่วโมง · ตัวหนา = ขั้นเตรียมทาง เช่นอัปทุ่งให้ถึง 5 ก่อนสร้าง โรงสีธัญพืช หรือถึง 10 ก่อน เบเกอร์รี่</li>
      <li><b>ตั้งค่า</b> (กดปุ่มเลือก 3 กลุ่ม): จำนวนทุ่งข้าว · เมืองหลวง (ทุ่งถึง 21) หรือไม่ (ถึง 10) · เผ่าอียิปต์ · โอเอซิสข้าว 3 แห่ง · โบนัส +25% · ความเร็วเซิร์ฟใช้ค่าจากช่อง ⚡ ความเร็ว ด้านบนของแอป (ใช้คิดวันคืนทุน) · เริ่มจากทุกอย่างเลเวล 0</li>
      <li><b>เซิร์ฟที่มี City</b>: เลือก "ระบบเมือง: มี" → แอปใส่ขั้น ศาลากลาง 20 + อัปเป็น City เมื่อคุ้ม (คิดว่ายังไม่เป็น City และ ศาลากลาง เริ่มที่ 0 เสมอ) · City ที่ไม่ใช่เมืองหลวงอัปทุ่งได้ถึง 12 · การประปา สร้างได้เฉพาะใน City</li>
      <li><b>คอลัมน์ตาราง</b>: M · B · H · W (เลเวล โรงสีธัญพืช · เบเกอร์รี่ · คฤหาสน์ฮีโร่ · การประปา) · ทุ่ง · ทำอะไร · แร่ที่ใช้ · ข้าว/ชม. หลังทำ · คืนทุน</li>
      <li>แนวคิดจากเครื่องมือ Travian Capital Crop/Oasis/เบเกอร์รี่ Order (Bryan H, MaTzE, Ricardo) เขียนใหม่ด้วยข้อมูลอาคารของแอป</li></ul>`,`<ul><li><b>What it does</b>: tells you what to upgrade first to raise crop most efficiently: croplands · Grain Mill · Bakery · Hero's Mansion (crop oasis capture) · Waterworks (Egyptians)</li>
      <li><b>How</b>: every step picks what pays back fastest = total resources ÷ extra crop per hour · bold = a preparing step, e.g. raising a field to 5 before the Grain Mill or to 10 before the Bakery</li>

      <li><b>Table columns</b>: M · B · H · W (Grain Mill · Bakery · Hero's Mansion · Waterworks levels) · fields · action · cost · crop/h after · payback</li>

  ['h-gar',L('🍞 ข้าวทหารฝาก','🍞 Reinforcement crop'),L(`<ul><li><b>ใช้ทำอะไร</b>: ตอนถืออาติลดข้าว (1/2 หรือ 3/4) แล้วเพื่อนเอาทหารมาฝากในเมืองเรา ใช้เช็กว่าแต่ละคนส่งข้าวมาพอกับที่ทหารของเขากินหรือไม่</li>

  ['h-formula',L('📏 สูตรที่ใช้','📏 Formulas'),L(`
    <ul>
      <li><b>เวลาฝึก</b> = เวลา(x1, Lv1) × 0.9^(Lv−1) ÷ x × (1−หมวก) × อาติแฟค × (1−กิลด์) × (1−1%×Horse Drinking Trough)</li>
      <li><b>เวลาสร้าง</b> = เวลา(x1, MB1) × 0.964^(MB−1) ÷ x (ปัดหลัก 10 วินาที, คลาดได้ ±10 วิ)</li>
      <li><b>ค่าสถานะที่ upgrade lvl</b> = ฐาน + (ฐาน + 298/7 × ข้าวที่กิน) × (1.007^Lv − 1)</li>
      <li><b>วิจัย (Academy)</b> ต่อแร่ = α × ต้นทุนฝึก + K (α = 6/4/8/6 ไม้/โคลน/เหล็ก/ข้าว · K = 100/100/200/160) · เวลา = 1800 + 3 × เวลาฝึก (ที่ความเร็วเซิร์ฟเวอร์นั้น วินาที · ค่า 1800 ไม่หารด้วยความเร็ว · ไม่ขึ้นกับ Smithy Lv และ Academy Lv) · หน่วยตั้งต้นไม่ต้องวิจัย · <b>ตัวยึด</b> (มีแต่วิจัย): แร่ = 0.5/0.5/0.8/0.6 × ต้นทุนฝึก + 500/200/400/160 · เวลา = 1800 + เวลาฝึก ÷ 4 (เวลาฝึกที่ความเร็วนั้น) (ตรง Senator, Ephor, Jarl) · ค่าอาจลงท้าย .5</li>
      <li><b>อัปเกรดเกราะ (Smithy) Lv 1</b> ต่อแร่ = (7 × ต้นทุนฝึก + K) ÷ ข้าวที่กิน · เวลา = 1800 + 3 × เวลาฝึก · <b>เลเวล L</b> = ค่า Lv 1 (ไม่ปัด) × L^0.8 แล้วปัดแร่เป็น 5 และเวลาเป็นวินาที · เวลาจริง = ปัดครั้งเดียว: (1800 + 3 × เวลาฝึกที่ x) × L^0.8 × 0.964^(Smithy Lv−1) (ตรง kirilloid ที่ x1/x2/x3 และ Smithy Lv 1/10/20) · สูตรตรงกับ kirilloid ทุกค่า: Romans ครบ 8 หน่วย (835 ค่า) และอีก 21 หน่วยจาก Teutons Gauls Egyptians Huns Spartans Vikings (วิจัย + เลเวล 1, 2, 10, 20 + ตัวยึด) รวมถึงเวลาที่ Smithy Lv 20 ครบ 20 เลเวล</li>
      <li><b>Celebration/ชม.</b> = ต้นทุน ÷ เวลางาน · <b>เส้นทางการค้า/ชม.</b> = Σ(แร่ × ครั้ง) ต่อวัน ÷ 24</li>
      <li>แร่ที่ใช้ปัดขึ้น · จำนวนทหารปัดลง</li>
    </ul>`,`
    <ul>
      <li><b>Training time</b> = time(x1, Lv1) × 0.9^(Lv−1) ÷ x × (1−helmet) × artifact × (1−guild) × (1−1%×Horse Drinking Trough)</li>
      <li><b>Building time</b> = time(x1, MB1) × 0.964^(MB−1) ÷ x (rounded to 10 s, may differ ±10 s)</li>
      <li><b>Stats at the upgrade lvl</b> = base + (base + 298/7 × upkeep) × (1.007^Lv − 1)</li>
      <li><b>Research (Academy)</b> per resource = α × training cost + K (α = 6/4/8/6 lumber/clay/iron/crop · K = 100/100/200/160) · time = 1800 + 3 × training time (at that server speed, in seconds · the 1800 is not divided by the speed · independent of the Smithy Lv and the Academy Lv) · the starting unit needs no research · <b>chief units</b> (research only): resources = 0.5/0.5/0.8/0.6 × training cost + 500/200/400/160 · time = 1800 + training time ÷ 4 (matches Senator, Ephor, Jarl) · values may end in .5</li>
      <li><b>Armor upgrade (Smithy) Lv 1</b> per resource = (7 × training cost + K) ÷ upkeep · time = 1800 + 3 × training time · <b>level L</b> = the unrounded Lv 1 value × L^0.8, then resources rounded to 5 and time to seconds · real time = rounded once: (1800 + 3 × training time at x) × L^0.8 × 0.964^(Smithy Lv−1) (matches kirilloid at x1/x2/x3 and Smithy Lv 1/10/20) · the formulas match kirilloid on every value checked: all 8 Romans units (835 values) plus 21 units from Teutons, Gauls, Egyptians, Huns, Spartans and Vikings (research + levels 1, 2, 10, 20 + chiefs), and the times at Smithy Lv 20 on all 20 levels</li>
      <li><b>Celebration/h</b> = cost ÷ duration · <b>Trade route/h</b> = Σ(resources × times) per day ÷ 24</li>
      <li>Resources used are rounded up · troop counts rounded down</li>
    </ul>`)],

  ['h-cloud',L('☁️ ล็อกอิน Google และซิงค์ข้อมูล','☁️ Google sign-in and sync'),L(`

    </ul>`)],
  ['h-map',L('🗺️ แผนที่','🗺️ Map'),L(`

  const x=xs===''?null:Math.round(+xs),y=ys===''?null:Math.round(+ys);
  if(x!=null&&y!=null){const d=S.towns.find(o=>+o.x===x&&+o.y===y&&o.x!=null);if(d){dlg('มีเมืองที่พิกัด ('+x+'/'+y+') แล้ว: '+d.name+'\nไม่สร้างซ้ำ');return;}}
  closeAddTown();addTown(type);const t=T(cur);if(nm)t.name=nm;if(x!=null&&!isNaN(x))t.x=x;if(y!=null&&!isNaN(y))t.y=y;renderAll();autosave();

function addTown(type){const t=newTown(type);S.towns.push(t);cur=t.id;view='town';renderAll();autosave();}
function setXY(k,v){const t=T(cur);if(!t)return;const n=String(v).trim()===''?null:Math.round(+v);t[k]=(n===null||isNaN(n))?null:n;

function dupTown(id){const t=T(id==null?cur:id);if(!t)return;const n=JSON.parse(JSON.stringify(t));n.id=S.nextId++;n.name=t.name+' (สำเนา)';n.exports=[];S.towns.splice(S.towns.indexOf(t)+1,0,n);cur=n.id;view='town';renderAll();autosave();}
function clearTown(id){
  const t=T(id==null?cur:id);if(!t)return;
  dlg('ล้างข้อมูลของ "'+t.name+'" ?\nจะรีเซ็ตการผลิต เส้นทางส่งออก Celebration อาคารฝึกทหาร และโบนัสของเมืองนี้ให้เป็นค่าเริ่มต้น\nชื่อ ประเภท และเผ่าของเมืองยังอยู่ · เส้นทางที่เมืองอื่นส่งมาที่เมืองนี้ไม่ถูกลบ\nกู้คืนไม่ได้ (ยกเว้นโหลดจากไฟล์ Save)',()=>{
    const f=newTown(t.type);
    Object.assign(t,{prod:[0,0,0,0],exports:[],th:1,celeb:'none',horse:0,helmI:'',helmC:'',art:100,bld:f.bld});
    window._pasteMsg='';renderAll();autosave();
  },'ล้างข้อมูล',true);
}
function delTown(id){
  const t=T(id==null?cur:id);if(!t)return;
  dlg('ลบ "'+t.name+'" ?\nเส้นทางส่งออกที่ชี้มาเมืองนี้จะถูกลบด้วย และกู้คืนไม่ได้ (ยกเว้นโหลดจากไฟล์ Save)',()=>{
    const tid=t.id;
    S.towns=S.towns.filter(x=>x.id!==tid);
    S.towns.forEach(o=>o.exports=o.exports.filter(e=>e.to!==tid));
    if(cur===tid)cur=S.towns.length?S.towns[0].id:null;
    renderAll();autosave();
  },'ลบเมือง',true);
}

function moveFolder(fid,dir){const i=S.folders.findIndex(x=>x.id===fid),j=i+dir;if(i<0||j<0||j>=S.folders.length)return;[S.folders[i],S.folders[j]]=[S.folders[j],S.folders[i]];renderList();autosave();}

// ลำดับเมือง = ลำดับใน S.towns (ใช้ทุกหน้า) · ▲▼ สลับกับเมืองก่อน/หลังในโฟลเดอร์เดียวกัน
function nudgeTown(id,dir){const t=T(id);if(!t)return;const same=S.towns.filter(x=>(x.folder??null)===(t.folder??null));const i=same.indexOf(t),j=i+dir;if(j<0||j>=same.length)return;
  const a=S.towns.indexOf(t),b=S.towns.indexOf(same[j]);[S.towns[a],S.towns[b]]=[S.towns[b],S.towns[a]];renderAll();autosave();}
// ย้ายเมือง: beforeId = วางไว้ก่อนเมืองนั้น (ใช้โฟลเดอร์เดียวกับเมืองนั้น) · ไม่ระบุ = ท้ายโฟลเดอร์ fid (null = ไม่จัดกลุ่ม)
function moveTown(id,beforeId,fid){
  const t=T(id);if(!t||id===beforeId)return;
  S.towns.splice(S.towns.indexOf(t),1);
  if(beforeId!=null){const b=T(beforeId);if(!b){S.towns.push(t);}else{t.folder=b.folder??null;S.towns.splice(S.towns.indexOf(b),0,t);}}
  else{t.folder=fid??null;let last=-1;S.towns.forEach((x,i)=>{if((x.folder??null)===(fid??null))last=i;});S.towns.splice(last>=0?last+1:S.towns.length,0,t);}
  renderAll();autosave();
}

function dragLeaveRow(e){e.currentTarget.classList.remove('dov');}
function dropTown(e,beforeId){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dov');const d=window._drag;window._drag=null;if(d!=null)moveTown(d,beforeId,undefined);}
function dropFolder(e,fid){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove('dov');const d=window._drag;window._drag=null;if(d!=null)moveTown(d,null,fid);}

function renderList(){
  const L=document.getElementById('townlist');
  const q=(window._q||'').trim().toLowerCase(),flt=window._flt||'all',srt=window._sort||'created',dense=window._dense!==false,edit=!!window._edit;
  S.folders=S.folders||[];
  const eb=document.getElementById('tedit');if(eb){eb.textContent=edit?'✓ เสร็จสิ้น':'✏️ จัดเรียง / จัดกลุ่ม';eb.classList.toggle('pri',edit);}
  const info=new Map(S.towns.map(t=>[t.id,calc(t)]));
  const negs=t=>info.get(t.id).net.filter(x=>Math.round(x)<0).length;
  let vis=S.towns.filter(t=>(!q||t.name.toLowerCase().includes(q))&&(flt!=='bad'||negs(t)>0));
  if(srt==='name')vis=vis.slice().sort((a,b)=>a.name.localeCompare(b.name,'th',{numeric:true}));
  if(srt==='bad')vis=vis.slice().sort((a,b)=>negs(b)-negs(a));
  const card=t=>{
    const ic=tribeBadge(t.tribe)+`<span class="ttype" title="${t.type==='ore'?'เมืองแร่':'เมืองทหาร'}">${t.type==='ore'?'⛏️':'🗡️'}</span>`,on=(t.id===cur&&view==='town')?'on':'',clk=`cur=${t.id};view='town';renderAll();asideClose()`;
    if(dense)return `<button class="town c ${on}" data-id="${t.id}" onclick="${clk}" oncontextmenu="townMenu(event,${t.id})"><span class="ti">${ic}</span><span class="tn" data-noi18n>${esc(t.name)}</span><span class="tacts" id="ta-${t.id}">${actIcons(t,info.get(t.id))}</span>${t.x!=null&&t.y!=null?`<span class="xy">(${t.x}/${t.y})</span>`:''}<span class="dot ${negs(t)?'bad':'ok'}" id="dot-${t.id}"></span></button>`;
    return `<button class="town ${on}" data-id="${t.id}" onclick="${clk}" oncontextmenu="townMenu(event,${t.id})"><span class="ti">${ic}</span><span class="tx"><span class="tn" data-noi18n>${esc(t.name)}</span><small>${t.type==='ore'?'เมืองแร่':'เมืองทหาร · '+t.tribe}${t.x!=null?` · (${t.x}/${t.y})`:''}<span class="tacts" id="ta-${t.id}">${actIcons(t,info.get(t.id))}</span></small><small id="tl-${t.id}"></small></span></button>`;
  };
  const row=t=>{const f=folderOf(t),btn=card(t),st=f?` style="--fc:${f.color}"`:'';
    if(!edit)return `<div class="trow"${st}>${btn}</div>`;
    const opts=`<option value="">${NOF()}</option>`+S.folders.map(x=>`<option value="${x.id}" ${t.folder===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
    return `<div class="trow edit"${st} draggable="true" ondragstart="dragTown(event,${t.id})" ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropTown(event,${t.id})"><span class="grab" title="ลากเพื่อย้าย">⠿</span>${btn}<span class="tmv"><button onclick="nudgeTown(${t.id},-1)" title="ขึ้น">▲</button><button onclick="nudgeTown(${t.id},1)" title="ลง">▼</button></span>${S.folders.length?`<select class="tfs" data-noi18n onchange="setTownFolder(${t.id},this.value)">${opts}</select>`:''}</div>`;};
  const cnt=(n,all)=>n===all?all:n+'/'+all;
  const secs=[];
  S.folders.forEach(f=>{
    const list=vis.filter(t=>t.folder===f.id),all=S.towns.filter(t=>t.folder===f.id).length;
    if(!edit&&!list.length)return;
    secs.push(`<div class="fld" style="--fc:${f.color}"><div class="fldh" ${edit?`ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropFolder(event,${f.id})"`:''}><button class="fldt" onclick="toggleFolder(${f.id})"><span>${f.closed?'▸':'▾'}</span><span class="fdot" style="background:${f.color}"></span><b data-noi18n>${esc(f.name)}</b><span class="cnt">${cnt(list.length,all)}</span></button>${edit?`<span class="fedit"><input type="color" value="${f.color}" title="สี" onchange="setFolderColor(${f.id},this.value)"><button onclick="renameFolder(${f.id})" title="เปลี่ยนชื่อ">✏️</button><button onclick="moveFolder(${f.id},-1)" title="ขึ้น">▲</button><button onclick="moveFolder(${f.id},1)" title="ลง">▼</button><button onclick="delFolder(${f.id})" title="ลบโฟลเดอร์">🗑️</button></span>`:''}</div>${f.closed?'':(list.map(row).join('')||`<p class="note" style="margin:2px 6px 8px">ลากเมืองมาวางที่นี่</p>`)}</div>`);
  });
  const un=vis.filter(t=>t.folder==null);
  if(S.folders.length&&(un.length||edit))secs.push(`<div class="fld"><div class="fldh" ${edit?`ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropFolder(event,null)"`:''}><span class="fldt static"><b data-noi18n>${NOF()}</b><span class="cnt">${cnt(un.length,S.towns.filter(t=>t.folder==null).length)}</span></span></div>${un.map(row).join('')}</div>`);
  else if(!S.folders.length)secs.push(un.map(row).join(''));
  const tools=edit?`<div class="etools"><button class="pri" onclick="addFolder()">＋ โฟลเดอร์</button><span class="note">ลากเมือง (⠿) เพื่อย้าย · หรือใช้ ▲▼ · เลือกโฟลเดอร์ที่ช่องใต้ชื่อเมือง</span></div>`:'';
  L.innerHTML=S.towns.length?(tools+(secs.join('')||'<p class="note" style="margin:4px">ไม่พบเมือง</p>')):(tools+'<p class="note">ยังไม่มีเมือง กดปุ่มด้านบนเพื่อเพิ่ม</p>');
  asideLbl();
}

/* ============ วางหน้า "เส้นทางการค้า" จากตลาดสินค้า → อัปเดตการส่งออกตามของจริง ============ */
function pageLines(raw){return raw.replace(/[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').split(/\r?\n/).map(x=>x.trim().replace(/^[*•]\s+/,''));}
function villageInfo(lines){ // ชื่อหมู่บ้านปัจจุบัน + รายชื่อหมู่บ้านพร้อมพิกัด (ท้ายหน้า)
  const pi=lines.findIndex(x=>/^(ประชากร|Population)/i.test(x));let name='';
  if(pi>0)for(let j=pi-1;j>=0;j--){if(lines[j]){name=lines[j];break;}}
  const cre=/^\(\s*([−–-]?\d+)\s*\|\s*([−–-]?\d+)\s*\)$/,list={};
  if(pi>0)for(let j=pi+1;j<lines.length;j++){let k=j+1;while(k<lines.length&&!lines[k])k++;const m=lines[j]&&(lines[k]||'').match(cre);
    if(m&&!cre.test(lines[j]))list[lines[j]]={x:parseInt(m[1].replace(/[−–]/,'-'),10),y:parseInt(m[2].replace(/[−–]/,'-'),10)};}
  return {name,list,me:list[name]||null};
}
function parseTradeRoutes(raw){
  const L=pageLines(raw),vi=villageInfo(L),nz=L.filter(x=>x);
  const dests={};let cur=null;
  for(let i=0;i<nz.length;i++){
    const m=nz[i].match(/^(ไปยัง|To|Target)\s*:\s*(.+)$/i);if(m){cur=m[2].trim();dests[cur]=dests[cur]||{day:[0,0,0,0],rows:0};continue;}
    if(cur&&/^\d+$/.test(nz[i])&&/^\d+$/.test(nz[i+1]||'')&&/^\d+$/.test(nz[i+2]||'')&&/^\d+$/.test(nz[i+3]||'')){
      // รูปแบบ: ไม้ โคลน เหล็ก ข้าว [N×] เวลา พ่อค้า  (ถ้าส่งครั้งเดียว เกมไม่แสดง N×)
      const tre=/^\d{1,2}:\d{2}$/,rm=(nz[i+4]||'').match(/^(\d+)\s*[×x]$/i);
      let rep=0,step=0;
      if(rm&&tre.test(nz[i+5]||'')){rep=+rm[1];step=6;}else if(tre.test(nz[i+4]||'')){rep=1;step=5;}
      if(rep){const r=[0,1,2,3].map(j=>+nz[i+j]*rep);const d=dests[cur]=dests[cur]||{day:[0,0,0,0],rows:0};r.forEach((v,j)=>d.day[j]+=v);d.rows++;i+=step;}
    }
  }
  return {src:vi.name,srcXY:vi.me,list:vi.list,dests,isTrade:/เส้นทางการค้า|trade route/i.test(raw)};
}
function findTownBy(name,xy){return (xy&&S.towns.find(t=>t.x!=null&&+t.x===xy.x&&+t.y===xy.y))||S.towns.find(t=>t.name===name)||null;}
function trSay(h,bad){window._trMsg=(bad?'<span class="warn">':'')+h+(bad?'</span>':'');const m=document.getElementById('trmsg');if(m)m.innerHTML=window._trMsg;}
function onTradePaste(el){
  const v=el.value;if(!v.trim())return;el.value='';
  if(srcIs(v)){if(!pasteSource(v,m=>trSay(m)))trSay('⚠ '+LN('ซอร์สนี้ไม่ใช่หน้าเส้นทางการค้าหรือหน้าทรัพยากร','This source is neither the trade routes page nor the resources page'),true);return;}
  const P=parseTradeRoutes(v);
  if(!P.isTrade&&!Object.keys(P.dests).length){trSay('⚠ ไม่ใช่หน้าเส้นทางการค้า — เปิดหน้า ตลาดสินค้า → เส้นทางการค้า แล้วกด Ctrl+A, Ctrl+C ใหม่',true);return;}
  const t=window._trSrc?T(+window._trSrc):findTownBy(P.src,P.srcXY);
  tradeSmart(t,P,m=>trSay(m));
}
// แทนการส่งออก "ทั้งหมด" ของเมืองต้นทางด้วยเส้นทางในหน้าที่วาง (หน้าเส้นทางการค้าแสดงทุกปลายทางของหมู่บ้านนั้น · ไม่มีเส้นทาง = ไม่ได้ส่ง)
function tradeApply(){
  const P=window._trPending;if(!P)return;
  const pick=window._trSrc?T(+window._trSrc):null;
  const src=pick||(P.srcXY||S.towns.some(t=>t.name===P.src)?findTownBy(P.src,P.srcXY):null);
  if(!src){trSay(`⚠ อ่านไม่ได้ว่าข้อความนี้เป็นของหมู่บ้านไหน${P.src?` (เจอ "${esc(P.src)}" แต่ไม่ใช่ชื่อหมู่บ้าน)`:''} — เลือก <b>เมืองต้นทาง</b> ในช่องด้านบน แล้วกด <button class="pri" onclick="tradeApply()">ใช้ข้อมูลที่วางไว้</button>`,true);return;}
  const keys=Object.keys(P.dests),next=[],out=[],miss=[],folded=[],syncIds=[];
  window._trLast=P;window._trMiss=[];
  keys.forEach(k=>{const d=P.dests[k],xy=P.list[k]||null,dst=findDestBy(k,xy);
    if(!dst||dst.id===src.id){const mi=window._trMiss.push(k)-1;miss.push(esc(k)+(xy?` (${xy.x}/${xy.y})`:'')+` <button onclick="trExt(${mi},'ww')">＋ 🏛️ เป็น WW</button> <button onclick="trExt(${mi},'art')">＋ 💎 เป็นอาติแฟค</button>`);return;}
    if(!d.rows){ // ยังไม่ได้กาง V: ไม่มีรายละเอียดแร่ → คงค่าเดิมไว้
      const old=src.exports.find(e=>e.to===dst.id);if(old)next.push(old);
      folded.push(`<b>${esc(dst.name)}</b>${old?' (คงค่าเดิม)':' (ยังไม่มีค่าในแอป)'}`);return;}
    syncIds.push(dst.id);const h=d.day.map(x=>Math.round(x/24));if(dst.kind==='art'){h[0]=h[1]=h[2]=0;}const ex=next.find(e=>e.to===dst.id);if(ex)h.forEach((v,j)=>ex.r[j]+=v);else next.push({to:dst.id,r:h});
    out.push(`➡ <b>${esc(dst.name)}</b>: ${h.map((x,j)=>x?RNAME[j]+' '+fmt(x):'').filter(Boolean).join(' · ')||'0'} ต่อชม. <span class="note">(${d.rows} รายการ/วัน)</span>`);});
  const removed=src.exports.filter(e=>!next.some(n=>n.to===e.to)&&D(e.to)).map(e=>esc(D(e.to).name));
  next.forEach(e=>{if(syncIds.includes(e.to)){delete e.pend;delete e.prev;}});
  src.exports=next;src.delPend=[];extGc();window._trPending=null;autosave();renderAll();
  trSay(`✓ อัปเดตการส่งออกของ <b>${esc(src.name)}</b>${src.x!=null?` (${src.x}/${src.y})`:''} ตามเส้นทางการค้าแล้ว<br>`+
    (out.length?out.join('<br>'):(keys.length?'':'ไม่มีเส้นทางการค้า → <b>เมืองนี้ไม่ได้ส่งแร่ไปไหน</b>'))+
    (folded.length?`<br><span class="warn">⚠ ยังไม่ได้กาง V (ไม่เห็นจำนวนแร่): ${folded.join(', ')} — ในเกมกดลูกศร V ของทุกเส้นทางให้กางออก แล้วคัดลอกวางใหม่</span>`:'')+
    (removed.length?`<br><span class="note">ลบเส้นทางเดิมที่ไม่มีในเกมแล้ว: ${removed.join(', ')}</span>`:'')+
    (miss.length?`<br><span class="warn">⚠ ไม่พบเมืองปลายทางในแอป (ข้ามไว้): ${miss.join(' · ')}</span><br><span class="note">ถ้าเป็นหมู่บ้าน WW หรืออาติแฟค กดปุ่มเพื่อเพิ่มเป็นปลายทางภายนอก แล้วระบบจะใช้ข้อมูลที่วางไว้ให้อีกครั้ง</span>`:''),false);
}

/* ============ ปลายทางภายนอก: 🏛️ WW (ทุกชนิด) · 💎 อาติแฟค (ข้าวอย่างเดียว) ============ */
// เก็บใน S.ext · id ติดลบ เพื่อไม่ชนกับ id เมือง · เส้นทางไปที่นี่ = ส่งออกของเมืองต้นทาง
const EXT_KIND={ww:{i:'🏛️',n:'WW'},art:{i:'💎',n:'อาติแฟค'}};
function extList(){S.ext=S.ext||[];return S.ext;}
function D(id){return T(id)||extList().find(e=>e.id===id)||null;}
const isArt=id=>{const d=D(id);return !!(d&&d.kind==='art');};
function extAdd(kind,name,xy){const L=extList();const id=-(1+L.reduce((a,e)=>Math.max(a,-e.id),0));const e={id,kind,name:name||((kind==='ww'?'WW ':'Artifact ')+(-id)),x:xy?xy.x:null,y:xy?xy.y:null,owner:''};L.push(e);return e;}
function extNew(kind){extAdd(kind);renderAll();autosave();}
const extAutoName=(kind,x,y)=>EXT_KIND[kind].n+(x!=null&&y!=null?' ('+x+'/'+y+')':'');
// หา/สร้างปลายทางภายนอกจากชนิด+พิกัด (ผู้ใช้ไม่ต้องสร้างล่วงหน้า)
function extFind(kind,x,y){return extList().find(e=>e.kind===kind&&x!=null&&y!=null&&e.x!=null&&+e.x===+x&&+e.y===+y)||null;}
function extEnsure(kind,x,y,name){let e=extFind(kind,x,y);if(!e){e=extAdd(kind,name||extAutoName(kind,x,y),{x,y});extMap(e);}else if(name)e.name=name;return e.id;}
// ลบปลายทางภายนอกที่ไม่มีเส้นทางอ้างอิงแล้ว (รวมรายการที่รอลบในเกม)
function extGc(){const refs=new Set();S.towns.forEach(t=>{t.exports.forEach(e=>refs.add(e.to));(t.delPend||[]).forEach(d=>refs.add(d.to));});S.ext=extList().filter(e=>refs.has(e.id));}
// แก้พิกัดปลายทางภายนอก → ดึงชื่อหมู่บ้าน/เจ้าของจาก map.sql (ชื่อที่ผู้ใช้พิมพ์เองไม่ถูกทับ)
const EXT_AUTO_RE=/^(WW|Artifact|อาติแฟค)( \d+| \(-?\d+\/-?\d+\))?$/;
function extMap(e){delete e.did;
  try{if(mpHost()&&!MP.rows)mpLoadCache();}catch(x){}
  const auto=!String(e.name||'').trim()||EXT_AUTO_RE.test(e.name)||(e.mName&&e.name===e.mName);
  const r=(e.x!=null&&e.y!=null&&MP.rows)?MP.rows.find(q=>q.x===e.x&&q.y===e.y):null;
  if(r){e.did=+r.vid;if(auto){e.name=r.name;e.mName=r.name;}e.owner=r.player||'';e.mOwner=e.owner;}
  else{if(auto){e.name=extAutoName(e.kind,e.x,e.y);delete e.mName;}if(e.mOwner&&e.owner===e.mOwner){e.owner='';delete e.mOwner;}}
  return r;}
function extSet(id,k,v){const e=D(id);if(!e||id>=0)return;
  if(k==='x'||k==='y'){const n=String(v).trim()===''?null:Math.round(+v);e[k]=isNaN(n)?null:n;extMap(e);}else e[k]=String(v).trim();
  if(k==='kind'&&e.kind==='art')S.towns.forEach(t=>t.exports.forEach(r=>{if(r.to===id&&r.r.slice(0,3).some(x=>x)){const b=r.r.slice();r.r=[0,0,0,r.r[3]];pendMark(r,b);}}));
  renderAll();autosave();}
function extDel(id){const e=D(id);if(!e)return;const n=S.towns.reduce((a,t)=>a+t.exports.filter(r=>r.to===id).length,0);
  dlg('ลบปลายทาง "'+e.name+'" ?'+(n?'\nเส้นทางที่ส่งไปที่นี่ '+n+' เส้นทางจะถูกลบด้วย':''),()=>{S.towns.forEach(t=>{t.exports=t.exports.filter(r=>r.to!==id);t.delPend=(t.delPend||[]).filter(d=>d.to!==id);});S.ext=extList().filter(x=>x.id!==id);renderAll();autosave();},'ลบ',true);}
function extRecv(id){const r=[0,0,0,0];S.towns.forEach(t=>t.exports.forEach(e=>{if(e.to===id)e.r.forEach((v,j)=>r[j]+=v);}));return r;}

// รวมแร่ ประชากร CP และเวลา (ต่อ MB Lv) ของแผน
function planTotals(p){
  const res=[0,0,0,0];let pop=0,cp=0;const base=[];
  p.items.forEach(r=>{const b=BUILD_DATA[r.name];if(!b)return;const rs=b.rows.slice(r.from,r.to);
    rs.forEach(x=>{for(let j=0;j<4;j++)res[j]+=x[j]*r.n;pop+=x[4]*r.n;base.push([x[6],r.n]);});
    cp+=((b.rows[r.to-1]||[])[5]||0)*r.n;});
  const timeAt=mb=>base.reduce((a,[sec,n])=>a+bTime(sec,mb)*n,0);
  return {res,pop,cp,timeAt};
}

  if(c.tr&&c.tr.h.some(v=>v>0)){const dt=c.tr.detail,n=dt.length;
    const bl=k=>LANG()==='en'?trText(BSHORT[k]):BSHORT[k];
    const lines=dt.map(x=>`${x.name} (${bl(x.k)}) · ≈${fmt(Math.floor(x.perH))} ${LN('ตัว/ชม.','units/h')}${x.mode==='count'?' · '+LN('รวม ','total ')+fmt(x.qty)+' '+LN('ตัว','units'):''}`);

  return h;
}

function pendMark(e,before){

}

function newRoute(src,to,r){ // เส้นทางใหม่: ถ้าเคยถูกลบ (รอลบในเกม) ให้นับเป็นแก้ไขแทน

function syncRoute(tid,i){const t=T(tid),e=t&&t.exports[i];if(!e)return;delete e.pend;delete e.prev;toast('✓ ตั้งในเกมแล้ว: '+t.name+' → '+(D(e.to)||{}).name);renderAll();autosave();refreshFlow();}

/* ============ 🐎 พ่อค้า: เช็กพ่อค้าพอไหม + คำแนะนำนาทีส่ง / ทำซ้ำ (v1.76.0) ============ */
// ความจุตั้งต้นต่อพ่อค้า (x1) จากหน้าช่วยเหลือของ Travian · ×ความเร็วเซิร์ฟ · สำนักงานการค้า +20%/เลเวล (โรมัน +40%) · ×(1+โบนัสการค้าพันธมิตร)

const MCAP={Romans:500,Teutons:1000,Gauls:750,Egyptians:750,Huns:500,Spartans:500,Vikings:750},MCH_N=20;
function mchCap(t){return Math.round((MCAP[t.tribe]||750)*(+S.speed||1)*(1+(+t.tof||0)*(t.tribe==='Romans'?0.4:0.2))*(1+(+S.trade||0)/100));}
function mchLoad(L,s,dur,m){const n=Math.ceil(dur-1e-9);for(let o=0;o<n;o++)L[(s+o)%60]+=m;}
// แผนต่อเมืองต้นทาง: ทุกเส้นทางส่งทุก 1 ชม. · เลือก × (1–3) ให้ใช้พ่อค้าน้อยสุดโดยไม่วิ่งเกิน 60 นาที · จัดนาทีเริ่มให้พ่อค้าที่ออกพร้อมกันน้อยสุด
function mchPlan(t){
  const res={cap:mchCap(t),routes:[],skip:[],peak:0,naive:0,pct:100};
  if(!t||t.x==null||t.y==null){res.err=LN('ใส่พิกัด X/Y ของเมืองนี้ก่อน','Set this town\'s X/Y first');return res;}
  const spd=(MERCH_SPEED[t.tribe]||16)*mpSpeedMul(),cap=res.cap;
  t.exports.forEach((e,i)=>{const d=D(e.to);if(!d)return;const A=e.r.reduce((a,v)=>a+(+v||0),0);if(A<=0)return;
    if(d.x==null||d.y==null||d.x===''){res.skip.push(d);return;}
    const leg=Math.round(mpDist(t,d)/spd*3600),rt=2*leg;let best=null;
    for(let k=1;k<=3;k++){const per=e.r.map(v=>Math.ceil((+v||0)/k)),m=Math.max(1,Math.ceil(per.reduce((a,v)=>a+v,0)/cap)),dur=k*rt/60;
      if(k>1&&dur>60)break;if(!best||m<best.m)best={k,m,dur,per};}
    const m1=Math.max(1,Math.ceil(A/cap));
    res.routes.push(Object.assign({e,i,d,A,leg,rt,m1,dur1:rt/60},best));});
  const L=new Array(60).fill(0),N=new Array(60).fill(0);
  res.routes.forEach(r=>mchLoad(N,0,r.dur1,r.m1));res.naive=Math.max(0,...N);
  res.routes.slice().sort((a,b)=>b.m*b.dur-a.m*a.dur).forEach(r=>{let bs=0,bp=1e9,bq=1e18;
    for(let s=0;s<60;s++){const T2=L.slice();mchLoad(T2,s,r.dur,r.m);const p=Math.max(...T2),q=T2.reduce((a,v)=>a+v*v,0);if(p<bp||(p===bp&&q<bq)){bp=p;bq=q;bs=s;}}
    r.start=bs;mchLoad(L,bs,r.dur,r.m);});
  res.peak=Math.max(0,...L);
  if(res.peak>MCH_N){   // เกมส่งเท่าที่มีพ่อค้าว่าง: จำลอง 4 ชม. (นับ 3 ชม.หลัง) ทีละนาที
    let busy=[],want=0,got=0;const H=Math.max(4,Math.ceil(Math.max(...res.routes.map(r=>r.dur))/60)+2)*60;   // จำลองจนพ่อค้ากลับมาครบหลายรอบ แล้วนับ 24 ชม.สุดท้าย
    for(let mi=0;mi<H+1440;mi++){busy=busy.filter(b=>b.u>mi);let free=MCH_N-busy.reduce((a,b)=>a+b.n,0);
      res.routes.filter(r=>r.start===mi%60).forEach(r=>{const n=Math.max(0,Math.min(r.m,free));free-=n;if(n)busy.push({u:mi+Math.ceil(r.dur),n});if(mi>=H){want+=r.A;got+=r.A*n/r.m;}});}
    res.pct=want?Math.max(got>0?1:0,Math.floor(got/want*100)):100;}

    <p class="note">${LN('ในเกม: ทุก 1 ชม. · เริ่มที่นาทีที่แนะนำ · ทำซ้ำตามช่อง × · ยอดในตาราง = ต่อเที่ยว (× จำนวนครั้ง = ยอดต่อชั่วโมงในแอป) · ปุ่ม 🔗 สร้างในเกม ใส่ค่าตามนี้ให้','In the game: every 1 h · start at the suggested minute · repeat as in the × column · amounts are per trip (× repeats = the hourly amount in the app) · the 🔗 Create in game button fills these in')}</p></details>`;

(function(){let box=null,cur=null;
  function show(el){const t=el.getAttribute('data-tip');if(!t)return;if(!box){box=document.createElement('div');box.id='qtipf';box.setAttribute('data-noi18n','');document.body.appendChild(box);}
    box.textContent=t;box.style.display='block';box.style.left='0px';box.style.top='0px';
    const r=el.getBoundingClientRect(),W=document.documentElement.clientWidth,H=innerHeight,m=8,bw=box.offsetWidth,bh=box.offsetHeight;
    let x=r.left;if(x+bw>W-m)x=W-m-bw;if(x<m)x=m;
    let y=r.bottom+8;if(y+bh>H-m){y=r.top-8-bh>=m?r.top-8-bh:Math.max(m,H-m-bh);}
    box.style.left=Math.round(x)+'px';box.style.top=Math.round(y)+'px';cur=el;}
  function hide(){if(box)box.style.display='none';cur=null;}
  window.qtipShow=show;window.qtipHide=hide;
  document.addEventListener('mouseover',e=>{const q=e.target.closest&&e.target.closest('.qtip');if(q){if(q!==cur)show(q);}else if(cur&&document.activeElement!==cur)hide();});

function rfNet(t){const F=window._rf,n=calc(t).net.slice();const e=F&&F.mode==='edit'?((T(F.tid)||{}).exports||[])[F.i]:null;if(e){if(t.id===F.tid)e.r.forEach((v,j)=>n[j]+=v);if(t.id===e.to)e.r.forEach((v,j)=>n[j]-=v);}return n;}
function rfSub(t){return rfNet(t).map((v,j)=>`${GRES(j)}<b class="${cls(Math.round(v))}">${sg(Math.round(v))}</b>`).join(' ');}

function rfDK(k){

  const xe=document.getElementById('rf-ex');if(xe)F.ex={x:xe.value,y:document.getElementById('rf-ey').value,name:document.getElementById('rf-en').value};
  F.dk=k;

// แสดงแร่เหลือ/ขาดของเมืองต้นทาง-ปลายทาง และตารางเมืองที่มีแร่เหลือให้คลิกเลือก
function rfPick(k){if(window._rf){window._rf.pick=k;rfInfo();}}
// ผลลัพธ์หลังบันทึก: เมืองต้นทางเหลือ/ขาดเท่าไร เมืองปลายทางเป็นอย่างไร (อัปเดตทันทีที่พิมพ์จำนวนแร่)
function rfPreview(){
  const box=document.getElementById('rf-prev'),F=window._rf,fromEl=document.getElementById('rf-from');if(!box||!F||!fromEl)return;
  const src=T(+fromEl.value);if(!src){box.innerHTML='';return;}
  const r=[0,1,2,3].map(j=>{const e=document.getElementById('rf-'+j);return e?Math.max(0,Math.floor(+e.value||0)):0;});
  if(F.dk==='art'){r[0]=r[1]=r[2]=0;}
  const editing=F.mode==='edit'?((T(F.tid)||{}).exports||[])[F.i]:null;
  const toEl=document.getElementById('rf-to'),dst=F.dk==='own'&&toEl?T(+toEl.value):null;
  const now=t=>calc(t).net.map(Math.round);
  const base=t=>{const n=calc(t).net.slice();if(editing){if(t.id===F.tid)editing.r.forEach((v,j)=>n[j]+=v);if(t.id===editing.to)editing.r.forEach((v,j)=>n[j]-=v);}return n;};
  const cells=a=>a.map(v=>`<td class="${cls(v)}">${sg(v)}</td>`).join('');
  const lack=a=>a.map((v,j)=>v<0?`${RNAME[j]} ${sg(v)}`:'').filter(Boolean).join(' · ');
  const verdict=(who,a)=>{const l=lack(a);return l?`<span class="neg">⚠ ${who} ${LN('ขาด','short')}: ${l}</span>`:`<span class="pos">✓ ${who} ${LN('ไม่ขาดแร่','not short')}</span>`;};
  const sAfter=base(src).map((v,j)=>Math.round(v-r[j]));
  let rows=`<tr><td rowspan="2">📤 ${tLabel(src,true)}<br><span class="note">${LN('ต้นทาง','Source')}</span></td><td class="note">${LN('ตอนนี้','Now')}</td>${cells(now(src))}</tr><tr class="sum"><td>${LN('หลังส่ง','After sending')}</td>${cells(sAfter)}</tr>`;
  let vd=verdict(LN('ต้นทาง','Source'),sAfter);
  if(dst&&dst.id!==src.id){
    const dAfter=base(dst).map((v,j)=>Math.round(v+r[j]));
    rows+=`<tr><td rowspan="2">🎯 ${tLabel(dst,true)}<br><span class="note">${LN('ปลายทาง','Destination')}</span></td><td class="note">${LN('ตอนนี้','Now')}</td>${cells(now(dst))}</tr><tr class="sum"><td>${LN('หลังรับ','After receiving')}</td>${cells(dAfter)}</tr>`;
    vd+=' · '+verdict(LN('ปลายทาง','Destination'),dAfter);
  }else if(F.dk!=='own'){
    rows+=`<tr><td>${F.dk==='ww'?'🏛️ WW':'💎 '+LN('อาติแฟค','Artifact')}</td><td class="note">${LN('รับ','Receives')}</td>${r.map(v=>`<td class="${v?'pos':'note'}">${v?'+'+fmt(v):'–'}</td>`).join('')}</tr>`;
  }
  box.innerHTML=`<p class="note" style="margin:12px 0 4px">${LN('ผลลัพธ์หลังบันทึก (แร่เหลือ + / ขาด − ต่อชม.)','Result after saving (surplus + / shortage − per hour)')}</p>
    <div class="scroll"><table class="rfit"><tr><th>${LN('เมือง','Town')}</th><th></th>${RES.map((n,j)=>`<th class="${RCLS[j]}">${n}</th>`).join('')}</tr>${rows}</table></div>
    <p style="margin:6px 0 0;font-size:13px">${vd}</p>`;
}
function rfInfo(){rfInfoMain();rfPreview();}
function rfInfoMain(){
  const box=document.getElementById('rf-info');if(!box)return;
  const F=window._rf;if(!F)return;
  const fromEl=document.getElementById('rf-from');if(!fromEl)return;
  const from=+fromEl.value,toEl=document.getElementById('rf-to'),to=toEl?+toEl.value:null;
  const editing=F.mode==='edit'?T(F.tid).exports[F.i]:null;
  const netOf=t=>{const n=calc(t).net.slice();if(editing){if(t.id===F.tid)editing.r.forEach((v,j)=>n[j]+=v);if(t.id===editing.to)editing.r.forEach((v,j)=>n[j]-=v);}return n;};
  const cells=n=>n.map(v=>`<td class="${cls(v)}">${sg(v)}</td>`).join('');
  const art=F.dk==='art';[0,1,2].forEach(j=>{const x=document.getElementById('rf-'+j);if(x){x.disabled=art;if(art)x.value='';}});
  const head=`<tr><th>เมือง</th>${RES.map((r,j)=>`<th class="${RCLS[j]}">${r}</th>`).join('')}</tr>`;
  if(F.dk!=='own'){ // ปลายทางภายนอก: แสดงแร่เหลือของเมืองต้นทางอย่างเดียว
    const src=T(from);
    box.innerHTML=`<div class="rfi"><p class="note" style="margin:10px 0 4px">แร่เหลือ (+) / ขาด (−) ต่อชม. ของเมืองต้นทางตอนนี้${editing?' (ไม่นับเส้นทางที่กำลังแก้)':''}</p>
      <div class="scroll"><table class="rfit">${head}${src?`<tr class="dst"><td>📤 ${esc(src.name)} <span class="note">(ต้นทาง)</span></td>${cells(netOf(src))}</tr>`:''}${art?`<tr><td colspan="5" class="warn">💎 อาติแฟครับได้แค่ข้าว</td></tr>`:''}</table></div></div>`;
    return;
  }
  if(MQ.matches){box.innerHTML='';return;}   // มือถือ: เลือกจากปุ่มใหญ่ด้านบนแทนตาราง
  const pickTo=F.pick==='to',anchorId=pickTo?from:to,selId=pickTo?to:from,sel=pickTo?'rf-to':'rf-from';
  const score=n=>pickTo?n.reduce((x,y)=>x+Math.max(0,-y),0):n.reduce((x,y)=>x+Math.max(0,y),0); // ส่งแร่: เมืองที่ขาดมากขึ้นก่อน · รับแร่: เมืองที่เหลือมากขึ้นก่อน
  const others=S.towns.filter(o=>o.id!==anchorId).map(o=>({o,n:netOf(o)})).sort((a,b)=>score(b.n)-score(a.n));
  const an=T(anchorId);
  box.innerHTML=`<div class="rfi"><div class="grid" style="margin:10px 0 4px;gap:8px"><span class="note">คลิกแถวในตารางเพื่อเลือก</span>
      <span class="seg"><button class="${pickTo?'':'on'}" onclick="rfPick('from')">⬅ เมืองต้นทาง</button><button class="${pickTo?'on':''}" onclick="rfPick('to')">➡ เมืองปลายทาง</button></span></div>
    <p class="note" style="margin:0 0 4px">แร่เหลือ (+) / ขาด (−) ต่อชม. ตอนนี้${editing?' (ไม่นับเส้นทางที่กำลังแก้)':''} · ${pickTo?'เรียงเมืองที่ขาดแร่มากไว้บน':'เรียงเมืองที่เหลือแร่มากไว้บน'}</p>
    <div class="scroll" style="max-height:220px;overflow-y:auto"><table class="rfit">${head}
    ${an?`<tr class="dst"><td>${pickTo?'📤':'🎯'} ${tLabel(an)} <span class="note">(${pickTo?'ต้นทาง':'ปลายทาง'})</span></td>${cells(netOf(an))}</tr>`:''}
    ${others.map(x=>`<tr class="clk ${x.o.id===selId?'sel':''}" onclick="document.getElementById('${sel}').value='${x.o.id}';rfInfo()"><td>${x.o.id===selId?'✓ ':''}${tLabel(x.o)}${x.o.x!=null?` <span class="note">(${x.o.x}/${x.o.y})</span>`:''}</td>${cells(x.n)}</tr>`).join('')}</table></div></div>`;
}
function closeRoute(){document.getElementById('routeform').classList.remove('on');window._rf=null;}
function routeSave(){
  const F=window._rf;if(!F)return;
  const from=+document.getElementById('rf-from').value;
  const r=[0,1,2,3].map(j=>Math.max(0,Math.floor(+document.getElementById('rf-'+j).value||0)));
  const msg=document.getElementById('rf-msg');
  if(F.dk==='art'){r[0]=r[1]=r[2]=0;if(!r[3]){msg.textContent='อาติแฟครับได้แค่ข้าว — ใส่จำนวนข้าว';return;}}
  if(!r.some(x=>x>0)){msg.textContent='ใส่จำนวนแร่อย่างน้อย 1 ชนิด';return;}
  let to;
  if(F.dk==='own'){to=+document.getElementById('rf-to').value;if(from===to){msg.textContent='เมืองต้นทางกับปลายทางต้องไม่ใช่เมืองเดียวกัน';return;}}
  else{
    const xs=document.getElementById('rf-ex').value.trim(),ys=document.getElementById('rf-ey').value.trim();
    if(xs===''||ys===''||isNaN(+xs)||isNaN(+ys)){msg.textContent='ใส่พิกัด X และ Y ของ '+(F.dk==='ww'?'WW':'อาติแฟค');return;}
    to=extEnsure(F.dk,Math.round(+xs),Math.round(+ys),document.getElementById('rf-en').value.trim());
  }
  let src=T(from);
  if(F.mode==='edit'){const t=T(F.tid),old=t.exports[F.i];
    if(t.id===from&&old.to===to){const before=old.r.slice();old.r=r;pendMark(old,before);}
    else{t.exports.splice(F.i,1);pendDel(t,old);const ex=src.exports.find(e=>e.to===to);if(ex){const before=ex.r.slice();r.forEach((v,j)=>ex.r[j]+=v);pendMark(ex,before);}else newRoute(src,to,r);}}
  else{const ex=src.exports.find(e=>e.to===to);if(ex){const before=ex.r.slice();r.forEach((v,j)=>ex.r[j]+=v);pendMark(ex,before);}else newRoute(src,to,r);}
  extGc();
  closeRoute();toast((F.mode==='edit'?'✓ บันทึก ':'✓ เพิ่ม ')+src.name+' → '+D(to).name);renderAll();autosave();refreshFlow();
}
function routeDelete(){const F=window._rf;if(!F)return;const t=T(F.tid);if(t){const old=t.exports.splice(F.i,1)[0];if(old)pendDel(t,old);}extGc();closeRoute();toast('ลบเส้นทางแล้ว');renderAll();autosave();refreshFlow();}

  const tRow=(label,d,src,k)=>`<tr class="tomb"><td>${label} <span class="pb pdel">🗑️ ต้องลบในเกม</span></td>${tombCells(d.r)}<td class="act"><button class="okbtn" onclick="syncDel(${src},${k})">✓ ลบในเกมแล้ว</button></td></tr>`;
  let ins='',outs='';
  S.towns.forEach(o=>{o.exports.forEach((e,i)=>{if(e.to===t.id)ins+=eRow(`⬅ รับจาก <b>${tLabel(o)}</b>`,e,1,o.id,i);});(o.delPend||[]).forEach((d,k)=>{if(d.to===t.id)ins+=tRow(`⬅ จาก <b>${tLabel(o)}</b>`,d,o.id,k);});});
  t.exports.forEach((e,i)=>{const d=D(e.to);if(d)outs+=eRow(`➡ ส่งไป <b>${tLabel(d)}</b>`,e,-1,t.id,i);});
  (t.delPend||[]).forEach((d,k)=>{const x=D(d.to);if(x)outs+=tRow(`➡ ไป <b>${tLabel(x)}</b>`,d,t.id,k);});

    <div class="scroll"><table class="flowtab"><tr><th>ต่อชั่วโมง</th>${RES.map((n,j)=>`<th class="${RCLS[j]}">${n}</th>`).join('')}<th></th></tr>
    <tr class="fsec"><td colspan="6">⚒️ ผลิต</td></tr>${row('ผลิตเอง',t.prod,1)}
    <tr class="fsec"><td colspan="6">⬅ รับเข้า ${sum(c.imp)?'':'<span class="note">(ไม่มี)</span>'}</td></tr>${ins}

function orderedTowns(){const out=[];(S.folders||[]).forEach(f=>S.towns.forEach(t=>{if(t.folder===f.id)out.push(t);}));S.towns.forEach(t=>{if(!folderOf(t))out.push(t);});return out;}
function sumSortMode(){return ['order','name','bad'].includes(window._sumSort)?window._sumSort:'order';}
function sumSort(list){

  if(m==='name')a.sort((x,y)=>String(x.name).localeCompare(String(y.name),'th',{numeric:true})||idx.get(x.id)-idx.get(y.id));

  box.innerHTML=`<section class="box"><h3 style="flex-wrap:wrap">📊 ภาพรวมทุกเมือง (ต่อชั่วโมง)${tabs}</h3>
