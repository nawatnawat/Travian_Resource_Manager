/* ============ ปลายทางภายนอก: 🏛️ WW (ทุกชนิด) · 💎 อาติแฟค (ข้าวอย่างเดียว) ============ */
// เก็บใน S.ext · id ติดลบ เพื่อไม่ชนกับ id เมือง · เส้นทางไปที่นี่ = ส่งออกของเมืองต้นทาง
const EXT_KIND={ww:{i:'🏛️',n:'WW'},art:{i:'💎',n:'อาติแฟค'}};
function extList(){S.ext=S.ext||[];return S.ext;}
function D(id){return T(id)||extList().find(e=>e.id===id)||null;}
const isArt=id=>{const d=D(id);return !!(d&&d.kind==='art');};
function extAdd(kind,name,xy){const L=extList();const id=-(1+L.reduce((a,e)=>Math.max(a,-e.id),0));const e={id,kind,name:name||((kind==='ww'?'WW ':'Artifact ')+(-id)),x:xy?xy.x:null,y:xy?xy.y:null,owner:''};L.push(e);return e;}
function extNew(kind){extAdd(kind);renderAll();autosave();}
const extAutoName=(kind,x,y)=>EXT_KIND[kind].n+(x!=null&&y!=null?' ('+x+'/'+y+')':'');
// หา/สร้างปลายทางภายนอกจากชนิด+พิกัด (ผู้ใช้ไม่ต้องสร้างล่วงหน้า)
function extFind(kind,x,y){return extList().find(e=>e.kind===kind&&x!=null&&y!=null&&e.x!=null&&+e.x===+x&&+e.y===+y)||null;}
function extEnsure(kind,x,y,name){let e=extFind(kind,x,y);if(!e)e=extAdd(kind,name||extAutoName(kind,x,y),{x,y});else if(name)e.name=name;return e.id;}
// ลบปลายทางภายนอกที่ไม่มีเส้นทางอ้างอิงแล้ว (รวมรายการที่รอลบในเกม)
function extGc(){const refs=new Set();S.towns.forEach(t=>{t.exports.forEach(e=>refs.add(e.to));(t.delPend||[]).forEach(d=>refs.add(d.to));});S.ext=extList().filter(e=>refs.has(e.id));}
function extSet(id,k,v){const e=D(id);if(!e||id>=0)return;
  if(k==='x'||k==='y'){const n=String(v).trim()===''?null:Math.round(+v);e[k]=isNaN(n)?null:n;}else e[k]=String(v).trim();
  if(k==='kind'&&e.kind==='art')S.towns.forEach(t=>t.exports.forEach(r=>{if(r.to===id&&r.r.slice(0,3).some(x=>x)){const b=r.r.slice();r.r=[0,0,0,r.r[3]];pendMark(r,b);}}));
  renderAll();autosave();}
function extDel(id){const e=D(id);if(!e)return;const n=S.towns.reduce((a,t)=>a+t.exports.filter(r=>r.to===id).length,0);
  dlg('ลบปลายทาง "'+e.name+'" ?'+(n?'\nเส้นทางที่ส่งไปที่นี่ '+n+' เส้นทางจะถูกลบด้วย':''),()=>{S.towns.forEach(t=>{t.exports=t.exports.filter(r=>r.to!==id);t.delPend=(t.delPend||[]).filter(d=>d.to!==id);});S.ext=extList().filter(x=>x.id!==id);renderAll();autosave();},'ลบ',true);}
function extRecv(id){const r=[0,0,0,0];S.towns.forEach(t=>t.exports.forEach(e=>{if(e.to===id)e.r.forEach((v,j)=>r[j]+=v);}));return r;}
function findDestBy(name,xy){return findTownBy(name,xy)||(xy&&extList().find(e=>e.x!=null&&+e.x===xy.x&&+e.y===xy.y))||extList().find(e=>e.name===name)||null;}
function trExt(i,kind){const P=window._trLast,nm=(window._trMiss||[])[i];if(!P||nm==null)return;extAdd(kind,nm,P.list[nm]||null);autosave();window._trPending=P;tradeApply();}

function planTotals(p){
  const res=[0,0,0,0];let pop=0,cp=0;const base=[];
  p.items.forEach(r=>{const b=BUILD_DATA[r.name];if(!b)return;const rs=b.rows.slice(r.from,r.to);
    rs.forEach(x=>{for(let j=0;j<4;j++)res[j]+=x[j]*r.n;pop+=x[4]*r.n;base.push([x[6],r.n]);});
    cp+=((b.rows[r.to-1]||[])[5]||0)*r.n;});
  const timeAt=mb=>base.reduce((a,[sec,n])=>a+bTime(sec,mb)*n,0);
  return {res,pop,cp,timeAt};
}

// ---- สถานะ "ต้องไปแก้ในเกม" ของเส้นทาง ----
// e.pend: 'new' (ต้องสร้างในเกม) / 'edit' (ต้องแก้ เดิม e.prev) · t.delPend: [{to,r}] ต้องลบในเกม
function pendMark(e,before){
  if(e.pend==='new')return;
  if(!e.pend){e.pend='edit';e.prev=before.slice();}
  if(e.pend==='edit'&&e.prev&&e.prev.every((v,j)=>v===e.r[j])){delete e.pend;delete e.prev;}
}
function pendDel(t,e){if(e.pend==='new')return;t.delPend=t.delPend||[];const r=(e.prev||e.r).slice();const x=t.delPend.find(d=>d.to===e.to);if(x)x.r=r;else t.delPend.push({to:e.to,r});}
function newRoute(src,to,r){ // เส้นทางใหม่: ถ้าเคยถูกลบ (รอลบในเกม) ให้นับเป็นแก้ไขแทน

  if(k>=0){const tb=src.delPend.splice(k,1)[0];if(!tb.r.every((v,j)=>v===e.r[j])){e.pend='edit';e.prev=tb.r;}}else e.pend='new';
  src.exports.push(e);return e;
}

function syncDel(tid,k){const t=T(tid);if(!t||!t.delPend)return;const d=t.delPend.splice(k,1)[0];extGc();toast('✓ ลบในเกมแล้ว: '+t.name+' → '+((d&&D(d.to))||{}).name);renderAll();autosave();refreshFlow();}
function pendCount(){let n=0;S.towns.forEach(t=>{n+=t.exports.filter(e=>e.pend&&D(e.to)).length+(t.delPend||[]).filter(d=>D(d.to)).length;});return n;}

function rfDK(k){

function rfPreview(){

  const base=t=>{const n=calc(t).net.slice();if(editing){if(t.id===F.tid)editing.r.forEach((v,j)=>n[j]+=v);if(t.id===editing.to)editing.r.forEach((v,j)=>n[j]-=v);}return n;};

    rows+=`<tr><td>${F.dk==='ww'?'🏛️ WW':'💎 '+LN('อาติแฟค','Artifact')}</td><td class="note">${LN('รับ','Receives')}</td>${r.map(v=>`<td class="${v?'pos':'note'}">${v?'+'+fmt(v):'–'}</td>`).join('')}</tr>`;
  }

function closeRoute(){document.getElementById('routeform').classList.remove('on');window._rf=null;}
function routeSave(){
  const F=window._rf;if(!F)return;
  const from=+document.getElementById('rf-from').value;
  const r=[0,1,2,3].map(j=>Math.max(0,Math.floor(+document.getElementById('rf-'+j).value||0)));
  const msg=document.getElementById('rf-msg');
  if(F.dk==='art'){r[0]=r[1]=r[2]=0;if(!r[3]){msg.textContent='อาติแฟครับได้แค่ข้าว — ใส่จำนวนข้าว';return;}}
  if(!r.some(x=>x>0)){msg.textContent='ใส่จำนวนแร่อย่างน้อย 1 ชนิด';return;}
  let to;
  if(F.dk==='own'){to=+document.getElementById('rf-to').value;if(from===to){msg.textContent='เมืองต้นทางกับปลายทางต้องไม่ใช่เมืองเดียวกัน';return;}}
  else{
    const xs=document.getElementById('rf-ex').value.trim(),ys=document.getElementById('rf-ey').value.trim();
    if(xs===''||ys===''||isNaN(+xs)||isNaN(+ys)){msg.textContent='ใส่พิกัด X และ Y ของ '+(F.dk==='ww'?'WW':'อาติแฟค');return;}
    to=extEnsure(F.dk,Math.round(+xs),Math.round(+ys),document.getElementById('rf-en').value.trim());
  }
  let src=T(from);
  if(F.mode==='edit'){const t=T(F.tid),old=t.exports[F.i];
    if(t.id===from&&old.to===to){const before=old.r.slice();old.r=r;pendMark(old,before);}
    else{t.exports.splice(F.i,1);pendDel(t,old);const ex=src.exports.find(e=>e.to===to);if(ex){const before=ex.r.slice();r.forEach((v,j)=>ex.r[j]+=v);pendMark(ex,before);}else newRoute(src,to,r);}}
  else{const ex=src.exports.find(e=>e.to===to);if(ex){const before=ex.r.slice();r.forEach((v,j)=>ex.r[j]+=v);pendMark(ex,before);}else newRoute(src,to,r);}
  extGc();
  closeRoute();toast((F.mode==='edit'?'✓ บันทึก ':'✓ เพิ่ม ')+src.name+' → '+D(to).name);renderAll();autosave();refreshFlow();
}
function routeDelete(){const F=window._rf;if(!F)return;const t=T(F.tid);if(t){const old=t.exports.splice(F.i,1)[0];if(old)pendDel(t,old);}extGc();closeRoute();toast('ลบเส้นทางแล้ว');renderAll();autosave();refreshFlow();}

  t.exports.forEach((e,i)=>{const d=D(e.to);if(d)outs+=eRow(`➡ ส่งไป <b>${tLabel(d)}</b>`,e,-1,t.id,i);});
  (t.delPend||[]).forEach((d,k)=>{const x=D(d.to);if(x)outs+=tRow(`➡ ไป <b>${tLabel(x)}</b>`,d,t.id,k);});
  const sum=a=>a.reduce((x,y)=>x+y,0);
  document.getElementById('flowcard').innerHTML=`<div class="mhead"><b>🔍 การไหลของแร่: ${tLabel(t)}${actIcons(t,c)} <span class="note">· ${t.type==='ore'?'เมืองแร่':'เมืองทหาร · '+t.tribe}</span></b><button class="mx" onclick="closeFlow()">✕</button></div>
    <div class="scroll"><table class="flowtab"><tr><th>ต่อชั่วโมง</th>${RES.map((n,j)=>`<th class="${RCLS[j]}">${n}</th>`).join('')}<th></th></tr>
    <tr class="fsec"><td colspan="6">⚒️ ผลิต</td></tr>${row('ผลิตเอง',t.prod,1)}
    <tr class="fsec"><td colspan="6">⬅ รับเข้า ${sum(c.imp)?'':'<span class="note">(ไม่มี)</span>'}</td></tr>${ins}
    <tr class="fsec"><td colspan="6">➡ ส่งออก ${t.exports.length||(t.delPend||[]).length?'':'<span class="note">(ไม่มี)</span>'}</td></tr>${outs}
    ${sum(c.ce.h)||sum(c.tr.h)?`<tr class="fsec"><td colspan="6">🔥 ใช้ในเมือง</td></tr>${sum(c.ce.h)?row('Celebration',c.ce.h,-1):''}${sum(c.tr.h)?row('ฝึกทหาร',c.tr.h,-1):''}`:''}
    <tr class="sum"><td>= เหลือ / ขาด สุทธิ</td>${c.net.map(v=>`<td class="${cls(v)}">${sg(v)}</td>`).join('')}<td></td></tr></table></div>
    <div class="grid" style="margin-top:12px;justify-content:flex-end">${typeof shRO==='function'&&shRO()?`<span class="note" style="margin-right:auto">${SH_EYE} ${LN('ดูอย่างเดียว — แก้เส้นทางไม่ได้','View only: routes cannot be changed')}</span>`:''}<button onclick="openRoute('add',null,${t.id})">⬅ ＋ รับแร่จากเมืองอื่น</button><button class="pri" onclick="openRoute('add',${t.id},null)">➡ ＋ ส่งแร่ไปเมืองอื่น</button></div>`;
  try{if(document.body.classList.contains('shro'))shLock();}catch(e){}   // โปรไฟล์ที่แชร์แบบดูอย่างเดียว: ล็อกปุ่มแก้
}
// มุมมองเมืองทหาร: แบ่งกลุ่ม ⚠ ขาดแร่ / ✓ ไม่ขาดแร่ · เมืองทหารแต่ละเมืองเป็นการ์ด (กาง/หุบรายชื่อเมืองที่ส่งแร่ให้ได้) · คลิกแถวเมืองที่ส่งแร่เพื่อดูรายละเอียด
// เรียงเมืองในหน้าสรุป: ลำดับที่จัดไว้ (= ลำดับใน S.towns) / ชื่อ / ขาดแร่ก่อน (ขาดมากสุดก่อน) · ค่าเริ่มต้น = ลำดับที่จัดไว้
// ลำดับที่จัดไว้ = ลำดับเดียวกับรายชื่อเมืองด้านซ้าย: โฟลเดอร์ตามลำดับโฟลเดอร์ (ในโฟลเดอร์ตามลำดับเมือง) แล้ว "ไม่จัดกลุ่ม" ไว้หลังสุด
function orderedTowns(){const out=[];(S.folders||[]).forEach(f=>S.towns.forEach(t=>{if(t.folder===f.id)out.push(t);}));S.towns.forEach(t=>{if(!folderOf(t))out.push(t);});return out;}
function sumSortMode(){return ['order','name','bad'].includes(window._sumSort)?window._sumSort:'order';}
function sumSort(list){
  const m=sumSortMode(),idx=new Map(orderedTowns().map((t,i)=>[t.id,i])),a=list.slice();
  if(m==='name')a.sort((x,y)=>String(x.name).localeCompare(String(y.name),'th',{numeric:true})||idx.get(x.id)-idx.get(y.id));
  else if(m==='bad'){const sev=new Map(a.map(t=>[t.id,calc(t).net.reduce((s2,v)=>s2+Math.max(0,-Math.round(v)),0)]));a.sort((x,y)=>(sev.get(y.id)-sev.get(x.id))||idx.get(x.id)-idx.get(y.id));}
  else a.sort((x,y)=>idx.get(x.id)-idx.get(y.id));
  return a;
}
function sumSortSel(){const m=sumSortMode();

function milIntroText(){const MT=S.towns.filter(t=>t.type==='mil');return LN(`เมืองทหาร ${MT.length} เมือง · <b>ซ้าย</b>: แถวเมืองแร่ = แร่ที่ส่งให้ (+ เขียว) · แถวเมืองทหาร = แร่ที่ต้องการใช้ (ฝึกทหาร + ฉลอง + ส่งออก) หักการผลิตของเมืองเองแล้ว (− แดง) · ถ้าผลิตเองพอใช้ แสดงเป็นเลขสีฟ้าไม่มีเครื่องหมาย · ปุ่มสลับมุมขวาบนเปลี่ยนคอลัมน์ซ้ายเป็น "ผลิตในเมือง" · <b>ขวา</b> = เหลือ / ขาด สุทธิ · <b>คลิกลูกศร ▾/▸ ทางซ้าย</b> กาง/หุบรายชื่อเมืองที่ส่งแร่ให้ · <b>คลิกที่แถวเมืองตรงไหนก็ได้</b> เปิดหน้าต่างการไหลของแร่ (เหมือนโหมดทุกเมือง) · เมืองแร่ที่ยังไม่ได้ส่งให้เมืองทหารรวมเป็นการ์ดกลุ่มเดียว หัวการ์ดแสดงยอดรวมของกลุ่ม`,`${MT.length} military town(s) · <b>Left</b>: resource-town rows = resources sent (+ green) · military-town rows = resources needed (training + celebration + exports) minus the town's own production (− red) · if its own production is enough the number is blue with no sign · the switch at the top right changes the left columns to "Own production" · <b>Right</b> = net surplus / shortage · <b>click the ▾/▸ arrow on the left</b> to expand/collapse the supplying towns · <b>click anywhere on a town row</b> to open the resource-flow window (same as the All towns view) · resource towns that don't supply a military town form one group card whose header shows the group total`);}
function milCard(id,bad){const c=S.milCard=S.milCard||{};const cur=(id in c)?c[id]:!!bad;c[id]=!cur;renderSum();autosave();}
function milAll(open){const c=S.milCard={};S.towns.filter(t=>t.type==='mil').forEach(t=>c[t.id]=open);c.free=open;renderSum();autosave();}
function milView(){
  const MT=S.towns.filter(t=>t.type==='mil');
  if(!MT.length)return '<p class="note">ยังไม่มีเมืองทหาร — ติ๊ก "สร้างทหารจาก" ในหน้าจัดการเมือง เมืองนั้นจะนับเป็นเมืองทหาร</p>';
  const card=S.milCard||{};
  const info=MT.map(t=>{const c=calc(t);return {t,c,bad:c.net.some(v=>Math.round(v)<0),sev:c.net.reduce((a,v)=>a+Math.max(0,-Math.round(v)),0)};});
  const ord=new Map(sumSort(MT).map((t,i)=>[t.id,i])),byOrd=(a,b)=>ord.get(a.t.id)-ord.get(b.t.id);

  const amtc=arr=>arr.map(v=>{v=Math.round(v);return `<div class="mn ${v?'pos':'note'}">${v?'+'+fmt(v):'–'}</div>`;}).join('');
  const blank=()=>'<div class="mn"></div>'.repeat(4);
  const lmode=window._milLeft==='prod'?'prod':'flow';   // คอลัมน์ซ้าย: flow = ส่งให้/ต้องการ · prod = ผลิตในเมืองเท่าไร

  const cardHTML=x=>{

  };
  const cards=bad.concat(ok).map(cardHTML).join('');
  // เมืองแร่ที่ไม่ได้ส่งแร่ให้เมืองทหารเมืองไหนเลย (เรียงตามลำดับเมือง)
  const sup=new Set();S.towns.forEach(o=>o.exports.forEach(e=>{if(MT.some(m=>m.id===e.to))sup.add(o.id);}));

  const tw=n=>LN('เมือง',n===1?'town':'towns');
  const legend=`<div class="mleg" data-noi18n>${bad.length?`<span class="mlg bad" onclick="milJump('bad')">⚠ ${LN('ขาดแร่','Short of resources')} <b>${bad.length}</b> ${tw(bad.length)}</span>`:''}${ok.length?`<span class="mlg ok" onclick="milJump('ok')">✓ ${LN('ไม่ขาดแร่','Not short')} <b>${ok.length}</b> ${tw(ok.length)}</span>`:''}${free.length?`<span class="mlg free" onclick="milJump('free')">⛏️ ${LN('เมืองแร่ที่ยังไม่ได้ส่ง','Resource towns not sending')} <b>${free.length}</b> ${tw(free.length)}</span>`:''}<span class="sepv"></span>${lmode==='prod'?`<span class="mk own">${LN('ตัวเลขสีฟ้า = ผลิตในเมืองเอง ต่อชม.','blue numbers = own production per h.')}</span>`:`<span class="mk pos">+ ${LN('ส่งให้','sent')}</span><span class="mk neg">− ${LN('ต้องการ','needed')}</span><span class="mk own">${LN('ผลิตเองพอ (ไม่มีเครื่องหมาย)','self-sufficient (no sign)')}</span>`}</div>`;
  return `<div class="milwrap"><div class="mrow mhd2"><div class="hcity">${LN('เมือง','Towns')}</div><div class="mgl" style="grid-column:2/span 4">${lmode==='prod'?LN('ผลิตในเมืองเอง','Own production'):LN('ส่งให้ (+) · ต้องการ (−) · ผลิตพอ (ฟ้า)','Sent (+) · Needed (−) · Enough (blue)')}</div><div class="mgl sep" style="grid-column:6/span 4">${LN('เหลือ / ขาด สุทธิ (หลังรับ-ส่ง)','Net surplus / shortage (after in/out)')}</div>${RES.map((r,j)=>`<div class="rr ${RCLS[j]}">${r}</div>`).join('')}${RES.map((r,j)=>`<div class="rr ${RCLS[j]}${j===0?' sep':''}">${r}</div>`).join('')}</div>`+

}

// หน่วยที่นับเป็นพลังตี (a) / ป้องกัน (d) / ทั้งสองอย่าง (ad) ตามที่ผู้ใช้กำหนด · Ram/Catapult (อาคาร W) ทุกเผ่านับเป็นตี · หน่วยที่ไม่อยู่ในรายการ (สอดแนม ตัวยึด ผู้ตั้งถิ่นฐาน) ไม่นับ

function uRole(tribe,i){const b=(TRIBES[tribe]||[])[i];if(!b)return '';if(b.b==='W')return 'a';return UROLE[tribe+'|'+b.n]||'';}
// ===== อัปเกรดเกราะ (Smithy) + วิจัย (Academy): คำนวณจากต้นทุนฝึก + ข้าวที่กิน + เวลาฝึก =====
// ถอดสูตรจากข้อมูล Romans ครบทุกหน่วย (kirilloid T4.6) — ตรงทุกค่า 835 ค่า (วิจัย + เลเวล 1-20 × แร่ 4 ชนิด + เวลา)
//  วิจัย (Academy):  แร่_i = UA_i × ต้นทุนฝึก_i + UK_i  (UA = 6,4,8,6 · UK = 100,100,200,160)   เวลา = 1800 + 3 × เวลาฝึก(วินาที ที่ความเร็วเซิร์ฟเวอร์นั้น — 1800 ไม่หารด้วย x)   · หน่วยแรกของเผ่า (index 0) ไม่ต้องวิจัย
//  อัปเกรด Lv 1:     แร่_i = (7 × ต้นทุนฝึก_i + UK_i) ÷ ข้าวที่กิน                                  เวลา = 1800 + 3 × เวลาฝึก
//  เลเวล L:          แร่ = ปัดเป็น 5 ของ (ค่า Lv 1 แบบไม่ปัด × L^0.8) · เวลา = ปัดเป็นวินาทีของ (เวลา Lv 1 × L^0.8)
//  ตัวยึด: มีแค่วิจัย (ไม่มีอัปเกรด) แร่_i = UCM_i × ต้นทุนฝึก_i + UCN_i (UCM = 0.5,0.5,0.8,0.6 · UCN = 500,200,400,160) เวลา = 1800 + เวลาฝึก ÷ 4 (ที่ความเร็วนั้น)  (ตรง Romans Senator, Spartans Ephor, Vikings Jarl) · ผู้ตั้งถิ่นฐาน: ไม่มีทั้งวิจัยและอัปเกรด
// ตรวจกับ kirilloid แล้ว 30 หน่วยจากทั้ง 7 เผ่า (UVER) — หน่วยที่เหลือใช้สูตรเดียวกัน
const UK=[100,100,200,160],UA=[6,4,8,6],UCM=[0.5,0.5,0.8,0.6],UCN=[500,200,400,160];
const UVER=new Set(['Romans|Legionnaire','Romans|Praetorian','Romans|Imperian','Romans|Equites Legati','Romans|Equites Imperatoris','Romans|Equites Caesaris','Romans|Battering Ram','Romans|Fire Catapult','Romans|Senator','Teutons|Clubswinger','Teutons|Axeman','Teutons|Paladin','Gauls|Pathfinder','Gauls|Haeduan','Egyptians|Khopesh Warrior','Egyptians|Resheph Chariot','Huns|Mercenary','Huns|Spotter','Huns|Marauder','Spartans|Sentinel','Spartans|Corinthian Crusher','Spartans|Ballista','Spartans|Ephor','Vikings|Shield Maiden','Vikings|Huskarl Rider','Vikings|Catapult','Vikings|Jarl','Vikings|Ram','Egyptians|Ash Warden','Egyptians|Nomarch']);
const fmtD=v=>Number.isInteger(v)?fmt(v):(Math.round(v*10)/10).toLocaleString('en-US');   // ค่าวิจัยตัวยึดอาจลงท้าย .5 (เหมือน kirilloid)
const r5=x=>Math.round(x/5)*5;
const upgKey=(tribe,i)=>tribe+':'+i;
function upgData(tribe,i){
  const b=(TRIBES[tribe]||[])[i];if(!b)return null;
  const un=unit(tribe,i),z=[0,0,0,0];
  if(un.role==='settler')return {kind:'none',r:z,rt:0,u:z,ut:0};
  if(un.role==='chief')return {kind:'chief',r:un.c.map((x,j)=>UCM[j]*x+UCN[j]),rt:Math.round(1800+un.t/4/(+S.speed||1)),u:z,ut:0};
  if(un.unk)return null;
  const st=(USTATS[tribe]||[])[i],up=st?+st[5]:0;if(!(up>0))return null;
  const T1=1800+3*un.t/(+S.speed||1);   // 1800 วินาทีคงที่ ไม่หารด้วยความเร็วเซิร์ฟเวอร์ · ส่วนเวลาฝึกหารด้วย x (ตรง kirilloid ที่ x1/x2/x3)
  return {kind:'unit',r:i===0?z:un.c.map((x,j)=>UA[j]*x+UK[j]),rt:i===0?0:T1,u:un.c.map((x,j)=>(7*x+UK[j])/up),ut:T1};
}
const upgCost=(d,L)=>d.u.map(a=>r5(a*Math.pow(L,0.8)));
const upgSecs=(d,L)=>Math.round(d.ut*Math.pow(L,0.8));
// เวลาอัปเกรดเลเวล L = ปัดครั้งเดียว: (1800 + 3 × เวลาฝึกที่ x) × L^0.8 × 0.964^(Smithy Lv−1) · เวลาวิจัย = 1800 + 3 × เวลาฝึกที่ x (ไม่ขึ้นกับ Smithy Lv และ Academy Lv) — ตรงกับ kirilloid ที่ x1/x2/x3 และ Smithy Lv 1/10/20 ครบทุกเลเวล
const smLv=()=>{const v=Math.floor(+S.smithyLv);return v>=1&&v<=20?v:20;};   // Smithy Lv ค่าเริ่มต้น 20
const upgTF=()=>Math.pow(0.964,smLv()-1);   // ตัวคูณเวลาอัปเกรดตาม Smithy Lv (ไม่ใช้กับเวลาวิจัย)
const upgTime=(d,L)=>Math.round(d.ut*Math.pow(L,0.8)*upgTF());   // เวลาอัปเกรดเลเวล L (วินาที) ที่ Smithy Lv + ความเร็วเซิร์ฟเวอร์ปัจจุบัน
const upgHas=d=>!!d&&(d.u.some(x=>x>0)||d.r.some(x=>x>0));
function setSmithyLv(v,soft){S.smithyLv=Math.max(1,Math.min(20,Math.floor(+v||20)));if(soft){if(typeof renderCalcResult==='function')renderCalcResult();}else renderAll();autosave();}
function upgTableHTML(tribe,i){
  const d=upgData(tribe,i);
  if(!d)return `<p class="note">${LN('ยังไม่มีข้อมูลอัปเกรดเกราะ/วิจัยของหน่วยนี้','No armor upgrade/research data for this unit yet')}</p>`;
  const sp=+S.speed||1,sum4=a=>a.reduce((x,y)=>x+y,0);
  const resH=RES.map((r,j)=>`<th class="${RCLS[j]}">${r}</th>`).join('');
  const none=(label,txt)=>`<tr class="sumhd"><td>${label}</td><td colspan="7" style="text-align:center;font-weight:400">${txt}</td></tr>`;
  const lblR=`📚 ${LN('วิจัย (Academy)','Research (Academy)')}`;
  let h=`<div class="scroll"><table class="ttab upgt"><tr><th>${LN('รายการ','Item')}</th>${resH}<th>${LN('รวม 4 ชนิด','Total of 4')}</th><th>${LN('เวลา','Time')} (x${sp} · Smithy Lv${smLv()})</th><th>${LN('รวมสะสม','Cumulative')}</th></tr>`;
  // วิจัย: มีค่า = แสดงตัวเลข · ไม่ต้องวิจัย (หน่วยตั้งต้น / ผู้ตั้งถิ่นฐาน) = เขียนว่า ไม่ต้องวิจัย
  h+=d.r.some(x=>x>0)?`<tr class="sumhd"><td>${lblR}</td>${d.r.map(x=>`<td>${fmtD(x)}</td>`).join('')}<td class="tot">${fmtD(sum4(d.r))}</td><td>${hmsp(d.rt)}</td><td></td></tr>`:none(lblR,`<b>${LN('ไม่ต้องวิจัย','No research needed')}</b>`);
  // อัปเกรดเกราะ: ตัวยึด / ผู้ตั้งถิ่นฐาน ไม่มี
  if(d.u.some(x=>x>0)){let cum=0;for(let L=1;L<=20;L++){const c=upgCost(d,L),t=sum4(c);cum+=t;h+=`<tr><td>🛡️ ${LN('อัปเกรดเกราะ Lv','Armor upgrade Lv')} ${L}</td>${c.map(x=>`<td>${fmt(x)}</td>`).join('')}<td class="tot">${fmt(t)}</td><td>${hmsp(upgTime(d,L))}</td><td>${fmt(cum)}</td></tr>`;}}
  else h+=none(`🛡️ ${LN('อัปเกรดเกราะ','Armor upgrade')}`,`<b>${LN('ไม่มีอัปเกรดเกราะ','No armor upgrade')}</b>`);
  return h+'</table></div>';
}

// ค่าสถานะของหน่วยที่ upgrade lvl (Smithy) ปัจจุบัน: โจมตี / ป้องกันราบ / ป้องกันม้า / ข้าวที่กินต่อชม. (Senator/Chief/Settler ไม่มี upgrade)
function ustat(tribe,i){const st=(USTATS[tribe]||[])[i]||[],un=unit(tribe,i),ul=+S.upLv||0;
  const g=j=>(st[j]===''||st[j]==null)?0:(un.b==='P'?+st[j]:upStat(+st[j],+st[5],ul));
  return {a:g(0),di:g(1),dc:g(2),up:+st[5]||0};}
// สรุปการผลิตทหารต่อวัน

    <tr class="sum"><td colspan="3">${LN(`รวมพลังป้องกัน ทั้งบัญชี · ${nTown} เมือง`,`Total defense — whole account · ${nTown} town${nTown>1?'s':''}`)}</td><td class="tot">${fmt(G.n)}</td><td>${fmt(G.cr)}</td><td></td><td>${z(G.di)}</td><td>${z(G.dc)}</td><td>${z(G.di+G.dc)}</td></tr></table></div>

  box.innerHTML=`<section class="box"><h3 style="flex-wrap:wrap">📊 ภาพรวมทุกเมือง (ต่อชั่วโมง)${tabs}</h3>

/* ============ เมนู คำนวณแร่ ============ */
function ensureCalc(){
  S.calc=S.calc||{};
  if(!Array.isArray(S.calc.rows))S.calc.rows=[{tribe:'Romans',i:0,qty:0,great:false}];   // ใช้ครั้งแรกเท่านั้น · ลบหมดแล้วต้องว่างจริง (ไม่เด้งแถวว่างกลับมา)
  if(!Array.isArray(S.calc.blds))S.calc.blds=[];
  if(!S.calc.show||typeof S.calc.show!=='object')S.calc.show={};   // ส่วนที่เปิดใช้อยู่ (ส่วนที่ไม่ได้ใช้ซ่อนไว้)
  if(!Array.isArray(S.calc.arm))S.calc.arm=[];        // อัปเกรดเกราะ/วิจัย: [{tribe,i,mode:'up'|'res',from,to}]
  if(!Array.isArray(S.calc.cel))S.calc.cel=[];        // ฉลอง: [{type:'small'|'large',n}]
  if(!Array.isArray(S.calc.others))S.calc.others=[];  // ค่าใช้จ่ายอื่นๆ: [{note,r:[4],qty}]
  if(!Array.isArray(S.calc.stocks)){const old=Array.isArray(S.calc.stock)?S.calc.stock:null;   // แร่ที่มีอยู่ หลายรายการ: [{note,r:[4]}] (ย้ายข้อมูลจากช่องเดียวแบบเก่า)
    S.calc.stocks=[{note:'',r:old?old.map(x=>+x||0):[0,0,0,0]}];}
  delete S.calc.stock;
  if(!(S.calc.mb>=1))S.calc.mb=1;
}
/* สิ่งก่อสร้าง: เลือกอาคาร ที่มีอยู่ Lv → ถึง Lv × จำนวนอาคาร */
// กำแพงแต่ละเผ่า: เลือก "กำแพง" ก่อน แล้วค่อยเลือกเผ่า (Vikings/Spartans ยังไม่มีข้อมูลใน kirilloid T4.6)
const WALLS={Romans:'City Wall',Teutons:'Earth Wall',Gauls:'Palisade',Egyptians:'Stone Wall',Huns:'Makeshift Wall'};
const WALL_TRIBE=Object.fromEntries(Object.entries(WALLS).map(([t,n])=>[n,t]));
const lvOptsR=(a,b,sel)=>{let o='';for(let l=a;l<=b;l++)o+=`<option value="${l}" ${l===sel?'selected':''}>${l}</option>`;return o;};
function cbMax(name){const b=BUILD_DATA[name];return b?b.rows.length:20;}
function cbFix(r){const m=cbMax(r.name);r.to=Math.max(1,Math.min(m,Math.floor(+r.to||1)));r.from=Math.max(0,Math.min(r.to-1,Math.floor(+r.from||0)));r.n=Math.max(1,Math.floor(+r.n||1));return r;}
function calcAddBld(){ensureCalc();const l=S.calc.blds[S.calc.blds.length-1];S.calc.blds.push(cbFix({name:l?l.name:'Main Building',from:0,to:5,n:1}));renderAll();autosave();}
function calcDelBld(n){S.calc.blds.splice(n,1);renderAll();autosave();}
function calcBSet(n,k,v){const r=S.calc.blds[n];if(!r)return;
  if(k==='name'){if(v==='WALL'){const t=(T(cur)&&WALLS[T(cur).tribe])?T(cur).tribe:'Romans';v=WALLS[t];}r.name=v;cbFix(r);renderAll();autosave();return;}
  if(k==='from'||k==='to'){r[k]=+v;if(k==='from'&&r.to<=r.from)r.to=r.from+1;cbFix(r);renderAll();autosave();return;}
  r[k]=v;cbFix(r);update();autosave();}
function calcBFix(n){const r=S.calc.blds[n];if(r){cbFix(r);renderAll();}}
function calcMB(v){S.calc.mb=Math.max(1,Math.min(20,Math.floor(+v||1)));update();autosave();}
// เวลาสร้างตามเลเวล Main Building: เวลา(MB1) × 0.964^(MB-1) ปัดเป็นหลัก 10 วินาที (ตรวจกับ kirilloid ที่ MB 10 และ 20 แล้ว)
function mbLv(){ensureCalc();return S.calc.mb;}
// + หารด้วยความเร็วเซิร์ฟเวอร์ (ตรวจกับ kirilloid WW ที่ x2 MB 1/10/20 แล้ว คลาดได้ไม่เกิน ±10 วินาที)
function bTime(sec,mb){mb=mb||mbLv();const sp=+S.speed||1;if(mb<=1&&sp===1)return sec;return Math.round(sec*Math.pow(0.964,mb-1)/sp/10)*10;}
function setMB(v){ensureCalc();S.calc.mb=Math.max(1,Math.min(20,Math.floor(+v||1)));renderAll();autosave();}
function mbPct(l){const mb=BUILD_DATA['Main Building'];if(!mb||l<1)return 100;const v=mb.rows[Math.min(20,l)-1][7];return parseFloat(v)||100;}
function bldCalcRow(r){
  const b=BUILD_DATA[r.name];if(!b)return null;
  const rs=b.rows.slice(r.from,r.to),c=[0,1,2,3].map(j=>rs.reduce((a,x)=>a+x[j],0)*r.n);
  const t=rs.reduce((a,x)=>a+bTime(x[6]),0)*r.n;
  return {c,t,lv:rs.length};
}
function calcAddRow(){ensureCalc();const l=S.calc.rows[S.calc.rows.length-1]||{tribe:'Romans'};S.calc.rows.push({tribe:l.tribe,i:0,qty:0,great:false});renderAll();autosave();}
function calcDelRow(n){ensureCalc();S.calc.rows.splice(n,1);renderAll();autosave();}
function calcSet(n,k,v){
  const r=S.calc.rows[n];if(!r)return;
  if(k==='tribe'){r.tribe=v;r.i=0;renderAll();autosave();return;}
  if(k==='i'){r.i=+v;if(noGreat(unit(r.tribe,r.i).b))r.great=false;renderAll();autosave();return;}
  if(k==='qty')r.qty=Math.max(0,Math.floor(+v||0));
  if(k==='great')r.great=!!v;
  update();autosave();
}
function calcCropMode(v){ensureCalc();S.calc.noCrop=!!v;renderAll();autosave();}
// แร่ที่มีอยู่ (หลายรายการ + รายละเอียด)
function calcStockAdd(){ensureCalc();S.calc.stocks.push({note:'',r:[0,0,0,0]});renderAll();autosave();}
function calcStockDel(n){ensureCalc();S.calc.stocks.splice(n,1);renderAll();autosave();}
function calcStockSet(n,k,v){const r=S.calc.stocks[n];if(!r)return;if(k==='note')r.note=String(v);else r.r[k]=Math.max(0,Math.floor(+v||0));update();autosave();}

function calcCelSet(n,k,v){const r=S.calc.cel[n];if(!r)return;if(k==='type'){r.type=v==='large'?'large':'small';renderAll();autosave();return;}r.n=Math.max(0,Math.floor(+v||0));update();autosave();}

function calcArmAdd(){ensureCalc();const l=S.calc.arm[S.calc.arm.length-1]||{tribe:'Romans',i:1,mode:'up'};S.calc.arm.push({tribe:l.tribe,i:l.i,mode:l.mode,from:0,to:1});renderAll();autosave();}
function calcArmDel(n){ensureCalc();S.calc.arm.splice(n,1);renderAll();autosave();}
function calcArmSet(n,k,v){const r=S.calc.arm[n];if(!r)return;
  if(k==='tribe'){r.tribe=v;r.i=0;}else if(k==='mode')r.mode=v==='res'?'res':'up';else if(k==='i')r.i=+v||0;
  else if(k==='from'){r.from=Math.max(0,Math.min(19,+v||0));if(r.to<=r.from)r.to=r.from+1;}
  else if(k==='to')r.to=Math.max(r.from+1,Math.min(20,+v||1));
  renderAll();autosave();}
function calcClearArm(){dlg('ล้างรายการอัปเกรดเกราะ/วิจัยทั้งหมด?',()=>{S.calc.arm=[];renderAll();autosave();},'ล้างอัปเกรดเกราะ/วิจัย',true);}
function armCalc(r){
  const d=upgData(r.tribe,r.i);if(!d)return null;
  if(r.mode==='res'){if(!d.r.some(x=>x>0))return null;return {c:d.r.map(Math.ceil),t:d.rt,lv:0};}   // แร่ที่ใช้ปัดขึ้น (ตัวยึดอาจลงท้าย .5)
  if(!d.u.some(x=>x>0))return null;
  const c=[0,0,0,0];let sec=0;for(let L=r.from+1;L<=r.to;L++){upgCost(d,L).forEach((v,j)=>c[j]+=v);sec+=upgTime(d,L);}
  return {c,t:sec,lv:r.to-r.from};
}

// ส่วนในหน้าคำนวณแร่: ซ่อนอันที่ไม่ได้ใช้ ผู้ใช้คลิกที่แถบด้านบนเพื่อเปิด/ซ่อนเอง
// ซ่อน = ไม่นำไปคิดในสรุป แต่ข้อมูลที่กรอกไว้ยังอยู่ (เปิดกลับมาเห็นเหมือนเดิม) · S.calc.show[k]: true=เปิด · false=ซ่อน · ไม่มีค่า=ตามว่ามีข้อมูลหรือไม่ (ไฟล์เก่า)
const CALC_SECS=[['troops','🗡️','ฝึกทหาร','Train troops'],['blds','🏗️','สิ่งก่อสร้าง','Buildings'],['arm','🛡️','อัปเกรดเกราะ + วิจัย','Armor upgrade + research'],['cel','🎉','ฉลอง (Celebration)','Celebration'],['others','💸','ค่าใช้จ่ายอื่นๆ','Other expenses'],['stock','📦','แร่ที่มีอยู่','Resources on hand']];
function calcSecCount(k){const c=S.calc;

const BCAT_LABEL={res:'🌾 ทรัพยากร (Resources)',mil:'⚔️ ทหาร (Military)',inf:'🏛️ โครงสร้างพื้นฐาน (Infrastructure)'};
const EFF_LABEL={prod:'ผลผลิต/ชม.',pct:'เพิ่มผลผลิต',cap:'ความจุ',spd:'ความเร็วฝึก',hdt:'เร่งฝึกม้า',upg:'อัปเกรดได้ถึง Lv',def:'+ป้องกัน (พื้นฐาน, %)'};
function effText(kind,lvl,row){
  if(kind==='prod')return fmt(row[7]);
  if(kind==='pct')return row[7]+'%';
  if(kind==='cap')return fmt(row[7]);
  if(kind==='spd')return (1/Math.pow(0.9,lvl-1)).toFixed(1)+'x';
  if(kind==='hdt')return (1/(1-0.01*lvl)).toFixed(2)+'x';
  if(kind==='upg')return row[7];
  if(kind==='def'||kind==='raw')return esc(String(row[7]));
  return '';
}
function selBld(n){window._bsel=n;window._brange=null;renderAll();}
// เลือกช่วงเลเวลแบบ kirilloid: คลิกแถวแรก แล้วคลิกแถวที่สอง = รวมแร่/เวลาของทุกเลเวลในช่วง
function bldPick(l){
  const r=window._brange,n=window._bsel;
  if(!r||r.name!==n||r.b!=null)window._brange={name:n,a:l,b:null};else r.b=l;
  renderAll();
}
function bldRange(from,to){
  const b=BUILD_DATA[window._bsel];if(!b)return;const max=b.rows.length;
  from=Math.max(0,Math.min(max-1,Math.floor(+from||0)));to=Math.max(from+1,Math.min(max,Math.floor(+to||1)));
  window._brange={name:window._bsel,a:from+1,b:to};renderAll();
}
const rs_n=(lo,hi)=>hi-lo+1;
function bldClear(){window._brange=null;renderAll();}

function fbAvatar(u){const ini=((u.displayName||u.email||'?').trim().charAt(0)||'?').toUpperCase();return u.photoURL?`<img src="${esc(u.photoURL)}" referrerpolicy="no-referrer" alt="">`:`<span class="av">${esc(ini)}</span>`;}
function fbRenderUI(){
  const dd=document.getElementById('userdd');if(!dd||!FB_CONFIG.apiKey)return;
  const u=FB.user,open=!!dd.querySelector('.usermenu.open');
  const cls=FB.state==='error'||FB.ss==='rules'||FB.ss==='noconn'?'bad':(FB.state==='paused'||FB.ss==='pending'?'warn':'');
  const dot=(document.getElementById('fbDot')||{}).className||'save-dot';
  dd.innerHTML=`<button class="gbtn-top" id="fbLoginBtn" onclick="fbLogin()" ${u?'style="display:none"':''}>${FB_G}<span class="lbl">${LN('เข้าสู่ระบบ','Sign in')}</span></button>
    <div class="userchip" id="fbChip" onclick="fbMenu(event)" style="display:${u?'flex':'none'}" data-noi18n>${u?fbAvatar(u)+'<span class="un">'+esc(u.displayName||LN('บัญชี','Account'))+'</span><span class="cv">▾</span>':''}</div>
    <div class="usermenu${open&&u?' open':''}" id="fbMenu" data-noi18n>
      <div class="um-head"><span class="t">${LN('บัญชีของฉัน','My account')}</span><button class="um-close" onclick="fbMenu(event,false)">✕</button></div>
      <div class="um-acct">${u?fbAvatar(u)+'<span><div class="an">'+esc(u.displayName||'')+'</div><div class="ae">'+esc(u.email||'')+'</div></span>':''}</div>
      <div class="um-sync ${cls}"><span class="si">${FB_CLD}</span><span><div class="st">${LN('ซิงค์อัตโนมัติเปิดอยู่','Auto sync is on')}</div><div class="ss" id="fbSs">${fbSsText()}</div></span></div>
      <div class="um-item" onclick="fbSyncNow()">🔄 ${LN('ซิงค์เดี๋ยวนี้','Sync now')}</div>
      <div class="um-item" onclick="fbMenu(null,false);shInvites(true)">📥 ${LN('โปรไฟล์ที่แชร์ให้ฉัน','Profiles shared with me')}</div>
      <div class="um-item" onclick="fbMenu(null,false);shDialog()">👥 ${LN('แชร์โปรไฟล์นี้','Share this profile')}</div>
      <div class="um-item" onclick="fbRestore()">↩ ${LN('กู้ข้อมูลก่อนหน้า','Restore an earlier version')}</div>
      <div class="um-item" onclick="fbLogout()">${FB_OUT} ${LN('ออกจากระบบ','Sign out')}</div>
    </div><span class="${dot}" id="fbDot" title="${LN('จุดสถานะซิงค์: เหลืองกะพริบ = กำลังบันทึกขึ้นคลาวด์ · เขียว = บันทึกแล้ว · แดง = ยังไม่ได้ซิงค์ (เปิดเมนูบัญชีเพื่อดู)','Sync dot: blinking yellow = saving to the cloud · green = saved · red = not synced (open the account menu for details)')}"></span>`;
}
function fbMenu(e,force){if(e)e.stopPropagation();const m=document.getElementById('fbMenu');if(!m)return;m.classList.toggle('open',typeof force==='boolean'?force:!m.classList.contains('open'));}
// ----- โหลด SDK + ล็อกอิน -----
function fbLoadSdk(){
  if(FB.ready||FB.loading)return;FB.loading=true;
  if(window.firebase){FB.loading=false;fbSetup();return;}
  let i=0;const next=()=>{if(i>=FB_SDK.length){FB.loading=false;fbSetup();return;}const sc=document.createElement('script');sc.src=FB_SDK[i++];sc.onload=next;sc.onerror=()=>{FB.loading=false;};document.head.appendChild(sc);};next();
}
function fbSetup(){
  if(FB.ready||!window.firebase)return;
  try{if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FB_CONFIG);}catch(e){return;}
  FB.auth=firebase.auth();FB.db=firebase.firestore();FB.provider=new firebase.auth.GoogleAuthProvider();FB.ready=true;
  FB.auth.onAuthStateChanged(u=>{u?fbOnLogin(u):fbOnLogout();});
}
function fbLogin(){
  if(location.protocol==='file:'){fbToast(LN('ต้องเปิดจากลิงก์เว็บ (https) ถึงล็อกอิน Google ได้','Open the app from a web link (https) to sign in with Google'));return;}
  if(!FB.ready){fbToast(LN('ยังโหลดระบบล็อกอินไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่','The sign-in system has not loaded: check the internet connection and try again'));fbLoadSdk();return;}
  FB.auth.signInWithPopup(FB.provider).catch(e=>{const c=(e&&e.code)||'';
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{FB.auth.signInWithRedirect(FB.provider);}catch(x){}return;}
    fbToast(LN('ล็อกอินไม่สำเร็จ','Sign-in failed')+': '+c);});
}
function fbLogout(){if(FB.auth)FB.auth.signOut();fbToast(LN('ออกจากระบบแล้ว (ข้อมูลในเครื่องยังอยู่)','Signed out (the data on this device is kept)'));}
function fbOnLogin(u){
  FB.user=u;FB.ref=FB.db.collection(FB_COL).doc(u.uid);FB.paused=false;FB.ss='syncing';FB.state='syncing';
  const m=fbMeta();
  if(m.uid===u.uid&&m.ver!=null){FB.ver=m.ver;FB.sig=m.sig==null?null:m.sig;FB.dirty=FB.dirty||!!m.dirty;}   // เก็บธงงานค้างที่เกิดก่อนล็อกอินกู้เสร็จไว้ ไม่ล้างทิ้ง
  else{FB.ver=null;FB.sig=null;}
  fbRenderUI();
  if(FB.ver==null)fbFirstSync();else fbPull(false);
  setTimeout(()=>{try{if(mpReady())mpRegister();}catch(e){}},3000);   // ลงชื่อเซิร์ฟเวอร์ map.sql ให้ GitHub
  try{shStart();}catch(e){}   // โปรไฟล์ที่แชร์: ซิงค์ + คำเชิญ
}
function fbOnLogout(){try{shStop();}catch(e){}FB.user=null;FB.ref=null;FB.dirty=false;FB.paused=false;FB.ver=null;FB.sig=null;clearTimeout(FB.timer);fbW(FBK.meta,null);FB.ss='ready';FB.state='idle';fbRenderUI();}
function fbFail(e,quiet){
  const c=(e&&e.code)||'',msg=String((e&&e.message)||e);
  if(c==='permission-denied'||/permission/i.test(msg)){fbSS('rules','error');if(!quiet)fbToast(LN('คลาวด์ไม่อนุญาต — ต้องเพิ่ม rules ของ Firestore','The cloud refused access: the Firestore rules need adding'));fbDot('pending');return;}
  if(msg==='toobig'){fbSS('toobig','error');fbDot('pending');return;}
  fbSS(FB.dirty?'pending':'noconn','error');fbDot('pending');
  clearTimeout(FB.timer);FB.timer=setTimeout(()=>{if(FB.dirty)fbPush();else fbPull(true);},60000);
}
function fbSchedule(ms){clearTimeout(FB.timer);FB.timer=setTimeout(fbPush,ms==null?30000:ms);}
function fbDirty(){
  if(FB.applying)return;FB.seq++;FB.dirty=true;
  const m=fbMeta();if(FB.user&&m.uid===FB.user.uid){m.dirty=true;fbW(FBK.meta,m);}
  if(FB.user&&!FB.paused){fbDot('saved');fbSchedule();}
}
async function fbCommit(base){
  const seq=FB.seq,str=fbPayload();
  if(str.length>900000)throw new Error('toobig');
  const sigC=fbSigOf(JSON.parse(str));
  const ver=await FB.db.runTransaction(async tx=>{
    const sn=await tx.get(FB.ref),cur=sn.exists?(+sn.data().version||0):0;
    if(cur!==base){const er=new Error('conflict');er.conflict=true;throw er;}
    const prev=sn.exists?sn.data().data:null,doc={data:str,version:cur+1,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),device:fbDev()};
    if(prev&&typeof prev==='string'&&prev.length+str.length<900000)doc.prev=prev;   // ฉบับก่อนหน้า 1 ฉบับ (กู้คืนได้)
    tx.set(FB.ref,doc);return cur+1;
  });
  FB.dirty=FB.seq!==seq;FB.ver=ver;FB.sig=sigC;fbMark(ver,sigC,FB.dirty||fbSig()!==sigC);FB.lastPush=Date.now();fbSS('pushed','synced');fbDot('saved');
  if(FB.dirty||fbSig()!==sigC){FB.dirty=true;fbSchedule(5000);}
  return ver;
}
async function fbPush(){
  if(!FB.user||FB.paused||!fbIsDirty())return;
  if(FB.busy||FB.asking){FB.again=true;return;}
  FB.busy=true;fbSS('syncing','syncing');fbDot('saving');
  try{
    if(FB.ver==null){FB.busy=false;await fbFirstSync();return;}
    if(FB.sig!=null&&fbSig()===FB.sig){FB.dirty=false;fbMark(FB.ver,FB.sig,false);fbSS('pushed','synced');FB.busy=false;return;}   // เนื้อหาเหมือนตอนซิงค์ล่าสุด → ไม่ต้องเขียนขึ้นคลาวด์
    await fbCommit(FB.ver);   // เวอร์ชันฐานมาจากหน่วยความจำของแท็บนี้: แท็บที่ข้อมูลเก่าจะชนและถูกถาม ไม่เขียนทับเงียบๆ
  }catch(e){if(e&&e.conflict){FB.busy=false;await fbConflict();return;}fbFail(e);}
  finally{fbDotSettle();}
  FB.busy=false;if(FB.again){FB.again=false;fbSchedule(2000);}
}
// จุดสถานะค้างเป็น "กำลังบันทึก" (เหลือง) ไม่ได้: เนื้อหาเหมือนคลาวด์ / ซิงค์ครั้งแรก / ชนกัน จบแล้วต้องเปลี่ยนเป็นเขียว (บันทึกแล้ว) หรือแดง (ยังไม่ได้ซิงค์)
function fbDotSettle(){const d=document.getElementById('fbDot');if(!d||!d.classList.contains('saving'))return;
  if(FB.state==='error'||FB.ss==='rules'||FB.ss==='noconn'||FB.ss==='toobig')fbDot('pending');else if(FB.paused)fbDot('pending');else fbDot('saved');}
function fbChoiceHTML(row,intro){
  return `<div data-noi18n><p>${intro}</p><table class="rfit"><tr><th></th><th>${LN('สรุป','Summary')}</th><th>${LN('ล่าสุด','Last change')}</th></tr>
  <tr><td>💻 ${LN('เครื่องนี้','This device')}</td><td>${fbSum(JSON.parse(fbPayload()))}</td><td>${fbT((fbMeta()||{}).at)}</td></tr>
  <tr><td>☁️ ${LN('คลาวด์','Cloud')}</td><td>${fbSum(row.data)}</td><td>${fbT(row.at)}${row.ver?' · v'+row.ver:''}</td></tr></table>
  <p class="note" style="margin-top:8px">${LN('ฉบับที่ไม่เลือกจะถูกทับ · ระบบสำรองข้อมูลเครื่องนี้ไว้ให้ 1 ฉบับก่อนใช้ของคลาวด์ (กู้ได้จากเมนูโปรไฟล์)','The version you do not choose is overwritten · this device\'s data is backed up once before the cloud copy is used (restore it from the profile menu)')}</p></div>`;
}
const fbBtns=()=>[{key:'cloud',label:'☁️ '+LN('ใช้ของคลาวด์ (ทับเครื่องนี้)','Use the cloud copy (overwrite this device)'),raw:true},{key:'mine',label:'💻 '+LN('ใช้ของเครื่องนี้ (ทับคลาวด์)','Use this device (overwrite the cloud)'),cls:'pri',raw:true},{key:'cancel',label:LN('ยกเลิก (หยุดซิงค์ไว้ก่อน)','Cancel (pause sync)'),raw:true}];
async function fbConflict(){   // อีกเครื่อง/แท็บแก้ไปก่อน
  if(FB.asking)return;FB.asking=true;
  try{
    const sn=await FB.ref.get();
    if(!sn.exists){FB.ver=0;FB.dirty=true;FB.asking=false;fbSchedule(500);return;}
    const row=fbRow(sn);if(!row.data){throw new Error('bad data');}
    const k=await askChoice(LN('☁️ ข้อมูลซิงค์ชนกัน','☁️ Sync conflict'),fbChoiceHTML(row,LN('ข้อมูลบนคลาวด์ถูกแก้จากเครื่องอื่นไปก่อน เลือกว่าจะใช้ฉบับไหน','The cloud data was changed from another device first. Choose which version to keep.')),fbBtns());
    if(k==='cloud'){fbApply(row.data);FB.dirty=false;fbMark(row.ver,fbSig(),false);fbSS('pulled','synced');}
    else if(k==='mine'){await fbCommit(row.ver);}
    else{FB.paused=true;fbSS('paused','paused');}
  }catch(e){if(e&&e.conflict){FB.asking=false;return fbConflict();}fbFail(e);}
  FB.asking=false;fbDotSettle();
}
async function fbFirstSync(){   // ล็อกอินครั้งแรกบนเครื่องนี้ (หรือเปลี่ยนบัญชี): เทียบเครื่องนี้กับคลาวด์
  if(FB.asking)return;FB.asking=true;fbSS('syncing','syncing');
  setTimeout(fbDotSettle,0);
  try{
    const sn=await FB.ref.get(),has=fbHasLocal();
    if(!sn.exists){
      if(has){await fbCommit(0);fbSS('created','synced');}
      else{FB.dirty=false;fbMark(0,fbSig(),false);fbSS('ready','synced');}
    }else{
      const row=fbRow(sn);if(!row.data)throw new Error('bad data');
      if(!has){fbApply(row.data);FB.dirty=false;fbMark(row.ver,fbSig(),false);fbSS('pulled','synced');}
      else if(fbSame(row.data)){FB.dirty=false;fbMark(row.ver,fbSig(),false);fbSS('linked','synced');}
      else{
        const k=await askChoice(LN('☁️ พบข้อมูลทั้งสองฝั่ง','☁️ Data found on both sides'),fbChoiceHTML(row,LN('ทั้งเครื่องนี้และคลาวด์มีข้อมูลอยู่แล้ว เลือกว่าจะใช้ฉบับไหน','Both this device and the cloud already have data. Choose which version to keep.')),fbBtns());
        if(k==='cloud'){fbApply(row.data);FB.dirty=false;fbMark(row.ver,fbSig(),false);fbSS('pulled','synced');}
        else if(k==='mine'){FB.asking=false;try{await fbCommit(row.ver);}catch(e){if(e&&e.conflict){await fbConflict();return;}throw e;}return;}
        else{FB.paused=true;fbSS('paused','paused');}
      }
    }
  }catch(e){fbFail(e);}
  FB.asking=false;
}
const fbTyping=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);};
async function fbPull(auto){   // ตรวจคลาวด์: ถ้าเวอร์ชันใหม่กว่าและเครื่องนี้ไม่มีงานค้าง → อัปเดตเงียบๆ (มีปุ่มเลิกทำ) · ถ้ามีงานค้าง → ถาม
  if(!FB.user||FB.paused||FB.busy||FB.asking)return;
  try{
    if(FB.ver==null){await fbFirstSync();return;}
    const sn=await FB.ref.get();FB.lastPull=Date.now();
    if(!sn.exists){FB.ver=0;if(fbIsDirty()||fbHasLocal()){FB.dirty=true;fbSchedule(500);}else fbSS('ready','synced');return;}
    const row=fbRow(sn),dirty=fbIsDirty();
    if(row.ver>FB.ver){
      if(dirty){await fbConflict();return;}   // มีการแก้ที่ยังไม่ขึ้นคลาวด์ (ดูจากเนื้อหาจริง) → ถามก่อน ไม่ทับเงียบๆ
      if(auto&&fbTyping())return;   // กำลังพิมพ์อยู่ รอรอบถัดไป
      if(!row.data)throw new Error('bad data');
      fbApply(row.data);fbMark(row.ver,fbSig(),false);fbSS('updated','synced');fbToast(LN('อัปเดตข้อมูลจากอีกเครื่องแล้ว','Updated from another device'),LN('เลิกทำ','Undo'),fbUndoLocal);
    }else if(dirty)fbSchedule(500);
    else{if(FB.sig==null)fbMark(FB.ver,fbSig(),false);if(FB.ss==='syncing')fbSS('pushed','synced');else fbRenderUI();}
  }catch(e){fbFail(e,true);}
}
async function fbSyncNow(){FB.paused=false;FB.asking=false;fbMenu(null,false);fbSS('syncing','syncing');await fbPull(false);if(FB.dirty&&!FB.paused&&!FB.asking)await fbPush();}
async function fbRestore(){   // กู้ข้อมูลก่อนหน้า: ฉบับก่อนหน้าบนคลาวด์ หรือข้อมูลเครื่องนี้ก่อนซิงค์ล่าสุด
  fbMenu(null,false);
  try{
    const bak=fbJ(FBK.bak,null),sn=FB.ref?await FB.ref.get():null,row=sn&&sn.exists?fbRow(sn):null;let prev=null;try{prev=row&&row.prev?JSON.parse(row.prev):null;}catch(e){}
    const btns=[];
    if(prev&&prev.servers)btns.push({key:'cloud',label:'☁️ '+LN('ฉบับก่อนหน้าบนคลาวด์','The previous cloud version'),raw:true});
    if(bak&&bak.data&&bak.data.servers)btns.push({key:'local',label:'💻 '+LN('ข้อมูลเครื่องนี้ก่อนซิงค์ล่าสุด ('+fbT(bak.at)+')','This device before the last sync ('+fbT(bak.at)+')'),raw:true});
    if(!btns.length){fbToast(LN('ยังไม่มีข้อมูลก่อนหน้าให้กู้','There is no earlier version to restore yet'));return;}
    btns.push({key:'cancel',label:LN('ยกเลิก','Cancel'),raw:true});
    const k=await askChoice(LN('↩ กู้ข้อมูลก่อนหน้า','↩ Restore an earlier version'),`<div data-noi18n><p>${LN('เลือกฉบับที่ต้องการ ข้อมูลตอนนี้จะถูกแทนที่ (และซิงค์ขึ้นคลาวด์ตามปกติ)','Choose the version you want. The current data is replaced (and synced to the cloud as usual).')}</p></div>`,btns);
    if(k==='cloud'||k==='local'){fbApply(k==='cloud'?prev:bak.data);FB.paused=false;fbDirty();fbToast(LN('กู้ข้อมูลแล้ว กำลังซิงค์ขึ้นคลาวด์','Restored, syncing to the cloud'));}
  }catch(e){fbFail(e);}
}function fbUndoLocal(){   // เลิกทำการดึงข้อมูลจากคลาวด์: กลับไปใช้ข้อมูลเครื่องนี้ก่อนหน้านั้น
  const b=fbJ(FBK.bak,null);if(!b||!b.data)return;
  FB.applying=true;try{loadM(Object.assign({},b.data,{lang:undefined,theme:undefined}));autosave();renderAll();}finally{FB.applying=false;}
  FB.paused=false;FB.dirty=true;fbDirty();fbToast(LN('กลับไปใช้ข้อมูลเครื่องนี้แล้ว กำลังซิงค์ขึ้นคลาวด์','Back to this device\'s data, syncing to the cloud'));
}
// อีกแท็บของเบราว์เซอร์เดียวกันบันทึกข้อมูลใหม่ → โหลดตามทันที ไม่งั้นแท็บนี้จะเขียนทับด้วยข้อมูลเก่า (ถ้ากำลังพิมพ์อยู่ รอให้พิมพ์เสร็จก่อน)
function fbTabData(txt){
  const go=()=>{try{const d=JSON.parse(txt);FB.applying=true;try{loadM(Object.assign({},d,{lang:M.lang,theme:M.theme}));renderAll();}finally{FB.applying=false;}}catch(e){}};
  if(fbTyping()){const h=()=>{document.removeEventListener('focusout',h,true);setTimeout(go,60);};document.addEventListener('focusout',h,true);}else go();
}
function fbInit(){
  if(!FB_CONFIG.apiKey||!FB_CONFIG.projectId)return;   // ยังไม่ได้ตั้งค่าโปรเจกต์ Firebase ของตัวเอง: ไม่แสดงปุ่ม ไม่โหลด SDK ไม่เรียกเครือข่าย
  fbRenderUI();
  if(!FB.bound){FB.bound=true;
    document.addEventListener('click',e=>{const dd=document.getElementById('userdd');if(dd&&!dd.contains(e.target)){const m=document.getElementById('fbMenu');if(m)m.classList.remove('open');}});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FB.user&&Date.now()-FB.lastPull>300000)fbPull(true);});
    window.addEventListener('storage',e=>{   // แท็บอื่นของเบราว์เซอร์เดียวกันบันทึกข้อมูล/สถานะซิงค์
      if(e.key===FBK.meta&&FB.user&&e.newValue){try{const m=JSON.parse(e.newValue);if(m&&m.uid===FB.user.uid){FB.ver=m.ver;if(m.sig!=null)FB.sig=m.sig;FB.dirty=!!m.dirty;}}catch(x){}}
      else if(e.key==='travian-mgr'&&e.newValue&&!FB.applying)fbTabData(e.newValue);
    });
    window.addEventListener('online',()=>{if(FB.user){if(FB.dirty)fbSchedule(1000);else fbPull(true);}});
    window.addEventListener('pagehide',()=>{if(FB.user&&FB.dirty&&!FB.paused&&!FB.asking)fbPush();});   // ปิดหน้า: พยายามส่งทันที (ไม่ทันก็ยังจำว่ามีงานค้าง รอบหน้าส่งให้)
    setInterval(()=>{if(FB.user&&!document.hidden)fbPull(true);},600000);
  }
  fbLoadSdk();
}


/* ============ 👥 แชร์โปรไฟล์ให้เพื่อน (Dual) ============ */
// แชร์เฉพาะ: เมือง (รวมเส้นทางส่งออก) · ปลายทาง WW/อาติแฟค · กลุ่มเมือง · การ์ดเมืองทหาร · ความเร็ว/โบนัสกิลด์/Item Crafting
//   = ข้อมูลของหน้า จัดการเมือง · จัดการเส้นทางขนส่ง · สรุปทุกเมือง · ที่เหลือ (แผนที่ ตีสวน คำนวณแร่ ฯลฯ) ของใครของมัน
// เก็บที่ Firestore "trshare/{id}" = {owner, ownerEmail, ownerName, name, emails:[...], roles:{email:'view'|'edit'}, data (JSON), ver, updatedAt, by, seed}
// เจ้าของเชิญด้วย Gmail · คนที่ได้รับเชิญล็อกอินด้วย Gmail นั้นแล้วแอปถามให้เพิ่มเป็นโปรไฟล์ · ซิงค์ทันที (onSnapshot)
// ชนกัน (แก้พร้อมกัน): ใช้ฉบับที่ขึ้นคลาวด์ก่อน แล้วแจ้งให้แก้ซ้ำ · ดูอย่างเดียว: แก้ในเครื่องไม่ได้ (คืนค่าให้เอง)
const SH_COL='trshare',SH_KEYS=['towns','ext','nextId','folders','nextFid','milCard','speed','guild','crafting'],SH_VIEWS=['town','routes','sum','imp'];
const SH={subs:{},cache:{},push:{},pend:{},fly:{},applying:false,invites:[],obs:null,warnT:0};
const shEmail=()=>FB.user&&FB.user.email?String(FB.user.email).trim().toLowerCase():'';
const shRO=()=>!!(S&&S.share&&S.share.role==='view');
const shSv=id=>M.servers.find(x=>x.share&&x.share.id===id)||null;
const shRef=id=>FB.db.collection(SH_COL).doc(id);
const SH_EYE='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const shRoleTxt=r=>r==='owner'?LN('เจ้าของ','owner'):r==='edit'?LN('แก้ไขได้','can edit'):LN('ดูอย่างเดียว','view only');
const shRoleHTML=r=>(r==='view'?SH_EYE+' ':r==='edit'?'✏️ ':'')+shRoleTxt(r);   // ใช้ในข้อความ HTML (มีไอคอนตาสำหรับดูอย่างเดียว)
function shPick(sv){const o={};SH_KEYS.forEach(k=>{if(sv[k]!==undefined)o[k]=sv[k];});return JSON.stringify(o);}
function shPut(sv,str){   // ใส่ข้อมูลที่แชร์ลงโปรไฟล์ แล้วคืนสตริงหลังจัดรูปแบบ (ไว้เทียบว่ามีการแก้ไหม)
  let d={};try{d=JSON.parse(str)||{};}catch(e){}
  SH_KEYS.forEach(k=>{if(d[k]!==undefined)sv[k]=JSON.parse(JSON.stringify(d[k]));else if(k==='towns'||k==='ext'||k==='folders')sv[k]=[];});
  withServer(sv,()=>{try{normTowns();}catch(e){}});
  if(sv===S&&!T(cur))cur=S.towns.length?S.towns[0].id:null;
  return shPick(sv);
}
function shAfterLoad(){   // หลังโหลดข้อมูลทั้งชุด (จากคลาวด์ของตัวเอง/แท็บอื่น): ใช้ข้อมูลแชร์ล่าสุดที่รู้ ทับสำเนาเก่าในโปรไฟล์
  if(!M)return;M.servers.forEach(sv=>{const c=sv.share&&SH.cache[sv.share.id];if(c&&shPick(sv)!==c.str)shPut(sv,c.str);});
  shSyncSubs();
}
function shOnSave(){   // เรียกจาก autosave: มีการแก้ข้อมูลที่แชร์ไหม → ส่งขึ้น (แก้ไขได้/เจ้าของ) หรือคืนค่า (ดูอย่างเดียว)
  if(SH.applying||!S||!S.share)return;
  const id=S.share.id,c=SH.cache[id];if(!c)return;
  if(shPick(S)===c.str)return;
  if(S.share.role==='view'){
    shPut(S,c.str);
    if(Date.now()-SH.warnT>4000){SH.warnT=Date.now();fbToast('🔒 '+LN('โปรไฟล์นี้แชร์แบบดูอย่างเดียว — แก้ไม่ได้','This shared profile is view only: changes are not allowed'));}
    setTimeout(()=>{if(!fbTyping())renderAll();},0);return;
  }
  shSchedule(id,1200);
}
function shSchedule(id,ms){clearTimeout(SH.push[id]);SH.push[id]=setTimeout(()=>{SH.push[id]=0;shPush(id);},ms);}
async function shPush(id){
  const sv=shSv(id),c=SH.cache[id];if(!sv||!c||!FB.user||sv.share.role==='view')return;
  const str=shPick(sv);if(str===c.str)return;
  if(str.length>900000){fbToast('⚠ '+LN('ข้อมูลที่แชร์ใหญ่เกินไป ซิงค์ไม่ได้','The shared data is too large to sync'));return;}
  SH.fly[id]=true;
  try{
    const ver=await FB.db.runTransaction(async tx=>{
      const sn=await tx.get(shRef(id));if(!sn.exists){const e=new Error('gone');e.gone=true;throw e;}
      const d=sn.data(),cur=+d.ver||0;if(cur!==c.ver){const e=new Error('conflict');e.conflict=true;e.d=d;throw e;}
      tx.update(shRef(id),{data:str,ver:cur+1,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:shEmail()});return cur+1;});
    SH.cache[id]={ver,str,raw:str};
    const sv2=shSv(id);if(sv2&&shPick(sv2)!==str)shSchedule(id,800);   // แก้เพิ่มระหว่างส่ง
  }catch(e){
    if(e&&e.conflict){shApply(id,e.d,true);fbToast('⚠ '+LN('มีคนแก้โปรไฟล์ที่แชร์พร้อมกัน — ใช้ฉบับล่าสุดแล้ว กรุณาแก้อีกครั้ง','Someone edited the shared profile at the same time: the latest version is loaded, please make your change again'));}
    else if(e&&(e.gone||e.code==='permission-denied'))shDetach(id,e.gone?'gone':'removed');
    else{fbToast('⚠ '+LN('ซิงค์โปรไฟล์ที่แชร์ไม่สำเร็จ — จะลองใหม่','Could not sync the shared profile: will retry'));shSchedule(id,30000);}
  }finally{SH.fly[id]=false;}
}
function shApply(id,d,force){   // ข้อมูลใหม่จากคลาวด์ → ใส่ลงโปรไฟล์
  const sv=shSv(id);if(!sv||!d)return;
  const go=()=>{const sv=shSv(id);if(!sv)return;
    SH.applying=true;try{SH.cache[id]={ver:+d.ver||0,str:shPut(sv,d.data),raw:d.data};autosave();}finally{SH.applying=false;}
    renderAll();
    if(d.by&&d.by!==shEmail()&&!force)fbToast('👥 '+LN('อัปเดตโปรไฟล์ที่แชร์ "','Shared profile "')+sv.name+LN('" จาก ','" updated by ')+d.by);};
  if(fbTyping()&&sv===S&&SH_VIEWS.includes(view)){SH.pend[id]=go;const h=()=>{document.removeEventListener('focusout',h,true);setTimeout(()=>{const f=SH.pend[id];SH.pend[id]=null;if(f)f();},60);};document.addEventListener('focusout',h,true);}
  else go();
}
function shMeta(sv,d){   // สิทธิ์ของเรา + ข้อมูลเจ้าของ/จำนวนคน (เปลี่ยนเมื่อเจ้าของแก้)
  const em=shEmail(),role=FB.user&&d.owner===FB.user.uid?'owner':(d.roles&&d.roles[em])||'';
  if(!role)return false;
  const n=(d.emails||[]).length,own=d.ownerName||d.ownerEmail||'';
  if(sv.share.role!==role||sv.share.n!==n||sv.share.ownerName!==own){
    const was=sv.share.role;sv.share.role=role;sv.share.n=n;sv.share.ownerName=own;
    SH.applying=true;try{autosave();}finally{SH.applying=false;}
    if(was&&was!==role)fbToast('👥 "'+sv.name+'": '+LN('สิทธิ์ของคุณเปลี่ยนเป็น ','your access is now ')+shRoleTxt(role));
    if(sv===S)renderAll();
  }
  return true;
}
function shSub(id){
  if(SH.subs[id]||!FB.user)return;
  SH.subs[id]=shRef(id).onSnapshot(sn=>{
    const sv=shSv(id);if(!sv)return;
    if(!sn.exists){shDetach(id,'gone');return;}
    const d=sn.data()||{};if(!shMeta(sv,d)){shDetach(id,'removed');return;}
    const c=SH.cache[id],ver=+d.ver||0;
    if(!c||ver>c.ver||(ver===c.ver&&d.data!==c.raw)){if((SH.push[id]||SH.fly[id])&&c)return;   // เวอร์ชันเท่ากันแต่เนื้อหาต่าง = ใช้ของคลาวด์ (ให้ทุกเครื่องตรงกัน)   // เรามีการแก้รอส่ง → ให้ shPush ตัดสิน (ชน = ใช้ฉบับคลาวด์)
      shApply(id,d,!c);}
  },e=>{const code=(e&&e.code)||'';SH.subs[id]=null;if(code==='permission-denied')shDetach(id,'removed');});
}
function shUnsub(id){const u=SH.subs[id];if(typeof u==='function')try{u();}catch(e){}delete SH.subs[id];}
function shSyncSubs(){
  if(!FB.user||!FB.db||!M)return;
  const want=new Set(M.servers.filter(x=>x.share&&x.share.id).map(x=>x.share.id));
  Object.keys(SH.subs).forEach(id=>{if(!want.has(id))shUnsub(id);});
  want.forEach(id=>shSub(id));
}
function shDetach(id,why){   // เลิกเชื่อม: เก็บข้อมูลไว้เป็นโปรไฟล์ของตัวเอง
  shUnsub(id);clearTimeout(SH.push[id]);delete SH.cache[id];
  const sv=shSv(id);if(!sv)return;sv.share=null;autosave();renderAll();
  if(why==='gone')fbToast('👥 '+LN('เจ้าของเลิกแชร์ "','The owner stopped sharing "')+sv.name+LN('" แล้ว · ข้อมูลยังอยู่ในโปรไฟล์นี้','" · the data stays in this profile'));
  else if(why==='removed')fbToast('👥 '+LN('คุณไม่ได้อยู่ในการแชร์ "','You are no longer in the share of "')+sv.name+LN('" แล้ว · ข้อมูลยังอยู่ในโปรไฟล์นี้','" · the data stays in this profile'));
}
function shStart(){shSyncSubs();setTimeout(()=>shInvites(false),2500);
  if(!SH.iv){SH.iv=setInterval(()=>{if(FB.user&&!document.hidden&&!document.querySelector('#choicebox.on'))shInvites(false);},300000);   // คำเชิญใหม่: เช็กทุก 5 นาที + ตอนกลับมาที่แท็บ
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FB.user&&Date.now()-(SH.lastInv||0)>60000)shInvites(false);});}}
function shStop(){Object.keys(SH.subs).forEach(shUnsub);}
// ----- คำเชิญ: โปรไฟล์ที่คนอื่นแชร์ให้ Gmail นี้ -----
async function shInvites(manual){
  if(!FB.user){if(manual)fbToast(LN('ล็อกอิน Google ก่อน','Sign in with Google first'),LN('เข้าสู่ระบบ','Sign in'),fbLogin);return;}
  const em=shEmail();if(!em)return;SH.lastInv=Date.now();
  if(!manual&&document.querySelector('#choicebox.on'))return;   // มีหน้าต่างอื่นเปิดอยู่ ไว้รอบหน้า
  try{
    const qs=await FB.db.collection(SH_COL).where('emails','array-contains',em).get();
    SH.invites=qs.docs.map(x=>Object.assign({id:x.id},x.data()));
  }catch(e){if(manual)fbToast('⚠ '+LN('อ่านรายการที่แชร์ไม่ได้ — ตรวจ rules ของ Firestore','Could not read the shared list: check the Firestore rules'));return;}
  if(!M.shSeen||typeof M.shSeen!=='object')M.shSeen={};
  const fresh=SH.invites.filter(d=>!shSv(d.id));
  if(manual){shInbox();return;}
  for(const d of fresh.filter(d=>!M.shSeen[d.id])){
    const k=await askChoice('📥 '+LN('มีโปรไฟล์แชร์ให้คุณ','A profile is shared with you'),
      `<div data-noi18n><p><b>${esc(d.ownerName||d.ownerEmail||'')}</b> ${LN('แชร์โปรไฟล์','shared the profile')} <b>${esc(d.name||'')}</b> ${LN('ให้คุณ','with you')} · <b>${shRoleHTML((d.roles||{})[em])}</b></p><p class="note">${LN('แชร์: เมือง · เส้นทางขนส่ง · สรุปทุกเมือง (ซิงค์ทันที) · ส่วนอื่นเป็นของคุณเอง','Shared: towns · trade routes · summary (synced live) · everything else is your own')}</p></div>`,
      [{key:'add',label:LN('เพิ่มเป็นโปรไฟล์','Add as a profile'),cls:'pri',raw:true},{key:'later',label:LN('ไว้ทีหลัง','Later'),raw:true},{key:'no',label:LN('ไม่เพิ่ม','No'),raw:true}]);
    if(k==='add')shJoin(d);else if(k==='no'){M.shSeen[d.id]=1;autosave();}
    if(k==='later')break;
  }
}
function shInbox(){
  const em=shEmail(),L=SH.invites||[];
  const rows=L.length?L.map(d=>{const sv=shSv(d.id);return `<div class="shrow"><div><b data-noi18n>${esc(d.name||'')}</b><div class="note"><span data-noi18n>${esc(d.ownerName||d.ownerEmail||'')}</span> · ${shRoleHTML((d.roles||{})[em])}</div></div>${sv?`<span class="note">✓ ${LN('เพิ่มแล้ว','added')}</span>`:`<button class="pri" onclick="choiceClose('j:${esc(d.id)}')">${LN('เพิ่ม','Add')}</button>`}</div>`;}).join(''):`<p class="note">${LN('ยังไม่มีใครแชร์โปรไฟล์ให้ ','Nobody has shared a profile with ')}<b data-noi18n>${esc(em)}</b></p>`;
  askChoice('📥 '+LN('โปรไฟล์ที่แชร์ให้ฉัน','Profiles shared with me'),`<div>${rows}</div>`,[{key:'close',label:LN('ปิด','Close'),raw:true}]).then(k=>{
    if(k&&k.startsWith('j:')){const d=L.find(x=>x.id===k.slice(2));if(d)shJoin(d);}});
}
function shJoin(d){
  if(shSv(d.id)){switchServer(shSv(d.id).id);return;}
  const em=shEmail(),sv=newState();sv.id=M.nextSid++;
  sv.name=uniqueName((d.name||LN('โปรไฟล์ที่แชร์','Shared profile'))+(d.ownerName?' ('+d.ownerName+')':''));
  sv.share={id:d.id,role:FB.user&&d.owner===FB.user.uid?'owner':(d.roles||{})[em]||'view',n:(d.emails||[]).length,ownerName:d.ownerName||d.ownerEmail||''};
  if(d.seed){if(d.seed.mapUrl)sv.mapUrl=d.seed.mapUrl;if(d.seed.mapPlayer)sv.mapPlayer=d.seed.mapPlayer;}   // ตั้งค่าเริ่มต้น (map.sql) ครั้งเดียวตอนเพิ่ม
  M.servers.push(sv);
  SH.applying=true;try{SH.cache[d.id]={ver:+d.ver||0,str:shPut(sv,d.data||'{}'),raw:d.data||'{}'};}finally{SH.applying=false;}
  if(!M.shSeen||typeof M.shSeen!=='object')M.shSeen={};M.shSeen[d.id]=1;
  switchServer(sv.id);shSyncSubs();
  fbToast('👥 '+LN('เพิ่มโปรไฟล์ที่แชร์แล้ว: ','Shared profile added: ')+sv.name);
}
// ----- หน้าต่างตั้งค่าการแชร์ (ปุ่ม 👥 ข้างชื่อโปรไฟล์) -----
const shOkEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function shDialog(){
  if(!FB.user){fbToast(LN('ล็อกอิน Google ก่อนจึงแชร์โปรไฟล์ได้','Sign in with Google to share a profile'),LN('เข้าสู่ระบบ','Sign in'),fbLogin);return;}
  const sh=S.share,what=`<p class="note">${LN('แชร์เฉพาะ: <b>จัดการเมือง · จัดการเส้นทางขนส่ง · สรุปทุกเมือง</b> (รวมความเร็ว โบนัสกิลด์ Item Crafting) ซิงค์ทันทีทุกคน · ส่วนอื่น (แผนที่ ตีสวน คำนวณแร่ แผนสร้างเมือง ฯลฯ) ของใครของมัน · คนที่ได้รับเชิญต้องล็อกอินด้วย Gmail ที่ใส่ไว้','Shared: <b>towns · trade routes · summary</b> (with speed, alliance bonus, Item Crafting), synced live for everyone · everything else (map, counter-attack, calculators, plans…) stays personal · invited people sign in with the Gmail entered here')}</p>`;
  if(sh&&sh.role!=='owner'){   // เราเป็นคนที่ได้รับแชร์
    const k=await askChoice('👥 '+LN('โปรไฟล์ที่แชร์','Shared profile'),`<div data-noi18n><p>${LN('แชร์โดย','Shared by')} <b>${esc(sh.ownerName||'')}</b> · ${LN('สิทธิ์ของคุณ','your access')}: <b>${shRoleHTML(sh.role)}</b></p>${what}<p class="note">${LN('เลิกใช้การแชร์ = เก็บข้อมูลตอนนี้ไว้เป็นโปรไฟล์ของคุณเอง ไม่ซิงค์อีก','Stop using the share = keep the current data as your own profile, no more syncing')}</p></div>`,
      [{key:'leave',label:LN('เลิกใช้การแชร์','Stop using the share'),cls:'dng',raw:true},{key:'close',label:LN('ปิด','Close'),raw:true}]);
    if(k==='leave'){const id=sh.id;shDetach(id,'');M.shSeen=M.shSeen||{};M.shSeen[id]=1;autosave();fbToast('👥 '+LN('เลิกใช้การแชร์แล้ว ข้อมูลยังอยู่','Stopped using the share, the data is kept'));}
    return;
  }
  let d=null;if(sh){try{const sn=await shRef(sh.id).get();d=sn.exists?sn.data():null;}catch(e){}if(!d){fbToast('⚠ '+LN('อ่านข้อมูลการแชร์ไม่ได้','Could not read the share'));return;}}
  const roles=(d&&d.roles)||{},emails=(d&&d.emails)||[];

              :[{key:'save',label:LN('เริ่มแชร์','Start sharing'),cls:'pri',raw:true},{key:'close',label:LN('ยกเลิก','Cancel'),raw:true}];
  const k=await askChoice('👥 '+LN('แชร์โปรไฟล์ "','Share the profile "')+S.name+'"',h,btns);
  if(k==='stop'){dlg(LN('เลิกแชร์โปรไฟล์ "'+S.name+'" ?\nเพื่อนจะเก็บข้อมูลล่าสุดไว้ในเครื่องของเขา แต่ไม่ซิงค์อีก','Stop sharing "'+S.name+'"?\nFriends keep the latest data on their side, but it no longer syncs'),async()=>{
      const id=sh.id;try{await shRef(id).delete();}catch(e){fbToast('⚠ '+LN('เลิกแชร์ไม่สำเร็จ','Could not stop sharing'));return;}
      shUnsub(id);delete SH.cache[id];S.share=null;autosave();renderAll();fbToast('👥 '+LN('เลิกแชร์แล้ว','Sharing stopped'));},LN('เลิกแชร์','Stop sharing'),true);return;}
  if(k!=='save')return;
  const R={};emails.forEach((e,i)=>{const v=(document.getElementById('shm'+i)||{}).value||roles[e]||'view';if(v!=='del')R[e]=v;});
  const nr=(document.getElementById('shnewr')||{}).value||'edit',raw=String((document.getElementById('shnew')||{}).value||'').toLowerCase().split(/[\s,;]+/).filter(Boolean);
  const bad=raw.filter(e=>!shOkEmail(e));if(bad.length){fbToast('⚠ '+LN('อีเมลไม่ถูกต้อง: ','Invalid email: ')+bad.join(', '));return;}

  try{

      if(str.length>900000){fbToast('⚠ '+LN('ข้อมูลใหญ่เกินกว่าจะแชร์ได้','The data is too large to share'));return;}
      await ref.set({owner:FB.user.uid,ownerEmail:shEmail(),ownerName:FB.user.displayName||shEmail(),name:S.name,emails:E,roles:R,data:str,ver:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),by:shEmail(),seed});
      S.share={id:ref.id,role:'owner',n:E.length,ownerName:FB.user.displayName||shEmail()};SH.cache[ref.id]={ver:1,str,raw:str};
      SH.applying=true;try{autosave();}finally{SH.applying=false;}shSyncSubs();renderAll();
      fbToast('👥 '+LN('เริ่มแชร์แล้ว · ให้เพื่อนเปิดแอปแล้วล็อกอินด้วย Gmail ที่ใส่ไว้','Sharing started · ask your friends to open the app and sign in with the Gmail you entered'));
    }else if(!E.length){   // เอาทุกคนออก = เลิกแชร์ (ลบการแชร์ ไอคอนแชร์หาย)
      const id=sh.id;await shRef(id).delete();
      shUnsub(id);delete SH.cache[id];S.share=null;autosave();renderAll();
      fbToast('👥 '+LN('ไม่เหลือใครในการแชร์ — เลิกแชร์ให้แล้ว','Nobody is left in the share: sharing stopped'));
    }else{
      await shRef(sh.id).update({emails:E,roles:R,name:S.name,seed});
      S.share.n=E.length;SH.applying=true;try{autosave();}finally{SH.applying=false;}renderAll();fbToast('👥 '+LN('บันทึกการแชร์แล้ว','Sharing saved'));
    }
  }catch(e){fbToast('⚠ '+LN('บันทึกการแชร์ไม่สำเร็จ — ตรวจ rules ของ Firestore','Could not save the share: check the Firestore rules')+' ('+((e&&e.code)||e)+')');}

/* ============ มือถือ: ตารางกว้าง → ย่อให้พอดี หรือแสดงเป็นการ์ด (ทำเฉพาะจอแคบ) ============ */
const MQ=window.matchMedia?window.matchMedia('(max-width:760px)'):{matches:false};
function mobTable(t){   // ติดป้ายชื่อคอลัมน์ให้ทุกเซลล์ (จากหัวตารางทุกชั้น รวม colspan/rowspan) · คืนข้อมูลกลุ่มหัวตาราง (เช่น "ผลิตเอง" ×4)
  t.querySelectorAll('td.mcap,span.mlab').forEach(x=>x.remove());
  const rows=[...t.rows];if(rows.length<2)return null;
  let h=0;while(h<rows.length&&[...rows[h].cells].every(c=>c.tagName==='TH'))h++;
  if(!h||h>=rows.length)return null;
  const g=[],gs=[],ge=[];
  for(let r=0;r<h;r++){let c=0;for(const cell of rows[r].cells){while(g[r]&&g[r][c]!==undefined)c++;
    for(let i=0;i<cell.rowSpan;i++)for(let j=0;j<cell.colSpan;j++)if(r+i<h){(g[r+i]=g[r+i]||[])[c+j]=cell.textContent.replace(/\s+/g,' ').trim();(gs[r+i]=gs[r+i]||[])[c+j]=[c,cell.colSpan,cell.rowSpan];(ge[r+i]=ge[r+i]||[])[c+j]=cell;}
    c+=cell.colSpan;}}
  const n=Math.max(...g.map(x=>x.length)),lab=[],grp=[];
  for(let c=0;c<n;c++){
    const leaf=(g[h-1]&&g[h-1][c])||'';lab[c]=leaf;
    // กลุ่ม = หัวตารางชั้นบนที่คลุมหลายคอลัมน์ และข้อความไม่ซ้ำกับชั้นล่าง
    if(h>=2){const top=g[0]&&g[0][c],m=gs[0]&&gs[0][c];if(top&&m&&m[1]>1&&m[2]===1&&top!==leaf)grp[c]={txt:top,start:m[0]};}
    if(!lab[c]){const parts=[];for(let r=0;r<h;r++){const x=g[r]&&g[r][c];if(x&&x!==parts[parts.length-1])parts.push(x);}lab[c]=parts.join(' · ');}
  }
  let title=lab.findIndex(x=>x);if(title<0)title=0;
  const labH=lab.map((x,c)=>{const cell=ge[h-1]&&ge[h-1][c];return cell&&cell.querySelector('i,img,svg')?cell.innerHTML.trim():null;});   // ป้ายที่มีไอคอนวาดด้วย CSS (เช่น โคลน) ใช้ HTML ของหัวตารางจริง
  const hasGrp=grp.some(Boolean);
  return {rows,h,n,lab,labH,grp,title,hasGrp};
}
function mobLabel(t,m){   // ใส่ป้ายและ (ถ้าเป็นการ์ด) หัวกลุ่มลงในแถวข้อมูล
  const {rows,h,n,lab,labH,grp,title}=m;
  rows.forEach((tr,ri)=>{
    if(ri<h){tr.classList.add('mhd');return;}
    let c=0;
    for(const td of [...tr.cells]){
      const wide=td.colSpan>1&&td.colSpan>=n-1;
      td.dataset.label=wide?'':(lab[c]||'');
      td.classList.toggle('mtitle',c===title);
      td.classList.toggle('mtool',!wide&&!lab[c]&&c!==title);
      td.classList.toggle('mwide',wide&&c!==title);
      td.classList.toggle('mempty',!td.textContent.trim()&&!td.querySelector('input,select,button,img,svg,i'));
      if(t.classList.contains('mcards')&&!wide&&labH[c]&&c!==title&&lab[c]&&!td.classList.contains('mempty')){const sp=document.createElement('span');sp.className='mlab';sp.innerHTML=labH[c];td.insertBefore(sp,td.firstChild);td.dataset.label='';}
      if(t.classList.contains('mcards')&&!wide&&grp[c]&&grp[c].start===c){const cap=document.createElement('td');cap.className='mcap mwide';cap.textContent=grp[c].txt;cap.dataset.label='';tr.insertBefore(cap,td);}
      c+=td.colSpan;
    }
  });
}
let MO=null;
function mobShort(){   // ย่อป้ายแถวของตารางอัปเกรดเกราะ (เฉพาะมือถือ) ให้แถวละบรรทัดเดียว
  document.querySelectorAll('main .upgt tr').forEach(tr=>{const c=tr.cells[0];if(!c||c.children.length)return;
    const t=c.textContent,n=t.replace(/(อัปเกรดเกราะ|Armor upgrade)\s*(?=Lv)/,'').replace(/\s*\((Academy)\)/,'');if(n!==t)c.textContent=n;});
}
function mobAll(){
  const on=MQ.matches,y0=window.scrollY;
  if(on)mobShort();
  document.querySelectorAll('main table').forEach(t=>{
    if(!on){t.classList.remove('mcards','mcmp','mgrp');t.querySelectorAll('td.mcap,span.mlab').forEach(x=>x.remove());return;}
    if(t.classList.contains('upgt'))return;
    const wrap0=t.closest('.scroll')||t.parentElement,w0=wrap0?wrap0.clientWidth:0;
    if(t._mobW===w0&&![...t.rows].some(tr=>!tr.classList.contains('mhd')&&[...tr.cells].some(td=>!('label' in td.dataset)&&!td.classList.contains('mcap'))))return;   // ทำไปแล้ว ไม่ต้องทำซ้ำ
    t._mobW=w0;
    t.classList.remove('mcards','mgrp');t.classList.add('mcmp');
    const m=mobTable(t);if(!m){t.classList.remove('mcmp');return;}
    mobLabel(t,m);
    const wrap=t.closest('.scroll')||t.parentElement;
    if(t.offsetWidth>wrap.clientWidth+1){t.classList.remove('mcmp');t.classList.add('mcards');t.classList.toggle('mgrp',m.hasGrp);mobLabel(t,mobTable(t));}   // ย่อแล้วยังไม่พอดี → การ์ด
  });
  if(on&&Math.abs(window.scrollY-y0)>1)window.scrollTo(0,y0);   // จัดการ์ดใหม่แล้วตำแหน่งเลื่อนต้องไม่กระโดด
  if(MO)MO.takeRecords();   // ไม่นับการแก้ DOM ของตัวเอง กันวนซ้ำ
}
(function(){
  let tm=0;const sched=()=>{if(!MQ.matches)return;cancelAnimationFrame(tm);tm=requestAnimationFrame(mobAll);};
  const m=document.querySelector('main');
  if(window.MutationObserver&&m){MO=new MutationObserver(sched);MO.observe(m,{childList:true,subtree:true,characterData:true});}
  const flip=()=>{renderAll();mobAll();};
  if(MQ.addEventListener)MQ.addEventListener('change',flip);else if(MQ.addListener)MQ.addListener(flip);
  let lw=window.innerWidth;
  window.addEventListener('resize',()=>{if(window.innerWidth!==lw){lw=window.innerWidth;sched();}});   // แถบที่อยู่ของเบราว์เซอร์โผล่/หายเปลี่ยนแค่ความสูง → ไม่ต้องจัดการ์ดใหม่ (เดิมทำให้หน้ากระตุก)
  mobAll();
})();


/* ============ มือถือ: กันรูดหน้าลงสุดแล้วเบราว์เซอร์รีเฟรชหน้าเอง (pull-to-refresh) ============ */
(function(){
  if(!('ontouchstart' in window))return;
  let sy=0;
  document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!MQ.matches||!e.cancelable)return;
    const dy=e.touches[0].clientY-sy;if(dy<=0)return;                                   // นิ้วลากลง = ดึงเนื้อหาลงมา
    if((document.scrollingElement||document.documentElement).scrollTop>0)return;        // ยังไม่ถึงบนสุดของหน้า
    for(let a=e.target;a&&a!==document.body;a=a.parentElement){const cs=getComputedStyle(a);if(/(auto|scroll)/.test(cs.overflowY)&&a.scrollTop>0)return;}   // กรอบที่เลื่อนอยู่ข้างใน ปล่อยให้เลื่อนได้
    e.preventDefault();
  },{passive:false});
})();

/* ============ 📋 วางข้อมูลจากเกม (คัดลอก-วางเอง · ไม่มีโปรแกรมอ่านหน้าเกม) ============ */
// รับได้ 2 แบบ: ข้อความที่คัดลอกจากหน้า (Ctrl+A, Ctrl+C) หรือซอร์สของหน้า (Ctrl+U → Ctrl+A, Ctrl+C) ซึ่งมีเส้นทางครบแม้ส่วนที่พับ V ไว้
// วางหน้าไหนในช่องไหนก็ได้: แอปดูเองว่าเป็นหน้าทรัพยากรหรือหน้าเส้นทางการค้า ของหมู่บ้านไหน · ไม่มีอะไรเปลี่ยน = ไม่บันทึก · ไม่ทับแผนเส้นทาง 🆕/✏️/🗑️
function tradeSameAsGame(src,P){   // ผลของ tradeApply จะเหมือนการส่งออกเดิมทุกค่าไหม (ไม่มีงานค้างของแอปด้วย)
  if((src.delPend&&src.delPend.length)||src.exports.some(e=>e.pend||e.prev))return false;
  const next=[];
  for(const k of Object.keys(P.dests)){const d=P.dests[k],dst=findDestBy(k,P.list[k]||null);
    if(!dst||dst.id===src.id)continue;
    if(!d.rows){const old=src.exports.find(e=>e.to===dst.id);if(old)next.push({to:old.to,r:old.r.slice()});continue;}
    const h=d.day.map(x=>Math.round(x/24));if(dst.kind==='art'){h[0]=h[1]=h[2]=0;}
    const ex=next.find(e=>e.to===dst.id);if(ex)h.forEach((v,j)=>ex.r[j]+=v);else next.push({to:dst.id,r:h});}
  const norm=a=>JSON.stringify(a.map(e=>[e.to,(e.r||[]).map(Number)]).sort((x,y)=>x[0]-y[0]));
  return norm(next)===norm(src.exports);
}
// เส้นทางจากเกม (ที่วาง) รวมกับ "แผนที่ยังไม่ได้ทำในเกม" — ไม่ทับแผน
//  • เส้นทางที่วางแผนไว้ (🆕 ต้องสร้าง / ✏️ ต้องแก้): เกมตรงแผนแล้ว → ติ๊กว่าทำแล้วให้เอง · ยังไม่ตรง → คงแผนไว้ (จำค่าในเกมตอนนี้เป็น "เดิม")
//  • 🗑️ ที่รอลบ: ไม่มีในเกมแล้ว → เอาออกจากรายการรอลบ · ยังมี → รอต่อ
//  • เส้นทางที่ไม่ได้วางแผน: ใช้ค่าจากเกม (มีในเกมแต่ไม่มีในแอป → เพิ่ม · ไม่มีในเกมแล้ว → ลบ)
// เส้นทางจากเกม (ที่วาง) รวมกับ "แผนที่ยังไม่ได้ทำในเกม" — ไม่ทับแผน

// ช่องที่อิทธิพลรวมของพันธมิตรใด ≥ MP_TT เป็นของพันธมิตรที่อิทธิพลสูงสุด → หมู่บ้านเดี่ยวได้รัศมีราว 3 ช่อง กลุ่มหนาแน่นได้กว้างกว่า และชนะตรงที่ทับกัน
const MP_TI=6,MP_TT=0.2,MP_TG=3;   // MP_TG = เชื่อมช่องว่างของพันธมิตรเดียวกันที่กว้างไม่เกินราว 7 ช่อง
function mpTerr(){
  const cfg=mpCfg(),R=MP.R||200,n=2*R+1,on=(cfg.al||[]).filter(a=>a.on);
  const sig=[MP.at,MP.rows.length,R,cfg.wrap,on.map(a=>a.aid+':'+a.color).join(',')].join('|');
  if(MP.terr&&MP.terr.sig===sig)return MP.terr;
  const N=n*n,best=new Float32Array(N),own=new Uint8Array(N).fill(255),tmp=new Float32Array(N),K=[];
  for(let dy=-MP_TI;dy<=MP_TI;dy++)for(let dx=-MP_TI;dx<=MP_TI;dx++){const d=Math.hypot(dx,dy);if(d<MP_TI)K.push(dx,dy,(1-d/MP_TI)**2);}
  const byAid=new Map();MP.rows.forEach(r=>{if(r.aid)(byAid.get(r.aid)||byAid.set(r.aid,[]).get(r.aid)).push(r);});
  on.forEach((a,ai)=>{const L=byAid.get(a.aid);if(!L)return;const touched=[];
    for(const r of L){const cx=r.x+R,cy=R-r.y;
      for(let k=0;k<K.length;k+=3){let x=cx+K[k],y=cy+K[k+1];
        if(x<0||x>=n||y<0||y>=n){if(!cfg.wrap)continue;x=(x+n)%n;y=(y+n)%n;}
        const i=y*n+x;if(tmp[i]===0)touched.push(i);tmp[i]+=K[k+2];}}
    for(const i of touched){const v=tmp[i];if(v>=MP_TT&&v>best[i]){best[i]=v;own[i]=ai;}tmp[i]=0;}});
  // เชื่อมช่องว่างเล็กๆ ระหว่างพื้นที่ของพันธมิตรเดียวกัน (กว้างไม่เกินราว 2×MP_TG+1 ช่อง และไม่มีพันธมิตรอื่นอยู่ตรงนั้น)
  // = closing แบบสี่เหลี่ยมรัศมี MP_TG: ขยายพื้นที่ (ห้ามทับพันธมิตรอื่น) แล้วหดกลับ · เติมเฉพาะช่องที่ยังว่าง · ช่องที่สองพันธมิตรแย่งกันปล่อยว่าง
  {const k=MP_TG,cand=new Uint8Array(N).fill(255);
    on.forEach((a,o)=>{let x0=n,x1=-1,y0=n,y1=-1;
      for(let i=0;i<N;i++)if(own[i]===o){const x=i%n,y=(i/n)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      if(x1<0)return;x0=Math.max(0,x0-2*k);y0=Math.max(0,y0-2*k);x1=Math.min(n-1,x1+2*k);y1=Math.min(n-1,y1+2*k);
      const w=x1-x0+1,h=y1-y0+1,P=new Int32Array((w+1)*(h+1)),Q=new Int32Array((w+1)*(h+1)),dil=new Uint8Array(w*h);
      const sum=(T,ax,ay,bx,by)=>{ax=Math.max(0,ax);ay=Math.max(0,ay);bx=Math.min(w-1,bx);by=Math.min(h-1,by);return T[(by+1)*(w+1)+bx+1]-T[ay*(w+1)+bx+1]-T[(by+1)*(w+1)+ax]+T[ay*(w+1)+ax];};
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=own[(y+y0)*n+x+x0]===o?1:0;P[(y+1)*(w+1)+x+1]=v+P[y*(w+1)+x+1]+P[(y+1)*(w+1)+x]-P[y*(w+1)+x];}
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ow=own[(y+y0)*n+x+x0];dil[y*w+x]=(ow===255||ow===o)&&sum(P,x-k,y-k,x+k,y+k)>0?1:0;}
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)Q[(y+1)*(w+1)+x+1]=dil[y*w+x]+Q[y*(w+1)+x+1]+Q[(y+1)*(w+1)+x]-Q[y*(w+1)+x];
      for(let y=k;y<h-k;y++)for(let x=k;x<w-k;x++){const i=(y+y0)*n+x+x0;if(own[i]!==255||!dil[y*w+x])continue;
        if(sum(Q,x-k,y-k,x+k,y+k)===(2*k+1)*(2*k+1))cand[i]=cand[i]===255?o:254;}});
    for(let i=0;i<N;i++){const o=cand[i];if(o<254){own[i]=o;best[i]=MP_TT;}}}
  // ภาพ 1 พิกเซล = 1 ช่อง: cvFill = สีจางด้านใน · cvEdge = เหมือนกันแต่ขอบเข้ม (ใช้ตอนซูมไกล)
  const mk=edge=>{const cv=document.createElement('canvas');cv.width=n;cv.height=n;const g=cv.getContext('2d'),img=g.createImageData(n,n),D=img.data,rgb=on.map(a=>mpRGB(a.color).split(',').map(Number));
    for(let i=0;i<N;i++){const o=own[i];if(o===255)continue;const x=i%n;
      const e=edge&&((x>0&&own[i-1]!==o)||(x<n-1&&own[i+1]!==o)||(i>=n&&own[i-n]!==o)||(i<N-n&&own[i+n]!==o));
      const col=rgb[o],q=i*4;D[q]=col[0];D[q+1]=col[1];D[q+2]=col[2];D[q+3]=Math.round(255*(0.06+0.12*Math.min(1,best[i]/1.5)))+(e?40:0);}   // บางๆ: ขอบจาง ตรงกลาง/หนาแน่นเข้มขึ้นเล็กน้อย
    g.putImageData(img,0,0);return cv;};
  // จุดวางชื่อพันธมิตร: ช่องในอาณาเขตที่ไกลจากขอบที่สุด (ที่โล่งกว้างที่สุด) — ระยะถึงขอบแบบ chamfer สองรอบ
  const dist=new Float32Array(N),S2=Math.SQRT2;
  for(let i=0;i<N;i++)dist[i]=own[i]===255?0:1e9;
  const nb=(i,x,y,dx,dy,st)=>{const X=x+dx,Y=y+dy;if(X<0||X>=n||Y<0||Y>=n)return st;const j=Y*n+X;return own[j]!==own[i]?st:dist[j]+st;};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=y*n+x;if(own[i]===255)continue;
    dist[i]=Math.min(dist[i],nb(i,x,y,-1,0,1),nb(i,x,y,0,-1,1),nb(i,x,y,-1,-1,S2),nb(i,x,y,1,-1,S2));}
  for(let y=n-1;y>=0;y--)for(let x=n-1;x>=0;x--){const i=y*n+x;if(own[i]===255)continue;
    dist[i]=Math.min(dist[i],nb(i,x,y,1,0,1),nb(i,x,y,0,1,1),nb(i,x,y,1,1,S2),nb(i,x,y,-1,1,S2));}
  const labels=on.map(()=>({d:0,i:-1}));
  for(let i=0;i<N;i++){const o=own[i];if(o===255)continue;if(dist[i]>labels[o].d){labels[o].d=dist[i];labels[o].i=i;}}
  MP.terr={sig,own,n,R,on,cvFill:mk(false),cvEdge:mk(true),labels:labels.map((l,k)=>l.i<0?null:{ai:k,x:l.i%n-R,y:R-Math.floor(l.i/n),d:l.d})};return MP.terr;
}
function mpNextColor(list){return MP_COLORS.find(col=>!list.some(a=>a.color===col))||MP_COLORS[list.length%MP_COLORS.length];}
function mpMine(){return MP.rows&&MP.uid!=null?MP.rows.filter(r=>r.uid===MP.uid).sort((a,b)=>(b.capital-a.capital)||b.pop-a.pop):[];}
// สำเนา map.sql ที่ GitHub Actions เก็บไว้ในรีโพเดียวกับแอป (branch "mapdata") — ใช้เมื่อเซิร์ฟเวอร์เกมไม่ยอมให้เว็บอื่นดึงตรง
function mpMirror(){const h=location.hostname,host=mpHost();if(!host||!/\.github\.io$/i.test(h))return '';const owner=h.split('.')[0],repo=location.pathname.split('/').filter(Boolean)[0];return repo?`https://raw.githubusercontent.com/${owner}/${repo}/mapdata/${host}.sql`:'';}
function mpMirrorApi(){const h=location.hostname,repo=location.pathname.split('/').filter(Boolean)[0];return `https://api.github.com/repos/${h.split('.')[0]}/${repo}/commits?sha=mapdata&per_page=1`;}
// ลงชื่อเซิร์ฟเวอร์ (เฉพาะชื่อเซิร์ฟเวอร์ + เวลา ไม่มีข้อมูลผู้ใช้) ที่ Firestore "mapServers" ให้ GitHub ดึงสำเนา map.sql ให้ทุกวัน
// ทำเฉพาะผู้ที่ล็อกอิน · อย่างมากสัปดาห์ละครั้งต่อเซิร์ฟเวอร์ต่อเครื่อง
const MP_HOST_RE=/^[a-z0-9-]+(\.[a-z0-9-]+)*\.travian\.com$/;
function mpRegister(){
  try{const h=mpHost();if(!h||!MP_HOST_RE.test(h)||h.length>80||!FB.user||!FB.db||!window.firebase)return;
    const k='travian-mapreg:'+h,last=+localStorage.getItem(k)||0;if(Date.now()-last<7*86400000)return;
    MP.regTry=h;
    FB.db.collection('mapServers').doc(h).set({lastSeen:firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{try{localStorage.setItem(k,String(Date.now()));}catch(e){}MP.reg=h;mpStatus();})
      .catch(e=>{MP.regErr=String(e&&e.code||e);});
  }catch(e){}
}
function mpStore(rows,src,force,at){const h=mpHost();at=at||Date.now();   // at = เวลาของข้อมูล (สำเนา GitHub: เวลาที่ GitHub ดาวน์โหลดจริง จาก _index.json)
  try{localStorage.setItem('travian-mapsql:'+h,JSON.stringify({at,src,rows:mpPack(rows)}));}catch(e){}   // เต็ม: ใช้ในหน่วยความจำอย่างเดียว
  MP.host=h;MP.src=src;mpSetRows(rows,at);mpSyncTowns(force);}
async function mpFetch(force){
  if(MP.loading||!mpReady())return;
  clearTimeout(MP.retry);
  const b=mapBase(S.mapUrl),h=mpHost(),mir=mpMirror();MP.loading=true;MP.err='';MP.blocked=false;mpStatus();
  const get=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const rows=parseMapSql(await r.text());if(!rows.length)throw new Error('empty');return rows;};
  let rows=null,src='',at=0,same=false;
  try{rows=await get(b+'map.sql');src='game';}catch(e){MP.err=String(e&&e.message||e);}
  if(!rows&&mir){
    // วันที่ของสำเนา = เวลา commit ล่าสุดของ branch "mapdata" (GitHub API อ่านได้จากหน้าเว็บ ไม่ต้องล็อกอิน · จำกัด 60 ครั้ง/ชม.)
    // ถ้า API ใช้ไม่ได้ ใช้เวลาตอนนี้แทน (แบบเดิม) เพื่อไม่ให้โหลดสำเนาซ้ำทุกครั้ง
    let st=0;try{const r=await fetch(mpMirrorApi(),{cache:'no-store'});if(r.ok){const j=await r.json();st=Date.parse(j&&j[0]&&j[0].commit&&j[0].commit.committer&&j[0].commit.committer.date)||0;}}catch(e){}
    if(!force&&st&&MP.rows&&MP.host===h&&MP.src==='github'&&st<=MP.at){same=true;MP.err='';}   // สำเนาเดิม ไม่ต้องโหลดซ้ำ
    else{try{rows=await get(mir);src='github';at=st||Date.now();MP.err='';}catch(e){}}
  }
  if(rows){if(mpHost()===h)mpStore(rows,src,force,at);}else if(!same)MP.blocked=true;
  MP.loading=false;
  // สำเนา GitHub ของวันนี้ยังไม่มา (GitHub รันช้า/ดาวน์โหลดไม่สำเร็จ): ลองใหม่ทุก 20 นาทีระหว่างที่แอปเปิดอยู่
  if(mpHost()===h&&MP.src==='github'&&mpDue(MP.at))MP.retry=setTimeout(()=>{try{mpFetch(false);}catch(e){}},20*60000);
  mpStatus();mpDraw();if(view==='map'){mpRenderPanel();mpRenderInfo();}
}
function mpLoadText(t,label){const rows=parseMapSql(t);if(!rows.length){fbToast('⚠ '+LN('ไฟล์นี้ไม่ใช่ map.sql','This file is not a map.sql'));return false;}
  MP.err='';MP.blocked=false;mpStore(rows,'file',true);mpStatus();mpDraw();if(view==='map'){mpRenderPanel();mpRenderInfo();}fbToast('🗺️ '+LN('โหลด map.sql แล้ว: ','map.sql loaded: ')+fmt(rows.length)+' '+LN('หมู่บ้าน','villages'));return true;}
function mpFile(f){if(!f)return;const rd=new FileReader();rd.onload=()=>mpLoadText(String(rd.result||''),f.name);rd.readAsText(f);}
function mpAuto(){if(!mpReady())return;mpRegister();mpLoadCache();if(mpDue(MP.at))mpFetch(false);else if(MP.rows)mpSyncTowns(false);}
// ---------- หมู่บ้านของเรา: ชื่อ/พิกัดแก้เงียบ · หมู่บ้านใหม่ / หายไป / เผ่าไม่ตรง ถามก่อน ----------
function mpSyncTowns(force){
  if(!MP.rows||MP.uid==null||shRO())return;   // โปรไฟล์ที่แชร์แบบดูอย่างเดียว: ไม่แก้เมืองจาก map.sql
  const mine=mpMine(),ownVid=new Set(mine.map(r=>r.vid)),ig=mpCfg()&&S.mapIgnore;let quiet=false;const nw=[],tr=[],gone=[];
  mine.forEach(r=>{
    const t=S.towns.find(x=>x.did===r.vid)||S.towns.find(x=>x.x!=null&&+x.x===r.x&&+x.y===r.y);
    if(!t){if(!ig['n'+r.vid])nw.push(r);return;}
    if(t.did!==r.vid){t.did=r.vid;quiet=true;}
    if(r.name&&t.name!==r.name){t.name=r.name;quiet=true;}
    if(+t.x!==r.x||+t.y!==r.y){t.x=r.x;t.y=r.y;quiet=true;}
    const mt=MAP_TRIBE[r.tribe];if(mt&&TRIBES[mt]&&t.tribe!==mt&&!ig['t'+r.vid+':'+mt])tr.push({t,r,mt});
  });
  S.towns.forEach(t=>{if(t.did&&!ownVid.has(t.did)&&!ig['m'+t.did])gone.push({t,now:MP.byVid.get(t.did)});});
  if(quiet){autosave();if(view!=='map')renderAll();}
  MP.review=(nw.length||tr.length||gone.length)?{nw,tr,gone}:null;
  if(MP.review){const R=MP.review,parts=[];
    if(nw.length)parts.push(LN('ใหม่ ','new ')+nw.length);if(gone.length)parts.push(LN('หายไป ','gone ')+gone.length);if(tr.length)parts.push(LN('เผ่าไม่ตรง ','tribe mismatch ')+tr.length);
    if(force||S.mapAskDay!==new Date().toDateString())fbToast('🗺️ map.sql: '+parts.join(' · '),LN('ดู','View'),mpReview);}
  mpStatus();
}

  h+='</div>';
  const k=await askChoice('🗺️ map.sql',h,[{key:'apply',label:LN('ทำตามที่เลือก','Apply the ticked ones'),cls:'pri',raw:true},{key:'later',label:LN('ไว้ทีหลัง','Later'),raw:true}]);
  if(k!=='apply')return;

  R.nw.forEach(r=>{if(on('mpn'+r.vid)){const t=newTown('ore');t.name=r.name||t.name;t.x=r.x;t.y=r.y;t.did=r.vid;const mt=MAP_TRIBE[r.tribe];if(mt&&TRIBES[mt])t.tribe=mt;S.towns.push(t);ch=true;}else S.mapIgnore['n'+r.vid]=1;});
  R.tr.forEach(o=>{if(on('mpt'+o.r.vid)){o.t.tribe=o.mt;BKEYS.forEach(k=>{o.t.bld[k].sel=[];o.t.bld[k].qty={};});ch=true;}else S.mapIgnore['t'+o.r.vid+':'+o.mt]=1;});
  R.gone.forEach(o=>{if(on('mpg'+o.t.did)){const id=o.t.id;S.towns=S.towns.filter(x=>x.id!==id);S.towns.forEach(x=>x.exports=x.exports.filter(e=>e.to!==id));if(cur===id)cur=S.towns.length?S.towns[0].id:null;ch=true;}else S.mapIgnore['m'+o.t.did]=1;});

}

//   ถ้าทัพสวนต้องปล่อย "ก่อน" ทัพเขาชน (ระยะไกล) ทัพสวนเริ่มก่อน → ต้องให้เข้าหลัง 1 วินาที

function ctrToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function ctrHMS(v){const a=String(v||'').trim().split(':');if(a.length<2||a.some(x=>!/^\d{1,2}$/.test(x)))return '';while(a.length<3)a.push('0');return a.slice(0,3).map(x=>x.padStart(2,'0')).join(':');}

// ไอเทมฮีโร่ที่มีผลกับเวลาเดินทาง (มีผลเฉพาะเมื่อฮีโร่ไปกับทัพ) · rarity มีเฉพาะเซิร์ฟเวอร์ที่มี Item Crafting (ไม่มี = ค่า common)

const ART_SP={'3':3,'2':2,'1.5':1.5,'0.67':2/3,'0.5':0.5,'0.33':1/3};
